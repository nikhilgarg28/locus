# A workspace of its own. Nothing here depends on a file outside this
# directory: what it reuses from spikes/locus-macro is copied.
[workspace]
resolver = "3"
members = ["locus", "locus-macros", "cases", "corpus", "ghost-lets"]
# `cases` and `corpus` hold programs that must be rejected, and run.sh builds
# their bins one at a time, so a plain `cargo build` builds only these.
default-members = ["locus", "locus-macros"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
proc-macro2 = "1"

# A crate whose code expands Locus's macros must declare the checking `cfg`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(__locus_check)'] }
