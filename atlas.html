<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locus documentation</title>
<style>body{max-width:42rem;margin:12vh auto;padding:2rem;background:#f7f4ec;color:#262e2a;font:20px/1.6 Georgia,serif}a{color:#a74631}code{font-size:.8em}h1{font-weight:normal}</style>
</head>
<body>
<main><h1>The Atlas has become a book.</h1>
<p><a id="website" href="target/site/index.html">Open the Locus website →</a></p>
<p>Build the website with <code>npm ci --prefix website</code> and <code>python3 tools/site.py build</code>, or start a preview with <code>python3 tools/site.py serve</code>.</p>
<p>The source of truth is now Markdown in <a href="docs/">docs/</a>. This page preserves old Atlas bookmarks.</p></main>
<script>
const link = document.getElementById('website');
if (location.hash) link.href = 'target/site/atlas.html' + location.hash;
// HTTP previews redirect only when the built site exists; file previews retain
// a useful build instruction instead of navigating to a missing local file.
if (location.protocol !== 'file:') fetch('target/site/index.html', {method:'HEAD'})
  .then(response => { if (response.ok) location.replace(link.href); }).catch(() => {});
</script>
</body></html>
