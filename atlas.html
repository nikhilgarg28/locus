    "## Evidence about mutable state",
    "",
    "Loop invariants need no construct of their own once the language has mutable locals. The direction is agreed; the full rules are to be written as part of introducing mut, together with the replacement of the loop forms of section 10 of the language as built, which exist only because there is no mutation.",
    "",
    "- Evidence bound with let is a snapshot. It speaks of the values its proposition mentions as they were at that line, is never invalidated, and stays usable after those variables change, as let y = x keeps the old x. Evidence bound with let mut is tracked: its proposition is read against current values, and it may be reassigned. The same type text therefore reads differently under let and let mut, exactly as for data. Both are needed: evidence about the next value is built as a snapshot before an assignment and used to re-establish tracked evidence after it.",
    "- Assigning a variable, or passing it as &mut, invalidates every tracked evidence variable whose type mentions it, until that evidence is reassigned. Validity then follows Rust's initialization analysis: valid after a join only if valid on every path into it, a loop's back edge is such a path, and a path that breaks or returns does not count. Evidence that is not used again carries no obligation.",
    "- A fact that can be derived afresh on each pass is an ordinary let inside the body. A fact that depends on earlier passes is tracked evidence declared before the loop and reassigned in the body. A claim about what the loop leaves behind is that evidence, used after the loop with the fact of the exit test. Refreshing is explicit, ok = _; or ok = proof;, so that each obligation is visible where it arises.",
    "",
    "~~~",
    "let mut lock = Lock { failures: 0, open: false };",
    "let mut ok: @within_limit(lock.failures) = _;",
    "for attempt in 0..attempts {",
    " let (next, still) = step(lock, ok, event_at(attempt, correct));",
    " lock = next;        // ok is now invalid",
    " ok = still;         // re-established",
    "}",
    "(lock, ok)",
    "~~~",
    "",
    "- The checker still performs the induction: the tracked evidence live across the back edge becomes part of the loop's state, as in section 10 of the language as built. The programmer states no invariant. The flow analysis is not trusted. Lowering gives each assignment a new version of the variable and of the evidence, and stale evidence used by mistake is a proof about an old version, which the kernel rejects. What becomes trusted is the translation of mutable locals into versions, which mutable data needs in any case.",
    "- A for hides its iterator, so evidence declared before the loop cannot speak of the index, nor in general of what an iterator has produced so far. Facts the loop can supply afresh on each pass, such as the bounds of a range index, are unaffected. A carried fact about progress is written with the iterator or index as a named mutable variable, in a while or while let. A clause on for that names the hidden state was considered and is deliberately not planned.",
    "- To be settled with mut: tracked evidence in local variables only at first; no assignment to a struct field that a proof field of the same struct depends on; invalidation by whole variable rather than by path; and how the signature of a function taking &mut states a fact about the new value.",
    "",
    "Plan: LOC-16, LOC-127, LOC-28, LOC-30.",
    "",
    "## Termination",
    "",
    "Termination. Every loop, including for, counts as possibly not returning, and needs no annotation. A function that promises to terminate contains no loop and, when it calls itself, states what gets smaller, in the same attribute as the promise:",
    "",
    "~~~",
    "#[terminates(decreases = n)]",
    "#[no_panic]",
    "fn sum_to(n: u8) -> u8 {",
    " if n == 0 { 0 } else { n.wrapping_add(recurse!(_, sum_to(n.wrapping_sub(1)))) }",
    "}",
    "~~~",
    "",
    "- A function that does not call itself writes #[terminates] alone. A function that calls itself and promises to terminate must state the measure; it is not guessed. A header carries the bare promise, and the definition adds the measure, which is the argument for the promise and no part of the contract.",
    "- The measure is an ordinary expression over the parameters, read as a logical term and never executed. Its type must have an order with no infinite descent, fixed by the language: unsigned integers and later Nat under \u003c, bool, tuples lexicographically, later recursive data by the part-of order, and later signed integers with the added obligation that the measure is not negative. Wrapping cannot cheat the order: n.wrapping_sub(1) \u003c n is false when n is 0.",
    "- recurse!(evidence, call) is the slot for the evidence at a recursive call. It has the value of the call and erases to it. The first argument is expected to be evidence that the measure at the arguments is smaller than the measure at the parameters, so _ works there and a wrong proof is an ordinary mismatch reported at the call. A bare recursive call means recurse!(_, call). The form is spelled with !, as rewrite!, unfold!, and fold! are (Built-in forms). It is the rendering of the idea that a function already on the call stack receives, as an extra argument, evidence that it has gone down; outside callers never see that argument, and the old value is the current frame's own measure.",
    "- A recursive call is a call to any function in the caller's own cycle of the call graph, which the ordering of declarations already computes; the programmer does not mark it, and recurse! around any other call is an error. The evidence is per call, not per function: each call from f to g shows that the measure of g at the arguments is below the measure of f at its parameters, in one order shared by the cycle. That is checkable within one body, against the signatures and measures of the others, and it implies what is wanted, since following the calls round any cycle back to f composes into a strict descent of f's own measure. The members of a cycle therefore live in one implementation unit, where their measures are visible, and their signatures are elaborated before any of their bodies. A function in a cycle that does not promise to terminate cannot be called by one that does.",
    "- Mutual recursion: every function in a cycle states a measure, and at a call from f to g the slot of recurse! expects the measure of g at the arguments to be smaller than the measure of f at its parameters. The functions may have quite different parameters; it is their measures that must be comparable, because a cycle terminates exactly when every function in it can be mapped into one order without infinite descent. Two ways of being comparable are intended. Measures of one type from the list above, typically numbers or tuples of numbers, reached through conversions such as a size function once Nat exists; a final tuple component that ranks the functions lets an edge keep the first component equal, as with (n, 1) and (n, 0). And measures that are recursive data of any types, compared by the part-of order, which relates values of different types: a statement inside an expression is a part of it. That covers functions that follow mutually recursive data, with the evidence coming from the match that exposed the part. An order supplied by the programmer, with a proof that it has no infinite descent, is not planned; a cycle that needs one does not promise to terminate. Whether the first implementation includes mutual recursion is open.",
    "- Computation meant to run forever is a function without the terminates promise that loops around a function with it; each pass finishes and carries its evidence.",
    "- What the logic knows of a recursive function. The kernel has no recursion, so a terminating recursive function is not a kernel term and has no defining equation there, even where its body is visible. It enters the logic as a function symbol with the function's signature, known by its contract alone (Functions in propositions), and the checker's termination rule is what justifies treating it as total. This refines what Functions in propositions says: the defining equation is available where the body is visible and is expressible as a kernel term. Recursion in the kernel, beginning with structural recursion over recursive data, would make the equation available and is the natural companion of recursive data types.",
    "- Consequences to keep in view. A function that promises to terminate uses stack in proportion to its recursion depth, since Rust does not guarantee tail calls, so recursion suits structural recursion and divide and conquer better than iteration over long input. Loops that keep the promise, by a finite range or a measure, are left for later; the kernel's rule for a bounded for (section 10 of the language as built.6) remains and is what they would lower to. The one trusted addition is the checker's rule that a strictly decreasing sequence in these orders is finite.",
    "",
    "Plan: LOC-53, LOC-54, LOC-82, LOC-49.",
    "",
    "## How mutation is checked",
    "",
    "The typed tree stays shaped like the source, so that the generated Rust assigns where the programmer assigned. The check IR has no assignment. Trusted lowering gives each assignment a new version of the variable, and the check IR stays what it is today: lets, facts, calls, matches, and loops that pass their state. This section is the design, written before the code (LOC-129). It says what is added to the check IR, what lowering does, what is trusted, and works eleven cases by hand; each case becomes a test of the same name. It was reviewed and revised on 21 September.",
    "",
    "### What is trusted, and what watches it",
    "",
    "- Trusted: the checker of the check IR; lowering, which here means versions, which variables a branch or loop assigns, the writing back of &mut arguments, and the disjointness of those arguments; and erase.",
    "- Not trusted: the flow analysis in the elaborator, which decides whether tracked evidence is valid, whether a value has been moved, which evidence a loop carries, and which version a diagnostic names. Its mistakes cannot make a false claim pass. A use of stale evidence lowers to a proof about an old version where a claim about the current one is wanted, and the kernel rejects it. A use of a moved value is harmless in the logic, where values are values, and rustc rejects the generated Rust.",
    "- Lowering computes the set of variables a loop or branch assigns itself, and does not take it from the flow analysis. Leaving one out would keep facts about a variable the program has changed, which is the one way this translation can be unsound. The set is computed over binding identities, not names:",
    "  - a binding made outside the construct and assigned anywhere inside it, nested blocks included, is in the set; so is one passed as &mut, or whose field path is;",
    "  - a write to a field counts as a write to the root binding of the path;",
    "  - a binding made inside the construct is local to it and is never in the set, since it has no value at entry; a loop with let mut scratch in its body does not carry scratch;",
    "  - a binding that shadows an outer one is a different binding, so assigning to the inner leaves the outer out of the set, and assigning to the outer before it is shadowed puts it in;",
    "  - the condition of a while is part of the loop, so an assignment or a &mut call in the condition counts.",
    "  Each of these five has a small test of its own in M2 and M3, on the check IR that lowering produces and through the two interpreters.",
    "- Lowering follows Rust's order of evaluation exactly, one subexpression at a time, and each subexpression sees the versions current when it runs: arguments left to right; in an assignment, the right side first, with everything it writes back, and the place last. A translation that is well typed and out of order is one the checker cannot catch, so the order is part of what is trusted, and the interpreters watch it (case 9).",
    "- The two interpreters are compared on every program. The interpreter of the check IR runs the versions, the interpreter of the erased tree runs the assignments, and a variable missed by lowering shows as a disagreement on any input that reaches it. The random programs of R1 assign in branches and loops for this reason.",
    "",
    "### Added to the check IR",
    "",
    "Four additions and one simplification.",
    "",
    "- A function carries its promises, all four. The checker enforces what erasure and the boundary with Rust rely on. A function that promises no_panic calls only functions that promise it, has evidence at every operation that may panic, and has evidence of false at every panic ending. A function that promises terminates contains no loop and calls only functions that promise it. A function that promises no_io, or no_alloc, calls only functions that promise the same, and uses no primitive that performs I/O, or allocates; the core has no such primitive yet, and the rule is there so that the first one cannot slip past. Erasure removes a call only on the strength of terminates, no_panic, and no_io, so none of the three can rest on the elaborator alone. Recursion is already impossible, since a function is checked against those declared before it. The elaborator checks the same promises first, to give good errors; the checker's word is the one that counts.",
    "- Return, as a way for a block to end. The value is checked against the function's result type in the context of that point, exactly as the value of the body is. It may stand anywhere, inside loops included, and like break it means the block produces no value.",
    "- Panic, as a way for a block to end, with its message. It demands nothing, and under no_panic it demands a proof of false. Nothing follows it.",
    "- A primitive operation that may panic, as a statement: let v = a + b for a machine type, from the table of K5. Its equation is the meaning that holds in every build: for + - * the wrapped result, for / and % the truncating result of the views. It may carry a proof that the panic condition is false; under no_panic it must. With the proof, the exact result is also known (the view of v is the sum of the views). Without it nothing more is known, except that for / and % the code that follows learns that the panic condition was false, since these panic in every build. The interpreters have two modes, as Rust has two builds. In the default mode every panic condition of the table panics. In wrapping mode the overflow of + - * and of unary minus wraps, and nothing else changes: division and remainder by zero still panic, and so do MIN / -1 and MIN % -1, as they do in every Rust build. Unary minus exists on signed types only; its panic condition is that the operand is MIN, and its wrapped result is MIN.",
    "- The bounded for is simplified. Its state no longer depends on the index, because evidence declared outside a for cannot speak of the hidden index, so the state is a plain tuple as for loop, the proof that the bounds are ordered is dropped (an empty range runs no passes), and break is allowed with the loop's state. It is stated for every integer type. The body still gets lo \u003c= i and i \u003c hi afresh on each pass.",
    "",
    "Nothing else changes. In particular a match in statement position already allows an arm to transfer control and produce no value.",
    "",
    "### What lowering does",
    "",
    "- Assignment. x = e becomes let x' = e, and later mentions of x mean x'. Assignment to a field path, lock.failures = e, becomes let lock' = Lock { failures: e, open: lock.open }. The new value is an ordinary struct value and must be well typed, so a field that an evidence field of the same struct depends on cannot be assigned alone: the rebuilt value would carry evidence about the old field, and the kernel rejects it. The whole value is replaced. This is the rule already stated under Mutation and references, and here it falls out of the translation.",
    "- Tracked evidence. let mut ok: @P = proof becomes the fact ok : P at the current versions. ok = proof becomes a new fact ok' : P read at the versions current at that line. A use of ok is the latest of these. An assignment to x does nothing to ok in the check IR; ok is still a true fact, about the old x. Whether ok may be used is the flow analysis's question, and the kernel's answer if the analysis is wrong.",
    "- What mentions means. Tracked evidence is invalidated by an assignment to a variable its type mentions as written. A name bound by let is a value and a snapshot, so let p = prop!(x \u003c= 3); let mut ok: @p = ...; mentions p and not x, and an assignment to x leaves it valid, correctly, since p is still the proposition about the old x.",
    "- A branch that assigns has one representation. A conditional or match in which no arm assigns an outer binding is lowered as it is today: as a term when it is pure, which keeps its defining equation, and as a match statement otherwise. Pure means that every part is a term of the logic: literals, names, fields, constructors, comparisons, the wrapping methods, conditionals and matches of the same kind, and calls to functions that may appear in propositions (terminates, no_panic, no_io, no &mut); and no operation that may panic, no loop, no assignment, and no return, break, continue, or panic. As soon as any arm assigns an outer binding, the conditional lowers to a match whose result is a tuple: the new versions of the variables assigned in any arm, then the tracked evidence that is valid at the end of every arm that reaches the end, typed over those new versions, then the value of the conditional. An arm that returns, breaks, continues, or panics contributes nothing, which is how a path that leaves does not count at the join. The condition or scrutinee is evaluated before any arm, at the versions current on entry. Nothing is known of a joined variable beyond what the evidence in the tuple says, even when both arms are simple; an exact equation for the join, where every arm is pure, could be added later and is left out now so that there is one translation to audit (case 10).",
    "- A loop. The state is a tuple: the variables assigned in the body, then the tracked evidence declared outside and carried by the loop, typed over them. Every continue, and the end of the body, supplies that state at the current versions; so does the entry. The loop's result is a tuple of the same shape, plus the value of a break, plus the fact of the exit test when the loop is a while with a pure condition and no break. while c { body } is a loop whose body matches on c and breaks in the false arm. Which evidence is carried is chosen by the flow analysis (what is valid on entry and used afterwards or on a later pass); choosing too little loses facts and choosing too much leaves an obligation unproved at a continue, and neither is unsound.",
    "- A call with &mut arguments. In the logic the callee takes the old values and returns a tuple of the new values of its &mut parameters followed by its declared result, whose type may mention them, with old!(x) for the entry value. At the call, lowering binds the result, then writes each new value back along its path as an assignment does. Lowering rejects two &mut arguments whose paths overlap, and a &mut argument that overlaps a path another argument reads. This check is small and is trusted, because two values written back to one place would let the logic keep the wrong one.",
    "- What may be lent. A field that evidence in the same struct depends on cannot be assigned alone, and for the same reason it cannot be lent: &mut percent.value is rejected by lowering, as is any path through such a field. The callee would write to it at runtime before the caller could rebuild and recheck anything, and a panic in between would leave a broken value where a Rust caller can find it. &mut percent is accepted, since whoever holds a whole Percent can only replace it with a valid one. This rule, with the rule on assignment, gives an invariant that does not depend on which path a function leaves by: at every moment of execution, every value of a struct type satisfies the evidence in its fields. It is the argument for safety under unwinding, and it is about writes, not about returns.",
    "- When a call panics. Writes made through &mut before a panic are real, and a Rust caller that catches the panic sees them. The logic needs nothing for this: partial correctness speaks only of normal return, and the invariant above is what protects values on the other path. The interpreters and the comparison with compiled Rust do need it, or a wrong write-back on the way out would go unseen. So a panic as an outcome carries the values of the function's &mut parameters at the moment of the panic. In the check IR, every point that may panic, a panic ending, an operation that may panic, or a call, is annotated by lowering with the current versions of the function's &mut parameters, and at a call these are written in terms of the values the callee reports for its own. The checker ignores the annotations; only the interpreter reads them, so a mistake in them is a false alarm in the comparison and never a false proof. The compiled harness reads the arguments after catch_unwind and compares. This arrives with references, in O3; until then a panic carries its message alone, and the outcome type is a struct so that the state can be added without touching its users.",
    "- Moves and reinitialising produce nothing in the check IR. x = e after a move is an assignment like any other.",
    "",
    "### The cases",
    "",
    "**1. A branch that refreshes against one that returns early.**",
    "",
    "~~~",
    "x = x + 1;                          // ok, which mentions x, is now invalid",
    "if x > limit { return (x, give_up(x)); }",
    "else { ok = prove!(x \u003c= limit); }",
    "use_it(x, ok);                      // accepted: the only path here refreshed ok",
    "~~~",
    "",
    "Lowers to let x1 = x0 + 1 (the primitive), then a match on x1 > limit whose true arm ends in return and whose false arm has the fact ok1 : x1 \u003c= limit and ends in the value (ok1). The result of the match has type (@(x1 \u003c= limit)). The checker demands the function's result type at the return, in a context that knows x1 > limit, and the type of the tuple at the end of the false arm. Flow analysis: valid after the join, since the returning path does not reach it. If the else arm is deleted, the analysis reports ok as invalid at use_it and names the assignment that invalidated it; if the analysis were broken and said nothing, lowering would pass ok0 : x0 \u003c= limit where x1 \u003c= limit is wanted and the kernel would reject the call.",
    "",
    "**2. Several continue and break paths.**",
    "",
    "~~~",
    "let mut n = start;",
    "let mut ok: @small(n) = first;",
    "loop {",
    "    if done(n) { break; }",
    "    let (m, still) = advance(n, ok);",
    "    n = m;",
    "    if skip(n) { ok = still; continue; }",
    "    ok = still;",
    "}",
    "~~~",
    "",
    "The state is (n: u32, ok: @small(n)). The break supplies (n, ok) at the entry versions of this pass. The continue and the end of the body each supply (m, still), where still : @small(m) by the opening of the pattern. Remove either ok = still and the analysis reports that ok is not valid at that continue or at the end of the body; broken analysis would supply (m, ok) and the kernel would find @small(n) where @small(m) is wanted. After the loop, n and ok are the components of the loop's result, and that is all that is known of n.",
    "",
    "**3. Snapshot against tracked.**",
    "",
    "~~~",
    "let before: @(x \u003c= 3) = h;          // a snapshot: about x as it is here",
    "let mut now: @(x \u003c= 3) = h;         // tracked: about x as it is wherever it is used",
    "x = 9;",
    "takes_old(before);                  // accepted, and its claim is about the old x",
    "takes(x, now);                      // rejected: now was invalidated by x = 9",
    "~~~",
    "",
    "Both are the fact x0 \u003c= 3 in the check IR. The difference is only in what a use means: before always means that fact, and the diagnostic prints its type as x as it was before line 3, while now means the latest refresh and is wanted at the current version. takes(x, before) is rejected by the kernel as a mismatch between x0 \u003c= 3 and x1 \u003c= 3, with the same diagnostic about versions.",
    "",
    "**4. A captured proposition used as a tracked type.**",
    "",
    "~~~",
    "let p = prop!(x \u003c= 3);",
    "let mut ok: @p = h;",
    "x = 9;",
    "takes_p(p, ok);                     // accepted: p is a value, and still means the old x",
    "takes(x, ok);                       // rejected: wants @(x \u003c= 3) at the current x",
    "~~~",
    "",
    "p is let-bound, so it is the term x0 \u003c= 3 for good. The type @p mentions p and not x, the assignment invalidates nothing, and that is right. The second call fails in the kernel as in case 3. With let mut p, an assignment to p invalidates ok, by the same rule.",
    "",
    "**5. Move and reinitialise.**",
    "",
    "~~~",
    "let mut t = Token::new();",
    "consume(t);                         // moved",
    "t = Token::new();                   // initialised again",
    "consume(t);                         // accepted",
    "~~~",
    "",
    "Two versions of t and two calls in the check IR; nothing about moves appears there. Remove the second assignment and the elaborator reports a use after move. Were the move analysis broken, the check IR would still check, which is sound because a value used twice is harmless in the logic, and rustc would reject the generated Rust with E0382. A proposition that mentions a moved local is rejected by the elaborator as a rule of the language, not of soundness.",
    "",
    "**6. A call that changes two disjoint fields.**",
    "",
    "~~~",
    "fn settle(a: &mut u32, b: &mut u32, le: @(a \u003c= b)) -> @(a == b)",
    "",
    "let done = settle(&mut pair.lo, &mut pair.hi, le);",
    "~~~",
    "",
    "In the logic settle takes (a, b, le) and returns (a', b', @(a' == b')). The call binds r, then let pair1 = Pair { lo: r.0, hi: r.1 }, and done is r.2, whose type after the opening of the pattern is pair1.lo == pair1.hi. settle(&mut pair.lo, &mut pair.lo, ...) and settle(&mut pair, &mut pair.hi, ...) are rejected by lowering as overlapping, and by rustc. If Pair carried evidence about lo and hi, neither field could be lent at all, and the programmer would pass &mut pair to a function that replaces it with a whole valid Pair.",
    "",
    "**7. An operation that may panic.**",
    "",
    "~~~",
    "#[no_panic] fn next(n: u32, fits: @(n as Int + 1 \u003c= u32::MAX as Int)) -> (m: u32, @(m as Int == n as Int + 1)) {",
    "    let m = n + 1;                  // the obligation of +, met by fits",
    "    (m, prove!(m as Int == n as Int + 1))",
    "}",
    "fn bump(n: u32) -> u32 { n + 1 }    // no promise: may panic, and only the wrapped value is known",
    "~~~",
    "",
    "In next, the primitive carries a proof that the sum of the views is in range, the checker demands it because of the promise, and afterwards both m == n.wrapping_add(1) and the exact equation are facts, the second of which is the claim. In bump the primitive carries no proof and the checker asks for none. A check IR built by hand that omits the proof under no_panic is rejected by the checker, whatever the elaborator thought. After let q = a / b, the fact b != 0 is known in either function, and under no_panic it had to be proved first.",
    "",
    "**8. A protected value behind &mut when a panic unwinds.**",
    "",
    "~~~",
    "impl Percent {",
    "    fn set(&mut self, v: u32) {",
    "        assert!(v \u003c= 100);          // may panic: before the write",
    "        *self = Percent { value: v, in_range: prove!(v \u003c= 100) };",
    "    }",
    "}",
    "~~~",
    "",
    "self.value = v alone is rejected, by the rule on assignment above: the rebuilt value is ill typed. The whole value is written by one assignment, whose operands Rust evaluates before it writes, so a panic comes either before the write, leaving the old valid value, or not at all. Nor can the field be lent: helper(&mut self.value) is rejected, because helper would write before anyone rechecks. No broken Percent exists at any moment for a Rust caller to find after catch_unwind, which is the invariant stated under What lowering does, and the no_panic rule of LOC-191 has nothing to forbid in the core. It stays recorded for the day field-by-field update with a refresh is allowed, when there would be a window between the write and the refresh. The test from the Rust side, which catches a panic from set and reads the survivor, stays in O4.",
    "",
    "**9. The right side changes what the left side names.**",
    "",
    "~~~",
    "fn touch(p: &mut Pair) -> u32 { p.hi = 7; 3 }",
    "",
    "pair.lo = touch(&mut pair);         // Rust leaves lo == 3 and hi == 7",
    "~~~",
    "",
    "The right side runs first, with its write-back: the call binds r, and let pair1 = r.0 is the Pair with hi == 7. Only then is the place updated, from the version current at that point: let pair2 = Pair { lo: r.1, hi: pair1.hi }. Rebuilding from pair0 would give hi its old value, would be perfectly well typed, and would be wrong; the checker could not tell. The test asserts lo == 3 and hi == 7 in both interpreters and in compiled Rust. The same order governs arguments: in f(pair.lo, touch(&mut pair)) the first argument is read before the call changes pair, and in f(touch(&mut pair), pair.hi) after.",
    "",
    "**10. Both arms assign and refresh, and the condition reads what an arm assigns.**",
    "",
    "~~~",
    "if x \u003c 2 {                          // the condition reads x on entry",
    "    x = 1;",
    "    ok = prove!(x \u003c= 2);",
    "} else {",
    "    x = 2;",
    "    ok = prove!(x \u003c= 2);",
    "}",
    "use_it(x, ok);",
    "~~~",
    "",
    "A match on x0 \u003c 2. The true arm knows (x0 \u003c 2) == true, has let x1 = 1 and the fact ok1 : x1 \u003c= 2, and ends in the value (x1, ok1). The false arm likewise with x2 = 2 and ok2. The result of the match is r of type (x: u8, @(x \u003c= 2)), a tuple whose second part is typed over its first; each arm's value is checked against it, which asks for x1 \u003c= 2 of ok1 and x2 \u003c= 2 of ok2. After the match the current x is r.0 and the current ok is r.1, a proof of r.0 \u003c= 2, which is what use_it wants. Nothing else is known of r.0; that it is 1 or 2 is not recorded, by the choice made above, and a program that needs it carries it as evidence in the same way. If one arm left out its refresh, the analysis would report ok as invalid after the join, and a broken analysis would put ok0, a proof about x0, in that arm's tuple, which the kernel rejects against x \u003c= 2 at x1.",
    "",
    "**11. A replacement that completes, and then a panic.**",
    "",
    "~~~",
    "impl Percent {",
    "    fn set_then_fail(&mut self, v: u32, fits: @(v \u003c= 100)) {",
    "        *self = Percent { value: v, in_range: fits };",
    "        panic!(\"after the write\");",
    "    }",
    "}",
    "~~~",
    "",
    "A Rust caller, through a wrapper that needs no evidence, catches the panic and reads the Percent it lent. It finds the new value, valid. The logic has nothing to say, since the function does not return. The interpreters report the panic together with the value of self at that moment, which is the new one, and the compiled harness agrees. This is the test that a write before a panic is neither lost nor half done; with case 8, where the panic comes before the write, it covers both sides of the one assignment.",
    "",
    "### Left open by this design",
    "",
    "Diagnostics that name versions need the line of each assignment kept on the version, which is cheap. Tracked evidence is in local variables and parameters only, invalidated by whole variable and not by path. Whether a while with a break should still export a fact about its exit, and whether a join of pure arms should keep an exact equation, are left until an example wants them.",
    "",
    "Plan: LOC-142, LOC-129, and M0 to M5 of the Build plan.",
    "",
    "## What is generated",
    "",
    "One Rust module for each file, all of them under one module that holds the markers, so that evidence returned by one file can be taken by another.",
    "",
    "A marker that cannot be forged does not protect an export. Every proof erases to the same Rust type, so hand-written Rust can obtain a Proved honestly, from any function that returns one, and pass it to a function that wants evidence of something else: with increment and Percent::new both exported, safe Rust builds a Percent of 101. A marker for each proposition would not help either, since it still would not tie the evidence to the particular argument. So the boundary is drawn by what is exported, not by what can be constructed:",
    "",
    "- A function that takes evidence, directly or inside a parameter whose type Rust could build, is visible to other Locus modules and never to Rust. It is emitted so that only modules under the generated root can see it.",
    "- What Rust sees takes no evidence. It takes plain data and checks it at runtime, returning an Option or a Result, or it takes a validated type, one whose fields are private and whose every constructor Rust can reach validates. Returning evidence to Rust is harmless once nothing Rust can call accepts any.",
    "- Proved and Ghost still have no public constructor. That stops casual misuse and is no part of the guarantee.",
    "",
    "Visibility uses Rust's own restricted forms, pub(super), pub(in path), and pub(crate), and one checked rule: a function that takes evidence may be visible no further than the root of the generated modules. Plain pub means exported to Rust, and on a function that takes evidence it is an error that offers the two ways out, a narrower visibility or a validated type. In a crate that mixes Locus and hand-written Rust the programmer writes pub(in crate::verified), or pub(super) when the modules are siblings under the generated root; in a crate that is all Locus, pub(crate) is already right. Every spelling means what it means in Rust, and the surface Rust sees is what is marked plain pub. Not covered yet: one Locus crate calling the evidence-taking functions of another, for which Rust has no visibility; that waits for packages.",
    "",
    "Plan: LOC-137, LOC-135, LOC-19.",
    "",
    "## Found proofs are stored",
    "",
    "- Everything that fills a _ or a prove! is untrusted and produces a proof the kernel checks. That holds for the exact and computed steps, for the arithmetic procedure, and for any automation added later. Automation never widens what is trusted; only a new kernel rule does, and a rule is added only where ordinary proofs would be too large to be practical, as with linear arithmetic. The Kernel contract lists every rule.",
    "- The proofs found are written to a file beside the source, one per source file, in text, one obligation to an entry so that diffs and merges are readable. It is checked in, as Cargo.lock is.",
    "- An entry is found by a hash of the obligation, which is the claim and the facts it may use as kernel terms, and not by a hash of the source text. Reformatting, comments, and edits elsewhere in the file leave entries valid. Definitions are referred to by name, not by number.",
    "- The file is untrusted input. A stored proof is checked by the kernel against the current obligation every time, so a stale, edited, or wrong entry can cost a search and can never make a false claim pass. The hash is for finding an entry and carries no authority.",
    "- locus check uses a stored proof where one is found, searches where none is, and writes what it finds. locus check --locked never searches: a missing or failing entry is an error. That is the mode for CI and for a reviewer, who then depend on the kernel alone, and it is what makes builds fast.",
    "- A proof found by one version of Locus still checks under a later one, however the search has changed, as long as the kernel accepts the same rules. The format of proofs and certificates is versioned, and a change to it or to the kernel's rules is the one event that can invalidate stored proofs; it is announced, and proofs are found again.",
    "",
    "## Logic-only types and erasure",
    "",
    "Logic-only types and erasure by type. This supersedes the ghost keyword on binders that section 2.4 of the language as built defers.",
    "",
    "- Two ideas are kept apart. Every value has a logical value, which is what propositions speak of: a u8 is a number below 256, a Vec is a sequence, a Tree is a tree. Separately, a type either has a runtime form or has none.",
    "- Some types have no runtime form by nature: Prop, proof types, Int, the unbounded integers, and Seq\u003cT>, the finite sequences, with Map and Set to follow. Seq arrives after the core, with its own theory in the kernel; Int and Ghost\u003cT> are in the core. They are grouped under the name logic, and are built-in names until modules exist. Int and Seq never acquire a runtime form. A runtime Int would be a big number with a heap and an allocation at every operation, and giving an erased type a runtime form later would silently turn reasoning into computation. A program that needs big numbers at runtime uses a library type whose logical value is an Int, as the logical value of a Vec\u003cT> is a Seq\u003cT>.",
    "- Any other type gives up its runtime form on request, as Ghost\u003cT>, which keeps the logical value of a T and nothing else. snapshot!(e) builds one: it takes the value of e as it is now, never executes e, and neither moves nor copies anything. Inside a proposition a Ghost\u003cT> reads as the T. At first snapshot! applies only to a variable that is still live. Ghost\u003cT> erases to the zero-sized marker of the same name, so the generated Rust reads as the source does.",
    "- One rule: a binding, field, parameter, or result is erased exactly when its type has no runtime form. There is no keyword and no attribute. The rules that already govern Prop apply unchanged: erased values flow only into erased positions, a runtime branch cannot be chosen by one, and a struct may have such fields. Runtime containers of logic-only types, such as Vec\u003cInt>, are not allowed at first.",
    "- An erased result is not an erasable computation. fn clear(x: &mut u32) -> @(x == 0) returns only evidence, keeps all three promises, and writes through x; removing the call would remove the write. A call is removed only when nothing it does can be observed: its result has no runtime form, it keeps the three promises, and it takes no &mut to anything with a runtime form. Otherwise the call is kept and its result is the marker. A function has no runtime form only when every call of it could be removed.",
    "- Conversions into the logic are exact and total: x as Int from any machine integer, and a view from a Vec, array, or slice to its Seq. They serve a different purpose from snapshot. A snapshot remembers this exact value, at its own type. A conversion gives the mathematical value, to reason with: arithmetic that cannot overflow, a length that is an Int, concatenation.",
    "- Why Int is needed in the language and not only in the kernel. A specification written in machine arithmetic suffers the overflow it is trying to describe, so that every bound has to be rearranged. And acceptance rests on evidence a person or an AI writes: an obligation stated in terms nobody can write admits no intermediate fact, produces a diagnostic nobody can type back in, and leaves every lemma to be built by hand in the kernel's own language.",
    "- Model functions and model fields need no feature of their own. A model function maps a representation to the value it stands for, is used only in propositions, and so never runs; given only by its signature in a header, it is known to callers through the contracts of the operations, which is the abstraction boundary. A model field is a field of a logic-only type, kept beside the real fields with evidence that the two agree.",
    "",
    "Plan: LOC-3, LOC-26, LOC-81, LOC-97.",
    "",
    "## Built-in forms",
    "",
    "Built-in forms. Locus has no user-defined macros: one in a header would hide the text a reviewer is meant to read, diagnostics through expanded code are poor, and nothing about verification needs them. It has a closed set of forms the compiler handles itself, spelled with ! as Rust spells a macro call. The mark tells a Rust reader what it tells them in Rust: this is not an ordinary call, its arguments need not be ordinary values, and something happens at compile time. Nothing is expanded.",
    "",
    "- _ stays the request for evidence, in any expression position where evidence of a known claim is expected. It reads as it does in Vec\u003c_>: work this out. It is not valid Rust in expression position, so nothing is reinterpreted.",
    "- prove!(P) states a claim where it stands. P is a formula, written as inside brackets and without them. The claim must be provable at that point, by the search a _ would run, and a failure is reported there. It differs from let _: @[P] = _; in two ways: the fact stays in scope for every later search, which is what makes it a stepping stone and what localizes a broken proof to the step that no longer follows; and it is an expression of type @[P], so let h = prove!(i \u003c= limit); names the evidence and (out, prove!(out == n.wrapping_add(1))) is a hole that says what it proves. It erases to nothing as a statement and to the marker as a value. It takes no hints yet. The name assert! is not used for it, because in Rust that is a check at runtime.",
    "- old!(x) and snapshot!(e) are spelled this way (Mutation and references; Logic-only types and erasure): neither evaluates its argument as a function would.",
    "- Forms that mean what they mean in Rust: assert!(c), a check at runtime after which c is a known fact, and which needs evidence in a function that promises no_panic; unreachable!(), of any type, which needs evidence of false under no_panic; todo!(), of any type, which panics, so that a half-written file can be checked; panic!, debug_assert!, matches!, and vec! once Vec exists; and the attribute derive with a closed list of traits.",
    "- recurse!(evidence, call), rewrite!(eq, h), unfold!(f, h), and fold!(f, h) take the same spelling. recurse! wraps what must be, syntactically, a recursive call, and the type expected of its evidence is computed from that call. unfold! and fold! take the name of a function and not a value. The result type of rewrite! is computed by substitution. None of the four names is reserved any longer.",
    "- The rule that separates a form from a library function: a step is a function when its type can be written, and a form when the compiler has to look at syntax to know the type. A lemma such as u8_le_trans, and symmetry, transitivity, and congruence of equality, are functions that take evidence and return evidence, and live in the library. rewrite! cannot be one today: its signature would take the predicate P as a parameter, which needs generics and a lambda to pass, and since the kernel computes nothing by itself, P(a) would still have to be connected to the claim actually held; the form reads the claim of h, finds the occurrences, and works P out. unfold! cannot be one at all in that shape, since no signature can speak of the body of whichever function it is given; it is a rewrite along that function's defining equation, and fold! is the same rewrite backwards. Either way nothing is trusted that was not before: a form emits an ordinary kernel step, transport, and a library lemma is a checked function.",
    "- To revisit when generics and logic-only lambdas become possible: whether some of these forms should become library functions. The candidates are transport itself, as a function taking the predicate explicitly, and each function's defining equation as evidence that can be named. rewrite!, unfold!, and fold! would then remain as conveniences that infer the predicate. The library would be grouped beside the logic types, as logic::eq, logic::u8, and so on.",
    "",
    "Plan: LOC-25, LOC-71, LOC-77, LOC-78, LOC-79, LOC-80, LOC-81, LOC-82, LOC-83, LOC-84, LOC-85.",
    ""
   ],

   "id": "target-examples",
   "title": "Target examples",
   "group": "Vision",
   "body": [
    "# Target examples",
    "",
    "Programs written by hand in the target syntax, before any of it is built, to test the spelling and to count what their proofs need. Nothing here runs yet. Each obligation is marked with what would discharge it:",
    "",
    "- **exact**: the claim is a fact in scope as written;",
    "- **computed**: it is, after computing: names bound by let replaced by what they stand for, projections of written values, matches on written constructors, and arithmetic on literals;",
    "- **arithmetic**: it needs reasoning about order and sums, which means either the arithmetic procedure or a chain of lemma calls.",
    "",
    "The findings are at the end.",
    "",
    "## The lock, with 32-bit counts",
    "",
    "~~~",
    "#[derive(Clone, Copy)]",
    "pub enum Event { Wrong, Right }",
    "",
    "#[derive(Clone, Copy)]",
    "pub struct Lock { failures: u32, open: bool }",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "fn within_limit(failures: u32) -> Prop {",
    "    prop!(failures \u003c= 3)",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub fn step(",
    "    lock: Lock,",
    "    bounded: @within_limit(lock.failures),",
    "    event: Event,",
    ") -> (next: Lock, @within_limit(next.failures)) {",
    "    match event {",
    "        Event::Right => {",
    "            let next = Lock { failures: 0, open: true };",
    "            (next, fold!(within_limit, prove!(next.failures \u003c= 3)))             // computed: 0 \u003c= 3",
    "        }",
    "        Event::Wrong => {",
    "            if lock.failures \u003c 3 {",
    "                let fits = prove!(lock.failures as Int + 1 \u003c= u32::MAX as Int); // arithmetic, from lock.failures \u003c 3",
    "                let next = Lock { failures: lock.failures + 1, open: false };   // the obligation of + is fits: exact",
    "                (next, fold!(within_limit, prove!(next.failures \u003c= 3)))         // arithmetic",
    "            } else {",
    "                (Lock { failures: lock.failures, open: false }, bounded)        // computed: the field is lock.failures",
    "            }",
    "        }",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "fn event_at(attempt: u32, correct: u32) -> Event {",
    "    if attempt == correct { Event::Right } else { Event::Wrong }",
    "}",
    "",
    "// A loop, so no promise to terminate can be made, and run cannot appear in a proposition.",
    "#[no_panic] #[no_io]",
    "pub fn run(attempts: u32, correct: u32) -> (last: Lock, @within_limit(last.failures)) {",
    "    let mut lock = Lock { failures: 0, open: false };",
    "    let mut ok: @within_limit(lock.failures) = fold!(within_limit, prove!(lock.failures \u003c= 3)); // computed",
    "    for attempt in 0..attempts {",
    "        let (next, still) = step(lock, ok, event_at(attempt, correct));",
    "        lock = next;        // ok is now invalid",
    "        ok = still;         // exact, given that still is typed over next",
    "    }",
    "    (lock, ok)",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub fn remaining(failures: u32, bounded: @within_limit(failures)) -> (left: u32, @(left \u003c= 3)) {",
    "    let small = unfold!(within_limit, bounded);                                 // failures \u003c= 3",
    "    let left = 3 - failures;                                                    // the obligation of -: arithmetic, from small",
    "    (left, prove!(left \u003c= 3))                                                   // arithmetic",
    "}",
    "~~~",
    "",
    "## A midpoint that cannot overflow",
    "",
    "The specification is stated over Int, where the sum of two u32 cannot overflow; the code must avoid the overflow the specification is free of.",
    "",
    "~~~",
    "#[terminates] #[no_panic] #[no_io]",
    "pub fn midpoint(lo: u32, hi: u32, ordered: @(lo \u003c= hi))",
    "    -> (mid: u32, @(mid as Int == (lo as Int + hi as Int) / 2))",
    "{",
    "    let half = (hi - lo) / 2;          // the obligation of -: arithmetic, from ordered. 2 is not zero: computed",
    "    let mid = lo + half;               // the obligation of +: arithmetic",
    "    (mid, prove!(mid as Int == (lo as Int + hi as Int) / 2))   // arithmetic, with division by a literal",
    "}",
    "~~~",
    "",
    "Writing lo + hi in the specification is rejected, because + on u32 may panic; writing (lo + hi) / 2 in the code is rejected under no_panic unless the sum can be shown to fit, which it cannot. The language makes the well-known bug hard to write on either side.",
    "",
    "## A protected type, and a way in from Rust",
    "",
    "~~~",
    "pub struct Percent { value: u32, in_range: @(value \u003c= 100) }      // not Copy: it moves",
    "",
    "impl Percent {",
    "    // Callable from Locus, where evidence exists.",
    "    #[terminates] #[no_panic] #[no_io]",
    "    pub fn new(value: u32, in_range: @(value \u003c= 100)) -> Percent {",
    "        Percent { value, in_range }",
    "    }",
    "",
    "    // Callable from Rust: the check happens at runtime, and the evidence comes from the branch.",
    "    #[terminates] #[no_panic] #[no_io]",
    "    pub fn checked(value: u32) -> Option\u003cPercent> {",
    "        if value \u003c= 100 { Some(Percent::new(value, prove!(value \u003c= 100))) } else { None }   // exact",
    "    }",
    "}",
    "~~~",
    "",
    "new is visible to other Locus modules and is not exported to Rust. Being unable to construct evidence would not stop Rust from calling it: every proof erases to the same marker, and one obtained honestly from another function could be passed here. Rust cannot build a Percent directly either, because the fields are private. It calls checked. This example needs impl blocks and Option, which are later stages.",
    "",
    "## Findings",
    "",
    "1. Exact evidence has to mean exact after computing. With no computation at all, not even 0 \u003c= 3 for a struct that was just written can be shown, since the surface has no forms for the kernel's projection and literal axioms and was never meant to. This matches the principle already recorded under Principles: computation steps are inserted silently, and a function's definition is unfolded only on request. What is dropped is search: using one fact to reach another, and unfolding without being asked.",
    "2. Destructuring has to type each part over the names the pattern binds. In let (next, still) = step(...), still must have the type @within_limit(next.failures), not a type about step(...).0. This is how a dependent pattern is opened, a fixed step and not a search, and without it evidence that comes out of a call can never be used.",
    "3. Arithmetic is where the proofs are. Of the fourteen obligations above, three are exact, four are computed, and seven are arithmetic. Every one of the seven is linear. By hand each is three to five lemma calls, most of them moving between a comparison of u32 and a comparison of Int. The arithmetic procedure is what makes the language usable, and belongs early in the sequence.",
    "4. Nothing that repeats can promise to terminate. Loops never promise it, and recursion comes later, so run cannot make the promise, cannot be used in a proposition, and nothing that calls it can either. A loop over a finite range that keeps the promise is more urgent than its place under Unsure suggests.",
    "5. Three attributes on every function of a specification is heavy: within_limit is one line under three. A file-level default would help, and there is no way to opt out of one, so a file with one loop in it cannot use the default. Either an opt-out, or one attribute that lists several promises, such as #[promises(terminates, no_panic, no_io)], which bundles nothing.",
    "6. as Int is noticeable and tolerable. Comparisons within one type cost one extra cast per comparison of a machine value with an expression over Int.",
    ""
   ],

   "id": "principles",
   "title": "Principles",
   "group": "Vision",
   "body": [
    "# Principles",
    "",
    "## How the work is judged",
    "",
    "The central promise is that someone can write familiar code, state meaningful facts about it, and get understandable help establishing them. The kernel is a foundation for that; the experience from source to executable is what decides whether the language succeeds. Until that has been tested, the core feature set holds steady.",
    "",
    "**The test.** One polished end-to-end example: source code for a small bounded state machine; a result that carries evidence; a caller that reuses that evidence; useful diagnostics for an intentional mistake; and matching interpreted and generated behavior. Everything between here and there serves that example.",
    "",
    "**Boundaries to protect.**",
    "",
    "- Dependency is restricted to propositions. A value may change what a later proof field asserts and never the runtime layout. Dependent results, validated data, and loop invariants all rest on this one mechanism. A new feature must earn its place inside the boundary before the type system is widened.",
    "- Loop invariants are evidence in loop state: initialization supplies it, and each iteration supplies it again.",
    "- Ghost data is part of the logical value, so two logical values can share a runtime representation. That is kept, and it will resurface in equality, serialization, mutation, and foreign interfaces. Each future expansion of ghost data must come with a concrete use case.",
    "- This milestone is a language for verified immutable computation. Ownership, aliasing, destruction, and mutation raise questions it cannot answer, above all which state a proof describes after another reference changes storage. Before promising broad Rust compatibility, test the extension with one narrow borrowing-and-mutation example.",
    "",
    "**Acceptance criteria for the proof-writing experience.** The hand-built proofs so far show that the rules compose, not that the `let`-based surface is pleasant. Removing normalization from the kernel moved work into elaboration: projection, substitution, unfolding, and equality transport still have to happen somewhere, and if users must repair them by hand, friendly syntax will not save the experience.",
    "",
    "- Routine rearrangements, such as introducing a local variable, destructuring a tuple, or extracting a helper, require little or no proof repair when the interfaces involved stay equivalent.",
    "- An unsolved `_` shows the expected claim, the useful facts available, and the remaining gap.",
    "",
    "Both are to be exercised by the first integrated examples, not deferred to a tooling milestone.",
    "",
    "**Measure before large proofs are normal.** Predictable checking is not the same as fast compilation, and making every computation step explicit can produce a great deal of evidence. Track separately: time spent constructing proofs; the size of the resulting proof terms; time and memory spent checking them; and the cost of rechecking after a small edit. Checked lemma reuse and stable interfaces will matter early. Do not optimize the representation before there are numbers.",
    "",
    "**Preferences, not constraints.**",
    "",
    "- Generated Rust resembling the source is a strong preference. Temporary bindings and modest structural changes are acceptable where they make evaluation order or the correctness of erasure simpler.",
    "- `Proved` and `Ghost` are internal representations. They do not dictate the eventual public Rust interface.",
    "- The typed tree's two branches keep the output readable at a real cost in trust: a sound kernel cannot establish that the checked program and the executed program agree. Differential testing of the two branches is the next step for exactly that reason.",
    "",
    "## Why Locus has its own kernel",
    "",
    "Locus uses its own proof kernel, written in Rust. A Lean-backed adapter is no longer the plan. The decision rests on these commitments:",
    "",
    "- The logic is classical. The planned soundness argument is a denotational model in the style of explicit refinement types (Ghalayini and Krishnaswami, ICFP 2023): propositions denote truth values, and types denote sets of logical values related to runtime representations. Locus keeps the two apart because ghost data such as a `Prop` field belongs to the logical value but not to the representation; for types without ghost data this reduces to the paper's subset reading. Its mechanized Lean 4 development is a starting point; the two-layer values, divergence, and declared propositions are the parts Locus must add. Excluded middle is a single named lemma whose uses are recorded. Until the model is checked against every kernel rule, consistency is a goal. Exporting accepted terms to an independent implementation tests the kernel but does not replace that argument.",
    "- The kernel has no conversion checker. It compares terms up to renaming and proof irrelevance; every computation step is an explicit equality axiom used through transport. The elaborator inserts the steps for immutable lets, projections, matches on known constructors, and literal arithmetic, so the programmer still sees the minimal type identity of the specification. Function bodies are unfolded only on request.",
    "- Proof irrelevance holds, as part of conversion. `u8` is modelled as a natural number below 256 over a kernel-internal `Nat` with a recursor; its ordering lemmas are proved from that model. Native evaluation must agree with the model and can decide closed terms. Induction over that `Nat` is the proof-level recursion rule; bounded iteration is a separate term-level rule whose index-dependent state erases to a plain loop.",
    "- Everything that constructs proofs is untrusted: the elaborator, the hole solver, and any later decision procedure, external solver, or model. Each must produce a kernel term, or a certificate for a checker that is explicitly added to the trusted base.",
    "- Proofs are written declaratively, as stated intermediate facts joined by lemma calls and holes. There is no tactic language. The hole's search is fixed and bounded by step counts, never by time, and it does not search the prelude, so that its behavior is predictable; found proofs are recorded so rechecking does not repeat the search.",
    "- The prelude is checked, not trusted. The main cost of not building on Lean is this lemma library; statements can be ported, proofs must be redone.",
    "",
    "Regardless of kernel, the translation of programs into kernel statements, erasure, and execution initially remain trusted compiler components. Proof acceptance alone does not establish that generated machine code preserves the source semantics.",
    ""
   ],

   "id": "open-questions",
   "title": "Open questions and deferred",
   "group": "Vision",
   "body": [
    "# Open questions and deferred features",
    "",
    "Undecided, or decided against for now. Section numbers refer to [Language, as built](language.md). When one of these is settled it moves into the [Target language](target-language.md) and gets tasks.",
    "",
    "## Open questions",
    "",
    "These are not decided. Each lists the current behavior of this document first. None needs to be settled before the kernel spike.",
    "",
    "1. Settled in the target language: propositions are written prop!(P) and evidence types @P, and brackets are left to arrays. What remains open is a lighter way to write a proposition value.",
    "2. Implication is spelled =>, which is also the match arm separator (section 13). The alternative is ==>.",
    "3. Settled in the target language: evidence must be of exactly the claim wanted, after computing. The bridging the elaborator does today is to be removed.",
    "4. Branch and arm evidence is anonymous. A naming form, such as if h: n != 0 { ... }, would let hand-written steps refer to it without a hole.",
    "5. A hole does not search the prelude (section 12.3). A mechanism for marking lemmas that a hole may apply, with its own step budget, would shorten proofs at some cost in predictability.",
    "6. The spelling of the chain form (section 8.4). One candidate is the bracketed form trans[a =(p) b =(q) c] used by the explicit refinement calculus.",
    "7. Whether bounded iteration (section 10.6) should admit break, and whether a reversed range should be accepted as empty at the cost of a case distinction in the result type.",
    "8. Whether a design rule should be adopted that Locus never gives valid Rust syntax a different meaning, so that a Rust superset remains reachable. Items 1 and 2 are the current violations; Appendix A of language.md tracks them.",
    "",
    "## To settle before the core is built",
    "",
    "Raised in the last review before implementation, and tracked as tasks under Open decisions: LOC-129, LOC-130, LOC-131, LOC-132, LOC-133, LOC-134, LOC-135, LOC-136. In short: the checked IR for mutation, early exit, and panics, with the flow rules the target language defers; how moves meet the logic; acceptance examples in the target syntax, and the automation they show to be needed; whether evidence of one claim is accepted for another; how Int enters the kernel and how the machine models are tested; what a panic is to the interpreter and to erasure; what locus build emits; and the order of implementation.",
    "",
    "## Deferred",
    "",
    "The README milestones give the intended order. Each item below is outside this fragment.",
    "",
    "- Logical lambdas: logic-only, capturing only immutable and ghost values, and erased. They remove the hand lifting of section 8.3.",
    "- Mathematical Int and Nat, arithmetic operators whose overflow is a proof obligation over the mathematical value, further machine widths, and a linear-arithmetic procedure.",
    "- Generics over types and propositions. Exists, Option-like types, and a library Ghost wrapper become declarable.",
    "- Recursion, as one feature: recursive enums, recursive prop declarations, and structural recursion, where a recursive call is permitted only on a part bound by a match on the argument. Induction is then a recursive math function returning a proof. In the logic, Box is transparent: a recursive Rust enum using Box is seen as the plain inductive type, and the same holds for Rc, Arc, and shared references in the absence of interior mutability, because ownership guarantees such values are finite trees. Types that permit cycles through interior mutability are not inductive and need separate treatment.",
    "- The ghost keyword on binders (section 2.4), and with it model fields. The semantics is already fixed by Prop fields (section 4.2): ghost data is part of the logical value, so s.model is a function of s, and two structs differing only in a ghost field are different values with one runtime representation. A consequence to carry forward: once runtime equality exists on structs, it compares representations, and therefore does not reflect logical equality for a type with ghost data fields.",
    "- Dependent conjunction and implication, where the right operand is well formed only under the left, as in [i \u003c len && a.get(i) > 0] once indexing demands a proof. This arrives with the first operation that takes a proof precondition, and is a reason to make && and => kernel formers at that point, not instances of the prelude And.",
    "- Requires/ensures/invariant/assert as sugar over proof parameters, dependent results, and loop proof state.",
    "- Mutation, references, ownership, and surface loops that elaborate to the state-passing loops of section 10.",
    "- Termination measures, for total correctness of executable loops and for non-structural math recursion. Until then the workaround for the latter is an explicit fuel parameter.",
    "- Trusted and external declarations, with the rest of Rust interoperability. Every such declaration is to be syntactically marked.",
    "- Runtime closures.",
    ""
   ],
