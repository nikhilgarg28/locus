    "# Locus: overview",
    "",
    "*Review the guarantees, check the implementation, and use the result from ordinary Rust.*",
    "",
    "Locus is a Rust-like language for the parts of a crate whose correctness matters most. Propositions and proofs compose with ordinary functions and data, and explicit proof evidence is checked, deterministically, by a small, auditable kernel. Locus is designed to verify systems implementations with precise arithmetic, ownership, and mutation semantics, then emit readable Rust without runtime proof machinery. Generated interfaces protect proven invariants at the boundary with safe Rust callers. A programmer or an AI supplies the implementation and evidence against a human-reviewed specification; proof construction can be automated, while acceptance rests on independent checking. The core language is built: machine integers of every width with their operators, `let mut` and Rust's loops with tracked evidence, references as parameters, methods, moves, visibility, and a protected type shipped to a Rust caller.",
    "",
    "## The 32-bit lock",
    "",
    "`tests/corpus/target/lock.lc`, as written: a lock that tolerates three wrong codes, whose failure count never exceeds the limit, and every function that hands the count on says so with evidence.",
    "",
    "~~~locus run",
    "#[derive(Clone, Copy)]",
    "pub enum Event { Wrong, Right }",
    "",
    "#[derive(Clone, Copy)]",
    "pub struct Lock { failures: u32, open: bool }",
    "",
    "prop within_limit(failures: Int) {",
    "    Bounds => {",
    "        prop!(failures \u003c= 3)",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn step(",
    "    lock: Lock,",
    "    bounded: @within_limit(lock.failures as Int),",
    "    event: Event,",
    ") -> (next: Lock, @within_limit(next.failures as Int)) {",
    "    match event {",
    "        Event::Right => {",
    "            let next = Lock { failures: 0, open: true };",
    "            (next, within_limit::Bounds @ prove!((next.failures as Int) \u003c= 3))             // computed: 0 \u003c= 3",
    "        }",
    "        Event::Wrong => {",
    "            if lock.failures \u003c 3 {",
    "                let fits = prove!(lock.failures as Int + 1 \u003c= u32::MAX as Int); // arithmetic, from lock.failures \u003c 3",
    "                let next = Lock { failures: lock.failures + 1, open: false };   // the obligation of + is fits: exact",
    "                (next, within_limit::Bounds @ prove!((next.failures as Int) \u003c= 3))         // arithmetic",
    "            } else {",
    "                (Lock { failures: lock.failures, open: false }, bounded)        // computed: the field is lock.failures",
    "            }",
    "        }",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "fn event_at(attempt: u32, correct: u32) -> Event {",
    "    if attempt == correct { Event::Right } else { Event::Wrong }",
    "}",
    "",
    "// This loop has no termination proof in the initial implementation.",
    "// run is an ordinary fn and is never called inside a proposition.",
    "#[no_panic] #[no_io]",
    "pub fn run(attempts: u32, correct: u32) -> (last: Lock, @within_limit(last.failures as Int)) {",
    "    let mut lock = Lock { failures: 0, open: false };",
    "    let mut ok: @within_limit(lock.failures as Int) = within_limit::Bounds @ prove!((lock.failures as Int) \u003c= 3); // computed",
    "    for attempt in 0..attempts {",
    "        let (next, still) = step(lock, ok, event_at(attempt, correct));",
    "        lock = next;        // ok is now invalid",
    "        ok = still;         // exact, given that still is typed over next",
    "    }",
    "    (lock, ok)",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn remaining(failures: u32, bounded: @within_limit(failures as Int)) -> (left: u32, @((left as Int) \u003c= 3)) {",
    "    let small = logic {",
    "        let within_limit::Bounds @ small = bounded;",
    "        small",
    "    };                                                                        // model(failures) \u003c= 3",
    "    let left = 3 - failures;                                                    // the obligation of -: arithmetic, from small",
    "    (left, prove!((left as Int) \u003c= 3))                                                   // arithmetic",
    "}",
    "//~ run: run(0, 9)     => (Lock { failures: 0, open: false }, Erased)",
    "//~ run: run(2, 9)     => (Lock { failures: 2, open: false }, Erased)",
    "//~ run: run(3, 2)     => (Lock { failures: 0, open: true }, Erased)",
    "//~ run: run(300, 9)   => (Lock { failures: 3, open: false }, Erased)",
    "//~ run: step(Lock { failures: 2, open: false }, Erased, Right) => (Lock { failures: 0, open: true }, Erased)",
    "//~ run: step(Lock { failures: 3, open: true }, Erased, Wrong)  => (Lock { failures: 3, open: false }, Erased)",
    "//~ run: event_at(4294967295, 4294967295) => Right",
    "//~ run: remaining(3, Erased) => (0, Erased)",
    "~~~",
    "",
    "`@P` is the type of evidence for a claim, `prove!(F)` states a claim where it stands, and `_` asks the compiler for evidence. What is found is an explicit proof, which the kernel checks; the `+` and the `-` carry the obligation that they do not overflow, discharged by the arithmetic procedure from the facts in scope; `ok` is tracked evidence, stale after `lock = next` and established again by `ok = still`, carried by the `for` as its state. Proofs are erased, and the rest is emitted as plain Rust in which `run` takes two `u32` and `step`, which takes evidence, is `pub(super)` and out of a Rust caller's reach.",
    "",
    "The file's run lines are its demonstration. Each is run in both interpreters and, compiled by rustc with overflow checks on and off, in Rust, and the three agree:",
    "",
    "~~~text prose illustrative-results-checked-by-the-preceding-run-fence",
    "run(0, 9)     => (Lock { failures: 0, open: false }, Erased)",
    "run(2, 9)     => (Lock { failures: 2, open: false }, Erased)",
    "run(3, 2)     => (Lock { failures: 0, open: true }, Erased)",
    "run(300, 9)   => (Lock { failures: 3, open: false }, Erased)",
    "step(Lock { failures: 2, open: false }, Erased, Right) => (Lock { failures: 0, open: true }, Erased)",
    "step(Lock { failures: 3, open: true }, Erased, Wrong)  => (Lock { failures: 3, open: false }, Erased)",
    "event_at(4294967295, 4294967295) => Right",
    "remaining(3, Erased) => (0, Erased)",
    "~~~",
    "",
    "The [generated status](generated-status.md) records proof obligations by tier and stored-proof hits for these targets. The midpoint that cannot overflow and the protected `Percent` are beside the lock, and `tests/acceptance.rs` expresses the exit criteria of the core build as tests.",
    "",
    "## Status",
    "",
    "Reconciliation is complete. Process tooling is implemented; the benchmark observation period remains open. [Generated status](generated-status.md) is the sole source of current test counts, proof counts, trusted-base size, and measured timing. The [development workflow](development-workflow.md) explains how the gate refreshes it and marks obsolete measurements.",
    "",
    "A `.lc` file goes from text to a checked program, an interpreted result, generated Rust, and a crate. The core language of the [Target language](target-language.md) is the language of the code, described in [Language, as built](language.md): every machine integer type, the operators with their obligations under `no_panic`, `let mut`, assignment, Rust's loops, `return`, tracked evidence, references as parameters, `impl` blocks, moves and `derive`, visibility and the export boundary, found proofs stored beside the source, and `locus build`. What is not in the language is listed at the end of that document, and the projects that add it are under Plan.",
    "",
    "## Running it",
    "",
    "Requires Rust 1.91 or newer (validated with 1.91.1). The only dependency is the diagnostic renderer.",
    "",
    "```text prose shell-commands",
    "cargo run -- check tests/corpus/target/lock.lc            # types and proofs; writes lock.lc.proofs",
    "cargo run -- check tests/corpus/target/lock.lc --holes    # every obligation, and the tier that filled it",
    "cargo run -- check tests/corpus/target/lock.lc --stats    # per function: time to elaborate and to check",
    "cargo run -- check tests/corpus/target/lock.lc --locked   # the stored proofs alone, no search",
    "cargo run -- run tests/corpus/target/lock.lc run 300 9",
    "cargo run -- rust tests/corpus/target/lock.lc             # the generated Rust",
    "cargo run -- build tests/corpus/target/lock.lc tests/corpus/target/percent.lc --out /tmp/lock_crate",
    "tools/check.sh                                            # fmt, clippy, and the fast tests",
    "tools/check.sh --extended                                 # the long runs, and a line per exit criterion",
    "```",
    "",
    "`check`, `run`, `rust`, and `build` stop at the first stage that reports an error. Errors in the source exit with status 1, errors in the command line with status 2. Diagnostic color is enabled for terminals unless `NO_COLOR` is set. `run` takes `bool` and machine-integer arguments.",
    "",
    "## How this atlas is kept",
    "",
    "Everything about the project is in this one file, in three parts.",
    "",
    "| Part | What it holds | When it changes |",
    "|---|---|---|",
    "| **Now** | What exists in the codebase: this overview, [the language as built](language.md), [the architecture](architecture.md), and [the kernel contract](kernel-contract.md) | When work is finished |",
    "| **Vision** | What Locus is meant to be: [positioning](positioning.md), the [target language](target-language.md), [principles](principles.md), and [what is still open or deferred](open-questions.md) | When a decision is made |",
    "| **Plan** | The projects and tasks that lead from Now to Vision, and the language status table, which is the difference between the two | With both |",
    "",
    "A decision is written into the Vision and gets tasks in the Plan. Finished work is written into Now and closes its tasks. Nothing about the future is written under Now, and nothing under Vision claims to exist."
   ],

  {
   "id": "language",
   "title": "Language, as built",
   "group": "Now",
   "body": [
    "# Language, as built",
    "",
    "\u003c!-- spec: 1.0:1 informative -->",
    "The implementation reference after Reconciliation. Logical data and heap-view features are enabled by default and have passed the complete extended acceptance gate. Every construct here is exercised by a file under `tests/corpus/accept`, `tests/corpus/target`, or `examples`, or by a test named beside it; a construct the compiler refuses is named in the section on what is not yet built, with the file that pins its refusal. The language the project is building towards is [Target language](target-language.md); the difference between the two is the Language status table. How the compiler is built is [Architecture](architecture.md), and the rules of the proof kernel are [the kernel contract](kernel-contract.md).",
    "",
    "\u003c!-- spec: 1.0:2 legality-rule -->",
    "Locus source tokenizes as Rust, and where Locus and Rust both have a thing it means what it means in Rust. What Locus adds is propositions, evidence, and the promises a function makes; what it takes away is listed at the end. Every Rust keyword is reserved, so that a name in Locus is a name in the generated Rust (`tests/corpus/reject/keyword_as_name.lc`).",
    "",
    "## 1. The 32-bit lock",
    "",
    "\u003c!-- spec: 1.1:1 legality-rule -->",
    "`tests/corpus/target/lock.lc` is the target example: named proposition arms, explicit evidence, tracked loop evidence, and checked machine arithmetic. Its program text is kept identical to the Vision target; run directives belong to the corpus harness.",
    "",
    "\u003c!-- spec: 1.1:2 example -->",
    "~~~locus run",
    "#[derive(Clone, Copy)]",
    "pub enum Event { Wrong, Right }",
    "",
    "#[derive(Clone, Copy)]",
    "pub struct Lock { failures: u32, open: bool }",
    "",
    "prop within_limit(failures: Int) {",
    "    Bounds => {",
    "        prop!(failures \u003c= 3)",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn step(",
    "    lock: Lock,",
    "    bounded: @within_limit(lock.failures as Int),",
    "    event: Event,",
    ") -> (next: Lock, @within_limit(next.failures as Int)) {",
    "    match event {",
    "        Event::Right => {",
    "            let next = Lock { failures: 0, open: true };",
    "            (next, within_limit::Bounds @ prove!((next.failures as Int) \u003c= 3))             // computed: 0 \u003c= 3",
    "        }",
    "        Event::Wrong => {",
    "            if lock.failures \u003c 3 {",
    "                let fits = prove!(lock.failures as Int + 1 \u003c= u32::MAX as Int); // arithmetic, from lock.failures \u003c 3",
    "                let next = Lock { failures: lock.failures + 1, open: false };   // the obligation of + is fits: exact",
    "                (next, within_limit::Bounds @ prove!((next.failures as Int) \u003c= 3))         // arithmetic",
    "            } else {",
    "                (Lock { failures: lock.failures, open: false }, bounded)        // computed: the field is lock.failures",
    "            }",
    "        }",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "fn event_at(attempt: u32, correct: u32) -> Event {",
    "    if attempt == correct { Event::Right } else { Event::Wrong }",
    "}",
    "",
    "// This loop has no termination proof in the initial implementation.",
    "// run is an ordinary fn and is never called inside a proposition.",
    "#[no_panic] #[no_io]",
    "pub fn run(attempts: u32, correct: u32) -> (last: Lock, @within_limit(last.failures as Int)) {",
    "    let mut lock = Lock { failures: 0, open: false };",
    "    let mut ok: @within_limit(lock.failures as Int) = within_limit::Bounds @ prove!((lock.failures as Int) \u003c= 3); // computed",
    "    for attempt in 0..attempts {",
    "        let (next, still) = step(lock, ok, event_at(attempt, correct));",
    "        lock = next;        // ok is now invalid",
    "        ok = still;         // exact, given that still is typed over next",
    "    }",
    "    (lock, ok)",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn remaining(failures: u32, bounded: @within_limit(failures as Int)) -> (left: u32, @((left as Int) \u003c= 3)) {",
    "    let small = logic {",
    "        let within_limit::Bounds @ small = bounded;",
    "        small",
    "    };                                                                        // model(failures) \u003c= 3",
    "    let left = 3 - failures;                                                    // the obligation of -: arithmetic, from small",
    "    (left, prove!((left as Int) \u003c= 3))                                                   // arithmetic",
    "}",
    "//~ run: run(3, 2) => (Lock { failures: 0, open: true }, Erased)",
    "~~~",
    "",
    "\u003c!-- spec: 1.1:3 legality-rule -->",
    "`locus run tests/corpus/target/lock.lc run 300 9` returns `(Lock { failures: 3, open: false }, Erased)`. The evidence-taking functions are restricted exports; Rust callers use the public data interface. Proof counts and timing are measurements of the implementation, not language semantics.",
    "",
    "## 2. What the compiler remembers",
    "",
    "\u003c!-- spec: 1.2:1 legality-rule -->",
    "A source name is resolved to a binding identity, and every claim is written over identities, never over spellings. Shadowing makes a new identity, so a proposition formed before a `let` that reuses a name still speaks of the old value (`tests/corpus/accept/assign_shadowing.lc`). A `let mut` binding has one identity and a sequence of versions, one more at each assignment; a claim speaks of the version current where it was formed, and the type of tracked evidence is read again at each use over the versions current there (section 12).",
    "",
    "\u003c!-- spec: 1.2:2 legality-rule -->",
    "Items are elaborated in dependency order, whatever order the file lists them in: every name an item mentions that is also an item's name is an edge, and an unsupported cycle is an error. Logical data admits checked recursive logical definitions (`tests/corpus/reject/recursion.lc`, `method_recursion.lc`). Types and values are two namespaces, as in Rust: a struct, enum, or proposition may share its name with a function or a constant (`tests/corpus/accept/namespaces.lc`).",
    "",
    "\u003c!-- spec: 1.2:3 legality-rule -->",
    "What is known at a point of a function is a context of typed bindings and facts: the parameters; each `let` with its defining equation, when its right side is a term of the logic; the fact of each branch and arm; the bounds of a `for` index; every binding of proof type; and the evidence fields of every struct and tuple in scope, stated about that value's own fields. A call to an ordinary function gives its result a type and nothing else: its body is never unfolded, and its result has no defining equation.",
    "",
    "## 3. Types",
    "",
    "\u003c!-- spec: 1.3:1 legality-rule -->",
    "| Type | Runtime form | Notes |",
    "|---|---|---|",
    "| `bool` | `bool` | Physical boolean. |",
    "| `u8` through `u64`, `i8` through `i64` | Same machine type | No `usize`/`isize` surface type yet. |",
    "| `()` and tuples | Same product shape | Optional names in tuple types bind later field types; access stays positional. |",
    "| Ordinary structs/enums | Rust structs/enums | A physical aggregate may hold erased fields; an ordinary enum retains its tag. |",
    "| `Int`, `Bool`, `Prop`, `@P` | `Erased` | Logical integers, booleans, propositions and evidence. |",
    "| `#[derive(Logical)]` aggregates | `Erased` | Every field must be Logical. |",
    "| `logic Fn(x: T) -> U` | `Erased` | Inputs and result are Logical, including dependent evidence results. |",
    "| `&T`, `&mut T` parameters | Rust borrows | Shared stored references require heap-views; stored mutable references remain unsupported. |",
    "| `[T; n]`, `Vec\u003cT>`, borrowed `[T]` | Corresponding Rust storage | Runtime or Logical elements; literal array lengths. Logical elements erase, physical storage remains. |",
    "| `!` | Diverging expression | A declared never-returning function has no reachable result; its proof representation is erased. |",
    "",
    "\u003c!-- spec: 1.3:2 legality-rule -->",
    "Types may occur on parameters, bindings, fields, constants and results. Later fields and results may mention earlier values inside propositions and evidence types. Such dependencies do not select a runtime layout. Tuple field names exist only as binders in later types. Named structs are nominal.",
    "",
    "\u003c!-- spec: 1.3:3 legality-rule -->",
    "Generic structs, enums, propositions and functions in logical-data are checked templates. Every concrete instance is elaborated and kernel checked. An unused generic body is not asserted to be universally verified. `T: Logical` is the supported classification bound; other trait systems remain deferred. Generic methods inside inherent impls are not yet supported.",
    "",
    "\u003c!-- spec: 1.3:4 legality-rule -->",
    "`Ghost\u003cT>` and `snapshot!` are rejected migration syntax. Observe runtime data using its logical model (`x as Int`, or a checked user-defined Model implementation). A logical value's classification belongs to its type, not a `logic let` binding qualifier.",
    "",
    "## 4. Products, enums, and match",
    "",
    "\u003c!-- spec: 1.4:1 legality-rule -->",
    "A tuple is built `(a, b)`, a one-field tuple `(n,)`, and a struct `S { f: e, g }` with `g` short for `g: g`, in any field order; every field is given once and the names are those declared (`tests/corpus/reject/struct_literal_*.lc`). A tuple field is read `t.0`, and nested `pair.1.0`; a struct field by name. A tuple type's field names are binders only: `t.name` is refused (`tests/corpus/reject/field_of_a_tuple_by_name.lc`). Each field of a product is checked against its type with the earlier fields substituted, so `(next, within_limit::Bounds @ evidence)` is checked with `next` standing for the first field in the second's claim, and a `let (next, still) = step(...)` opens the tuple the same way: `still` has the type `@within_limit(next.failures as Int)`, about the `next` just bound, which is what lets evidence returned by a call be passed on (`tests/corpus/accept/evidence_argument.lc`).",
    "",
    "\u003c!-- spec: 1.4:2 legality-rule -->",
    "An enum declares its variants with no fields, positional fields, or named fields, and a variant's later field may mention an earlier one in a proposition (`tests/corpus/accept/named_variants.lc`). A variant is built by path, `E::V(x)`, `E::V { f: x, g }`, and inside an `impl` block of `E` also `Self::V`. `match` on an enum has one arm per variant, in any order, or a `_` arm; the pattern of an arm is `E::V`, `E::V(names)`, `E::V { f, g: other, .. }`, with a name or `_` for each field, and nothing deeper (`tests/corpus/reject/nested_pattern.lc`, `missing_arm.lc`, `unreachable_arm.lc`). Each arm knows that the scrutinee is the variant it names, applied to the names it bound. `match` takes apart an enum or evidence: `bool` is branched on with `if`, and an integer is compared (`tests/corpus/reject/match_on_a_number.lc`, `match_on_a_comparison.lc`).",
    "",
    "\u003c!-- spec: 1.4:3 legality-rule -->",
    "The ordinary patterns of a `let` are a name, `_`, and a tuple of those; a runtime struct or variant pattern in a `let` is refused (`tests/corpus/reject/variant_pattern_in_let.lc`). A name in a pattern may be `mut`.",
    "",
    "## 5. Expressions and computation modes",
    "",
    "\u003c!-- spec: 1.5:1 dynamic-semantics -->",
    "Runtime expressions use Rust-like evaluation order: operands and arguments are evaluated left to right, while assignment evaluates its right side before its destination. Effects of ordinary calls are retained even when their returned value is Logical.",
    "",
    "\u003c!-- spec: 1.5:2 dynamic-semantics -->",
    "`fn` declares ordinary execution. Its body may mutate, panic or diverge subject to its stated promises. It can accept or return data, propositions and evidence; the logical values occupy erased positions. A result's type does not make the call logical. An ordinary function cannot be unfolded or called inside a logical computation, even if it promises every effect restriction.",
    "",
    "\u003c!-- spec: 1.5:3 dynamic-semantics -->",
    "`logic fn` declares checked logical computation. Its result must be Logical; it cannot perform physical mutation, allocate physical objects, panic, or call ordinary functions. It can inspect authorized immutable snapshots of runtime inputs and call other logical definitions. `logic { ... }`, `prop!(...)`, proof annotations and `prove!(...)` establish logical contexts. User-defined total recursion requires the logical-data rules in section 25. The four runtime promises do not infer logical mode.",
    "",
    "\u003c!-- spec: 1.5:4 dynamic-semantics -->",
    "Ordinary code may call a logical function or compute with Logical operands without first wrapping the expression in `logic { ... }`. These logical operations disappear, but any ordinary argument-producing calls run once in source order. Inside an explicitly logical block such calls are rejected. Runtime control depends on physical `bool` or a physical enum tag; a logical conditional uses `Bool` and produces only logical computation. A logical value cannot be converted into physical data or used to choose a runtime branch.",
    "",
    "\u003c!-- spec: 1.5:5 dynamic-semantics -->",
    "Operator selection follows the operand types. `count + 1` with `count: Int` is erased integer arithmetic; the same syntax at `u8` is a runtime operation with Rust overflow behavior. Logical `Bool` and physical `bool` are different surface types even though the kernel shares a boolean representation. A separately checked erasure layout preserves the distinction inside products, fields, arguments, results and control-flow joins.",
    "",
    "## 6. Propositions",
    "",
    "\u003c!-- spec: 1.6:1 legality-rule -->",
    "A proposition is a Logical value of `Prop`. `prop!(test)` turns a logical boolean test into the claim that it holds. Runtime captures are observed through their models at their current SSA versions; no runtime closure or retained borrow is created. Capturing still requires that the value is available and that the observation is permitted. A proposition may be stored or returned after the original local name leaves scope, provided its logical dependencies are closed or explicitly carried in the returned value.",
    "",
    "\u003c!-- spec: 1.6:2 legality-rule -->",
    "Logical machine observations default to mathematical `Int` (`Bool` for physical booleans), so `prop!(x + 1 > x)` uses logical integer arithmetic rather than executing a possibly overflowing machine add. `x as Int` makes the model explicit. Explicit wrapping operations retain their machine-width meaning and then expose that result to the logic. Physical comparisons outside logical contexts still require matching machine types.",
    "",
    "\u003c!-- spec: 1.6:3 legality-rule -->",
    "`logic fn predicate(x: Int) -> Prop { prop!(x >= 0) }` is a computed predicate. Its immutable local bindings, conditionals, matches and checked total logical calls are ordinary logical computation. Proofs use its defining equation through `fold!` and `unfold!`; the compiler does not assume the body true.",
    "",
    "\u003c!-- spec: 1.6:4 informative -->",
    "A named proposition instead declares introduction alternatives:",
    "",
    "\u003c!-- spec: 1.6:5 example -->",
    "~~~locus check",
    "prop Small(n: Int) {",
    "    Zero => { prop!(n == 0) }",
    "    Below { limit: Int } => { prop!(n \u003c limit && limit \u003c= 10) }",
    "}",
    "~~~",
    "",
    "\u003c!-- spec: 1.6:6 legality-rule -->",
    "`Small::Zero @ evidence` requires evidence of its arm body and establishes `Small(n)`. `Small::Below { limit: 10 } @ evidence` passes the witness separately from the evidence of the resulting body. The alternatives need not be mutually consistent or exclusive: they are sufficient ways to establish the named proposition. They are not definitional equalities between that proposition and each individual body. Matching a proof recovers the chosen witnesses and its body evidence.",
    "",
    "\u003c!-- spec: 1.6:7 legality-rule -->",
    "`P && Q`, `P || Q`, `!P` and implication compose propositions. `forall` and `exists` syntax remains available; under logical-data it expands to the ordinary checked library propositions `ForAll\u003cT>` and `Exists\u003cT>` and logical predicate values. The kernel checks their registered schemas before treating them as positive quantifiers inside inductive declarations. Native quantifier term forms remain as low-level compatibility while that migration is completed; no constructor gains authority from its spelling.",
    "",
    "## 7. Proofs and their forms",
    "",
    "\u003c!-- spec: 1.7:1 syntax -->",
    "A proof type is `@name`, `@f(args)` for a call of the logic, `@N(args)` for a declared proposition, or `@(F)` for a formula; a leading `@` begins a proof type; between a named proposition constructor and its body evidence it separates the two expression operands (`tests/corpus/reject/proof_type_as_expression.lc`). Evidence is an ordinary expression of a proof type:",
    "",
    "\u003c!-- spec: 1.7:2 syntax -->",
    "| Written | What it is |",
    "|---|---|",
    "| `_` | a hole: the compiler finds the evidence, by the tiers of section 8 |",
    "| `prove!(F)` | a claim stated where it stands: as a statement it leaves `F` known to everything after it; as a value it is evidence of `F` |",
    "| a name, a field, a call | evidence already held, a field of evidence, or evidence a function returns |",
    "| `And::Intro(h, k)`, `Or::Left(h)`, `Or::Right(h)`, `True::Intro` | the constructors of the built-in connectives |",
    "| `N::Arm(witnesses) @ evidence`, `N::Arm { witness: value } @ evidence` | a named-arm constructor with a separate body-evidence slot |",
    "| `match h { N::Arm(x) @ body => ..., }` | Proof elimination; nonempty matches produce evidence, so witnesses cannot be extracted into data. Empty false elimination remains valid. |",
    "| `rewrite!(eq, h)` | `h` carried across the equation `eq` proves, every occurrence of its left side replaced by its right |",
    "| `unfold!(f, h)`, `fold!(f, h)` | `h` with a call of the function `f` of the logic opened to its body, or the body closed to the call; `f` is a name or a path such as `Counter::small` |",
    "| `general(p)(q)(h)` | evidence of a `forall` or an implication applied to an argument |",
    "| `u32_le_trans(a, b, c, ab, bc)` | a lemma of the theory called by name, its premises as arguments |",
    "| `f` | a function of the logic that returns evidence, named as evidence of its general claim |",
    "",
    "\u003c!-- spec: 1.7:3 syntax -->",
    "`examples/proofs.lc`, `examples/propositions.lc`, `tests/corpus/accept/explicit_steps.lc`, and `tests/corpus/accept/forms.lc` show each. The forms take `!` as a Rust macro does; a bare `rewrite(...)` is an error with a fix (`tests/corpus/reject/bare_proof_form.lc`).",
    "",
    "\u003c!-- spec: 1.7:4 syntax -->",
    "The lemmas callable by name are the 162 the kernel's theory declares: six about `Int`, `int_le_of_lt`, `int_lt_of_le_of_ne`, `int_le_add_left`, `int_le_add_right`, `int_le_sub`, `int_mul_le_mul_nonneg`; and at each of the eight machine types `T`, written `\u003cT>_\u003clemma>` as `u32_le_trans` and `i8_view_bounds`, `le_refl`, `le_trans`, `le_of_lt`, `lt_of_le_of_ne`, `lt_irrefl`, `le_antisymm`, `view_injective`, `view_bounds`, `le_of_cmp`, `cmp_of_le`, `lt_of_cmp`, `cmp_of_lt`, `eq_of_cmp`, `cmp_of_eq`, `lt_of_not_le`, `le_of_not_lt`, `succ_le_of_lt`, and `eq_symm`, with `zero_le`, `sub_le`, and `sub_le_sub` at the unsigned types. Their statements are in the kernel contract under Lemmas.",
    "",
    "\u003c!-- spec: 1.7:5 syntax -->",
    "Evidence is accepted only for the claim wanted, after computing (section 8): evidence of `x \u003c= 3` where `y \u003c= 3` is wanted is a mismatch, whatever relates `x` and `y` (`tests/corpus/reject/evidence_of_another_claim.lc`).",
    "",
    "## 8. What a hole finds",
    "",
    "\u003c!-- spec: 1.8:1 legality-rule -->",
    "A `_`, a `prove!`, the obligation of an operator under `no_panic`, and the evidence of a panic form under `no_panic` are filled by a fixed search whose tiers are tried in order. Every limit in it is a count of work and never a clock, and the proof it finds is checked by the kernel like any other.",
    "",
    "\u003c!-- spec: 1.8:2 legality-rule -->",
    "| Tier | What it does |",
    "|---|---|",
    "| stored | the entry for this obligation in the proofs file beside the source (section 20), checked again |",
    "| exact | a fact in scope that is the claim: a branch or arm fact, a `let` equation, a range bound, evidence in scope, or an evidence field of a value in scope |",
    "| computed | the same after computing: `let` names replaced by what they stand for, projections of written products, matches on written constructors, and arithmetic on literals; a definition is never unfolded on its own |",
    "| evaluation | a closed comparison, run by the kernel: `0 \u003c= 3`, `2 != 0` |",
    "| arithmetic | the linear arithmetic procedure (`src/arith`): the claim and the facts read as linear constraints over `Int`, the ranges of every machine value in them, the exact results of operators already discharged, and division by a literal reduced to the kernel's decomposition; it emits a certificate the kernel's `linear` rule checks |",
    "",
    "\u003c!-- spec: 1.8:3 legality-rule -->",
    "What a hole does not do: take a connective apart, unfold a definition, rewrite by an equation in scope, try every value of a byte, or bridge evidence of one claim to another. Each of those is a form of section 7, and the diagnostic for a failed hole names which (`tests/corpus/reject/connective_needs_a_constructor.lc`, `definition_opens_only_by_unfold.lc`, `equation_needs_rewrite.lc`, `one_byte_needs_a_lemma.lc`). `locus check --holes` lists every hole with the tier that filled it and the size of its proof; `--stats` counts the obligations by tier.",
    "",
    "## 9. Functions and promises",
    "",
    "\u003c!-- spec: 1.9:1 syntax -->",
    "A function is `fn name(params) -> R { body }`, with a result type that may name its value, `-> (out: u8, @(out \u003c= 3))`, so that the evidence returned speaks of the data returned. A parameter may be `mut`, `&T`, or `&mut T`. Every function has a result type; `-> ()` is written out. Ordinary runtime recursion is not yet supported; logical recursion is checked as described in section 25.",
    "",
    "\u003c!-- spec: 1.9:2 syntax -->",
    "The promises are four attributes, written on the function or once for the file as `#![no_panic]`, never inferred, and each checked in the check IR against the body (`tests/corpus/accept/promises.lc`, `tests/exec_endings.rs`):",
    "",
    "\u003c!-- spec: 1.9:3 syntax -->",
    "| Promise | What is checked |",
    "|---|---|",
    "| `#[terminates]` | no `loop`, `while`, or `for` anywhere in the body, and every function called promises it |",
    "| `#[no_panic]` | every operator that may panic carries evidence that it does not (section 15), every panic form carries evidence of `false` (section 10), and every function called promises it |",
    "| `#[no_io]` | every function called promises it; the core has no primitive that performs I/O |",
    "| `#[no_alloc]` | every callee promises it; allocating native collection and Box operations are rejected |",
    "",
    "\u003c!-- spec: 1.9:4 syntax -->",
    "Only `logic fn` declares a function of the logic (section 5). Runtime promises do not change this classification. A promise not kept is reported at the construct that breaks it (`tests/corpus/reject/promise_not_kept.lc`, `loop_under_terminates.lc`, `panic_under_no_panic.lc`, `exact_without_no_panic.lc`). `#[terminates(decreases = e)]` is parsed and refused: recursion is a later project (`tests/corpus/reject/decreases_not_yet.lc`).",
    "",
    "\u003c!-- spec: 1.9:5 syntax -->",
    "A `const` with a runtime form is a Rust `const`: its value is a literal, a cast, a comparison, a wrapping method, or a tuple, struct, or variant of those, naming other constants, and it is used by name; in the logic it is a function of no parameters with a defining equation. A constant of type `Prop` has no runtime form and may mention any function of the logic (`tests/corpus/accept/constants.lc`, `tests/corpus/reject/constant_calls.lc`).",
    "",
    "## 10. The forms that panic",
    "",
    "\u003c!-- spec: 1.10:1 dynamic-semantics -->",
    "`panic!(msg)`, `todo!()`, `todo!(msg)`, `unreachable!()`, and `unreachable!(msg)` yield no value and stand where any type is expected; `assert!(c)`, `assert!(c, msg)`, `debug_assert!(c)`, and `debug_assert!(c, msg)` are checks of type `()`. A message is a string literal, written as it is; format arguments are not in Locus (`tests/corpus/accept/panic_forms.lc`, `tests/corpus/reject/format_arguments.lc`). After `assert!(c)` the condition is a fact. A half-written file checks: `todo!()` stands for a body or the rest of one (`tests/corpus/accept/half_written.lc`).",
    "",
    "\u003c!-- spec: 1.10:2 dynamic-semantics -->",
    "A panic is a third way for a function to end, beside returning and never returning. Under `no_panic` every panic form must carry evidence of `false` at its point, found as a hole is: `assert!(x \u003c= 3)` from a hypothesis or by arithmetic, `unreachable!()` from the facts of the arms around it (`tests/corpus/accept/no_panic_forms.lc`). Code after a statement that transfers control or panics is unreachable, reported as a warning once per block, and not elaborated (`tests/corpus/accept/unreachable_statement.lc`).",
    "",
    "## 11. if, else, loops, return",
    "",
    "\u003c!-- spec: 1.11:1 dynamic-semantics -->",
    "`if c { a } else { b }` branches on a `bool`; each branch knows the outcome of the test it made, `a \u003c b` as the fact `a \u003c b` and its negation on the other side, and a condition `a != b` is the test `a == b` with the branches exchanged (`examples/preserve.lc`). An `if` in statement position still takes its `else`, which may be empty. `c && d`, `c || d`, and `!c` on `bool` are conditionals, so the right operand knows the left one held.",
    "",
    "\u003c!-- spec: 1.11:2 dynamic-semantics -->",
    "The loops are Rust's: `loop { ... }` with `break value` giving it its value and `continue` starting the next pass; `while c { ... }`, of type `()`, whose `break` carries nothing; and `for i in lo..hi { ... }` or `lo..=hi` over a range of any machine integer type, whose index is immutable and whose body knows `lo \u003c= i` and `i \u003c hi`, or `i \u003c= hi`, afresh on every pass. Nothing is asked about the order of the bounds: a range whose start lies past its end runs no pass, and the bounds are evaluated once (`tests/corpus/accept/loop_forms.lc`, `loop_ranges.lc`, `loop_nested.lc`). `break` and `continue` belong to the innermost loop. A `loop` that never breaks fits any result type. A loop never promises to terminate: it is forbidden under `terminates` and in a proposition. A `for` over anything but a range, and `while let`, are not in Locus yet (`tests/corpus/reject/loops_not_yet.lc`).",
    "",
    "\u003c!-- spec: 1.11:3 dynamic-semantics -->",
    "`return`, or `return value`, ends the function from any depth, and the value is checked against the result type in what is known where the `return` stands. `return`, `break`, `continue`, the panic forms, and a call of a function declared `-> !` have the never type, which coerces to any type; a function declared `-> !` must not reach the end of its body (`tests/corpus/accept/early_return.lc`, `tests/corpus/reject/never_fn_returns.lc`).",
    "",
    "## 12. Mutation, versions, and tracked evidence",
    "",
    "\u003c!-- spec: 1.12:1 dynamic-semantics -->",
    "`let mut x = e;` declares a binding that may be assigned, whole, `x = e`, or by a field path, `x.f.g = e`, `t.0 = e`; a `mut` parameter is assigned the same way. Assignment is a statement and has no value (`tests/corpus/accept/assign_straight.lc`, `tests/corpus/reject/assignment_as_value.lc`, `assign_immutable.lc`). The checker sees no assignment: lowering gives the binding a new version at each one, an assignment to a field rebuilding the whole value around the new field, and every later mention means the current version. A field that evidence in the same struct depends on cannot be assigned alone, because the rebuilt value would carry evidence about the old field; the whole value is replaced (`tests/corpus/reject/assign_field_with_evidence.lc`).",
    "",
    "\u003c!-- spec: 1.12:2 dynamic-semantics -->",
    "A branch some arm of which assigns a binding declared outside it joins: after it, each such binding is the version the arm taken produced, and nothing else is known of it beyond what evidence says; an arm that returns, breaks, continues, or panics contributes nothing to the join. A loop carries the bindings declared before it that its body, or the condition of a `while`, assigns, over binding identities: a field write counts for its root, a `let mut` inside the body is local, a shadowing name is another binding, and an assignment inside a nested block or branch counts (`tests/corpus/accept/assign_branches.lc`, `assign_join_evidence.lc`, `loop_assigned.lc`). After a loop, what it carried is known only by its type and by the evidence carried with it.",
    "",
    "\u003c!-- spec: 1.12:3 dynamic-semantics -->",
    "Evidence bound with `let` is a snapshot: it keeps its claim about the versions captured where it was written, whatever is assigned later, and `let p = prop!(x \u003c= 3)` likewise captures the `x` of that point. Evidence bound with `let mut` is tracked: its declared type is read over the versions current wherever it is used, an assignment to a binding it mentions, or a `&mut` lend of one, leaves it stale, and a use of stale evidence is an error that names the assignment. `ok = _`, `ok = prove!(F)`, or `ok = still` establishes it again over the current versions. A branch keeps tracked evidence valid after the join when every arm that reaches the join left it valid; a loop carries tracked evidence declared outside it as part of its state, so it must be valid at entry, at every `continue`, and at the end of the body, and is valid after the loop (`tests/corpus/accept/tracked_refresh.lc`, `tracked_snapshot.lc`, `tracked_loop.lc`, `examples/lock.lc`; `tests/corpus/reject/tracked_stale_use.lc`, `tracked_join.lc`, `tracked_loop_edges.lc`, `tracked_captured.lc`). The flow analysis that decides validity is not trusted: lowering types every version, so stale evidence passed where the current claim is wanted is rejected by the checker whatever the analysis said. Logical type classification is independent of whether a binding is mutable.",
    "",
    "## 13. References",
    "",
    "\u003c!-- spec: 1.13:1 dynamic-semantics -->",
    "Without heap-views, a reference lasts for one call. A parameter may be `x: &T` or `x: &mut T`, and an argument for it is a lend of a place, `&x`, `&mut x.f`, `&mut pair.0`; a stored shared reference requires heap-views, and stored mutable references are not in Locus (`tests/corpus/reject/reference_in_let.lc`, `reference_argument.lc`). Inside the callee a `&T` parameter is the value lent, read through its fields or whole when it is `Copy`, and never moved out of (`tests/corpus/reject/move_out_of_reference.lc`); a `&mut T` parameter is a mutable binding, assigned whole or by path, and its final value is written back into the caller's place when the call ends. In the parameter types its name means the value at entry, in the result type the value at return, and `old!(x)` names the entry value where the result needs both. Lending `&mut x` needs a `let mut x` (`tests/corpus/reject/borrow_immutable.lc`). Two arguments of one call may not overlap when either is `&mut`, and an argument may not read a root another argument lends by `&mut`: lowering refuses the overlap, and the message carries rustc's code (`tests/corpus/reject/overlapping_arguments.lc`, `tests/references.rs`). A field that evidence in the same struct depends on cannot be lent by `&mut` (`tests/corpus/reject/lend_field_with_evidence.lc`); the whole value is lent, and whoever holds it can only replace it with a valid one.",
    "",
    "\u003c!-- spec: 1.13:2 dynamic-semantics -->",
    "When a call panics, the writes it made through `&mut` before the panic are real: both interpreters report the panic with the values of the `&mut` parameters at that moment, and a Rust caller that catches the panic finds them (`tests/corpus/accept/references.lc`, `references_panic.lc`).",
    "",
    "## 14. Methods",
    "",
    "\u003c!-- spec: 1.14:1 syntax -->",
    "`impl T { ... }` declares functions under `T`. One with no `self` is an associated function, `T::name(args)`; one whose first parameter is `self`, `mut self`, `&self`, or `&mut self` is a method, called `x.name(args)` or by path with the receiver written as a lend, `T::name(&x, args)`. The receiver is a parameter named `self` of type `T`, passed as written: `self` moves `x` unless it is `Copy`, `&self` lends it, `&mut self` lends it mutably and needs a `let mut x`. `Self` is `T` inside the block, in types, literals, and variant paths; `*self` is the value behind a reference receiver, read, matched, or for `&mut self` replaced whole (`tests/corpus/accept/methods.lc`, `tests/corpus/target/percent.lc`; `tests/corpus/reject/star_self_misused.lc`, `method_call_shapes.lc`, `unknown_method.lc`, `method_declared_twice.lc`). In the logic a method is the function `T::name`, which a proposition calls as `c.small()` or `Counter::small(&c)`, and which `unfold!` and `fold!` take by path. An `impl` block holds functions only, and there are no traits (`tests/corpus/reject/impl_of_nothing.lc`, `rust_not_yet.lc`).",
    "",
    "## 15. Integers and operators",
    "",
    "\u003c!-- spec: 1.15:1 syntax -->",
    "Literals are written as in Rust: decimal, `0x`, `0o`, `0b`, underscores, and a suffix, `255u8`, `1_000u16`. A literal takes the type expected of it, else its suffix, else `i32`; `-128` is one literal; `T::MAX` and `T::MIN` are literals of `T` (`tests/corpus/accept/literals.lc`, `integer_types.lc`; `tests/corpus/reject/literal_misfit.lc`, `literal_out_of_range.lc`). `a as T` between machine types is Rust's `as`: it wraps, sign-extends, and truncates as Rust does, at every pair of types (`tests/corpus/accept/casts.lc`). `==`, `!=`, `\u003c`, `\u003c=`, `>`, `>=` compare two values of one machine type, and `==` and `!=` two `bool`. `a.wrapping_add(b)`, `wrapping_sub`, `wrapping_mul`, and at a signed type `wrapping_neg` never panic.",
    "",
    "\u003c!-- spec: 1.15:2 syntax -->",
    "`+`, `-`, `*`, `/`, `%`, and unary minus on a machine type mean what they mean in Rust: `+ - *` and unary minus panic on overflow in a build with overflow checks and wrap in one without; `/` and `%` panic on a zero divisor, and at a signed type on `MIN / -1`, in every build (`tests/corpus/accept/operators.lc`, generated at the boundaries of every type). What the logic learns: without a promise, the wrapped result, `s == (a as Int + b as Int) as u8`, the one fact true in every build; after `/` and `%`, that the divisor was not zero, since execution continues only then. Under `no_panic` an operator carries an obligation, the condition under which it does not panic, stated over the views, `a as Int + b as Int \u003c= u8::MAX as Int` and its lower bound for `+`, `b as Int != 0` for `/`, and filled as a hole is; afterwards the exact result is known, `s as Int == a as Int + b as Int` (`tests/corpus/accept/arithmetic_facts.lc`, `tests/corpus/target/midpoint.lc`; `tests/corpus/reject/operator_obligation.lc`, `midpoint_unordered.lc`). Bit operators and shifts are not in Locus (`tests/corpus/reject/bit_operators_not_yet.lc`).",
    "",
    "\u003c!-- spec: 1.15:3 syntax -->",
    "In a claim an ordering of two machine values is the ordering of their views, and `as Int` says so explicitly. Arithmetic on `Int` is total and may stand anywhere in a formula.",
    "",
    "## 16. Moves and derive",
    "",
    "\u003c!-- spec: 1.16:1 legality-rule -->",
    "Values move, as in Rust. A type is used more than once only when it is `Copy`; `#[derive(...)]` asks for it from the closed list `Clone`, `Copy`, `PartialEq`, `Eq`, `Debug`, in any order, and `Copy` needs `Clone` (`tests/corpus/accept/derives.lc`; `tests/corpus/reject/unknown_derive.lc`, `copy_without_clone.lc`, `copy_with_non_copy_field.lc`). A type holding evidence may derive `Clone`, `Copy`, and `Debug`, whose Rust prints the marker, and not `PartialEq`, since evidence is erased (`tests/corpus/reject/partial_eq_with_evidence.lc`). Use after a move is an error; a moved `let mut` is whole again once assigned, also before the back edge of a loop and in every arm of a branch; a `Copy` field is copied out of a value that is not, and a field that is not `Copy` moves out alone; a `match` that binds nothing that moves leaves the value whole; a proposition may mention a value only while it is whole, and evidence is never moved (`tests/corpus/accept/moves.lc`; `tests/corpus/reject/use_after_move.lc`, `moved_in_loop.lc`, `moved_in_one_arm.lc`, `proposition_mentions_moved.lc`). The move analysis is not trusted: a program it wrongly accepted would be refused by rustc, and `tests/moves.rs` hands every rejected shape to rustc, which refuses it with E0382.",
    "",
    "## 17. Visibility and the boundary with Rust",
    "",
    "\u003c!-- spec: 1.17:1 legality-rule -->",
    "Items and fields are private unless marked `pub`; `pub(crate)`, `pub(super)`, `pub(self)`, and `pub(in path)` are parsed and printed as written. A function that takes evidence, as a parameter or inside a parameter's type, may be `pub(crate)` and never plain `pub`, because every proof erases to the same marker and a Rust caller could pass one obtained honestly to a function that wants evidence of something else; the error offers the two ways out, a narrower visibility or a validated type (`tests/corpus/reject/pub_evidence_fn.lc`, `pub_evidence_field.lc`, `pub_evidence_hidden.lc`). What Rust sees takes no evidence: it takes plain data and checks it at runtime, as `Percent::checked` does, or takes a validated type whose fields are private. `tests/build.rs` and `tests/acceptance.rs` compile hand-written Rust against the generated crate of the target examples: the plain `pub` exports run, an evidence-taking function is E0603 or E0624, the marker cannot be named or built, a struct with a private field cannot be built or read, the marker replay attack does not compile, and a value a Rust caller still holds after catching a panic satisfies its invariant.",
    "",
    "## 18. Erasure",
    "",
    "\u003c!-- spec: 1.18:1 dynamic-semantics -->",
    "All Logical positions use one private zero-sized marker, `Erased`. Logical declarations and computations have no runtime implementation. Physical tuples and structs keep their layout positions, replacing logical fields with markers; ordinary enum tags and physical allocation remain observable. A physical `Box\u003cT>` remains physical even when T is Logical.",
    "",
    "\u003c!-- spec: 1.18:2 dynamic-semantics -->",
    "Erasure separates value production from execution. A logical operation disappears after its ordinary argument computations have run. An ordinary `fn` call remains even if it returns only evidence, takes only logical inputs, or promises to terminate and avoid panic. An ordinary function that takes `&mut` and returns a proof still performs its mutation at runtime. There is no result-type shortcut that deletes its effects.",
    "",
    "\u003c!-- spec: 1.18:3 dynamic-semantics -->",
    "Unused erased local bindings and unused erased destructuring components are removed by default in generated Rust. Effectful right sides are retained as statements. Bindings whose evaluation transfers control become the block's terminal expression, so removing an unused marker does not produce unreachable Rust or change divergence. The cleanup is checked by interpreter comparison and Rust compilation with warnings denied.",
    "",
    "\u003c!-- spec: 1.18:4 dynamic-semantics -->",
    "Proofs are never observed by runtime code. Matching evidence can establish more evidence; it cannot expose an existential witness as data, including Logical data. Physical containers such as `Option\u003c@P>` keep a runtime discriminant, so choosing Some or None is ordinary computation, with its evidence payload erased.",
    "",
    "## 19. What is generated",
    "",
    "\u003c!-- spec: 1.19:1 dynamic-semantics -->",
    "`locus rust file.lc` prints one Rust module; `locus build a.lc b.lc --out dir [--name crate]` writes a crate: `Cargo.toml` with the crate's name and edition 2024 and no dependencies, `src/lib.rs` holding the single marker `Erased`, a `Copy` unit struct with a private field and a private constant of its own name, and one `src/\u003cfile>.rs` per Locus file declared as a `pub mod`. The Rust reads as the source: the same names, nesting, and declaration order, `if` as `if`, `match` as `match`, `let mut` and assignment as written (`mut` is dropped from a binding never assigned), the loops as written, `impl` blocks with `self` as written and calls as method calls, visibility as written, derives in the order written, integer literals with their type as a suffix, and proof positions filled by `Erased`. The crate compiles under `-D warnings`; the corpus test compiles every accepted file twice, with overflow checks on and off, and compares each run line with both interpreters (`tests/corpus.rs`, `tests/cli.rs`, `tests/build.rs`, `tests/rust_output.rs`).",
    "",
    "\u003c!-- spec: 1.19:2 dynamic-semantics -->",
    "Two interpreters run every program: one on the check IR, which skips ghosts, and one on the erased tree, each in two modes matching the two builds. Both report a value, a panic with its message and the values of the `&mut` parameters at that moment, or that they ran out of fuel, which is inconclusive and never a verdict. `tests/random_programs.rs` generates well-typed programs with arithmetic, panics, mutation in branches and loops, and `&mut` calls, and compares the two interpreters and the compiled Rust three ways.",
    "",
    "## 20. Found proofs are stored",
    "",
    "\u003c!-- spec: 1.20:1 legality-rule -->",
    "`locus check file.lc` writes `file.lc.proofs` beside the source, one entry per obligation keyed by a hash of the claim and its context as kernel terms in a text that names definitions and numbers context positions, so that renaming, reformatting, and edits elsewhere leave an entry valid. A stored proof is checked by the kernel like any found proof and carries no authority: a stale or edited entry costs a search and never passes a false claim. `--locked` searches for nothing, so a missing or stale entry is an error naming the function, the line, and the claim; `--no-store`, or `LOCUS_PROOFS=off`, neither reads nor writes the file; `LOCUS_SEARCH=none` disables every tier, under which a complete file still checks. The examples and the target files are committed with their proofs files (`tests/store.rs`, `tests/cli.rs`, `tests/acceptance.rs`). Checking is deterministic: the proofs, the diagnostics, and the Rust are byte for byte the same on a second run.",
    "",
    "## 21. Diagnostics",
    "",
    "\u003c!-- spec: 1.21:1 legality-rule -->",
    "Every diagnostic has a stable code, source spans, explanatory notes and, where appropriate, a suggested edit. Lexer, parser, elaborator and driver errors have distinct code ranges. The corpus metadata test requires coverage for every reachable code, including preview, model, scope, borrowing and trust-boundary errors. Errors in source exit with status 1; command-line errors exit with 2. `locus check --error-format json` emits one one-element JSON array per diagnostic line on stderr, using fixed diagnostic schema 1. All optional proof fields are present and null when unavailable. The envelope includes severity, code, message, spans (exactly one primary), notes, helps and suggestions, plus the claim, claim after computing, facts considered, counterexample and checked explicit proof form. Source positions are mapped to the original entry/library file before stable sorting by file name and byte offset. Changing the fixed keys, field types or field meanings requires a schema-version increment. `locus explain CODE` prints a code-specific cause, example and stable Language paragraph reference. The complete field contract and migration history are in `docs/diagnostics/schema.md`; every source rejection and driver/resource diagnostic has a JSON golden, and every code has an explanation golden.",
    "",
    "\u003c!-- spec: 1.21:2 legality-rule -->",
    "A hole that cannot be filled, `L0230`, and an operator whose obligation cannot be met, `L0235`, report the claim, the claim after computing when that differs or the bound the operator needs, the facts considered, at most six, and the counterexample the arithmetic procedure found, which it has checked against the facts it collected: `it fails when hi = 0, lo = 1, which the arithmetic facts known here allow` (`tests/corpus/reject/midpoint_unordered.lc`, `unproved_claim.lc`). When a definition, an equation, a connective, or a lemma is what is missing, the note names the form that takes the step. A use of stale evidence names the assignment that invalidated it and the claim now owed (`tests/corpus/reject/tracked_stale_use.lc`). A parser error carries a fix where one is mechanical, and parsing goes on so that every error in a file is reported; the parser is total, by a step bound and a depth bound tested on their own (`tests/parser_fuzz.rs`, `tests/frontend.rs`).",
    "",
    "## 22. The command line",
    "",
    "\u003c!-- spec: 1.22:1 example -->",
    "~~~text prose shell-commands",
    "locus check file.lc [--holes] [--stats] [--locked] [--no-store]",
    "locus run file.lc function [bool | integer]...",
    "locus rust file.lc",
    "locus audit file.lc",
    "locus build file.lc... --out dir [--name crate]",
    "locus tokens file.lc",
    "locus parse file.lc",
    "locus ast file.lc",
    "~~~",
    "",
    "\u003c!-- spec: 1.22:2 legality-rule -->",
    "`--library path.lc` includes ordinary checked library declarations, with diagnostics mapped to the original files. Preview names are owned by tasks in a closed registry. All current features are stabilized; passing one of their obsolete flags is an error that asks the caller to remove it.",
    "",
    "\u003c!-- spec: 1.22:3 legality-rule -->",
    "`run` takes `bool` and machine-integer arguments on the command line. A run line in a corpus file passes any value, evidence as `Erased`, and `&mut` arguments with the value they hold afterwards (`tests/common/corpus.rs`).",
    "",
    "## 23. The trusted base",
    "",
    "\u003c!-- spec: 1.23:1 legality-rule -->",
    "The kernel (`src/kernel`), whose every rule, axiom, and primitive is named in the kernel contract; the checker of the check IR (`src/exec/check.rs`), which enforces the four promises, the obligations of the operators, and the endings of a block; `lower` (`src/typed/lower.rs`), which turns the typed tree into the check IR: versions, joins, what a loop carries, the write-back of `&mut` arguments and their disjointness; `erase` (`src/erased/erase.rs`) and the Rust printer (`src/erased/rust.rs`); and the Rust toolchain. Everything else is untrusted: the parser, the elaborator with its flow, move, and hole analyses, the arithmetic procedure, the proofs file, the derived proof forms, the lemmas of the theory, and both interpreters. A soundness bug in the untrusted search cannot create a proof the kernel accepts; the typed mode/layout and permission validation are also part of the trusted lowering boundary. Explicit foreign contracts are additional named assumptions. The test suites exercise these distinctions: `tests/kernel_soundness.rs` pairs every proof it can find with claims known to be false and with thousands of mutants of the proof; `tests/kernel_ops.rs`, `kernel_machine.rs`, `kernel_lemmas.rs`, and `kernel_numbers.rs` check the machine models against Rust exhaustively at 8 bits and at the boundaries above; `tests/kernel_linear.rs` refuses fabricated constraints; and `tests/exec_check.rs` and `exec_endings.rs` refuse check IR built by hand without the evidence a promise needs.",
    "",
    "## 24. Not in the language",
    "",
    "\u003c!-- spec: 1.24:1 legality-rule -->",
    "General runtime recursion; arbitrary trait implementations, dynamic dispatch and runtime closures; stored mutable references and interior mutability; `usize`/`isize`, floats, character and byte-string types; bit operators and compound assignment; modules/import resolution beyond explicit library input; general foreign Rust linking, `unsafe`, async; iterator-based `for`, `while let`, `if let`, `?`, loop labels and deep runtime patterns; user-defined macros and attributes. A parsed construct is accepted only when its typing, permissions, and erasure rules are implemented.",
    "",
    "## 25. Logical data",
    "",
    "\u003c!-- spec: 1.25:1 legality-rule -->",
    "`#[derive(Logical)]` structs and finite recursive enums erase completely. Recursive logical enums require no runtime Box. Mutually referring logical enum declarations form one checked group; generic groups are specialized first. Matching across group members can expose the same-typed structural descendant for a recursive function or proof. Mutually recursive functions remain unsupported. `library/logical.lc` defines Nat and Seq as ordinary enums and proves the Nat/Int correspondence; Int remains the primitive mathematical integer. Library maps, membership and reachability are checked source declarations. Explicit `--library` input includes them without a hidden privileged prelude.",
    "",
    "\u003c!-- spec: 1.25:2 legality-rule -->",
    "Structural recursion is checked against constructor subdata; recursive theorem calls become checked induction. Int recursion uses `recurse!(decreases, self(next))`, where decreases proves `0 \u003c= next && next \u003c current`. The descent proof is checked before admitting the recursive call, and cannot use that call to justify itself. Arbitrary nonpositive recursive proposition occurrences are rejected. The kernel checks computed arm bodies, recursive declarations, induction and reductions independently of the source elaborator.",
    "",
    "\u003c!-- spec: 1.25:3 legality-rule -->",
    "Logical closures are ordinary lambda terms with typed parameters, inferred captures, and dependent proof results. A runtime capture must be explicitly observed through a model. `logic Fn(x: T) -> U` is callable in ordinary code with erased results; any eager ordinary callee/argument work is retained. It is not a runtime closure type.",
    "",
    "\u003c!-- spec: 1.25:4 legality-rule -->",
    "`Exists\u003cT>::Witness(value) @ proof` and `ForAll\u003cT>::Each(prove_each) @ True::Intro` are the library quantifier constructors. Predicate arguments are Logical callables returning Prop. Applying universal evidence specializes its checked proof function. Eliminating an existential proof permits its witness only within further proof construction; it does not create a witness extraction operation.",
    "",
    "\u003c!-- spec: 1.25:5 legality-rule -->",
    "`impl Model\u003cRuntime> for LogicalDestination { logic fn model(source: &Runtime) -> Self { ... } }` defines an observational bridge. The definition is checked, not admitted as an axiom. A model cast records the current value version and requires a live observation permission. Models compose and a source may have multiple distinct destinations; overlapping source/destination implementations are rejected. Physical buffer shapes are retained for model selection even though their logical content snapshots share a kernel representation.",
    "",
    "## 26. Heap views and trust",
    "",
    "\u003c!-- spec: 1.26:1 dynamic-semantics -->",
    "Arrays, slices and Vec have immutable content snapshots with separately checked physical layouts. Length is a mathematical observation bounded by u64::MAX; runtime len returns u64. Indexing requires evidence of its bounds. Updates and push produce new snapshots and normal-return equations; allocation failure or panic does not invalidate partial-correctness claims about successful returns. Source `Vec::new()` and `Vec::from([elements])` use registered Rust implementations.",
    "",
    "\u003c!-- spec: 1.26:2 dynamic-semantics -->",
    "Shared references in locals, fields and results carry written lifetimes and typed provenance: their storage root, path and version. Locus checks those permissions before erasure, including uses in model observations. A reference cannot escape local storage, and an overlapping write/move invalidates its later use. Mutable loans remain call-scoped. Rust compilation supplies an independent oracle, not permission for an erased access that Rust never sees. B3 acceptance remains a required gate for stabilizing this tier.",
    "",
    "\u003c!-- spec: 1.26:3 dynamic-semantics -->",
    "A foreign declaration is `trusted \"reviewable reason\" fn name(parameters) -> Result = Vec::len;`, with the registered native path selected explicitly. This initial bridge supports Vec len, get and push. The signature must retain the native runtime argument/result shapes, including evidence slots. The body and its logical postcondition are deliberately not checked against each other. The header is well formed, the runtime implementation is registered, and the mandatory reason and claimed promises appear in `locus audit`. A false trusted specification can make a caller's claim false; the audit identifies that assumption, and tests demonstrate this boundary. Such a declaration is never a logical function or an unfoldable kernel definition.",
    "",
    "\u003c!-- spec: 1.26:4 dynamic-semantics -->",
    "The current shared-reference tier admits references in locals, tuples, structs, enum payloads and results. Returned/stored references use explicit lifetime parameters. Shared-reference leaves inside owned Vec/array/Box payloads, stored mutable references, interior mutability, and raw pointer addresses remain unsupported. Branch and loop-back-edge permissions are joined conservatively and may reject some Rust-valid programs. A logical model observation is a permission use even though it erases. Indexed borrowed lookup retains `&items[index]` and separately checked bounds in generated code.",
    "",
    "\u003c!-- spec: 1.26:5 dynamic-semantics -->",
    "Proof elimination is stricter than logical computation: a match on evidence returns evidence, not arbitrary Logical data. Witnesses introduced by a proof pattern stay inside the derivation and cannot escape as Int, Seq, or a predicate closure. Witness-free one-arm evidence may be destructured by let; witness-bearing patterns use a proof-producing match. This preserves proof irrelevance; erasure by itself would not justify a witness extractor (`tests/reconcile_props.rs`).",
    "",
    "\u003c!-- spec: 1.26:6 dynamic-semantics -->",
    "Physical Vec, arrays and parameter slices may contain Logical elements, including Int, Bool and evidence. They emit Vec\u003cErased>, [Erased; N] or borrowed marker slices while retaining lengths and ordinary argument effects, using Rust's zero-sized-element storage behavior. Mixed payloads erase their logical leaves while retaining runtime fields. Reading a logical element produces a logical value, never a runtime bool or integer (`tests/logical_containers.rs`)."
   ],
