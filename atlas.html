  {
   "id": "target-examples",
   "title": "Target examples",
   "group": "Vision",
   "body": [
    "# Target examples",
    "",
    "Programs written by hand in the target syntax, before any of it is built, to test the spelling and to count what their proofs need. Nothing here runs yet. These examples use the 22 September type split: executable conditions use bool; evidence states claims over explicit Int models. Code that unpacks proof constructors is logical. Runtime promise attributes do not make ordinary helpers callable in logic. Each obligation is marked with what would discharge it:",
    "",
    "- **exact**: the claim is a fact in scope as written;",
    "- **computed**: it is, after computing: names bound by let replaced by what they stand for, projections of written values, matches on written constructors, and arithmetic on literals;",
    "- **arithmetic**: it needs reasoning about order and sums, which means either the arithmetic procedure or a chain of lemma calls.",
    "",
    "The findings are at the end.",
    "",
    "## The lock, with 32-bit counts",
    "",
    "~~~",
    "#[derive(Clone, Copy)]",
    "pub enum Event { Wrong, Right }",
    "",
    "#[derive(Clone, Copy)]",
    "pub struct Lock { failures: u32, open: bool }",
    "",
    "prop within_limit(failures: Int) {",
    "    Bounds => {",
    "        prop!(failures \u003c= 3)",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn step(",
    "    lock: Lock,",
    "    bounded: @within_limit(lock.failures as Int),",
    "    event: Event,",
    ") -> (next: Lock, @within_limit(next.failures as Int)) {",
    "    match event {",
    "        Event::Right => {",
    "            let next = Lock { failures: 0, open: true };",
    "            (next, within_limit::Bounds @ prove!((next.failures as Int) \u003c= 3))             // computed: 0 \u003c= 3",
    "        }",
    "        Event::Wrong => {",
    "            if lock.failures \u003c 3 {",
    "                let fits = prove!(lock.failures as Int + 1 \u003c= u32::MAX as Int); // arithmetic, from lock.failures \u003c 3",
    "                let next = Lock { failures: lock.failures + 1, open: false };   // the obligation of + is fits: exact",
    "                (next, within_limit::Bounds @ prove!((next.failures as Int) \u003c= 3))         // arithmetic",
    "            } else {",
    "                (Lock { failures: lock.failures, open: false }, bounded)        // computed: the field is lock.failures",
    "            }",
    "        }",
    "    }",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "fn event_at(attempt: u32, correct: u32) -> Event {",
    "    if attempt == correct { Event::Right } else { Event::Wrong }",
    "}",
    "",
    "// This loop has no termination proof in the initial implementation.",
    "// run is an ordinary fn and is never called inside a proposition.",
    "#[no_panic] #[no_io]",
    "pub fn run(attempts: u32, correct: u32) -> (last: Lock, @within_limit(last.failures as Int)) {",
    "    let mut lock = Lock { failures: 0, open: false };",
    "    let mut ok: @within_limit(lock.failures as Int) = within_limit::Bounds @ prove!((lock.failures as Int) \u003c= 3); // computed",
    "    for attempt in 0..attempts {",
    "        let (next, still) = step(lock, ok, event_at(attempt, correct));",
    "        lock = next;        // ok is now invalid",
    "        ok = still;         // exact, given that still is typed over next",
    "    }",
    "    (lock, ok)",
    "}",
    "",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn remaining(failures: u32, bounded: @within_limit(failures as Int)) -> (left: u32, @((left as Int) \u003c= 3)) {",
    "    let small = logic {",
    "        let within_limit::Bounds @ small = bounded;",
    "        small",
    "    };                                                                        // model(failures) \u003c= 3",
    "    let left = 3 - failures;                                                    // the obligation of -: arithmetic, from small",
    "    (left, prove!((left as Int) \u003c= 3))                                                   // arithmetic",
    "}",
    "~~~",
    "",
    "## A midpoint that cannot overflow",
    "",
    "The specification is stated over Int, where the sum of two u32 cannot overflow; the code must avoid the overflow the specification is free of.",
    "",
    "~~~",
    "#[terminates] #[no_panic] #[no_io]",
    "pub(super) fn midpoint(lo: u32, hi: u32, ordered: @((lo as Int) \u003c= (hi as Int)))",
    "    -> (mid: u32, @(mid as Int == (lo as Int + hi as Int) / 2))",
    "{",
    "    let half = (hi - lo) / 2;          // the obligation of -: arithmetic, from ordered. 2 is not zero: computed",
    "    let mid = lo + half;               // the obligation of +: arithmetic",
    "    (mid, prove!(mid as Int == (lo as Int + hi as Int) / 2))   // arithmetic, with division by a literal",
    "}",
    "~~~",
    "",
    "Writing lo + hi in the specification is rejected because it selects a runtime operation; writing (lo + hi) / 2 in the code is rejected under no_panic unless the sum can be shown to fit, which it cannot. The language makes the well-known bug hard to write on either side.",
    "",
    "## A protected type, and a way in from Rust",
    "",
    "~~~",
    "pub struct Percent { value: u32, in_range: @((value as Int) \u003c= 100) }      // not Copy: it moves",
    "",
    "impl Percent {",
    "    // Callable from Locus, where evidence exists.",
    "    #[terminates] #[no_panic] #[no_io]",
    "    pub(super) fn new(value: u32, in_range: @((value as Int) \u003c= 100)) -> Percent {",
    "        Percent { value, in_range }",
    "    }",
    "",
    "    // Callable from Rust: the check happens at runtime, and the evidence comes from the branch.",
    "    #[terminates] #[no_panic] #[no_io]",
    "    pub fn checked(value: u32) -> Option\u003cPercent> {",
    "        if value \u003c= 100 { Some(Percent::new(value, prove!((value as Int) \u003c= 100))) } else { None }   // exact",
    "    }",
    "}",
    "~~~",
    "",
    "new is visible to other Locus modules and is not exported to Rust. Being unable to construct evidence would not stop Rust from calling it: every proof erases to the same marker, and one obtained honestly from another function could be passed here. Rust cannot build a Percent directly either, because the fields are private. It calls checked. This example needs impl blocks and Option, which are later stages.",
    "",
    "## Findings",
    "",
    "1. Exact evidence has to mean exact after computing. With no computation at all, not even 0 \u003c= 3 for a struct that was just written can be shown, since the surface has no forms for the kernel's projection and literal axioms and was never meant to. This matches the principle already recorded under Principles: computation steps are inserted silently, and a function's definition is unfolded only on request. What is dropped is search: using one fact to reach another, and unfolding without being asked.",
    "2. Destructuring has to type each part over the names the pattern binds. In let (next, still) = step(...), still must have the type @within_limit(next.failures as Int), not a type about step(...).0. This is how a dependent pattern is opened, a fixed step and not a search, and without it evidence that comes out of a call can never be used.",
    "3. Arithmetic is where the proofs are. Of the fourteen obligations above, three are exact, four are computed, and seven are arithmetic. Every one of the seven is linear. By hand each is three to five lemma calls, most of them moving between a comparison of u32 and a comparison of Int. The arithmetic procedure is what makes the language usable, and belongs early in the sequence.",
    "4. A logical loop needs a checked termination argument; until that feature lands, reject it. Ordinary loops may diverge unless a supported termination proof is supplied. An ordinary fn remains unavailable inside logic even when termination is proved. A finite-range termination rule is useful independently of source function mode.",
    "5. A predicate states its logical intent through prop and needs no promise attributes on its arms; within_limit now follows Predicates with named arms in the Target language. Three attributes on each executable helper are still heavy. A file-level default would help, but there is no way to opt out of one, so a file with one loop cannot use the termination default. This remains an ergonomic question for function promises, not for predicate declarations.",
    "6. as Int is an explicit model observation, not runtime conversion. Proof conditions use these models, while executable if conditions retain machine comparison. The primitive specifications connect branch outcomes to their logical facts.",
    "",
    "To append under Findings in Target examples (Vision), as finding 7:",
    "",
    "7. The counts of finding 3 are not the compiler's. `locus check --stats` classifies the obligations of the lock as 11: 1 exact, 2 computed, 2 by evaluation, 6 by arithmetic; the midpoint as 6: 1 by evaluation, 5 by arithmetic; and Percent as 3, all computed. Three things account for the difference from three exact, four computed, and seven arithmetic. `0 \u003c= 3` and `2 != 0` on literals are decided by evaluation, which the prediction folds into computed. An overflow row of the table has two premises, `min \u003c= e` and `e \u003c= max`, so each `+` and `-` under no_panic is two obligations where the prediction counts one, and the lower bound of a `u32` sum is a second arithmetic obligation at each of the four operators. And `ok = still` and `(next, bounded)` are typed assignments and values, checked by the kernel's comparison of types and never obligations, so the exact cases the prediction counted are no obligations at all: the one exact obligation is `fits` discharging the upper bound of `lock.failures + 1`. The counts are pinned by `the_proofs_are_the_ones_predicted` in tests/acceptance.rs.",
    "",
    "8. With the default model rule of 22 September, every as Int in these examples on a machine operand inside a logical context may be omitted: @within_limit(lock.failures) and prove!(left \u003c= 3) mean what the explicit spellings mean. The examples keep the explicit form so that both are exercised when they become the acceptance tests of the reconciliation."
   ],
   "created": "2026-09-21T21:22:55.000Z",
   "updated": "2026-09-22T23:44:20.000Z"

  {
   "id": "principles",
   "title": "Principles",
   "group": "Vision",
   "body": [
    "# Principles",
    "",
    "## How the work is judged",
    "",
    "The central promise is that someone can write familiar code, state meaningful facts about it, and get understandable help establishing them. The kernel is a foundation for that; the experience from source to executable is what decides whether the language succeeds. Until that has been tested, the core feature set holds steady.",
    "",
    "**The test.** One polished end-to-end example: source code for a small bounded state machine; a result that carries evidence; a caller that reuses that evidence; useful diagnostics for an intentional mistake; and matching interpreted and generated behavior. Everything between here and there serves that example.",
    "",
    "**Boundaries to protect.**",
    "",
    "- Dependency is restricted to propositions. A value may change what a later proof field asserts and never the runtime layout. Dependent results, validated data, and loop invariants all rest on this one mechanism. A new feature must earn its place inside the boundary before the type system is widened.",
    "- Loop invariants are evidence in loop state: initialization supplies it, and each iteration supplies it again.",
    "- Logical classification belongs to types: Int, Nat, Bool, logical collections, Prop, and evidence erase; runtime types retain their representation. Checked logic fn and logical blocks are pure and total. Ordinary fn stays executable even when returning logical values. Model\u003cT> constructs a logical observation of legally readable runtime data. There is no math fn, logic let, or implicit mode change through generics.",
    "- Logical data is extensible through checked structs and inductive enums. Direct recursive logical types need no runtime indirection; Int, Seq, and finite maps can be library definitions. Native arithmetic support is an implementation choice with a specified correspondence. Box\u003cT> always remains runtime, including when T is logical, and runtime recursive structures are related to separate logical models.",
    "- Logical fields can occur in runtime aggregates, so two source values may share one runtime representation. Runtime equality, serialization, mutation, and foreign interfaces must respect that boundary. Model snapshots retain binding and heap-state versions; they cannot recover runtime data or storage permissions. Runtime branches cannot discriminate on logical contents.",
    "- Ownership, aliasing, and mutation were tested with tier 0 of references in the core build (September 2026): let mut and assignment lowered to versions, tracked evidence carried by loops, &mut parameters as values in and new versions out, and a protected value that survives a panic. Which state a proof describes after another reference changes storage is answered for that tier by versions of bindings; heap-state versions, interior mutability, and references held in locals or fields are the questions the next tiers must answer before promising broad Rust compatibility.",
    "",
    "**Acceptance criteria for the proof-writing experience.** The hand-built proofs so far show that the rules compose, not that the `let`-based surface is pleasant. Removing normalization from the kernel moved work into elaboration: projection, substitution, unfolding, and equality transport still have to happen somewhere, and if users must repair them by hand, friendly syntax will not save the experience.",
    "",
    "- Routine rearrangements, such as introducing a local variable, destructuring a tuple, or extracting a helper, require little or no proof repair when the interfaces involved stay equivalent.",
    "- An unsolved `_` shows the expected claim, the useful facts available, and the remaining gap.",
    "",
    "Both are to be exercised by the first integrated examples, not deferred to a tooling milestone. The next design test, once generics and the narrow mutation tier exist, is a verified collection over a custom model with evidence reused across callers. [Open questions and deferred](open-questions.md) records its acceptance cases and the remaining concerns about proof elimination, model/trait contracts, erasure, and the logical foundation.",
    "",
    "**Measure before large proofs are normal.** Predictable checking is not the same as fast compilation, and making every computation step explicit can produce a great deal of evidence. Track separately: time spent constructing proofs; the size of the resulting proof terms; time and memory spent checking them; and the cost of rechecking after a small edit. Checked lemma reuse and stable interfaces will matter early. Do not optimize the representation before there are numbers.",
    "",
    "**Preferences, not constraints.**",
    "",
    "- Generated Rust resembling the source is a strong preference. Temporary bindings and modest structural changes are acceptable where they make evaluation order or the correctness of erasure simpler.",
    "- All logical types lower to one `Erased` marker. Generated Rust removes unused marker bindings by default, preserving effectful initializers and temporary/drop semantics, and names unused retained parameters appropriately. A debug dump may retain markers; no public flag is needed for clean output. The marker does not protect the Rust boundary by itself.",
    "- The typed tree's two branches keep the output readable at a real cost in trust: a sound kernel cannot establish that the checked program and the executed program agree. Differential testing of the two branches is the next step for exactly that reason.",
    "",
    "## Why Locus has its own kernel",
    "",
    "Locus uses its own proof kernel, written in Rust. A Lean-backed adapter is no longer the plan. The decision rests on these commitments:",
    "",
    "- The logic is classical. The planned soundness argument is a denotational model in the style of explicit refinement types (Ghalayini and Krishnaswami, ICFP 2023): propositions denote truth values, and types denote sets of logical values related to runtime representations. Locus keeps the two apart because logical data such as a `Prop` field belongs to the logical value but not to the representation; for runtime types without logical data fields this reduces to the paper's subset reading. Its mechanized Lean 4 development is a starting point; the two-layer values, divergence, and declared propositions are the parts Locus must add. Excluded middle is a single named lemma whose uses are recorded. Until the model is checked against every kernel rule, consistency is a goal. Exporting accepted terms to an independent implementation tests the kernel but does not replace that argument.",
    "- The kernel has no conversion checker. It compares terms up to renaming and proof irrelevance; every computation step is an explicit equality axiom used through transport. The elaborator inserts the steps for immutable lets, projections, matches on known constructors, and literal arithmetic, so the programmer still sees the minimal type identity of the specification. Function bodies are unfolded only on request.",
    "- Proof irrelevance holds, as part of conversion. `u8` is modelled as a natural number below 256 over a kernel-internal `Nat` with a recursor; its ordering lemmas are proved from that model. Native evaluation must agree with the model and can decide closed terms. Induction over that `Nat` is the proof-level recursion rule; bounded iteration is a separate term-level rule whose index-dependent state erases to a plain loop.",
    "- Everything that constructs proofs is untrusted: the elaborator, the hole solver, and any later decision procedure, external solver, or model. Each must produce a kernel term, or a certificate for a checker that is explicitly added to the trusted base.",
    "- Proofs are written declaratively, as stated intermediate facts joined by lemma calls and holes. There is no tactic language. The hole's search is fixed and bounded by step counts, never by time, and it does not search the prelude, so that its behavior is predictable; found proofs are recorded so rechecking does not repeat the search.",
    "- The prelude is checked, not trusted. The main cost of not building on Lean is this lemma library; statements can be ported, proofs must be redone.",
    "",
    "Regardless of kernel, the translation of programs into kernel statements, erasure, and execution initially remain trusted compiler components. Proof acceptance alone does not establish that generated machine code preserves the source semantics."
   ],
   "created": "2026-09-21T21:03:06.000Z",
   "updated": "2026-09-22T23:44:20.000Z"

  {
   "id": "open-questions",
   "title": "Open questions and deferred",
   "group": "Vision",
   "body": [
    "# Open questions and deferred features",
    "",
    "Undecided, or decided against for now. Section numbers refer to [Language, as built](language.md). When one of these is settled it moves into the [Target language](target-language.md) and gets tasks.",
    "",
    "## Open questions",
    "",
    "These are not decided. Each lists the current behavior of this document first. None needs to be settled before the kernel spike.",
    "",
    "1. Settled in the target language: prop!(e) lifts a logical Bool through holds; @P is evidence of a proposition. Quantifiers are library propositions with constructors, not literal keywords. Brackets remain available for arrays; a lighter literal spelling can be considered later.",
    "2. Settled: implication is spelled =>, and no longer collides with the match arm separator, because it appears only inside prop!, prove!, @(...), and the braced body of a predicate arm.",
    "3. Settled in the target language: evidence must be of exactly the claim wanted, after computing. The bridging the elaborator does today is to be removed.",
    "4. Branch and arm evidence is anonymous. A naming form, such as if h: n != 0 { ... }, would let hand-written steps refer to it without a hole.",
    "5. A hole does not search the prelude (section 12.3). A mechanism for marking lemmas that a hole may apply, with its own step budget, would shorten proofs at some cost in predictability.",
    "6. The spelling of the chain form (section 8.4). One candidate is the bracketed form trans[a =(p) b =(q) c] used by the explicit refinement calculus.",
    "7. Settled in the core build: the bounded for admits break, and a reversed or empty range runs no passes, with no proof of order asked.",
    "8. Adopted, as The rule about Rust in the Target language; the earlier violations were removed in the core build.",
    "",
    "## Design concerns",
    "",
    "Review recorded 22 September 2026, following the logical/runtime separation and library-data decisions. The items below distinguish unresolved rules and validation work from already agreed restrictions. They do not authorize additional Rust features or claim that the compiler implements the Vision. Alternative mechanisms mentioned here remain options until their semantics are specified.",
    "",
    "1. **Library abstractions and generic models.** Fixed logical classification requires corresponding runtime/logical operations, including bool/Bool, comparison, and optional values. Test a generic verified collection over a user-defined runtime element T with a logical model M, rather than only over machine integers. Define how model selection, generic bounds, and related comparison laws are expressed. Different models can forget different information; equality of content models must not imply allocation identity, capacity equality, or full runtime equality. A finite-map library must state whether an operation/equality concerns representation or extensional contents. The source language needs general inductive data and logical functions, not a growing list of special collection primitives.",
    "",
    "2. **Proof elimination within logic.** Preserve proof irrelevance when extending matching to logical functions, closures, and library quantifiers. Two proofs of Exists(n: Nat, True), built with witnesses 0 and 1, are interchangeable; a function that extracts the stored witness and reduces respectively to 0 and 1 would contradict that principle. Erasure of both values does not help. The existing restriction allowing the witness only inside a proof-producing elimination must carry forward. State exact rules for permitted proof projections, specialization of ForAll, and any proposed subsingleton exceptions. Include a rejected witness extractor returning Nat and an accepted proof using the witness internally. Arbitrary logical result types are not a sufficient check. The rule to preserve is the standard one and is already how the kernel works: evidence is eliminated only into a Prop or a proof type, never into data; a match on evidence yields a proof, and the witness of an existential is usable inside that proof and nowhere else.",
    "",
    "3. **Snapshots, heap state, and resources.** Specify which storage an observation depends on, how a mutation invalidates facts about current state, and how facts about disjoint unchanged storage are retained. Historical snapshots remain valid. Reborrowing, split slices, captured/stored references, and especially returning &mut require more than entry/return SSA versions: subsequent caller writes determine the owner's later state. The existing tier limits remain. Interior mutation, locks, atomics, and concurrency need dedicated permission and observation rules. Freely reusable snapshot evidence does not itself grant exclusive storage access; tracked resources with restricted duplication, or another ownership logic, may be needed. That is future design work, not an implicit extension of @P.",
    "",
    "4. **Erasure preserves execution, not just returned values.** Formalize the correspondence between checked execution and generated Rust, including effects, divergence, panic, unwinding, partial initialization/moves, temporary lifetimes, and Drop timing. In derive(mutate_and_prove(&mut x)), preserve the ordinary call without moving its effects across a logical branch or changing its borrow/drop scope. Generic/trait dispatch must be resolved and retained when many source types collapse to Erased; generated impls and specializations must not collide. Audit callable captures, auto traits such as Send/Sync, variance/drop checking, and ABI/layout promises before enabling the relevant Rust features. Box\u003cNat> remains a runtime box throughout, not a newly erased ownership operation. Default dead-marker cleanup is subject to this same preservation contract.",
    "",
    "5. **Behavioral trait contracts and external implementations.** A method signature alone cannot supply ordering laws, iterator relationships, callback effects, or destructor behavior. Decide how traits express contracts and how implementations establish them, including model relations, effects, trait objects, and closures when supported. External Rust implementations need a verified adapter or an explicitly trusted specification; a matching signature grants no theorem. Keep erased-proof entry points protected at the Rust boundary. Opaque types and wrappers must also account for public mutation and construction paths such as Default, conversion, and deserialization. One Erased marker cannot enforce the original proof index in handwritten Rust.",
    "",
    "6. **Proof ergonomics and cost.** Keep explicit proof slots while supplying certificate-producing automation for routine arithmetic and equality steps. Introducing a let, destructuring a tuple, or extracting a helper with an equivalent contract should not expose a cascade of manual transports/unfolding repairs. Exercise failed holes and version-mismatch diagnostics. Measure annotation burden, proof construction time, certificate size, checking time/memory, and rechecking after an edit. Bounded deterministic search and a small kernel do not by themselves imply fast builds or understandable failures. The own-kernel route also requires building and maintaining the lemma library.",
    "",
    "7. **Logical foundation and source/kernel correspondence.** Consolidate the formation, equality, positivity, elimination, and recursion rules for library-defined logical types and propositions. Generics, higher-order predicates, and dependent proof-returning callables need an explicit account of permissible type/proposition quantification, including any levels required to keep it sound. Library Exists/ForAll shift work into these general rules; they do not remove it. Native numerals, arithmetic certificates, primitive observations, and any future extensionality/choice principles need stated interpretations and trust boundaries. Kernel acceptance alone does not prove that source lowering described the intended program or that erasure implements it; test both translations and develop the soundness argument. No unchecked recursive equation or library declaration may introduce facts on its own.",
    "",
    "8. **What a returned proof promises.** An ordinary function's output guarantee applies on successful return. An ordinary fn returning @False can diverge without making False a theorem; it remains inadmissible in logic. Termination and no-panic promises are separate. State this distinction consistently in headers, diagnostics, and correctness claims. Logical fn remains total and pure independently of its result type.",
    "",
    "**Validation before broadening the Rust subset.** After the existing core acceptance example, build one generic verified collection with a custom element model, explicit evidence propagated through two or three callers, and a mutable operation within the supported borrowing tier. Include an intentional wrong proof, a harmless refactoring, a rejected existential witness extractor, a runtime Box containing a logical payload, and an executable call inside an otherwise erased expression. Check both proof diagnostics and retained runtime behavior. This is a follow-up design test, not a claim that the current immutable core already supports it.",
    "",
    "## To settle before the core is built",
    "",
    "Raised in the last review before implementation, and tracked as tasks under Open decisions: LOC-129, LOC-130, LOC-131, LOC-132, LOC-133, LOC-134, LOC-135, LOC-136. In short: the checked IR for mutation, early exit, and panics, with the flow rules the target language defers; how moves meet the logic; acceptance examples in the target syntax, and the automation they show to be needed; whether evidence of one claim is accepted for another; how Int enters the kernel and how the machine models are tested; what a panic is to the interpreter and to erasure; what locus build emits; and the order of implementation.",
    "",
    "## Deferred",
    "",
    "The README milestones give the intended order. Each item below is outside this fragment.",
    "",
    "- Logical lambdas and dependent proof-returning callables, capturing immutable logical observations. Their design is decided in Logical computation and erasure; their implementation supports library Exists/ForAll and removes hand lifting of proof helpers.",
    "- Logical classification, logic fn/blocks, model observations, and their lowering. Int/Nat/Seq have no runtime representation; the earlier executable-mathematics plan is superseded. Runtime arbitrary-precision types, if ever wanted, would be distinct runtime types with models. The existing arithmetic kernel and build tasks are not automatically migrated by this decision.",
    "- Generics over types and propositions, with Logical bounds on logical stored elements and mode-specific callable/comparison bounds. Exists and ForAll become library propositions; runtime Option and logical optional types remain distinct.",
    "- Recursion, as one feature: recursive logical enums, recursive prop declarations, and checked structural recursion/induction, followed by supported well-founded recursion. Logical enums can directly contain recursive occurrences with no Box because they have no runtime layout. Int, Seq, finite maps, and eventually Nat can be library types once these mechanisms exist; Target language contains schematic examples. Box\u003cT> is always runtime, even for logical T. A runtime boxed structure can have a separate logical model; neither it nor Rc/Arc/shared references become logical by ignoring indirection. Cycles, aliasing, and interior mutation need dedicated observation rules. Supported mutual and nested recursive forms, and migration of native arithmetic support to library definitions, remain implementation decisions.",
    "- Model fields are decided: a field of logical type M erases, even in a runtime struct. Model\u003cT> is implemented on M with a logical observer taking &T; a type may have several models. Snapshot access permissions and heap-state versions need implementation. Runtime equality cannot recover distinctions stored only in logical data fields.",
    "- Dependent conjunction and implication, where the right operand is well formed only under the left, as in [i \u003c len && a.get(i) > 0] once indexing demands a proof. This arrives with the first operation that takes a proof precondition, and is a reason to make && and => kernel formers at that point, not instances of the prelude And.",
    "- Requires/ensures/invariant/assert as sugar over proof parameters, dependent results, and loop proof state.",
    "- Mutation, references, ownership, and surface loops that elaborate to the state-passing loops of section 10.",
    "- Termination measures, for total correctness of executable loops and for non-structural logical recursion. Until then the workaround for the latter is an explicit fuel parameter.",
    "- Trusted and external declarations, with the rest of Rust interoperability. Every such declaration is to be syntactically marked.",
    "- Runtime closures.",
    "",
    "",
    "- Default cleanup of unused Erased bindings is decided under What is generated. A pre-cleanup diagnostic dump may be useful later; a public flag and its spelling are deferred, not required for clean generated Rust."
   ],
   "created": "2026-09-21T21:03:06.000Z",
   "updated": "2026-09-22T23:44:20.000Z"
  },
  {
   "id": "build-plan",
   "title": "Build plan",
   "group": "Plan",
   "body": [
    "# Build plan",
    "",
    "How the code gets from what is built (Language, as built) to the core language of Target language: 41 commits in seven lanes, each with its tests and the condition under which it is done. Each commit is a task in the Core build project, where its status is tracked; this document holds the order, the reasons, and the exit criteria for the whole. It is a plan and changes as commits land and teach us things.",
    "",
    "## What done means",
    "",
    "The body of work is finished when all of these hold, each as a test or a command and not as a judgement.",
    "",
    "- **The target examples run.** The 32-bit lock, the midpoint, and the protected type from Target examples check, run in both interpreters, compile under rustc with warnings denied, and the three agree on every listed input, panics included. Percent uses an enum of its own in place of Option.",
    "- **The proofs are the ones predicted.** check --stats classifies the obligations of those files as exact, computed, or arithmetic, and the counts match Target examples (three, four, seven) or the difference is recorded there as a finding.",
    "- **A Rust caller is held at the boundary.** A hand-written Rust crate compiled against the generated module can call what is plain pub and nothing that takes evidence, cannot name a marker constructor, cannot build a protected struct, and the marker replay attack fails to compile. rustc gives the verdict in each case. A protected value that a Rust caller still holds after catching a panic satisfies its invariant (LOC-191).",
    "- **An author is told why.** Removing a hypothesis from each target example gives a diagnostic with the obligation, the claim after computing, the facts considered, and a counterexample where the arithmetic procedure finds one. Every error code has a rejected file and a golden rendering.",
    "- **A crate can be checked by the kernel alone.** With its stored proofs, locus check --locked runs no search, and proofs written by a weaker search still check.",
    "- **Checking is deterministic.** Checking a file twice, on any machine, gives byte-identical proofs, diagnostics, and Rust. No hole is filled by search that bridges claims, and every limit in the checker is a count of work and never a clock.",
    "- **Locus is never more permissive than rustc.** Every accepted corpus program compiles without warnings. Every program rejected for a move or an aliasing error in a runtime use is also rejected by rustc when printed without that check.",
    "- **What is checked is what runs.** Under the extended suite the random program generator agrees three ways (check-IR interpreter, erased interpreter, compiled Rust) on at least 10,000 programs covering arithmetic in both overflow configurations, panics, mutation, bounded loops, and &mut calls, with no more than a handful inconclusive.",
    "- **The trusted base is written down and tested as such.** Every kernel axiom and rule is named in the Kernel contract (a test compares them), has a test that uses it and a near miss that is rejected, and the machine models and the operator table agree with Rust exhaustively at 8 bits and at the boundaries above. Each untrusted part (the solver, the arithmetic procedure, the flow analysis) has a test in which its wrong answer, a fabricated constraint included, is rejected by the trusted part behind it. No proof is accepted for a claim known to be false.",
    "- **The parser is robust, and total for stated reasons.** The fuzz tests pass at a hundred times their default counts, which shows robustness on what was tried. Totality rests on two guarantees stated in Architecture and tested on their own: every loop in the parser consumes a token or stops, and recursion is bounded.",
    "- **The legacy is gone.** No math fn, no [P] or @[P], no state-passing loop or bounded for, no u8 model over Nat, no proof by 256 cases. Language, as built is rewritten from the code.",
    "- **The suites are usable.** tools/check.sh, the fast suite with fixed seeds, passes in under two minutes and gates every commit. tools/check.sh --extended passes before a milestone is declared.",
    "",
    "## Milestones",
    "",
    "| Milestone | Reached at | What a user can do |",
    "|---|---|---|",
    "| 1. The new surface | S5 (LOC-158), E1 (LOC-167) | Write the target syntax for everything the language already does, with evidence that matches exactly |",
    "| 2. Arithmetic | E7 (LOC-173) | Write 32-bit programs whose overflow is shown impossible: midpoint, step, remaining |",
    "| 3. Mutation | M4 (LOC-180) | Write let mut and Rust loops that carry evidence: the whole lock file |",
    "| 4. The boundary | O4 (LOC-185) | Ship a protected type to a Rust caller: Percent |",
    "| 5. Acceptance | R4 (LOC-189) | Everything under What done means |",
    "",
    "## Order and what can run in parallel",
    "",
    "A commit can start when the commits it depends on have landed. Grouping by that rule gives the waves below, which are computed from the tasks. Within a wave the commits are independent of one another.",
    "",
    "| Wave | Harness and robustness | Syntax | Kernel | Elaborator | Mutation | Ownership |",
    "|---|---|---|---|---|---|---|",
    "| 1 | H1, H2, H3 |  | K1 |  | M0 |  |",
    "| 2 | R1, R2, R3 | S1 | K2 | E4 |  |  |",
    "| 3 |  | S2 | K3, K6 |  | M1 |  |",
    "| 4 |  | S3 | K4 | E1 |  |  |",
    "| 5 |  | S4 | K5, K7, K8 | E5 |  |  |",
    "| 6 |  | S5 |  | E2, E9 |  |  |",
    "| 7 |  |  |  | E3, E6, E8, E10 | M2 | O2 |",
    "| 8 |  |  |  | E7 | M3 | O1 |",
    "| 9 |  |  |  | E11 | M4, M5 |  |",
    "| 10 |  |  |  |  |  | O3 |",
    "| 11 |  |  |  |  |  | O4 |",
    "| 12 | R4 |  |  |  |  |  |",
    "",
    "- **The longest chain** runs through the syntax lane into mutation and ownership; python3 tools/atlas.py plan prints it. The syntax lane has one owner, so it starts first and nothing should interrupt it.",
    "- **The kernel lane is independent** of every other lane until E5. It can run from the first day beside syntax, and it is the second longest chain (K1 to K5, E6, E7).",
    "- **M0 is paper** and starts on the first day, so that the gate is open by the time S5 and E4 land.",
    "- **Three lanes at a time is the useful width**: syntax, kernel, and one of harness or elaborator. After wave 6 the lanes are elaborator, mutation, and ownership.",
    "- **E9, K8, R2, and R3 are fillers**: small, off the long chains, good for an idle lane.",
    "",
    "### Who owns which files",
    "",
    "Parallel work collides in files, not in ideas. Each lane owns directories, and the shared files are named so that a commit touching one lands quickly.",
    "",
    "| Lane | Owns | Shares |",
    "|---|---|---|",
    "| Syntax | src/lexer.rs, src/parser.rs, src/ast.rs, tests/frontend.rs | none after S5 |",
    "| Kernel | src/kernel, tests/kernel_*.rs, the Kernel contract | none |",
    "| Elaborator | src/elab, tests/elaborate.rs | src/typed/tree.rs with Mutation |",
    "| Mutation | src/exec, src/typed/lower.rs, src/erased | src/typed/tree.rs, src/elab for M2 to M5 |",
    "| Ownership | the move and borrow passes (new files under src/elab), the build command, the Rust caller tests | src/erased/rust.rs with Mutation |",
    "| Harness and robustness | tests/common, tests/corpus, tools | none |",
    "",
    "There are no feature branches. Parallel work happens in separate working copies, and each commit is rebased onto main and lands only when tools/check.sh passes on top of main. Commits stay small so that a rebase is cheap.",
    "",
    "## Rules for every commit",
    "",
    "- tools/check.sh passes: fmt, clippy with warnings denied, and the fast tests with fixed seeds, offline. The extended suite runs before a milestone is declared.",
    "- Nothing in the checker depends on a clock. Limits are counts of work, so that a file accepted on one machine is accepted on every machine. Timeouts exist only in the test harness, where firing means inconclusive.",
    "- New behaviour arrives with accepted and rejected corpus files. A rejected file pins the error code and the line.",
    "- A commit that changes the kernel, the check-IR checker, lower, or erase updates the Kernel contract or Architecture in the same commit, and says in its message what was added to the trusted base.",
    "- The atlas moves in the same commit: the task to done, the tasks it covers, and the Language status rows.",
    "- Old spellings leave with a migration diagnostic that carries a fix, and the fix is tested by applying it.",
    "- A commit that makes a lane wait (a shared file) says so in its task and lands within the day.",
    "- Anything learned that contradicts Target language is recorded there or as an open decision before the commit lands, not worked around in code.",
    "",
    "## Kinds of test, and what each is for",
    "",
    "| Kind | Guards against | Introduced |",
    "|---|---|---|",
    "| Corpus files, accepted and rejected | A feature that works in one stage of the pipeline and not the next | H1 |",
    "| Differential: two interpreters | lower and erase disagreeing about a program | exists, extended by R1 |",
    "| Compiled Rust against the interpreter, with overflow checks on and off | The printer, and Locus meaning something Rust does not in either build | exists, generalized by H1, E4, E6 |",
    "| rustc as the oracle for rejections | Locus accepting what rustc refuses, in moves, borrows, and visibility | O1, O2, O3 |",
    "| Exhaustive at 8 bits, boundaries and random above | A wrong machine model or operator table, which would be trusted and wrong | K4, K5 |",
    "| Axiom near misses | An axiom stated more strongly than intended | K2 |",

    "## The lanes",

    "",
    "Reconciliation is complete. All three tiers have passed tools/check.sh --extended, including certificate replay, hostile inputs, generic collections and three-way execution. All four preview features are stabilized. The fast suite measured 211 seconds against its advisory 120-second target; the extended suite measured 826 seconds. Process follows, including generated measurements and specification traceability.",
    "",
    "## What done means",
    "",
    "**Tier one, the logical split.** The three target examples check, run, and compile exactly as Target examples writes them. A type is Logical or runtime by its type alone, and a Logical value never reaches a runtime position: the erased check judges it independently of the elaborator. Only a logic fn or a logic block enters the logic; an ordinary fn never does, whatever it promises. prop declarations have named arms and are used by construction and matching; a one-arm predicate is opened by a let pattern in ordinary code. The default model rule holds: prop!(x \u003c= 3) on a u32 and its cast form are the same term. The generated Rust has no marker binding a reader would delete and carries no blanket lint allowance. Every migration diagnostic carries a fix that is tested by applying it. Language, as built is rewritten, and the interim rules of the core build (LOC-193, Ghost, logical-by-promises) are gone from the code.",
    "",
    "**Tier two, logical data.** Seq, Maybe, Nat, Exists, and ForAll are library declarations written in Locus and checked by the kernel; a logical enum may be recursive, with positivity checked and induction supplied; a prop may be inductive; a user type may have several models selected by as M; Option is a prelude enum and Percent returns it. The acceptance examples of Library-defined logical data and Design concern 2 are corpus files.",
    "",
    "**Tier three, references and heap state.** Slices as parameter views with a proof precondition on indexing; shared references held, stored, and returned under tier one of references; trusted declarations of Rust collections with models, each with its reason and listed by the audit; and the generic verified collection of Design concerns, with its wrong proof, its refactoring, and its rejected witness extractor.",

   "id": "design-brief",
   "title": "The earlier design brief",
   "group": "Archive",
   "body": [
    "# The earlier design brief",
    "",
    "This is the brief the project started from, moved here from the README. Parts of it are superseded: its milestone list by [roadmap.md](roadmap.md), its account of state, mutation, and loops by the target language, and the ghost binder keyword by the target language.",
    "",
    "**The programming model.** Propositions are native logical claims, potentially non-executable, rather than runtime booleans. They compose through equality, logical connectives, quantification, and named predicates. A proof establishes a particular proposition about particular values. A theorem is a function producing such proofs for arbitrary permitted inputs. `fn` declares executable functions accepting and returning runtime data and erased proofs, including combinations; it may diverge. `math fn` declares a function in the mathematical sense: pure and total, with one well-defined result for every input. A `math fn` is written once and used in both worlds: it is callable from logic because it is total, and it is compiled and callable at runtime whenever its signature contains executable data. Lemmas are math functions returning proofs; predicates are math functions returning `Prop`. Users can also declare their own propositions: a `prop` declaration lists every way a claim can be proved, as an `enum` lists every way a value can be built, and `match` on such a proof is case analysis. Propositions, proofs, and existential witnesses are *ghost* bindings: they exist for the checker, may appear anywhere in logic, and may never determine executable data or control flow. Under that rule proposition values may appear in `fn` signatures and struct fields; they are simply erased. Runtime structs and enums can combine data and proof fields, and a later field may mention an earlier one only inside a proposition, so runtime layout never depends on a value. Mathematical `Nat` and `Int` remain distinct from machine integers. Richer mathematical objects belong in libraries.",
    "",
    "**Erasure and control flow.** Proofs are checked at compile time, including proofs about unknown runtime inputs. Proposition values, proof values, and logical computation are erased; surrounding data computation still executes. Proofs can establish further facts and discharge preconditions, but cannot be printed, inspected, or used as runtime branch discriminants. Runtime decisions and enum tags can carry erased evidence; `if` is a `match` on `bool`, and every `match` arm receives checked evidence about the value it matched. `Unknown` or an absent proof establishes neither a claim nor its negation. Checked comparisons supply facts within their respective branches. Ordinary operations retain checked fallbacks when proofs are unavailable.",
    "",
    "**State and functions.** Proofs refer to immutable logical snapshots, tracked through SSA-style state versions, not borrows that freeze data or runtime copies. Mutation leaves old proofs true about old states; it does not retarget them. `before(x)` and `after(x)` describe invocation entry and normal return. Heap aliases must participate in state tracking. Loop invariants are ordinary proof components of explicit loop state, supplied on entry and on every back edge. Termination of executable loops is not tracked: an `fn` is checked for partial correctness, and a proof it returns is available only in the code reached after it returns. Totality of math code is guaranteed syntactically instead of by measures: math code has no general loops and, in the core, no recursion; bounded iteration is allowed, and structural recursion arrives with recursive data. There is no `decreases` clause. Functions used directly in propositions must be math functions; effectful calls are described through results and state transitions. Purely logical computation is erased and cannot supply runtime data or branch discriminants; the ghost flow check enforces that boundary. Runtime inputs may occur symbolically in logical definitions. Contracts remain optional surface conveniences.",
    "",
    "**Proposition and proof syntax.** `Prop` is the type of logical claims. A proposition literal must use brackets: `let claim: Prop = [n > 0];`. An annotation alone does not convert a Boolean into a proposition. Existing propositions compose directly using `!p`, `p && q`, `p || q`, and `p => q`; these operations construct claims, not evidence. In the core, which has no arrays, a bracketed expression is always a proposition literal, with or without an expected type. The implemented parser still keeps `[e]` neutral and preserves array forms; how brackets are shared with arrays later is an open question. Two spellings remain under review because they collide with Rust syntax, the bracket literal and `=>`; the specification records them as open questions.",
    "",
    "`@claim` or `@[condition]` denotes a proof type. Proofs are ordinary expressions: names, proof constructors such as `Or::Left(h)`, `match`, lemma calls, and applications of quantified proofs such as `all(n)`. The intended style is declarative: a sequence of `let` bindings that state intermediate facts, each justified by a lemma call or a hole. There is no tactic language; the earlier `@{ ... }` proof block is retired. `_` in an expression requests a checked proof of the expected proposition, found by a fixed, bounded search. An unsolved goal or missing expected proposition is an error. `_` in a pattern still ignores a value. The proof marker is not used alone, and `#[...]` remains reserved for attributes. Named result fields let proofs describe returned data:",
    "",
    "```rust",
    "fn increment(n: u8) -> (out: u8, @[out == n.wrapping_add(1)]) {",
    "    let out = n.wrapping_add(1);",
    "    (out, _)",
    "}",
    "```",
    "",
    "**Implementation direction.** Use a handwritten Rust lexer and recursive-descent/Pratt parser, with a reusable diagnostic renderer. Locus has its own proof kernel, written in Rust and kept small. The elaborator, the hole solver, decision procedures, and any external tool or model that proposes proofs are untrusted: each must produce an explicit term, and only the kernel's acceptance counts. An SMT solver is not the foundation. The logic is classical higher-order logic with declared data and declared propositions; since proofs are erased and can only produce other proofs, classical reasoning cannot affect execution. The planned soundness argument is a denotational model in the style of explicit refinement types (Ghalayini and Krishnaswami, ICFP 2023): every type erases to a simple type, and a proposition denotes a truth value. Locus keeps a logical value and its runtime representation apart: ghost data such as a `Prop` field is part of the logical value though absent at runtime, while proof contents are irrelevant to both. For a type with no ghost data, such as a nonzero byte, this reduces to a subset of the erased type. The model stays tractable because values appear in types only inside propositions. Equality is available at every data type, including function types, with reflexivity, transport, and computation; function and proposition extensionality are withheld. Excluded middle is one named lemma whose uses are recorded. Exporting accepted terms to an independent checker tests the implementation without replacing that argument. The kernel compares terms only up to renaming and proof irrelevance and contains no normalizer: computation steps are explicit equality axioms, inserted silently by the elaborator for lets, projections, matches on known constructors, and literal arithmetic, and only on request for function definitions. Checking is therefore syntax-directed and predictable. Machine integers are native to the kernel and modelled as bounded natural numbers, so their ordering lemmas are proved, not assumed; the kernel can also establish closed facts by evaluation. A kernel-internal `Nat` with a recursor underlies that model and bounded iteration, and later becomes the source-level `Nat`. Begin with limited, predictable automation: a hole searches facts in scope, propositional structure, equalities with congruence, definition unfolding, and closed evaluation, and nothing else; arithmetic steps are explicit lemma calls, and every search limit counts steps, never time. Found proofs are recorded so that rechecking never repeats a search. Initially, only proof types depend on runtime values, keeping data layouts straightforward. Erasure is a compositional function on types and terms. Emit Rust after erasure and build through Cargo. Lowering and imported behavioral specifications are explicit trust boundaries. Rust exports must preserve proof preconditions through checked wrappers or protected validated types.",
    "",
    "**Proposed milestones, in dependency order:**",
    "",
    "0. **Core:** `u8` with explicit wrapping operations, `bool`, unit, tuples, named structs, nonrecursive enums and `match`, immutable bindings, blocks, nonrecursive `fn`/`math fn` declarations, `if`, state-passing loops in `fn`, bounded iteration, proposition values, `prop` declarations, dependent proof results; the proof kernel, checker, and interpreter.",
    "1. **Native execution:** Rust generation and proof erasure; compare compiled and interpreted behavior.",
    "2. **Mathematical integers and machine arithmetic:** `Int` and `Nat`, further machine widths, arithmetic operators whose overflow is a proof obligation, conversions, and a linear-arithmetic procedure; verify byte packing.",
    "3. **Generics:** type and proposition parameters; `Option`, `Result`, and positive, negative, or unknown evidence; logic-only lambdas.",
    "4. **Recursion:** recursive enums and `prop` declarations, structural recursion, and induction as recursive lemmas, with `Box` transparent to the logic; prove list append's length property.",
    "5. **Proof tooling:** modules, cached checking, recorded proofs, hole expansion, opaque theorem interfaces, goal diagnostics, and rewrite and chain forms.",
    "6. **Specification conveniences:** the `ghost` binder keyword and model fields; `requires`/`ensures`/`invariant`/`assert` as sugar over proof parameters and results.",
    "7. **Local mutation:** assignment, snapshots, and branch joins; verify swap and reject stale-state evidence.",
    "8. **Loops over mutable state:** `while` and `for` elaborating to state-passing loops, labels, and optional termination measures; verify an iterative algorithm.",
    "9. **Ownership:** moves, shared/exclusive borrows, fixed arrays, and proof-assisted access; track referenced storage.",
    "10. **Collections:** modeled slices, `Box`, and `Vec`; prove in-place sorting preserves elements and produces order.",
    "11. **Rust boundaries:** marked trusted declarations, concrete adapters, effects, panics, safe exports; ship a verified codec crate.",
    "12. **Broader integration:** traits, associated types, ordering laws, and cross-package proof metadata; verify a generic algorithm.",
    "",
    "Runtime closures, custom destructors, interior mutability, raw pointers, concurrency, and async follow once this foundation works. Each milestone should deliver a useful example and measure checking cost, proof burden, and generated-code behavior.",
