  {
   "id": "t304",
   "n": 188,
   "title": "R3 · Golden diagnostics, and a test that every error code is exercised",
   "status": "done",
   "priority": 3,
   "project": "p266",
   "notes": "Landed 21 September, with a follow-up for the S1 messages. tests/diagnostics_golden.rs renders every rejected file through the library and compares with NAME.stderr; a second test checks the binary prints the same; LOCUS_BLESS=1 rewrites. A meta test scans src for L-codes and fails if one has no rejected file: 50 codes before S1, all covered, 105 files. Thirteen diagnostics judged misleading are listed in the task and should be fixed as reviewed golden diffs (see the list below).\n\nMisleading diagnostics found while writing the goldens, to fix later as golden diffs:\n1. L0299 (the checker rejected this) surfaces kernel messages: an if with evidence branches points at the function name; let next = continue(...) says break and continue may only end a block; [h == g] on two proofs, evidence returned from an enum payload, fold toward @q(1) leaking a VarId, and g(1).1 on a dependent tuple all reach L0299.\n2. unexpected_character.lc: the parser's L0102 is printed before the lexer's L0001 that caused it.\n3. evidence_as_proposition_parameter.lc: a prop parameter naming an earlier parameter gives L0204 unknown name rather than L0225.\n4. false_in_one_case.lc: after the arm's equation the claim computes to 7 \u003c= 6 and the note says nothing known speaks of it, although n == 7 is known; no counterexample note for a closed false claim.\n5. reversed_range.lc: nothing says the obligation comes from the range 5..n.\n6. L0216/L0220 span a whole block instead of the offending statement; L0215 spans a whole loop.\n7. L0208 labels only the path, not the wrong pattern list; L0228 points at the argument, not the call.\n8. L0206 (_ asks for evidence) says nothing about what to write instead.\n9. The nesting and chain limit errors could name the limit.\n10. unknown_enum.lc gives unknown name for Light::Red where unknown enum would match the neighbouring wording.\n\nLane: Robustness. Wave 2.\nDepends on: H1 (LOC-151).\nUnblocks: R4 (LOC-189).\n\nScope. The rendered diagnostic of every rejected corpus file is stored and compared. A meta test lists the error codes in the source and fails if one has no rejected file.\n\nTests.\n- LOCUS_BLESS=1 rewrites the goldens; the diff is reviewed like code.\n\nDone when. Diagnostics are the product for an author, human or AI, and change only on purpose.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",
   "created": "2026-09-21T22:14:21.000Z",

  {
   "id": "t305",
   "n": 189,
   "title": "R4 · Acceptance: the target examples run, the legacy is gone, and Now is rewritten",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Robustness. Wave 12.\nDepends on: E11 (LOC-192), E3 (LOC-169), E7 (LOC-173), E8 (LOC-174), E9 (LOC-175), E10 (LOC-190), M5 (LOC-181), O4 (LOC-185), K8 (LOC-166), R1 (LOC-186), R2 (LOC-187), R3 (LOC-188).\n\nScope. The closing commit. Language, as built is rewritten from the implementation, Overview and README show the 32-bit lock, and the Language status table moves every core row to built.\n\nTests.\n- The overall exit criteria of the Build plan, each as a test or a command, under tools/check.sh --extended.\n\nDone when. The core language of the Vision is the language of the code.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Elaborator. Wave 7.\nDepends on: M1 (LOC-177), E2 (LOC-168), S2 (LOC-155).\nUnblocks: R4 (LOC-189).\nCovers: LOC-71, LOC-85, LOC-95.\n\nScope. The forms with their Rust meaning and string literal messages, lowered to the panic ending of M1. Their type is the never type where Rust's is. Under no_panic, assert!(c) needs evidence of c and unreachable!() needs evidence of false, as Target language states; panic! and todo! are rejected there.\n\nTests.\n- Each form three ways, message included.\n- After assert!(c), c is a fact; under no_panic without evidence it is an error at the assert.\n- Check IR built by hand with a panic ending and no evidence of false is rejected under no_panic by the checker.\n\nDone when. A half-written file checks with todo!(), and a runtime check can teach the logic a fact.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",
   "created": "2026-09-21T22:27:28.000Z",

  },
  {
   "id": "t307",
   "n": 191,
   "title": "Decide the rule for a protected value behind &mut when a panic unwinds past a broken invariant",
   "status": "done",
   "priority": 3,
   "project": "p89",
   "created": "2026-09-21T22:27:28.000Z",
   "updated": "2026-09-21T22:47:55.000Z",
   "notes": "Refined the same day while writing the design of M0: in the core the scenario cannot arise, because a field that evidence depends on is never assigned alone and a whole-value write evaluates its operands first. The no_panic rule is kept for the day field-by-field update is allowed. The Rust caller test stays in O4.\n\nDecided 21 September: the conservative rule below. Target language: Effects are promises.\n\nRaised by review of the Build plan, 21 September; Target language mentions the question under Effects and leaves it to protected exports. A method takes &mut self on a type whose fields carry evidence, assigns a field, which invalidates the evidence, and panics before refreshing it. The checker looks only at the return path, so it is satisfied. A Rust caller that wrapped the call in catch_unwind now holds a value whose invariant is false, in safe Rust. A value owned by the function that panics is not a problem: it is dropped unseen, since Locus types have no Drop.\n\nRecommended, conservative: between an assignment that invalidates evidence stored in a place reached through a &mut parameter and the refresh of that evidence, nothing may panic; to begin with this is enforced by requiring #[no_panic] on any function that makes such an assignment. Replacing the whole value at once, *self = Percent { ... }, invalidates nothing and needs no promise. A finer rule, which looks only at the window between the assignment and the refresh, can replace it later without breaking any program.\n\nNeeded before O3 (LOC-184). The Rust caller test is in O4 (LOC-185), and the design case is the eighth of M0."
  },
  {
   "id": "t308",
   "n": 192,
   "title": "E11 · Found proofs are stored beside the source, and locus check --locked never searches",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Elaborator. Wave 9.\nDepends on: E7 (LOC-173).\nUnblocks: R4 (LOC-189).\nCovers: LOC-8.\n\nScope. Target language: Found proofs are stored. A text format for kernel proofs and certificates with a version, names for definitions, and one entry per obligation keyed by a hash of the claim and its available facts as kernel terms. A file beside each source file. locus check reads, searches on a miss, writes, and drops entries nothing asked for; locus check --locked never searches.\n\nTests.\n- Round trip: every proof the corpus produces is written, read back, and accepted; the file is byte-identical on a second run.\n- Reformatting a source file, adding comments, and editing an unrelated function leave every entry in use, counted by a test.\n- The file as hostile input: entries swapped between obligations, a proof edited by hand, a truncated file, random bytes. Each is a miss or a reported error, never an accepted false claim and never a panic; the reader is added to the fuzz tests.\n- --locked with a missing entry fails and names the obligation; with a complete file it runs no search, asserted by a counter.\n- A file written with the search deliberately weakened by a test hook still checks, which is what surviving an upgrade means.\n\nDone when. A reviewer or CI checks a crate with the kernel alone, and a change to the automation cannot break a build that has its proofs.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  }

<script id="app-js">
(function () {
'use strict';
// ---------------------------------------------------------------- basics
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const now = () => new Date().toISOString();
const ago = iso => {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  if (s < 86400 * 30) return Math.round(s / 86400) + ' d ago';
  return new Date(iso).toISOString().slice(0, 10);
};
const slug = s => String(s).toLowerCase().replace(/[`*_]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'section';

const FEATURE_STATUS = [
  ['built', 'Built'], ['partial', 'Partial'], ['agreed', 'Designed'],
  ['planned', 'Planned'], ['deferred', 'Deferred'], ['unsure', 'Unsure']];
const TASK_STATUS = [['backlog', 'Backlog'], ['todo', 'Todo'], ['doing', 'In progress'], ['done', 'Done'], ['canceled', 'Canceled']];
const PROJECT_STATUS = [['planned', 'Planned'], ['active', 'Active'], ['paused', 'Paused'], ['done', 'Done']];
const PROJECT_COLOR = {planned: 'planned', active: 'doing', paused: 'deferred', done: 'done'};
const PRIORITY = ['None', 'Low', 'Medium', 'High', 'Urgent'];
const label = (table, id) => (table.find(r => r[0] === id) || [id, id])[1];

// ---------------------------------------------------------------- data
function parseData(text) {
  const raw = JSON.parse(text);
  raw.docs = (raw.docs || []).map(d => Object.assign({}, d, {body: Array.isArray(d.body) ? d.body.join('\n') : (d.body || '')}));
  raw.features = raw.features || []; raw.projects = raw.projects || []; raw.tasks = raw.tasks || [];
  // Missing fields are filled in without changing the order of the ones that are there.
  raw.meta = raw.meta || {};
  const defaults = {title: 'Locus Atlas', rev: 0, nextTask: 1, nextId: 1, taskPrefix: 'LOC'};
  Object.keys(defaults).forEach(k => { if (!(k in raw.meta)) raw.meta[k] = defaults[k]; });
  return raw;
}
// Doc bodies are stored as arrays of lines so that a change shows up in git as changed lines.
function serialize(db) {
  const out = Object.assign({}, db, {docs: db.docs.map(d => Object.assign({}, d, {body: d.body.split('\n')}))});
  return JSON.stringify(out, null, 1).replace(/</g, '\\u003c');
}
let DB = parseData($('#atlas-data').textContent);
let dirty = false, fileHandle = null, baseRev = DB.meta.rev, specFilter = 'all', boardProject = 'all', boardText = '', showCanceled = false;
const newId = p => p + (DB.meta.nextId++);
const docById = id => DB.docs.find(d => d.id === id);
const projectById = id => DB.projects.find(p => p.id === id);
const taskKey = t => DB.meta.taskPrefix + '-' + t.n;

function touch() {
  dirty = true; changes += 1;
  renderSaveState();
  scheduleAutosave();
  clearTimeout(touch.timer);
  touch.timer = setTimeout(() => {
    try { localStorage.setItem('locus-atlas-draft', JSON.stringify({rev: baseRev, at: now(), data: serialize(DB)})); } catch (e) { /* storage may be unavailable */ }
  }, 600);
}

// ---------------------------------------------------------------- saving the file
const FILE_1 = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Locus Atlas</title>\n<style id="app-css">';
const FILE_2 = '</style>\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="atlas-data">\n';
const FILE_3 = '\n</' + 'script>\n<script id="app-js">';
const FILE_4 = '</' + 'script>\n</body>\n</html>\n';
function buildFile() {
  return FILE_1 + $('#app-css').textContent + FILE_2 + serialize(DB) + FILE_3 + $('#app-js').textContent + FILE_4;
}
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('locus-atlas', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('kv', mode), req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(req && req.result); tx.onerror = () => reject(tx.error);
    };
  });
}
// The revision of the data in a copy of this file, or null when it cannot be read.
function revisionOf(text) {
  const start = text.indexOf(FILE_2), end = text.indexOf(FILE_3, start);
  if (start < 0 || end < 0) return null;
  try { return JSON.parse(text.slice(start + FILE_2.length, end)).meta.rev; } catch (e) { return null; }
}
// Two ways to write the file without asking each time: through `tools/atlas.py serve`, which
// works in any browser, or through a file handle the browser was given once.
let serverMode = false, handleReady = false, saving = false, changes = 0, conflict = null, autosaveError = '';
let autosaveOn = true;
try { autosaveOn = localStorage.getItem('locus-atlas-autosave') !== 'off'; } catch (e) { /* ignore */ }
const SERVER = {headers: {'X-Atlas': '1'}, cache: 'no-store'};
const canWrite = () => serverMode || (fileHandle && handleReady);
async function revisionOnDisk() {
  if (serverMode) return (await (await fetch('/__atlas/info', SERVER)).json()).rev;
  if (fileHandle) return revisionOf(await (await fileHandle.getFile()).text());
  return null;
}
async function writeFile(text) {
  if (serverMode) {
    const r = await fetch('/__atlas/save', {method: 'POST', headers: {'X-Atlas': '1', 'Content-Type': 'text/html'}, body: text});
    if (!r.ok) throw new Error('the server answered ' + r.status + ' ' + (await r.text()));
    return;
  }
  const w = await fileHandle.createWritable(); await w.write(text); await w.close();
}
async function prepare() {
  try {
    if (/^http/.test(location.protocol)) { const r = await fetch('/__atlas/info', SERVER); serverMode = r.ok && (await r.json()).atlas === true; }
  } catch (e) { serverMode = false; }
  if (!serverMode && window.showSaveFilePicker) {
    try {
      fileHandle = await idb('readonly', s => s.get('handle'));
      handleReady = !!fileHandle && (await fileHandle.queryPermission({mode: 'readwrite'})) === 'granted';
    } catch (e) { fileHandle = null; }
  }
  renderSaveState();
}
// manual: the person asked for it, so the browser may be asked for the file and questions may be put.
// Otherwise this is autosave, which writes only when it can do so silently.
async function save(manual) {
  if (saving) return;
  if (!manual && (!autosaveOn || !dirty || conflict != null || !canWrite())) return;
  saving = true;
  const previous = {rev: DB.meta.rev, savedAt: DB.meta.savedAt}, started = changes;
  try {
    if (!serverMode) {
      if (!window.showSaveFilePicker) {
        DB.meta.rev += 1; DB.meta.savedAt = now();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buildFile()], {type: 'text/html'})); a.download = 'atlas.html';
        document.body.appendChild(a); a.click(); a.remove();
        toast('Downloaded atlas.html. Replace the old file with it.');
        dirty = false; baseRev = DB.meta.rev; return;
      }
      if (fileHandle && !handleReady) handleReady = (await fileHandle.requestPermission({mode: 'readwrite'})) === 'granted';
      if (!fileHandle || !handleReady) {
        fileHandle = await window.showSaveFilePicker({suggestedName: 'atlas.html', types: [{description: 'HTML', accept: {'text/html': ['.html']}}]});
        handleReady = true;
        try { await idb('readwrite', s => s.put(fileHandle, 'handle')); } catch (e) { /* remembered for this session only */ }
      }
    }
    // Something else may have written the file since this page read it.
    const onDisk = await revisionOnDisk();
    if (onDisk != null && onDisk !== baseRev) {
      if (!manual) { conflict = onDisk; return; }

  }
}
function scheduleAutosave() { clearTimeout(scheduleAutosave.timer); scheduleAutosave.timer = setTimeout(() => save(false), 1200); }

}

// ---------------------------------------------------------------- markdown
const SEP = String.fromCharCode(1);
const RE_KEPT = new RegExp(SEP + '(\\d+)' + SEP, 'g');

      '<div><b>Vision</b><div class="tiny muted">What Locus is meant to be. Every decision is written there.</div></div>' +

  const toc = r.headings.filter(h => h.level === 2 || h.level === 3).map(h => '<a class="l' + h.level + '" href="#/doc/' + d.id + '/' + h.id + '">' + esc(h.text.replace(/[`*]/g, '')) + '</a>').join('');

    '<div class="row"><a class="btn" href="#/edit/' + d.id + '">Edit</a><button class="btn ghost" data-act="doc-settings" data-id="' + d.id + '">Settings</button></div></div>' +
    '<div class="doc"><article class="md">' + r.html + '</article><nav class="toc">' + toc + '</nav></div></div>';

function progress(tasks) {
  const live = tasks.filter(t => t.status !== 'canceled'), done = live.filter(t => t.status === 'done').length;
  return {done, total: live.length, pct: live.length ? Math.round(100 * done / live.length) : 0};
}

// ---------------------------------------------------------------- search
function viewSearch(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return '<div class="page"><h1>Search</h1></div>';
  const mark = s => { const i = s.toLowerCase().indexOf(needle); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + needle.length)) + '</mark>' + esc(s.slice(i + needle.length)); };
  let hits = '', count = 0;
  DB.tasks.forEach(t => { if ((t.title + ' ' + (t.notes || '') + ' ' + taskKey(t)).toLowerCase().indexOf(needle) >= 0 && count++ < 200) hits += '<a class="hit" href="#/tasks" data-act="task-open" data-id="' + t.id + '"><b>' + taskKey(t) + ' ' + mark(t.title) + '</b><span class="muted tiny">Task, ' + label(TASK_STATUS, t.status) + '</span></a>'; });
  DB.features.forEach(f => { if ((f.name + ' ' + (f.note || '')).toLowerCase().indexOf(needle) >= 0 && count++ < 200) hits += '<a class="hit" href="#/status"><b>' + mark(f.name) + '</b><span class="muted tiny">Language status, ' + label(FEATURE_STATUS, f.status) + '. ' + mark(f.note || '') + '</span></a>'; });
  DB.docs.forEach(d => {
    const heads = renderMarkdown(d.body).headings; let per = 0;
    d.body.split('\n').forEach((line, n) => {
      if (per >= 12 || count >= 200 || line.toLowerCase().indexOf(needle) < 0) return;
      let h = null; for (const x of heads) { if (x.line <= n) h = x; else break; }
      const i = line.toLowerCase().indexOf(needle), from = Math.max(0, i - 80);
      hits += '<a class="hit" href="#/doc/' + d.id + (h ? '/' + h.id : '') + '"><b>' + esc(d.title) + (h ? ', ' + esc(h.text) : '') + '</b><span class="muted tiny">' + mark(line.slice(from, i + needle.length + 120)) + '</span></a>';
      per++; count++;
    });
  });
  return '<div class="page"><div class="head"><div><h1>Search: ' + esc(q) + '</h1><p>' + count + (count >= 200 ? ' or more' : '') + ' results</p></div></div>' + (hits || '<p class="muted">Nothing found.</p>') + '</div>';
}

const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const HELP = '<h2>How this file works</h2><div class="md"><p>Everything is inside this one HTML file: the documents, the language status table, the projects and tasks, and the program that shows them. Nothing is sent anywhere.</p>' +
  '<p><strong>Saving.</strong> With Autosave on, every change is written to the file a moment after it is made. There are two ways the page can write the file. Opened from <code>python3 tools/atlas.py serve</code>, it writes through that program, in any browser, with nothing to set up. Opened directly in Chrome, Edge or Arc, press Save file once and choose this file; from then on the page writes to it, and the browser may remember the permission for next time. In other browsers, opened directly, Save file downloads a copy to put in place of the old one. Cmd/Ctrl+S saves at once. Unsaved edits are also kept in the browser and offered back if the page is closed before they are written.</p>' +
  '<p><strong>One copy.</strong> The documents live only here. <code>python3 tools/atlas.py</code> reads and writes them from the command line: <code>list</code>, <code>show NAME</code>, <code>put NAME FILE</code>, and <code>dump DIR</code> to write them all out as markdown for reading elsewhere. If the file changes on disk while this page is open, saving says so before replacing it.</p>' +
  '<p><strong>Keys.</strong> <code>/</code> search, Cmd/Ctrl+S save, Esc close.</p></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Close</button></div>';
