    "# Locus: overview",
    "",
    "*Review the guarantees, check the implementation, and use the result from ordinary Rust.*",
    "",
    "Locus is a Rust-like language for the parts of a crate whose correctness matters most. Propositions and proofs compose with ordinary functions and data, and explicit proof evidence is checked, deterministically, by a small, auditable kernel. Locus is designed to verify systems implementations with precise arithmetic, ownership, and mutation semantics, then emit readable Rust without runtime proof machinery. Generated interfaces protect proven invariants at the boundary with safe Rust callers. A programmer or an AI supplies the implementation and evidence against a human-reviewed specification; proof construction can be automated, while acceptance rests on independent checking. That is the destination; the core implemented so far covers `bool`, `u8`, structs, enums, and loops without mutation.",
    "",
    "```rust",
    "fn increment(n: u8) -> (out: u8, @[out == n.wrapping_add(1)]) {",
    "    let out = n.wrapping_add(1);",
    "    (out, _)",
    "}",
    "```",
    "",
    "`@[...]` is the type of evidence for a claim, and `_` asks the compiler to find that evidence. What it finds is an explicit proof, which a small kernel checks. Proofs are erased, and the rest is emitted as plain Rust.",
    "",
    "## Status",
    "",
    "A `.lc` file goes from text to a checked program, an interpreted result, and generated Rust. The kernel, the checker for executable code, erasure, a reference interpreter, the Rust printer, the parser, and the elaborator with its bounded proof search and diagnostics all exist. `examples/lock.lc` is the end-to-end example. There is no mutation, no arithmetic beyond a byte, and no protected export to Rust yet.",
    "",
    "## Running it",
    "",
    "Requires Rust 1.85 or newer. The only dependency is the diagnostic renderer.",
    "",
    "```sh",
    "cargo run -- check examples/lock.lc            # types and proofs",
    "cargo run -- check examples/lock.lc --holes    # every `_`, how it was filled, and what it cost",
    "cargo run -- check examples/lock.lc --stats    # per function: time to elaborate and to check",
    "cargo run -- run examples/lock.lc attempts_left 5 9",
    "cargo run -- rust examples/lock.lc             # the generated Rust",
    "cargo run -- tokens examples/increment.lc",
    "cargo run -- parse examples/increment.lc",
    "cargo run -- ast examples/preserve.lc",
    "cargo test",
    "cargo fmt --check",
    "cargo clippy --all-targets -- -D warnings",
    "```",
    "",
    "`check`, `run`, and `rust` stop at the first stage that reports an error. Errors in the source exit with status 1, errors in the command line with status 2. Diagnostic color is enabled for terminals unless `NO_COLOR` is set. `run` takes `u8` and `bool` arguments.",
    "",

   "body": [
    "# Notes",
    "",
    "This is the one place that speaks about the future of Locus: what it is for, what has been agreed and not yet built, what is undecided, and what is deferred. The other documents describe only what exists: [Language](language.md) is the language as specified now, [Architecture](architecture.md) is how the compiler is built, and the [Kernel contract](kernel-contract.md) states the kernel's rules. The batches of work are the [projects](roadmap.md). When something here is built, its text moves into one of those documents and leaves this one.",
    "",
    "Section numbers such as \"section 10\" refer to language.md. \"Item 8\" refers to the numbered items under Accepted directions.",
    "",
    "## Working notes",
    "",
    "Free-form notes go here.",
    "",
    "## Positioning",
    "",
    "Locus is a tool and a language, not a company. This document records what it is for, why it has the shape it has, and what it gives up. Design decisions are measured against it.",
    "",
    "### In one line",
    "",
    "Review the guarantees, check the implementation, and use the result from ordinary Rust.",
    "",
    "### In one paragraph",
    "",
    "Locus is a Rust-like language for the parts of a crate whose correctness matters most. Propositions and proofs compose with ordinary functions and data, and explicit proof evidence is checked, deterministically, by a small, auditable kernel. Locus is designed to verify systems implementations with precise arithmetic, ownership, and mutation semantics, then emit readable Rust without runtime proof machinery. Generated interfaces protect proven invariants at the boundary with safe Rust callers. A programmer or an AI supplies the implementation and evidence against a human-reviewed specification; proof construction can be automated, while acceptance rests on independent checking.",
    "",
    "This is a statement of destination. What is true today: the kernel, the checking of evidence, a bounded search that fills holes, readable generated Rust, and proof-bearing interfaces between Locus functions, over `bool`, `u8`, structs, enums, and loops without mutation. Not yet true: ownership and mutation, arithmetic beyond a byte, and protected exports. Each release should say which systems features its guarantees cover.",
    "",
    "### The reasoning",
    "",
    "1. **The generated code must be efficient and safe.** A prover such as Lean can state and prove facts about machine integers and structures, and its proofs are kernel-checked. Its compiled code, however, runs on a runtime with reference-counted heap objects and boxing, and it reaches other languages only through a C interface.",
    "2. **Efficient code needs a source language that knows about ownership, mutability, and layout.** Avoiding boxing, heap allocation, and reference counting requires knowing statically what is uniquely owned and how data is laid out. A pure functional language with free sharing and types that depend on values cannot add that afterwards. A Rust-like language has it from the start.",
    "3. **Proofs and program belong in one language.** The alternative keeps them apart: write Rust, translate it into a prover, and write specifications and proofs there, as Aeneas does with Lean. That verifies existing code and has the full power of the prover. It also means two artifacts kept in step by a tool, specifications stated against a generated model, and proofs that break far from the edit that broke them, in a language a Rust programmer does not read. Locus puts the specification in the function's type and the proof in the function's body.",
    "4. **Acceptance rests on checking evidence, whoever produced it.** A person, an AI, a bounded search, or a decision procedure may construct a proof. What matters is that the program is accepted because a small kernel checked explicit evidence, and not because a search succeeded. The alternative, trusting a solver's answer, saves effort, and what it finds can change between versions and time out. Checked evidence is accepted deterministically and is not limited by what one search happens to find. \"Explicit\" describes the evidence, not the effort: a `_` is filled by a search that emits a proof, and any later decision procedure must emit one or a certificate for a small checker. Writing out intermediate facts is tedious for a person and cheap for an AI, which makes this choice more affordable than it was. Deterministic is not the same as inexpensive; what checking costs is measured, not assumed.",
    "5. **The target is Rust, which makes protected interfaces possible.** Rust supplies the mechanisms: private fields, shared references that cannot mutate, no null, no uninitialized value, exhaustive enums. A caller in C, or across a C interface, can forge anything. The mechanisms do not preserve a guarantee by themselves. Locus has to generate, and verify, the abstraction that uses them: private storage, constructors that validate or demand evidence, and operations that keep the invariant. Exposing unrestricted mutable access to a validated value would undo it. The claim is therefore narrow: a generated interface preserves the invariants it exposes to safe callers; `unsafe` in the caller can break them. A guarantee that relates several values, such as \"this output is a permutation of that input\", is available to Locus callers as evidence and does not become a Rust type; a Rust caller gets it as documentation of a checked fact, not as something the compiler tracks.",
    "",
    "Hence one language with a Rust-like type system, propositions, and explicit proofs, lowered to Rust.",
    "",
    "### What is trusted",
    "",
    "The proof kernel is small and auditable. It is not the whole trusted base. The correspondence between the source, the logical statements checked, and the Rust emitted is trusted too: lowering, the checker for executable code, erasure, the Rust printer, and the Rust toolchain ([IR architecture](architecture.md)). A sound kernel cannot establish that the program checked and the program run agree; differential testing of the two branches addresses that, and an erasure theorem is the longer-term answer. \"Proofs about the real code\" is likewise a commitment, not a consequence of the syntax: each systems feature, from machine arithmetic to aliasing, panics, and imported operations, needs a precise meaning in the logic that compilation preserves.",
    "",
    "\"Without runtime proof machinery\" means no dedicated runtime and no proof checking when the program runs. It does not mean no checks: validating input that arrives from outside, and the wrapper around an exported function with a precondition, are executable tests.",
    "",
    "### What it is not, and what it gives up",
    "",
    "- **It does not verify existing Rust.** Keeping proofs and program together means only code written in Locus is verified. Verifying code that already exists is what Aeneas, Verus, Creusot, and Kani are for.",
    "- **It is not as powerful as Lean.** The logic is deliberately small: dependency only inside propositions, no tactic language, no mathematics library. Where the difficulty is mathematics rather than bounds, states, and invariants, a prover is the right tool. Locus emits plain safe Rust, so taking a generated core into such a tool later remains possible.",
    "- **It is not a superset of Rust, and may never be one in full.** The aspiration is a growing subset of safe Rust, plus propositions and proofs, in which anything Locus and Rust both have means what it means in Rust. `unsafe`, interior mutability, and concurrency stay behind a stated trusted boundary. Giving logical meaning to all of Rust, which has no finished formal semantics, would make \"kernel-checked\" relative to a large trusted model.",
    "",
    "- **It is not alone.** Verified systems code, familiarity to Rust programmers, and static verification are what Verus offers too, with far more automation. What Locus wagers on is a combination: proof-bearing interfaces that compose as ordinary values, evidence that is checked independently of whatever produced it, proof construction a Rust programmer finds approachable, and Rust exports that protect what was proven. Those are experiences to demonstrate, not properties to assert.",
    "",
    "Its closest relative is Low\\* with KaRaMeL, a restricted language inside F\\* that compiles to readable C with no runtime, more than it is Lean.",
    "",
    "### The assumption everything rests on",
    "",
    "A Rust-like language with ownership and mutation, a logic over immutable values, and explicit proofs, all at a proof burden people tolerate. The functional reading of `&mut` is known to work. That it stays pleasant without a solver absorbing the obligations it generates is not known, and Locus today has no mutation at all. The experiment that tests the thesis is `let mut` and `&mut` under that reading; the Aeneas papers are the reference for it. Close behind is the expressiveness of specifications: mathematical integers, sequences and maps, ghost models, and opaque types, without which a specification can say little of interest.",
    "",
    "### How it is delivered",
    "",
    "- **A verified core inside a Rust crate.** `.lc` files in a crate, compiled by a cargo command or `build.rs` into an ordinary module. The output has no runtime and no dependency, so the users of the crate need nothing.",
    "- **A macro as the way in.** `locus! { ... }` for a first proven function with one dependency added. It is a second driver over the same library, which is why Locus source tokenizes as Rust. It is not the main route: a macro sees only its own tokens, pushes proof checking into every downstream build, and can report little.",
    "- **Rust only.** The erased tree is target-neutral and stays so, and nothing beyond Rust is promised, because the boundary guarantee depends on the host language.",
    "- **Rust's modules when modules are needed.** `mod`, `use`, and `pub` exactly as in Rust. `pub` and field privacy arrive earlier, with interoperation, because privacy is what protects a validated type.",
    "",
    "### The use case that motivates the next steps",
    "",
    "A person writes a header: types, declared propositions, math functions with their bodies, and the signatures of the public functions, which carry their invariants. An AI writes the implementation and its proofs in another file, against that fixed specification. People review only the header.",
    "",
    "This moves review to a smaller artifact; it does not decide what correctness means. The header becomes the critical document. A sorting contract that says only \"the result is sorted\" permits returning an empty collection. The specification has to cover the intended behavior and its assumptions, and the AI must be unable to weaken it or to add trusted assumptions while satisfying it. Tooling can help a reviewer trust a header, with executable examples and a warning when a precondition cannot be satisfied, and cannot write it for them.",
    "",
    "For that to be sound:",
    "",
    "- the header elaborates on its own, so that every word a claim uses is defined where it is reviewed;",
    "- the checker requires each implementation to match its signature exactly;",
    "- termination is visible in the header, since a function that never returns satisfies any result type, and `loop` is the only source of divergence;",
    "- `Proved` cannot be constructed outside generated code, and an exported function never takes evidence from Rust: it has no proof precondition, takes a validated type, or is a wrapper that checks at runtime;",
    "- an audit command lists everything trusted: foreign declarations, classical reasoning, divergence, traps.",
    "",
    "For it to be pleasant: diagnostics as data, with the claim, the facts, the gap, and the failing case; a short reference and example corpus written for a model that has never seen the language; a cache of found proofs; and decision procedures that produce certificates once integers are wider than a byte, where evaluating every case stops being possible.",
    "",
    "## How the work is judged",
    "",
    "The central promise is that someone can write familiar code, state meaningful facts about it, and get understandable help establishing them. The kernel is a foundation for that; the experience from source to executable is what decides whether the language succeeds. Until that has been tested, the core feature set holds steady.",
    "",
    "**The test.** One polished end-to-end example: source code for a small bounded state machine; a result that carries evidence; a caller that reuses that evidence; useful diagnostics for an intentional mistake; and matching interpreted and generated behavior. Everything between here and there serves that example.",
    "",
    "**Boundaries to protect.**",
    "",
    "- Dependency is restricted to propositions. A value may change what a later proof field asserts and never the runtime layout. Dependent results, validated data, and loop invariants all rest on this one mechanism. A new feature must earn its place inside the boundary before the type system is widened.",
    "- Loop invariants are evidence in loop state: initialization supplies it, and each iteration supplies it again.",
    "- Ghost data is part of the logical value, so two logical values can share a runtime representation. That is kept, and it will resurface in equality, serialization, mutation, and foreign interfaces. Each future expansion of ghost data must come with a concrete use case.",
    "- This milestone is a language for verified immutable computation. Ownership, aliasing, destruction, and mutation raise questions it cannot answer, above all which state a proof describes after another reference changes storage. Before promising broad Rust compatibility, test the extension with one narrow borrowing-and-mutation example.",
    "",
    "**Acceptance criteria for the proof-writing experience.** The hand-built proofs so far show that the rules compose, not that the `let`-based surface is pleasant. Removing normalization from the kernel moved work into elaboration: projection, substitution, unfolding, and equality transport still have to happen somewhere, and if users must repair them by hand, friendly syntax will not save the experience.",
    "",
    "- Routine rearrangements, such as introducing a local variable, destructuring a tuple, or extracting a helper, require little or no proof repair when the interfaces involved stay equivalent.",
    "- An unsolved `_` shows the expected claim, the useful facts available, and the remaining gap.",
    "",
    "Both are to be exercised by the first integrated examples, not deferred to a tooling milestone.",
    "",
    "**Measure before large proofs are normal.** Predictable checking is not the same as fast compilation, and making every computation step explicit can produce a great deal of evidence. Track separately: time spent constructing proofs; the size of the resulting proof terms; time and memory spent checking them; and the cost of rechecking after a small edit. Checked lemma reuse and stable interfaces will matter early. Do not optimize the representation before there are numbers.",
    "",
    "**Preferences, not constraints.**",
    "",
    "- Generated Rust resembling the source is a strong preference. Temporary bindings and modest structural changes are acceptable where they make evaluation order or the correctness of erasure simpler.",
    "- `Proved` and `Ghost` are internal representations. They do not dictate the eventual public Rust interface.",
    "- The typed tree's two branches keep the output readable at a real cost in trust: a sound kernel cannot establish that the checked program and the executed program agree. Differential testing of the two branches is the next step for exactly that reason.",
    "",
    "## 15.3 Accepted directions, not yet specified",
    "",
    "These were agreed in design discussion and are not yet worked into [language.md](language.md), which still describes fn and math fn. The details, in particular spelling, remain open. The Positioning section above gives the use case that motivates them: a header that a person reviews, and an implementation that is checked against it.",
    "",
    "1. Effects are a small closed list fixed by the language: not returning, panicking, allocating, and io, which is any interaction with the world, including time and randomness. There are no user-defined effects and no effect handlers, which would need runtime machinery that plain Rust does not have. Mutation is visible in types and is not an effect. Being ghost is a separate axis: an effect says what happens at runtime, and ghost says what exists at runtime. Classical reasoning is reported by an audit, not tracked as an effect.",
    "2. As in Rust, a function may have any effect unless it promises otherwise. A promise is a built-in attribute, one per effect, named as Rust names its own promises of absence (no_std, no_mangle):",
    "",
    "~~~",
    "#[terminates]      always returns",
    "#[no_panic]        never aborts",
    "#[no_alloc]        never allocates",
    "#[no_io]           never interacts with the world",
    "~~~",
    "",
    "   What is guaranteed is what is written, which suits review of a specification: a reader looks for promises that are present, not for weakenings that are absent. An inner attribute at the top of a file, such as #![no_panic], makes a promise for every function in it. Promises are always explicit and never inferred, as const fn and async fn are in Rust, so they spread to every function a promising function calls. There is no attribute that bundles several promises. An obligation arises only where a promise is made: an operation that may panic in Rust, such as checked arithmetic or indexing when they arrive, needs no evidence in an ordinary function and needs evidence in one that promises no_panic.",
    "3. Attributes are a closed, built-in set interpreted by the compiler. Locus has no user-defined macros and no user-defined attributes; its built-in forms are in item 12. Attribute syntax is chosen because it is Rust syntax.",
    "4. A promise is checked against the body: every construct and every callee must keep it. A foreign declaration states its promises and is trusted. Only termination bears on the soundness of the logic, and the logic is protected by construction, since only total kernel terms appear in propositions. The other promises are claims about runtime behavior, enforced by a table from constructs to effects and a check at each call, in the check IR so that the check is on the trusted path.",
    "5. A function may appear in a proposition exactly when it promises terminates, no_panic, and no_io. Such a function always returns and is deterministic, so f(x) denotes one value; allocation is invisible to the logic. The rule reads the signature and never the body. A function with no runtime form, such as one returning Prop, must keep these promises and states them like any other. A function that may not return cannot appear in a proposition, because its result type may promise anything; the result of calling it is a fresh variable that exists only after the call returns, as now.",
    "6. What the logic knows about f(x) is, always, what the result type says, so that f(x).1 is evidence about f(x).0; and, where the body of f is visible, its defining equation as well. Visibility of the equation follows visibility of the body. A recursive function is the exception recorded in item 9. Within one file every body is visible. Once headers exist, a function whose body is in the header is known by its definition, which is right for the vocabulary of a specification, and a function given there only by its signature is known by its contract. No separate control of unfolding is planned; it can be revisited.",
    "7. With the above, math fn carries no information of its own: it is the three promises of item 5. That a function may use Prop, quantifiers, and later Int, and need not be executable, follows from its types, which the kernel already classifies. The type math fn(x: A) -> B becomes a function type with those promises; function types carry promises too. The keyword stays until the promises are implemented and is then removed.",
    "8. Loop invariants need no construct of their own once the language has mutable locals. The direction is agreed; the full rules are to be written as part of introducing mut, together with the replacement of the loop forms of section 10, which exist only because there is no mutation.",
    "",
    "   - Evidence bound with let is a snapshot. It speaks of the values its proposition mentions as they were at that line, is never invalidated, and stays usable after those variables change, as let y = x keeps the old x. Evidence bound with let mut is tracked: its proposition is read against current values, and it may be reassigned. The same type text therefore reads differently under let and let mut, exactly as for data. Both are needed: evidence about the next value is built as a snapshot before an assignment and used to re-establish tracked evidence after it.",
    "   - Assigning a variable, or passing it as &mut, invalidates every tracked evidence variable whose type mentions it, until that evidence is reassigned. Validity then follows Rust's initialization analysis: valid after a join only if valid on every path into it, a loop's back edge is such a path, and a path that breaks or returns does not count. Evidence that is not used again carries no obligation.",
    "   - A fact that can be derived afresh on each pass is an ordinary let inside the body. A fact that depends on earlier passes is tracked evidence declared before the loop and reassigned in the body. A claim about what the loop leaves behind is that evidence, used after the loop with the fact of the exit test. Refreshing is explicit, ok = _; or ok = proof;, so that each obligation is visible where it arises.",
    "",
    "~~~",
    "let mut lock = Lock { failures: 0, open: false };",
    "let mut ok: @within_limit(lock.failures) = _;",
    "for attempt in 0..attempts {",
    "    let (next, still) = step(lock, ok, event_at(attempt, correct));",
    "    lock = next;        // ok is now invalid",
    "    ok = still;         // re-established",
    "}",
    "(lock, ok)",
    "~~~",
    "",
    "   - The checker still performs the induction: the tracked evidence live across the back edge becomes part of the loop's state, as in section 10. The programmer states no invariant. The flow analysis is not trusted. Lowering gives each assignment a new version of the variable and of the evidence, and stale evidence used by mistake is a proof about an old version, which the kernel rejects. What becomes trusted is the translation of mutable locals into versions, which mutable data needs in any case.",
    "   - A for hides its iterator, so evidence declared before the loop cannot speak of the index, nor in general of what an iterator has produced so far. Facts the loop can supply afresh on each pass, such as the bounds of a range index, are unaffected. A carried fact about progress is written with the iterator or index as a named mutable variable, in a while or while let. A clause on for that names the hidden state was considered and is deliberately not planned.",
    "   - To be settled with mut: tracked evidence in local variables only at first; no assignment to a struct field that a proof field of the same struct depends on; invalidation by whole variable rather than by path; and how the signature of a function taking &mut states a fact about the new value.",
    "9. Termination. Every loop, including for, counts as possibly not returning, and needs no annotation. A function that promises to terminate contains no loop and, when it calls itself, states what gets smaller, in the same attribute as the promise:",
    "",
    "~~~",
    "#[terminates(decreases = n)]",
    "#[no_panic]",
    "fn sum_to(n: u8) -> u8 {",
    "    if n == 0 { 0 } else { n.wrapping_add(recurse!(_, sum_to(n.wrapping_sub(1)))) }",
    "}",
    "~~~",
    "",
    "   - A function that does not call itself writes #[terminates] alone. A function that calls itself and promises to terminate must state the measure; it is not guessed. A header carries the bare promise, and the definition adds the measure, which is the argument for the promise and no part of the contract.",
    "   - The measure is an ordinary expression over the parameters, read as a logical term and never executed. Its type must have an order with no infinite descent, fixed by the language: unsigned integers and later Nat under \u003c, bool, tuples lexicographically, later recursive data by the part-of order, and later signed integers with the added obligation that the measure is not negative. Wrapping cannot cheat the order: n.wrapping_sub(1) \u003c n is false when n is 0.",
    "   - recurse!(evidence, call) is the slot for the evidence at a recursive call. It has the value of the call and erases to it. The first argument is expected to be evidence that the measure at the arguments is smaller than the measure at the parameters, so _ works there and a wrong proof is an ordinary mismatch reported at the call. A bare recursive call means recurse!(_, call). The form is spelled with !, as rewrite!, unfold!, and fold! are (item 12). It is the rendering of the idea that a function already on the call stack receives, as an extra argument, evidence that it has gone down; outside callers never see that argument, and the old value is the current frame's own measure.",
    "   - A recursive call is a call to any function in the caller's own cycle of the call graph, which the ordering of declarations already computes; the programmer does not mark it, and recurse! around any other call is an error. The evidence is per call, not per function: each call from f to g shows that the measure of g at the arguments is below the measure of f at its parameters, in one order shared by the cycle. That is checkable within one body, against the signatures and measures of the others, and it implies what is wanted, since following the calls round any cycle back to f composes into a strict descent of f's own measure. The members of a cycle therefore live in one implementation unit, where their measures are visible, and their signatures are elaborated before any of their bodies. A function in a cycle that does not promise to terminate cannot be called by one that does.",
    "   - Mutual recursion: every function in a cycle states a measure, and at a call from f to g the slot of recurse! expects the measure of g at the arguments to be smaller than the measure of f at its parameters. The functions may have quite different parameters; it is their measures that must be comparable, because a cycle terminates exactly when every function in it can be mapped into one order without infinite descent. Two ways of being comparable are intended. Measures of one type from the list above, typically numbers or tuples of numbers, reached through conversions such as a size function once Nat exists; a final tuple component that ranks the functions lets an edge keep the first component equal, as with (n, 1) and (n, 0). And measures that are recursive data of any types, compared by the part-of order, which relates values of different types: a statement inside an expression is a part of it. That covers functions that follow mutually recursive data, with the evidence coming from the match that exposed the part. An order supplied by the programmer, with a proof that it has no infinite descent, is not planned; a cycle that needs one does not promise to terminate. Whether the first implementation includes mutual recursion is open.",
    "   - Computation meant to run forever is a function without the terminates promise that loops around a function with it; each pass finishes and carries its evidence.",
    "   - What the logic knows of a recursive function. The kernel has no recursion, so a terminating recursive function is not a kernel term and has no defining equation there, even where its body is visible. It enters the logic as a function symbol with the function's signature, known by its contract alone (item 6), and the checker's termination rule is what justifies treating it as total. This refines item 6: the defining equation is available where the body is visible and is expressible as a kernel term. Recursion in the kernel, beginning with structural recursion over recursive data, would make the equation available and is the natural companion of recursive data types.",
    "   - Consequences to keep in view. A function that promises to terminate uses stack in proportion to its recursion depth, since Rust does not guarantee tail calls, so recursion suits structural recursion and divide and conquer better than iteration over long input. Loops that keep the promise, by a finite range or a measure, are left for later; the kernel's rule for a bounded for (section 10.6) remains and is what they would lower to. The one trusted addition is the checker's rule that a strictly decreasing sequence in these orders is finite.",
    "10. Mutation and references, in tiers. Tier 0 is agreed; the full rules are to be written when it is specified in detail, together with item 8, which depends on it.",
    "",
    "   Tier 0 consists of two steps, in order. First, let mut locals and assignment to a variable or to a field path of one (x = e, lock.failures = e), which need no references at all. Second, &mut T and &T as parameter types, including self, with arguments written as paths (&mut lock, &mut pair.0, &lock), a reference parameter passed on to another call, and inherent impl blocks with method calls, without traits, since &mut self presupposes them. Not in tier 0: a reference held in a local, in a struct field, or returned; explicit lifetimes; a reference to a reference; a closure that captures one. A reference therefore lasts for one call, and no lifetime is ever written or checked. Every type is still Copy; moves and types that are not Copy arrive with Box and Vec.",
    "",
    "   - What the logic sees. A mutable variable is a sequence of versions, a new one at each assignment. At a join, a variable assigned on some path gets a new version, equal to a conditional term when the branches are pure. In a loop, nothing is known of a variable the loop assigns beyond what tracked evidence carries (item 8). Lowering turns versions into the state-passing forms the check IR already has. What becomes trusted is that translation.",
    "   - How a signature speaks of old and new. In parameter types a &mut parameter means its value at entry. In the result type it means its value at return. old!(x) names the entry value where the result needs both. In the logic the function takes the old value and returns the new value beside its declared result, so that a call gives its argument a new version and the evidence it returns is about that version:",
    "",
    "~~~",
    "fn bump(lock: &mut Lock, ok: @within_limit(lock.failures)) -> @within_limit(lock.failures)",
    "",
    "ok = bump(&mut lock, ok);      // lock has a new version; the result re-establishes ok",
    "~~~",
    "",
    "   - Aliasing. The &mut arguments of one call are disjoint paths, and disjoint from every other argument that reads the same variable: f(&mut a, &mut a) and f(&mut a, a.x) are rejected, f(&mut a.x, &a.y) is accepted. Locus is never more permissive than rustc, since the generated Rust must compile, and soundness rests on Locus's own check: lowering cannot write two new values back to one variable.",
    "   - Evidence. A parameter is bound as let is, so an evidence parameter is a snapshot of the entry state; mut ok: @P makes it tracked, which is Rust's own syntax for a mutable parameter. A field that a proof field of the same struct depends on is not assigned through a reference; the whole value is replaced.",
    "   - &T adds nothing to the logic while every type is Copy and nothing has interior mutability: a shared reference is the value. It is there for idiom, and for efficiency later.",
    "   - Left for the detailed specification: the flow rules for tracked evidence, early return, what the caller's variable holds when the callee does not return normally (harmless under partial correctness), and diagnostics that name versions, such as i as it was before line 12.",
    "",
    "   Tier 1, planned next: shared references in fields, returns, and locals, with lifetimes. The logic is unchanged, because a shared reference is still the value, provided types with interior mutability are excluded. Nothing in the logic depends on when a shared loan ends, only on the value not changing while it lasts, which rustc enforces on the generated code; whether rustc may be the final judge of lifetimes here is to be examined. This recovers parsers that hold their input, lookups that return a reference, and iteration over a collection.",
    "",
    "   Tiers beyond that are not planned, and what each would cost is known from the tools that have done it. A mutable reference in a local needs a loan analysis of Locus's own, because a borrow ends at its last use and the logic must know where the lent variable gets its value back; rustc's checker has no specification to match. A returned mutable reference breaks the reading of a function as old values to new ones, because the final state of self depends on what the caller later writes; the known answers are a second, backward function per function, or prophecy variables that name a reference's final value, and either makes specifications harder to read, which matters when the specification is what people review. A mutable reference in a struct makes the struct's logical value carry current and final values. Interior mutability, unsafe code, and concurrency need separation logic and are a different project. In each case the translation from borrows to values would sit in the trusted lowering. Every tier 0 program remains valid under the later tiers, and the old!(x) convention coexists with a notation for a reference's final value.",
    "",
    "11. Logic-only types and erasure by type. This supersedes the ghost keyword on binders that section 2.4 defers.",
    "",
    "   - Two ideas are kept apart. Every value has a logical value, which is what propositions speak of: a u8 is a number below 256, a Vec is a sequence, a Tree is a tree. Separately, a type either has a runtime form or has none.",
    "   - Some types have no runtime form by nature: Prop, proof types, Int, the unbounded integers, and Seq\u003cT>, the finite sequences, with Map and Set to follow. They are grouped under the name logic, and are built-in names until modules exist. Int and Seq never acquire a runtime form. A runtime Int would be a big number with a heap and an allocation at every operation, and giving an erased type a runtime form later would silently turn reasoning into computation. A program that needs big numbers at runtime uses a library type whose logical value is an Int, as the logical value of a Vec\u003cT> is a Seq\u003cT>.",
    "   - Any other type gives up its runtime form on request, as Ghost\u003cT>, which keeps the logical value of a T and nothing else. snapshot!(e) builds one: it takes the value of e as it is now, never executes e, and neither moves nor copies anything. Inside a proposition a Ghost\u003cT> reads as the T. At first snapshot! applies only to a variable that is still live. Ghost\u003cT> erases to the zero-sized marker of the same name, so the generated Rust reads as the source does.",
    "   - One rule: a binding, field, parameter, or result is erased exactly when its type has no runtime form. There is no keyword and no attribute. The rules that already govern Prop apply unchanged: erased values flow only into erased positions, a function returning such a type has no runtime form, a runtime branch cannot be chosen by one, and a struct may have such fields. Runtime containers of logic-only types, such as Vec\u003cInt>, are not allowed at first.",
    "   - Conversions into the logic are exact and total: x as Int from any machine integer, and a view from a Vec, array, or slice to its Seq. They serve a different purpose from snapshot. A snapshot remembers this exact value, at its own type. A conversion gives the mathematical value, to reason with: arithmetic that cannot overflow, a length that is an Int, concatenation.",
    "   - Why Int is needed in the language and not only in the kernel. A specification written in machine arithmetic suffers the overflow it is trying to describe, so that every bound has to be rearranged. And acceptance rests on evidence a person or an AI writes: an obligation stated in terms nobody can write admits no intermediate fact, produces a diagnostic nobody can type back in, and leaves every lemma to be built by hand in the kernel's own language.",
    "   - Model functions and model fields need no feature of their own. A model function maps a representation to the value it stands for, is used only in propositions, and so never runs; given only by its signature in a header, it is known to callers through the contracts of the operations, which is the abstraction boundary. A model field is a field of a logic-only type, kept beside the real fields with evidence that the two agree.",
    "",
    "12. Built-in forms. Locus has no user-defined macros: one in a header would hide the text a reviewer is meant to read, diagnostics through expanded code are poor, and nothing about verification needs them. It has a closed set of forms the compiler handles itself, spelled with ! as Rust spells a macro call. The mark tells a Rust reader what it tells them in Rust: this is not an ordinary call, its arguments need not be ordinary values, and something happens at compile time. Nothing is expanded.",
    "",
    "   - _ stays the request for evidence, in any expression position where evidence of a known claim is expected. It reads as it does in Vec\u003c_>: work this out. It is not valid Rust in expression position, so nothing is reinterpreted.",
    "   - prove!(P) states a claim where it stands. P is a formula, written as inside brackets and without them. The claim must be provable at that point, by the search a _ would run, and a failure is reported there. It differs from let _: @[P] = _; in two ways: the fact stays in scope for every later search, which is what makes it a stepping stone and what localizes a broken proof to the step that no longer follows; and it is an expression of type @[P], so let h = prove!(i \u003c= limit); names the evidence and (out, prove!(out == n.wrapping_add(1))) is a hole that says what it proves. It erases to nothing as a statement and to the marker as a value. It takes no hints yet. The name assert! is not used for it, because in Rust that is a check at runtime.",
    "   - old!(x) and snapshot!(e) are spelled this way (items 10 and 11): neither evaluates its argument as a function would.",
    "   - Forms that mean what they mean in Rust: assert!(c), a check at runtime after which c is a known fact, and which needs evidence in a function that promises no_panic; unreachable!(), of any type, which needs evidence of false under no_panic; todo!(), of any type, which panics, so that a half-written file can be checked; panic!, debug_assert!, matches!, and vec! once Vec exists; and the attribute derive with a closed list of traits.",
    "   - recurse!(evidence, call), rewrite!(eq, h), unfold!(f, h), and fold!(f, h) take the same spelling. recurse! wraps what must be, syntactically, a recursive call, and the type expected of its evidence is computed from that call. unfold! and fold! take the name of a function and not a value. The result type of rewrite! is computed by substitution. None of the four names is reserved any longer.",
    "   - The rule that separates a form from a library function: a step is a function when its type can be written, and a form when the compiler has to look at syntax to know the type. A lemma such as u8_le_trans, and symmetry, transitivity, and congruence of equality, are functions that take evidence and return evidence, and live in the library. rewrite! cannot be one today: its signature would take the predicate P as a parameter, which needs generics and a lambda to pass, and since the kernel computes nothing by itself, P(a) would still have to be connected to the claim actually held; the form reads the claim of h, finds the occurrences, and works P out. unfold! cannot be one at all in that shape, since no signature can speak of the body of whichever function it is given; it is a rewrite along that function's defining equation, and fold! is the same rewrite backwards. Either way nothing is trusted that was not before: a form emits an ordinary kernel step, transport, and a library lemma is a checked function.",
    "   - To revisit when generics and logic-only lambdas become possible: whether some of these forms should become library functions. The candidates are transport itself, as a function taking the predicate explicitly, and each function's defining equation as evidence that can be named. rewrite!, unfold!, and fold! would then remain as conveniences that infer the predicate. The library would be grouped beside the logic types, as logic::eq, logic::u8, and so on.",
    "",
    "13. Decisions from the audit against the Rust Reference. The rule behind all of them: where Locus and Rust both have a thing, it means in Locus what it means in Rust, and generated Rust must be what a Rust programmer would have written. The audit walked the Reference chapter by chapter; what it found missing from the batches is filed as tasks.",
    "",
    "   - Propositions are written prop!(P), where P is a formula, and the type of evidence is @P, where P is the name of a proposition, a proposition applied to arguments, or a formula in parentheses: @within_limit(n), @(out == n.wrapping_add(1)). Brackets are no longer proposition literals, because [n > 0] is a Rust array and arrays, slices, and indexing are coming. This settles open question 1. A lighter way to write a proposition value may be found later. The implication arrow stays =>; it appears only inside prop!(...), prove!(...), and @(...), which Locus owns.",
    "   - Values move, as in Rust. A type is used more than once only if it is Copy, and Copy and Clone are asked for with derive, from the closed list of item 12. Use of a moved value is an error from the start. The present behavior, where every type is silently Copy, accepts programs that are not Rust.",
    "   - Items and fields are private unless marked pub, and pub is part of the core. The generated Rust at present makes everything public; shipping that and adding privacy later would change what programs mean. pub(crate) and the rest wait for modules.",
    "   - Every Rust keyword is reserved: the strict ones and the ones Rust reserves for later (abstract, become, box, do, final, gen, macro, override, priv, try, typeof, unsized, virtual, yield). Identifiers reach the generated Rust, so a variable named type or move would break it. Rust's weak keywords stay identifiers, as they do in Rust. Locus reserves forall and exists besides.",
    "   - The never type ! exists, with its coercion to any type. It is the type of panic!, unreachable!, todo!, of return, break, and continue, and the result type of a function that never returns.",
    "   - Early exit is part of the core: return. The check IR and lowering are designed with it from the start. The ? operator waits for the traits it is defined by.",
    "   - An integer literal takes the type expected of it, and i32 when nothing expects one, as in Rust. Suffixes (255u8), and hexadecimal, octal, and binary literals are part of the core. String literals exist for the messages of the built-in forms.",
    "   - Paths and namespaces follow Rust. A path has any number of segments, which u32::MAX, an associated function such as Lock::new, and modules all need. Types and values are looked up separately, so that a type and a function may share a name, as a struct and its constructor function do in Rust.",
    "   - Type arguments are written only on the types the language provides, such as Ghost\u003cT> and Seq\u003cT>, and later Option\u003cT> and Vec\u003cT>. Type parameters on a programmer's own types and functions arrive with generics, which need type variables in the logic. The alternative considered was a small subset of generics in the core.",
    "   - Operator precedence is Rust's table, exactly, including as and the unary operators. The implication arrow binds loosest.",
    "   - == and != are what they are in Rust: defined on bool and every integer type, and on a programmer's type only when it derives PartialEq. What equality of a type with erased fields means to the logic is already noted in language.md and is unchanged.",
    "   - Enum variants with named fields are part of the core. Explicit discriminants, tuple structs, unit structs, and the newtype idiom are polish.",
    "   - A const item is emitted as a Rust const, and its initializer is limited to what Rust can evaluate at compile time. At present it is a function of no arguments.",
    "   - match is to have the power it has in Rust: on integers, bool, and tuples, with literal, range, and or-patterns, bindings with @, guards, and exhaustiveness over integer ranges. This is in the batch on control flow, not in the core.",
    "   - Polish, after the core: omitting -> (), mut on parameters, field init shorthand and ..base in struct expressions, loop labels, MAX and MIN and a closed list of integer methods, range expressions including ..=, and passing doc comments and chosen attributes through to the generated Rust. usize and isize arrive with slices; their width depends on the platform, which the logic and determinism both have to account for.",
    "   - The meaning of the integer operators is item 14. The operators of the core are + - * / %; the bit operators and shifts come later, since they need a bit-level model.",
    "",
    "14. Integers, in code and in propositions. One rule decides what may be written in a proposition, and it is item 5, applied to operators as to any other function: an operator is a function of its operand types, with effects of its own, and only what always returns, never panics, and does no io may appear in a proposition.",
    "",
    "   - In code an operator means what it means in Rust and is printed as written. + - * on a machine integer panic on overflow in a build with overflow checks and wrap in one without; / and % panic on a zero divisor, and on the smallest value divided by -1, in every build.",
    "   - So x + 1 on a machine integer may panic, and is not valid in a proposition. x as Int + 1 is valid, because + on Int is total, and so is x.wrapping_add(1), which never panics. The same test, not a rule about arithmetic, is what rejects the one and admits the others, and the error says which two things can be written instead. Comparisons of machine integers never panic and are valid as they stand. A specification therefore cannot contain arithmetic that silently wraps, and no operator means one thing in code and another in a proposition: + always means the operation of its operand type.",
    "   - The same test settles what is to come. Indexing a Vec and unwrap may panic and are not written in propositions; their total counterparts on Seq and Option are. A function that takes evidence in place of panicking is total, and is written in a proposition wherever that evidence can be given. An operator a programmer defines is valid in a proposition exactly when its implementation makes the three promises.",
    "   - Code that promises no_panic may still use +: the operation has a condition under which it does not panic, and the promise turns that condition into an obligation at the place it is used. A proposition is never executed, so it has no such place, which is why the condition cannot be discharged there.",
    "   - What the logic knows of let s = a + b. Under no_panic, where the sum was shown to be in range, s as Int == a as Int + b as Int. Otherwise only s == a.wrapping_add(b), the one fact true in every build; evidence that the sum is in range recovers the exact sum. An operation that panics in every build teaches its condition to what follows: after a / b the divisor is known not to be zero, as c is known after assert!(c). An overflow check that only some builds make teaches nothing.",
    "   - / and % on Int truncate toward zero, as in Rust, so that code and specification agree. Int division by zero has the value 0, since a function of the logic must be total; code that promises no_panic never reaches it.",
    "   - as between integer types wraps, never panics, and is valid everywhere. as Int is exact. A literal that does not fit its type is an error.",
    "   - Floats follow from the same test. Their arithmetic never panics, so it may be written in a proposition, where it is an operation the logic knows nothing about: out == a + b can be stated and used, and no algebra follows from it. Equality in a proposition is the logic's, which holds of any value and itself; Rust's == on floats is a different function, which NaN fails, and the two must not be confused. How that is spelled is to be settled with floats.",
    "   - The reference interpreter panics on overflow, the stricter of Rust's two behaviors, and generated Rust is compared with it in a build with overflow checks.",
    "   - Still open: whether a comparison in a proposition may mix integer types, as in out == x as Int + 1 with out a u32. A comparison of two integers has one mathematical meaning whatever their types, which argues for allowing it; Rust does not allow it, which argues for writing out as Int.",
    "   - What this asks of the kernel: Int as an ordered ring, where there is only Nat with addition today; for each machine type a view to Int and a wrap from Int, generalizing the present model of u8; the evaluator; and an arithmetic procedure that is linear, treats multiplication by a literal as linear, and leaves other products to lemmas.",
    "",
    "## 15.2 Open questions",
    "",
    "These are not decided. Each lists the current behavior of this document first. None needs to be settled before the kernel spike.",
    "",
    "1. Settled by item 13: propositions are written prop!(P) and evidence types @P, and brackets are left to arrays. What remains open is a lighter way to write a proposition value.",
    "2. Implication is spelled =>, which is also the match arm separator (section 13). The alternative is ==>.",
    "3. Supplying evidence of Q where evidence of P is expected is an error unless the two are identical (section 3.1). The alternative is to treat the mismatch as an implicit hole, asking the solver of section 12.3 for P with the supplied evidence in scope. The implementation does the alternative, because a name bound by destructuring a result would otherwise never fit where evidence about that name is wanted; whether the specification should follow is still to be decided.",
    "4. Branch and arm evidence is anonymous. A naming form, such as if h: n != 0 { ... }, would let hand-written steps refer to it without a hole.",
    "5. A hole does not search the prelude (section 12.3). A mechanism for marking lemmas that a hole may apply, with its own step budget, would shorten proofs at some cost in predictability.",
    "6. The spelling of the chain form (section 8.4). One candidate is the bracketed form trans[a =(p) b =(q) c] used by the explicit refinement calculus.",
    "7. Whether bounded iteration (section 10.6) should admit break, and whether a reversed range should be accepted as empty at the cost of a case distinction in the result type.",
    "8. Whether a design rule should be adopted that Locus never gives valid Rust syntax a different meaning, so that a Rust superset remains reachable. Items 1 and 2 are the current violations; Appendix A of language.md tracks them.",
    "",
    "## 15.1 Deferred",
    "",
    "The README milestones give the intended order. Each item below is outside this fragment.",
    "",
    "- Logical lambdas: logic-only, capturing only immutable and ghost values, and erased. They remove the hand lifting of section 8.3.",
    "- Mathematical Int and Nat, arithmetic operators whose overflow is a proof obligation over the mathematical value, further machine widths, and a linear-arithmetic procedure.",
    "- Generics over types and propositions. Exists, Option-like types, and a library Ghost wrapper become declarable.",
    "- Recursion, as one feature: recursive enums, recursive prop declarations, and structural recursion, where a recursive call is permitted only on a part bound by a match on the argument. Induction is then a recursive math function returning a proof. In the logic, Box is transparent: a recursive Rust enum using Box is seen as the plain inductive type, and the same holds for Rc, Arc, and shared references in the absence of interior mutability, because ownership guarantees such values are finite trees. Types that permit cycles through interior mutability are not inductive and need separate treatment.",
    "- The ghost keyword on binders (section 2.4), and with it model fields. The semantics is already fixed by Prop fields (section 4.2): ghost data is part of the logical value, so s.model is a function of s, and two structs differing only in a ghost field are different values with one runtime representation. A consequence to carry forward: once runtime equality exists on structs, it compares representations, and therefore does not reflect logical equality for a type with ghost data fields.",
    "- Dependent conjunction and implication, where the right operand is well formed only under the left, as in [i \u003c len && a.get(i) > 0] once indexing demands a proof. This arrives with the first operation that takes a proof precondition, and is a reason to make && and => kernel formers at that point, not instances of the prelude And.",
    "- Requires/ensures/invariant/assert as sugar over proof parameters, dependent results, and loop proof state.",
    "- Mutation, references, ownership, and surface loops that elaborate to the state-passing loops of section 10.",
    "- Termination measures, for total correctness of executable loops and for non-structural math recursion. Until then the workaround for the latter is an explicit fuel parameter.",
    "- Trusted and external declarations, with the rest of Rust interoperability. Every such declaration is to be syntactically marked.",
    "- Runtime closures.",
    "",
    "## Why Locus has its own kernel",
    "",
    "Locus uses its own proof kernel, written in Rust. A Lean-backed adapter is no longer the plan. The decision rests on these commitments:",
    "",
    "- The logic is classical. The planned soundness argument is a denotational model in the style of explicit refinement types (Ghalayini and Krishnaswami, ICFP 2023): propositions denote truth values, and types denote sets of logical values related to runtime representations. Locus keeps the two apart because ghost data such as a `Prop` field belongs to the logical value but not to the representation; for types without ghost data this reduces to the paper's subset reading. Its mechanized Lean 4 development is a starting point; the two-layer values, divergence, and declared propositions are the parts Locus must add. Excluded middle is a single named lemma whose uses are recorded. Until the model is checked against every kernel rule, consistency is a goal. Exporting accepted terms to an independent implementation tests the kernel but does not replace that argument.",
    "- The kernel has no conversion checker. It compares terms up to renaming and proof irrelevance; every computation step is an explicit equality axiom used through transport. The elaborator inserts the steps for immutable lets, projections, matches on known constructors, and literal arithmetic, so the programmer still sees the minimal type identity of the specification. Function bodies are unfolded only on request.",
    "- Proof irrelevance holds, as part of conversion. `u8` is modelled as a natural number below 256 over a kernel-internal `Nat` with a recursor; its ordering lemmas are proved from that model. Native evaluation must agree with the model and can decide closed terms. Induction over that `Nat` is the proof-level recursion rule; bounded iteration is a separate term-level rule whose index-dependent state erases to a plain loop.",
    "- Everything that constructs proofs is untrusted: the elaborator, the hole solver, and any later decision procedure, external solver, or model. Each must produce a kernel term, or a certificate for a checker that is explicitly added to the trusted base.",
    "- Proofs are written declaratively, as stated intermediate facts joined by lemma calls and holes. There is no tactic language. The hole's search is fixed and bounded by step counts, never by time, and it does not search the prelude, so that its behavior is predictable; found proofs are recorded so rechecking does not repeat the search.",
    "- The prelude is checked, not trusted. The main cost of not building on Lean is this lemma library; statements can be ported, proofs must be redone.",
    "",
    "Regardless of kernel, the translation of programs into kernel statements, erasure, and execution initially remain trusted compiler components. Proof acceptance alone does not establish that generated machine code preserves the source semantics.",
    "",
    "## The earlier design brief",
    "",
    "This is the brief the project started from, moved here from the README. Parts of it are superseded: its milestone list by [roadmap.md](roadmap.md), its account of state, mutation, and loops by items 8 to 10 above, and the ghost binder keyword by item 11.",
    "",
    "**The programming model.** Propositions are native logical claims, potentially non-executable, rather than runtime booleans. They compose through equality, logical connectives, quantification, and named predicates. A proof establishes a particular proposition about particular values. A theorem is a function producing such proofs for arbitrary permitted inputs. `fn` declares executable functions accepting and returning runtime data and erased proofs, including combinations; it may diverge. `math fn` declares a function in the mathematical sense: pure and total, with one well-defined result for every input. A `math fn` is written once and used in both worlds: it is callable from logic because it is total, and it is compiled and callable at runtime whenever its signature contains executable data. Lemmas are math functions returning proofs; predicates are math functions returning `Prop`. Users can also declare their own propositions: a `prop` declaration lists every way a claim can be proved, as an `enum` lists every way a value can be built, and `match` on such a proof is case analysis. Propositions, proofs, and existential witnesses are *ghost* bindings: they exist for the checker, may appear anywhere in logic, and may never determine executable data or control flow. Under that rule proposition values may appear in `fn` signatures and struct fields; they are simply erased. Runtime structs and enums can combine data and proof fields, and a later field may mention an earlier one only inside a proposition, so runtime layout never depends on a value. Mathematical `Nat` and `Int` remain distinct from machine integers. Richer mathematical objects belong in libraries.",
    "",
    "**Erasure and control flow.** Proofs are checked at compile time, including proofs about unknown runtime inputs. Proposition values, proof values, and logical computation are erased; surrounding data computation still executes. Proofs can establish further facts and discharge preconditions, but cannot be printed, inspected, or used as runtime branch discriminants. Runtime decisions and enum tags can carry erased evidence; `if` is a `match` on `bool`, and every `match` arm receives checked evidence about the value it matched. `Unknown` or an absent proof establishes neither a claim nor its negation. Checked comparisons supply facts within their respective branches. Ordinary operations retain checked fallbacks when proofs are unavailable.",
    "",
    "**State and functions.** Proofs refer to immutable logical snapshots, tracked through SSA-style state versions, not borrows that freeze data or runtime copies. Mutation leaves old proofs true about old states; it does not retarget them. `before(x)` and `after(x)` describe invocation entry and normal return. Heap aliases must participate in state tracking. Loop invariants are ordinary proof components of explicit loop state, supplied on entry and on every back edge. Termination of executable loops is not tracked: an `fn` is checked for partial correctness, and a proof it returns is available only in the code reached after it returns. Totality of math code is guaranteed syntactically instead of by measures: math code has no general loops and, in the core, no recursion; bounded iteration is allowed, and structural recursion arrives with recursive data. There is no `decreases` clause. Functions used directly in propositions must be math functions; effectful calls are described through results and state transitions. Purely logical computation is erased and cannot supply runtime data or branch discriminants; the ghost flow check enforces that boundary. Runtime inputs may occur symbolically in logical definitions. Contracts remain optional surface conveniences.",
    "",
    "**Proposition and proof syntax.** `Prop` is the type of logical claims. A proposition literal must use brackets: `let claim: Prop = [n > 0];`. An annotation alone does not convert a Boolean into a proposition. Existing propositions compose directly using `!p`, `p && q`, `p || q`, and `p => q`; these operations construct claims, not evidence. In the core, which has no arrays, a bracketed expression is always a proposition literal, with or without an expected type. The implemented parser still keeps `[e]` neutral and preserves array forms; how brackets are shared with arrays later is an open question. Two spellings remain under review because they collide with Rust syntax, the bracket literal and `=>`; the specification records them as open questions.",
    "",
    "`@claim` or `@[condition]` denotes a proof type. Proofs are ordinary expressions: names, proof constructors such as `Or::Left(h)`, `match`, lemma calls, and applications of quantified proofs such as `all(n)`. The intended style is declarative: a sequence of `let` bindings that state intermediate facts, each justified by a lemma call or a hole. There is no tactic language; the earlier `@{ ... }` proof block is retired. `_` in an expression requests a checked proof of the expected proposition, found by a fixed, bounded search. An unsolved goal or missing expected proposition is an error. `_` in a pattern still ignores a value. The proof marker is not used alone, and `#[...]` remains reserved for attributes. Named result fields let proofs describe returned data:",
    "",
    "```rust",
    "fn increment(n: u8) -> (out: u8, @[out == n.wrapping_add(1)]) {",
    "    let out = n.wrapping_add(1);",
    "    (out, _)",
    "}",
    "```",
    "",
    "**Implementation direction.** Use a handwritten Rust lexer and recursive-descent/Pratt parser, with a reusable diagnostic renderer. Locus has its own proof kernel, written in Rust and kept small. The elaborator, the hole solver, decision procedures, and any external tool or model that proposes proofs are untrusted: each must produce an explicit term, and only the kernel's acceptance counts. An SMT solver is not the foundation. The logic is classical higher-order logic with declared data and declared propositions; since proofs are erased and can only produce other proofs, classical reasoning cannot affect execution. The planned soundness argument is a denotational model in the style of explicit refinement types (Ghalayini and Krishnaswami, ICFP 2023): every type erases to a simple type, and a proposition denotes a truth value. Locus keeps a logical value and its runtime representation apart: ghost data such as a `Prop` field is part of the logical value though absent at runtime, while proof contents are irrelevant to both. For a type with no ghost data, such as a nonzero byte, this reduces to a subset of the erased type. The model stays tractable because values appear in types only inside propositions. Equality is available at every data type, including function types, with reflexivity, transport, and computation; function and proposition extensionality are withheld. Excluded middle is one named lemma whose uses are recorded. Exporting accepted terms to an independent checker tests the implementation without replacing that argument. The kernel compares terms only up to renaming and proof irrelevance and contains no normalizer: computation steps are explicit equality axioms, inserted silently by the elaborator for lets, projections, matches on known constructors, and literal arithmetic, and only on request for function definitions. Checking is therefore syntax-directed and predictable. Machine integers are native to the kernel and modelled as bounded natural numbers, so their ordering lemmas are proved, not assumed; the kernel can also establish closed facts by evaluation. A kernel-internal `Nat` with a recursor underlies that model and bounded iteration, and later becomes the source-level `Nat`. Begin with limited, predictable automation: a hole searches facts in scope, propositional structure, equalities with congruence, definition unfolding, and closed evaluation, and nothing else; arithmetic steps are explicit lemma calls, and every search limit counts steps, never time. Found proofs are recorded so that rechecking never repeats a search. Initially, only proof types depend on runtime values, keeping data layouts straightforward. Erasure is a compositional function on types and terms. Emit Rust after erasure and build through Cargo. Lowering and imported behavioral specifications are explicit trust boundaries. Rust exports must preserve proof preconditions through checked wrappers or protected validated types.",
    "",
    "**Proposed milestones, in dependency order:**",
    "",
    "0. **Core:** `u8` with explicit wrapping operations, `bool`, unit, tuples, named structs, nonrecursive enums and `match`, immutable bindings, blocks, nonrecursive `fn`/`math fn` declarations, `if`, state-passing loops in `fn`, bounded iteration, proposition values, `prop` declarations, dependent proof results; the proof kernel, checker, and interpreter.",
    "1. **Native execution:** Rust generation and proof erasure; compare compiled and interpreted behavior.",
    "2. **Mathematical integers and machine arithmetic:** `Int` and `Nat`, further machine widths, arithmetic operators whose overflow is a proof obligation, conversions, and a linear-arithmetic procedure; verify byte packing.",
    "3. **Generics:** type and proposition parameters; `Option`, `Result`, and positive, negative, or unknown evidence; logic-only lambdas.",
    "4. **Recursion:** recursive enums and `prop` declarations, structural recursion, and induction as recursive lemmas, with `Box` transparent to the logic; prove list append's length property.",
    "5. **Proof tooling:** modules, cached checking, recorded proofs, hole expansion, opaque theorem interfaces, goal diagnostics, and rewrite and chain forms.",
    "6. **Specification conveniences:** the `ghost` binder keyword and model fields; `requires`/`ensures`/`invariant`/`assert` as sugar over proof parameters and results.",
    "7. **Local mutation:** assignment, snapshots, and branch joins; verify swap and reject stale-state evidence.",
    "8. **Loops over mutable state:** `while` and `for` elaborating to state-passing loops, labels, and optional termination measures; verify an iterative algorithm.",
    "9. **Ownership:** moves, shared/exclusive borrows, fixed arrays, and proof-assisted access; track referenced storage.",
    "10. **Collections:** modeled slices, `Box`, and `Vec`; prove in-place sorting preserves elements and produces order.",
    "11. **Rust boundaries:** marked trusted declarations, concrete adapters, effects, panics, safe exports; ship a verified codec crate.",
    "12. **Broader integration:** traits, associated types, ordering laws, and cross-package proof metadata; verify a generic algorithm.",
    "",
    "Runtime closures, custom destructors, interior mutability, raw pointers, concurrency, and async follow once this foundation works. Each milestone should deliver a useful example and measure checking cost, proof burden, and generated-code behavior.",
    ""
   ],

  {
   "id": "language",
   "title": "Language",
   "group": "Reference",
   "body": [
    "# The Locus language",
    "",
    "Status: the language as specified now, revised 21 September 2026. The parser and the elaborator implement this fragment; what the elaborator does not yet handle is listed in [architecture.md](architecture.md). Everything about the future of the language, including what has been agreed and not yet specified, is in [notes.md](notes.md). Section 13 is the grammar as implemented, and Appendix A relates the fragment to Rust's features.",
    "",
    "This document specifies binding, formation, checking, and execution rules together. A context-free parser grammar alone would not specify the dependencies we need. Code examples use proposed surface syntax; kernel constructs and context annotations need not be exposed to programmers.",
    "",
    "## 1. The selected fragment",
    "",
    "The core contains:",
    "",
    "- Unit, bool, and u8; other machine widths can be added by the same rules.",
    "- Immutable values and shadowable let bindings.",
    "- Functions, distinguished as fn or math fn. A named function may be used as a value. There are no closures.",
    "- Propositions and erased proofs, including user-declared propositions (prop declarations).",
    "- Tuples and named structs. Each field may optionally have a name. There are no anonymous structs.",
    "- Non-recursive enums, and match expressions.",
    "- If/else expressions, defined as a match on bool.",
    "- Loop expressions with explicit immutable state parameters, break, and continue. These are executable only.",
    "- Bounded for iteration over a u8 range, the only repetition available to math code.",
    "",
    "There is no primitive refinement type, Refined constructor, implicit refinement conversion, using expression, mutation, reference type, ownership system, trait system, generic parameter, type-level computation, closure, or recursion of any kind (functions, enums, or prop declarations) in this fragment. There are no termination measures, no decreases clause, no tactic language or proof block, no requires/ensures contracts, no trusted or external declarations, and no source-level ghost keyword. Mathematical Int and Nat are later additions to the source language; the kernel has an internal Nat that source programs cannot name (section 12.2). A generic Refined library type becomes possible when ordinary generics with logical predicate parameters are added. This specification does not require it.",
    "",
    "All primitive computations are pure. An ordinary fn may diverge; a math fn must terminate. Termination of math code is guaranteed by syntactic restriction, not by measures: math code contains no loop expression and no recursion. General effects and mutable state are later additions.",
    "",
    "For u8, literals range from 0 through 255. The primitive wrapping_add and wrapping_sub operations are total, modulo 256. Equality and unsigned ordering are defined precisely on that domain. Runtime equality is initially defined only for u8 and bool, not for products, enums, functions, propositions, or proofs. Plain arithmetic operators are omitted here to avoid an unresolved overflow policy.",
    "",
    "No separate snapshot operation is needed for this immutable core. A binding already denotes one stable value. Shadowing creates a new binding.",
    "",
    "The surface choices below are explicit proposals:",
    "",
    "1. Tuple field names are only local binders for later field types. Tuple construction, access, and destructuring are positional. Named struct fields additionally provide projection labels.",
    "2. Products preserve declaration order. Renaming a tuple binder does not change its type. Named structs and enums remain nominal.",
    "3. Loop state is passed explicitly to continue; there is no hidden assignment.",
    "4. Loop invariants are ordinary proof components of the state.",
    "5. A loop result type is formed in the outer context, not in the context of its changing state parameters.",
    "6. The function qualifier is math fn, following Rust's qualifier-plus-fn pattern (const fn, unsafe fn). A math fn denotes a function in the mathematical sense: one well-defined result for every input. It is callable from both executable code and logic. The earlier def spelling is retired.",
    "7. Proofs are ordinary expressions: names, constructor applications, match, calls to math functions, and checked holes. A proof is typically written as a sequence of let-bound intermediate facts. There is no tactic language.",
    "8. A proposition's meaning is what counts as a proof of it. A prop declaration fixes that by listing the proof constructors; match on such a proof is the corresponding case analysis.",
    "9. Proofs are checked by a small Locus proof kernel (section 12). The compiler and its automation may construct proofs, but only the kernel accepts them.",
    "",
    "## 2. What the compiler remembers: environments and binding identities",
    "",
    "The compiler needs four kinds of bookkeeping. These are roles in the specification, not a requirement to implement four separate data structures:",
    "",
    "~~~",
    "Definitions  global declarations, signatures, definitions, and primitive rules",
    "Names        lexical name-resolution stack: source spelling -> binding identity",
    "Context      ordered logical context of resolved bindings",
    "Loops        enclosing loop targets, used to check break and continue",
    "~~~",
    "",
    "The earlier draft used Greek names: Sigma for Definitions, Omega for Names, Gamma for Context, Kappa for Loops, and rho for runtime Values. The English names describe the same concepts.",
    "",
    "In plain language:",
    "",
    "| Name | Question it answers |",
    "|---|---|",
    "| Definitions | What functions, named structs, constants, and primitive operations exist? |",
    "| Names | Which binding does this written name refer to here? |",
    "| Context | What is that binding's type, and what checked information is available about it? |",
    "| Loops | Which loop would break or continue target, and what values must it receive? |",
    "| Values | During execution, what actual data does a binding contain? |",
    "",
    "For example:",
    "",
    "~~~",
    "let n: u8 = 3;",
    "let claim: Prop = [n == 3];",
    "let n: u8 = 9;",
    "~~~",
    "",
    "The compiler gives the two n declarations different identities, say n1 and n2. After the last line:",
    "",
    "~~~",
    "Names:",
    "    n     -> n2",
    "    claim -> claim1",
    "",
    "Context:",
    "    n1     : u8   with definition 3",
    "    claim1 : Prop with definition [n1 == 3]",
    "    n2     : u8   with definition 9",
    "~~~",
    "",
    "Names now selects n2, while claim1 still refers to n1. That is how shadowing preserves the meaning of old propositions.",
    "",
    "For a function parameter, Context may know only n1: u8, without knowing its numeric value. That is enough to form @[n1 == n1] or check a result type containing n1. Values is used later, when the program actually runs.",
    "",
    "Thus Type[Context] means simply: a type expression whose names and dependencies can be checked using the information currently available.",
    "",
    "Their binding grammar and lookup rule are:",
    "",
    "~~~",
    "Names ::= empty | Names / Frame",
    "Frame ::= finite map from source names to binding identities",
    "Context ::= empty | Context, Binding",
    "",
    "resolve(name, Names, Definitions):",
    "    search lexical frames from innermost to outermost",
    "    otherwise search global declarations",
    "    otherwise report an unbound name",
    "",
