   "id": "build-plan",
   "title": "Build plan",
   "group": "Plan",
   "body": [
    "# Build plan",
    "",
    "How the code gets from what is built (Language, as built) to the core language of Target language: 41 commits in seven lanes, each with its tests and the condition under which it is done. Each commit is a task in the Core build project, where its status is tracked; this document holds the order, the reasons, and the exit criteria for the whole. It is a plan and changes as commits land and teach us things.",
    "",
    "## What done means",
    "",
    "The body of work is finished when all of these hold, each as a test or a command and not as a judgement.",
    "",
    "- **The target examples run.** The 32-bit lock, the midpoint, and the protected type from Target examples check, run in both interpreters, compile under rustc with warnings denied, and the three agree on every listed input, panics included. Percent uses an enum of its own in place of Option.",
    "- **The proofs are the ones predicted.** check --stats classifies the obligations of those files as exact, computed, or arithmetic, and the counts match Target examples (three, four, seven) or the difference is recorded there as a finding.",
    "- **A Rust caller is held at the boundary.** A hand-written Rust crate compiled against the generated module can call what is plain pub and nothing that takes evidence, cannot name a marker constructor, cannot build a protected struct, and the marker replay attack fails to compile. rustc gives the verdict in each case. A protected value that a Rust caller still holds after catching a panic satisfies its invariant (LOC-191).",
    "- **An author is told why.** Removing a hypothesis from each target example gives a diagnostic with the obligation, the claim after computing, the facts considered, and a counterexample where the arithmetic procedure finds one. Every error code has a rejected file and a golden rendering.",
    "- **A crate can be checked by the kernel alone.** With its stored proofs, locus check --locked runs no search, and proofs written by a weaker search still check.",
    "- **Checking is deterministic.** Checking a file twice, on any machine, gives byte-identical proofs, diagnostics, and Rust. No hole is filled by search that bridges claims, and every limit in the checker is a count of work and never a clock.",
    "- **Locus is never more permissive than rustc.** Every accepted corpus program compiles without warnings. Every program rejected for a move or an aliasing error in a runtime use is also rejected by rustc when printed without that check.",
    "- **What is checked is what runs.** Under the extended suite the random program generator agrees three ways (check-IR interpreter, erased interpreter, compiled Rust) on at least 10,000 programs covering arithmetic in both overflow configurations, panics, mutation, bounded loops, and &mut calls, with no more than a handful inconclusive.",
    "- **The trusted base is written down and tested as such.** Every kernel axiom and rule is named in the Kernel contract (a test compares them), has a test that uses it and a near miss that is rejected, and the machine models and the operator table agree with Rust exhaustively at 8 bits and at the boundaries above. Each untrusted part (the solver, the arithmetic procedure, the flow analysis) has a test in which its wrong answer, a fabricated constraint included, is rejected by the trusted part behind it. No proof is accepted for a claim known to be false.",
    "- **The parser is robust, and total for stated reasons.** The fuzz tests pass at a hundred times their default counts, which shows robustness on what was tried. Totality rests on two guarantees stated in Architecture and tested on their own: every loop in the parser consumes a token or stops, and recursion is bounded.",
    "- **The legacy is gone.** No math fn, no [P] or @[P], no state-passing loop or bounded for, no u8 model over Nat, no proof by 256 cases. Language, as built is rewritten from the code.",
    "- **The suites are usable.** tools/check.sh, the fast suite with fixed seeds, passes in under two minutes and gates every commit. tools/check.sh --extended passes before a milestone is declared.",
    "",
    "## Milestones",
    "",
    "| Milestone | Reached at | What a user can do |",
    "|---|---|---|",
    "| 1. The new surface | S5 (LOC-158), E1 (LOC-167) | Write the target syntax for everything the language already does, with evidence that matches exactly |",
    "| 2. Arithmetic | E7 (LOC-173) | Write 32-bit programs whose overflow is shown impossible: midpoint, step, remaining |",
    "| 3. Mutation | M4 (LOC-180) | Write let mut and Rust loops that carry evidence: the whole lock file |",
    "| 4. The boundary | O4 (LOC-185) | Ship a protected type to a Rust caller: Percent |",
    "| 5. Acceptance | R4 (LOC-189) | Everything under What done means |",
    "",
    "## Order and what can run in parallel",
    "",
    "A commit can start when the commits it depends on have landed. Grouping by that rule gives the waves below, which are computed from the tasks. Within a wave the commits are independent of one another.",
    "",
    "| Wave | Harness and robustness | Syntax | Kernel | Elaborator | Mutation | Ownership |",
    "|---|---|---|---|---|---|---|",
    "| 1 | H1, H2, H3 |  | K1 |  | M0 |  |",
    "| 2 | R1, R2, R3 | S1 | K2 | E4 |  |  |",
    "| 3 |  | S2 | K3, K6 |  | M1 |  |",
    "| 4 |  | S3 | K4 | E1 |  |  |",
    "| 5 |  | S4 | K5, K7, K8 | E5 |  |  |",
    "| 6 |  | S5 |  | E2, E9 |  |  |",
    "| 7 |  |  |  | E3, E6, E8, E10 | M2 | O2 |",
    "| 8 |  |  |  | E7 | M3 | O1 |",
    "| 9 |  |  |  | E11 | M4, M5 |  |",
    "| 10 |  |  |  |  |  | O3 |",
    "| 11 |  |  |  |  |  | O4 |",
    "| 12 | R4 |  |  |  |  |  |",
    "",
    "- **The longest chain** runs through the syntax lane into mutation and ownership; python3 tools/atlas.py plan prints it. The syntax lane has one owner, so it starts first and nothing should interrupt it.",
    "- **The kernel lane is independent** of every other lane until E5. It can run from the first day beside syntax, and it is the second longest chain (K1 to K5, E6, E7).",
    "- **M0 is paper** and starts on the first day, so that the gate is open by the time S5 and E4 land.",
    "- **Three lanes at a time is the useful width**: syntax, kernel, and one of harness or elaborator. After wave 6 the lanes are elaborator, mutation, and ownership.",
    "- **E9, K8, R2, and R3 are fillers**: small, off the long chains, good for an idle lane.",
    "",
    "### Who owns which files",
    "",
    "Parallel work collides in files, not in ideas. Each lane owns directories, and the shared files are named so that a commit touching one lands quickly.",
    "",
    "| Lane | Owns | Shares |",
    "|---|---|---|",
    "| Syntax | src/lexer.rs, src/parser.rs, src/ast.rs, tests/frontend.rs | none after S5 |",
    "| Kernel | src/kernel, tests/kernel_*.rs, the Kernel contract | none |",
    "| Elaborator | src/elab, tests/elaborate.rs | src/typed/tree.rs with Mutation |",
    "| Mutation | src/exec, src/typed/lower.rs, src/erased | src/typed/tree.rs, src/elab for M2 to M5 |",
    "| Ownership | the move and borrow passes (new files under src/elab), the build command, the Rust caller tests | src/erased/rust.rs with Mutation |",
    "| Harness and robustness | tests/common, tests/corpus, tools | none |",
    "",
    "There are no feature branches. Parallel work happens in separate working copies, and each commit is rebased onto main and lands only when tools/check.sh passes on top of main. Commits stay small so that a rebase is cheap.",
    "",
    "## Rules for every commit",
    "",
    "- tools/check.sh passes: fmt, clippy with warnings denied, and the fast tests with fixed seeds, offline. The extended suite runs before a milestone is declared.",
    "- Nothing in the checker depends on a clock. Limits are counts of work, so that a file accepted on one machine is accepted on every machine. Timeouts exist only in the test harness, where firing means inconclusive.",
    "- New behaviour arrives with accepted and rejected corpus files. A rejected file pins the error code and the line.",
    "- A commit that changes the kernel, the check-IR checker, lower, or erase updates the Kernel contract or Architecture in the same commit, and says in its message what was added to the trusted base.",
    "- The atlas moves in the same commit: the task to done, the tasks it covers, and the Language status rows.",
    "- Old spellings leave with a migration diagnostic that carries a fix, and the fix is tested by applying it.",
    "- A commit that makes a lane wait (a shared file) says so in its task and lands within the day.",
    "- Anything learned that contradicts Target language is recorded there or as an open decision before the commit lands, not worked around in code.",
    "",
    "## Kinds of test, and what each is for",
    "",
    "| Kind | Guards against | Introduced |",
    "|---|---|---|",
    "| Corpus files, accepted and rejected | A feature that works in one stage of the pipeline and not the next | H1 |",
    "| Differential: two interpreters | lower and erase disagreeing about a program | exists, extended by R1 |",
    "| Compiled Rust against the interpreter, with overflow checks on and off | The printer, and Locus meaning something Rust does not in either build | exists, generalized by H1, E4, E6 |",
    "| rustc as the oracle for rejections | Locus accepting what rustc refuses, in moves, borrows, and visibility | O1, O2, O3 |",
    "| Exhaustive at 8 bits, boundaries and random above | A wrong machine model or operator table, which would be trusted and wrong | K4, K5 |",
    "| Axiom near misses | An axiom stated more strongly than intended | K2 |",
    "| Certificates and proofs against claims known to be false; fabricated constraints | A kernel that accepts too much | K6, R2 |",
    "| Wrong answers from untrusted parts | Trust creeping into the solver, the procedure, or the flow analysis | K7, M4 |",
    "| Random programs, three ways | Everything the hand-written tests did not think of | R1 |",
    "| Parser fuzz; separate tests of progress and depth | Panics and overflows on hostile input; the fuzz shows robustness, the other two are what totality rests on | H2 |",
    "| Golden diagnostics and generated Rust | Messages and output changing by accident | R3 |",
    "| Contract against code | An axiom that is in the kernel and not in the contract | K2 |",
    "",
    "## The lanes",
    "",
    "- **Harness.** Before anything else, make adding a test cost one file.",
    "- **Syntax.** The parser is finished first and for everything, including what the elaborator will not accept for months. Constructs that are parsed and not yet checked answer with one uniform diagnostic. This takes parser.rs off the path of every other lane.",
    "- **Kernel.** Int and the machine integers, independent of the surface language until E5. Every commit here adds to the trusted base and updates the Kernel contract. The certificate rule of K6 has its whole boundary written, with one complete certificate, before any code.",
    "- **Elaborator.** Semantics that need no mutation: exact evidence, promises, integers, operators, arithmetic in holes, logic-only types. Where a construct needs new checked semantics (operators that may panic, the forms that panic), the check IR and its checker change first and are tested on IR built by hand, and the surface follows.",
    "- **Mutation.** Gated by the design in M0. The check IR changes first, then the surface reaches it.",
    "- **Ownership.** Moves, the export boundary, and references as parameters. O2 depends on little and can land early.",
    "- **Robustness.** Standing tests that grow with the language, and the acceptance commit.",
    "",
    "## The commits",
    "",
    "One task each, in the Core build project, where the scope, the tests, and the condition for done are written. This list and the table of waves are written by python3 tools/atlas.py plan from the tasks, which are the only record of the order.",
    "",
    "### Harness",
    "",
    "- **H1** LOC-151. A corpus runner: every .lc file is checked, run in both interpreters, compiled, and compared. After: nothing.",
    "- **H2** LOC-152. A seeded generator with no dependencies, parser fuzz tests, and tools/check.sh in a fast and an extended form. After: nothing.",
    "- **H3** LOC-153. Split src/elab/exprs.rs by construct, with no change in behaviour. After: nothing.",
    "",
    "### Syntax",
    "",
    "- **S1** LOC-154. The lexer tokenizes as Rust: every keyword reserved, string literals, integer literals in full. After: H2.",
    "- **S2** LOC-155. Built-in forms and the formula grammar: prop!, prove!, @P, forall and exists, rewrite!, unfold!, fold!. After: S1.",
    "- **S3** LOC-156. Rust's operator precedence exactly, with as, unary minus, and + - * / % parsed. After: S2.",
    "- **S4** LOC-157. Items: the closed attribute set, pub and its restricted forms, impl blocks, variants with named fields, long paths, const. After: S3.",
    "- **S5** LOC-158. Statements and expressions: let mut, assignment, return, Rust's loop forms, references, the never type. After: S4.",
    "",
    "### Kernel",
    "",
    "- **K1** LOC-159. Integers of any size in the kernel: subtraction, multiplication, division, comparison, sign. After: nothing.",
    "- **K2** LOC-160. Int as a kernel type: literals, the ring and order axioms, discreteness, closed evaluation. After: K1.",
    "- **K3** LOC-161. Int division and remainder: truncating, total, with x / 0 == 0. After: K2.",
    "- **K4** LOC-162. A model for each machine integer type, from one table. After: K3.",
    "- **K5** LOC-163. The table of primitive operations: result type, panic condition, logical meaning. After: K4.",
    "- **K6** LOC-164. A kernel rule that checks a linear arithmetic certificate, with its whole boundary written first. After: K2.",
    "- **K7** LOC-165. The arithmetic procedure: finds certificates for linear goals, machine ranges, and division by a literal. After: K4, K6.",
    "- **K8** LOC-166. Lemmas about Int and the machine types, callable by name. After: K4.",
    "",
    "### Elaborator",
    "",
    "- **E1** LOC-167. Evidence must match exactly after computing; dependent patterns open over their own names. After: S2, H3.",
    "- **E2** LOC-168. Promises: terminates, no_panic, no_alloc, no_io, checked and never inferred. After: S4.",
    "- **E3** LOC-169. Remove math fn. After: E2.",
    "- **E4** LOC-170. A panic is a third outcome: the interpreters, the erased tree, and the harness. After: H1.",
    "- **E5** LOC-171. Every machine integer type, literal typing, as, Int, and comparison within one type. After: K4, S3.",
    "- **E6** LOC-172. The operators + - * / % with their panic conditions and what the logic learns. After: K5, E2, E4, E5, M0.",
    "- **E7** LOC-173. Arithmetic in holes and prove!. After: K7, E1, E6.",
    "- **E8** LOC-174. Logic-only types and the one erasure rule: Ghost\u003cT>, snapshot!, erased positions. After: E5, E2.",
    "- **E9** LOC-175. Variants with named fields, const as a Rust const, separate type and value namespaces. After: S4.",
    "- **E10** LOC-190. The forms that panic: panic!, assert!, unreachable!, todo!, debug_assert!. After: M1, E2, S2.",
    "- **E11** LOC-192. Found proofs are stored beside the source, and locus check --locked never searches. After: E7.",
    "",
    "### Mutation",
    "",
    "- **M0** LOC-176. Write the design of the checked IR for mutation, early exit, panics, and operations that may panic. After: nothing.",
    "- **M1** LOC-177. The check IR gains return and panic as ways a block ends. After: M0, E4.",
    "- **M2** LOC-178. let mut and assignment, lowered to versions. After: M1, S5.",
    "- **M3** LOC-179. Rust's loops over let mut; the state-passing loop and the bounded for are removed. After: M2.",
    "- **M4** LOC-180. Tracked evidence: let mut evidence, invalidated by assignment, refreshed explicitly. After: M3, E1.",
    "- **M5** LOC-181. return and the never type in the surface language. After: M3.",
    "",
    "### Ownership",
    "",
    "- **O1** LOC-182. Moves, and derive with a closed list. After: M2, S4.",
    "- **O2** LOC-183. Visibility, the export boundary, and locus build. After: S4, E2.",
    "- **O3** LOC-184. References as parameters: &T and &mut T, path arguments, disjointness, old!. After: O1, M4.",
    "- **O4** LOC-185. Inherent impl blocks and self; the protected type end to end. After: O2, O3.",
    "",
    "### Robustness",
    "",
    "- **R1** LOC-186. A generator of random well-typed programs, compared three ways. After: H1, H2.",
    "- **R2** LOC-187. Kernel soundness under mutation: no proof is accepted for a claim known to be false. After: H1.",
    "- **R3** LOC-188. Golden diagnostics, and a test that every error code is exercised. After: H1.",
    "- **R4** LOC-189. Acceptance: the target examples run, the legacy is gone, and Now is rewritten. After: E11, E3, E7, E8, E9, E10, M5, O4, K8, R1, R2, R3.",
    "",
    "## Decisions",
    "",
    "Decided on 21 September, and recorded in Target language: the order of this plan (LOC-136); one kernel rule that checks linear certificates (K6); Seq\u003cT> leaves the core; Percent uses an enum of its own until Option exists; a function that invalidates evidence behind a &mut parameter must promise no_panic (LOC-191).",
    "",
    "Still needed:",
    "",
    "- **What locus build emits** (LOC-135), before O2.",
    "- **The design of M0** (LOC-129), before M1 and, for its seventh case, before E6. Until it is agreed, the mutation lane does not start.",
    "- **The contract of the arithmetic certificate**, written into the Kernel contract with one complete certificate, before K6 is coded.",
    "- Not blocking: a finite loop that may promise to terminate (LOC-144), a lighter spelling for promises (LOC-143) and for a proposition value (LOC-115). Each is a small change after the core if decided later.",
    "",
    "## Left out of the core on purpose",
    "",
    "Recursion and decreases, shared references with lifetimes, generics and traits, Seq, Map, and Set, usize and slices, bit operators and shifts, match parity, floats, modules across files and packages, the header and implementation split, and the polish list. Each has its project in the Plan."
   ],
   "created": "2026-09-21T22:14:21.000Z",
   "updated": "2026-09-21T23:13:41.000Z"

  {
   "id": "design-brief",
   "title": "The earlier design brief",
   "group": "Archive",
   "body": [
    "# The earlier design brief",
    "",
    "This is the brief the project started from, moved here from the README. Parts of it are superseded: its milestone list by [roadmap.md](roadmap.md), its account of state, mutation, and loops by the target language, and the ghost binder keyword by the target language.",
    "",
    "**The programming model.** Propositions are native logical claims, potentially non-executable, rather than runtime booleans. They compose through equality, logical connectives, quantification, and named predicates. A proof establishes a particular proposition about particular values. A theorem is a function producing such proofs for arbitrary permitted inputs. `fn` declares executable functions accepting and returning runtime data and erased proofs, including combinations; it may diverge. `math fn` declares a function in the mathematical sense: pure and total, with one well-defined result for every input. A `math fn` is written once and used in both worlds: it is callable from logic because it is total, and it is compiled and callable at runtime whenever its signature contains executable data. Lemmas are math functions returning proofs; predicates are math functions returning `Prop`. Users can also declare their own propositions: a `prop` declaration lists every way a claim can be proved, as an `enum` lists every way a value can be built, and `match` on such a proof is case analysis. Propositions, proofs, and existential witnesses are *ghost* bindings: they exist for the checker, may appear anywhere in logic, and may never determine executable data or control flow. Under that rule proposition values may appear in `fn` signatures and struct fields; they are simply erased. Runtime structs and enums can combine data and proof fields, and a later field may mention an earlier one only inside a proposition, so runtime layout never depends on a value. Mathematical `Nat` and `Int` remain distinct from machine integers. Richer mathematical objects belong in libraries.",
    "",
    "**Erasure and control flow.** Proofs are checked at compile time, including proofs about unknown runtime inputs. Proposition values, proof values, and logical computation are erased; surrounding data computation still executes. Proofs can establish further facts and discharge preconditions, but cannot be printed, inspected, or used as runtime branch discriminants. Runtime decisions and enum tags can carry erased evidence; `if` is a `match` on `bool`, and every `match` arm receives checked evidence about the value it matched. `Unknown` or an absent proof establishes neither a claim nor its negation. Checked comparisons supply facts within their respective branches. Ordinary operations retain checked fallbacks when proofs are unavailable.",
    "",
    "**State and functions.** Proofs refer to immutable logical snapshots, tracked through SSA-style state versions, not borrows that freeze data or runtime copies. Mutation leaves old proofs true about old states; it does not retarget them. `before(x)` and `after(x)` describe invocation entry and normal return. Heap aliases must participate in state tracking. Loop invariants are ordinary proof components of explicit loop state, supplied on entry and on every back edge. Termination of executable loops is not tracked: an `fn` is checked for partial correctness, and a proof it returns is available only in the code reached after it returns. Totality of math code is guaranteed syntactically instead of by measures: math code has no general loops and, in the core, no recursion; bounded iteration is allowed, and structural recursion arrives with recursive data. There is no `decreases` clause. Functions used directly in propositions must be math functions; effectful calls are described through results and state transitions. Purely logical computation is erased and cannot supply runtime data or branch discriminants; the ghost flow check enforces that boundary. Runtime inputs may occur symbolically in logical definitions. Contracts remain optional surface conveniences.",
    "",
    "**Proposition and proof syntax.** `Prop` is the type of logical claims. A proposition literal must use brackets: `let claim: Prop = [n > 0];`. An annotation alone does not convert a Boolean into a proposition. Existing propositions compose directly using `!p`, `p && q`, `p || q`, and `p => q`; these operations construct claims, not evidence. In the core, which has no arrays, a bracketed expression is always a proposition literal, with or without an expected type. The implemented parser still keeps `[e]` neutral and preserves array forms; how brackets are shared with arrays later is an open question. Two spellings remain under review because they collide with Rust syntax, the bracket literal and `=>`; the specification records them as open questions.",
    "",
    "`@claim` or `@[condition]` denotes a proof type. Proofs are ordinary expressions: names, proof constructors such as `Or::Left(h)`, `match`, lemma calls, and applications of quantified proofs such as `all(n)`. The intended style is declarative: a sequence of `let` bindings that state intermediate facts, each justified by a lemma call or a hole. There is no tactic language; the earlier `@{ ... }` proof block is retired. `_` in an expression requests a checked proof of the expected proposition, found by a fixed, bounded search. An unsolved goal or missing expected proposition is an error. `_` in a pattern still ignores a value. The proof marker is not used alone, and `#[...]` remains reserved for attributes. Named result fields let proofs describe returned data:",
    "",
    "```rust",
    "fn increment(n: u8) -> (out: u8, @[out == n.wrapping_add(1)]) {",
    "    let out = n.wrapping_add(1);",
    "    (out, _)",
    "}",
    "```",
    "",
    "**Implementation direction.** Use a handwritten Rust lexer and recursive-descent/Pratt parser, with a reusable diagnostic renderer. Locus has its own proof kernel, written in Rust and kept small. The elaborator, the hole solver, decision procedures, and any external tool or model that proposes proofs are untrusted: each must produce an explicit term, and only the kernel's acceptance counts. An SMT solver is not the foundation. The logic is classical higher-order logic with declared data and declared propositions; since proofs are erased and can only produce other proofs, classical reasoning cannot affect execution. The planned soundness argument is a denotational model in the style of explicit refinement types (Ghalayini and Krishnaswami, ICFP 2023): every type erases to a simple type, and a proposition denotes a truth value. Locus keeps a logical value and its runtime representation apart: ghost data such as a `Prop` field is part of the logical value though absent at runtime, while proof contents are irrelevant to both. For a type with no ghost data, such as a nonzero byte, this reduces to a subset of the erased type. The model stays tractable because values appear in types only inside propositions. Equality is available at every data type, including function types, with reflexivity, transport, and computation; function and proposition extensionality are withheld. Excluded middle is one named lemma whose uses are recorded. Exporting accepted terms to an independent checker tests the implementation without replacing that argument. The kernel compares terms only up to renaming and proof irrelevance and contains no normalizer: computation steps are explicit equality axioms, inserted silently by the elaborator for lets, projections, matches on known constructors, and literal arithmetic, and only on request for function definitions. Checking is therefore syntax-directed and predictable. Machine integers are native to the kernel and modelled as bounded natural numbers, so their ordering lemmas are proved, not assumed; the kernel can also establish closed facts by evaluation. A kernel-internal `Nat` with a recursor underlies that model and bounded iteration, and later becomes the source-level `Nat`. Begin with limited, predictable automation: a hole searches facts in scope, propositional structure, equalities with congruence, definition unfolding, and closed evaluation, and nothing else; arithmetic steps are explicit lemma calls, and every search limit counts steps, never time. Found proofs are recorded so that rechecking never repeats a search. Initially, only proof types depend on runtime values, keeping data layouts straightforward. Erasure is a compositional function on types and terms. Emit Rust after erasure and build through Cargo. Lowering and imported behavioral specifications are explicit trust boundaries. Rust exports must preserve proof preconditions through checked wrappers or protected validated types.",
    "",
    "**Proposed milestones, in dependency order:**",
    "",
    "0. **Core:** `u8` with explicit wrapping operations, `bool`, unit, tuples, named structs, nonrecursive enums and `match`, immutable bindings, blocks, nonrecursive `fn`/`math fn` declarations, `if`, state-passing loops in `fn`, bounded iteration, proposition values, `prop` declarations, dependent proof results; the proof kernel, checker, and interpreter.",
    "1. **Native execution:** Rust generation and proof erasure; compare compiled and interpreted behavior.",
    "2. **Mathematical integers and machine arithmetic:** `Int` and `Nat`, further machine widths, arithmetic operators whose overflow is a proof obligation, conversions, and a linear-arithmetic procedure; verify byte packing.",
    "3. **Generics:** type and proposition parameters; `Option`, `Result`, and positive, negative, or unknown evidence; logic-only lambdas.",
    "4. **Recursion:** recursive enums and `prop` declarations, structural recursion, and induction as recursive lemmas, with `Box` transparent to the logic; prove list append's length property.",
    "5. **Proof tooling:** modules, cached checking, recorded proofs, hole expansion, opaque theorem interfaces, goal diagnostics, and rewrite and chain forms.",
    "6. **Specification conveniences:** the `ghost` binder keyword and model fields; `requires`/`ensures`/`invariant`/`assert` as sugar over proof parameters and results.",
    "7. **Local mutation:** assignment, snapshots, and branch joins; verify swap and reject stale-state evidence.",
    "8. **Loops over mutable state:** `while` and `for` elaborating to state-passing loops, labels, and optional termination measures; verify an iterative algorithm.",
    "9. **Ownership:** moves, shared/exclusive borrows, fixed arrays, and proof-assisted access; track referenced storage.",
    "10. **Collections:** modeled slices, `Box`, and `Vec`; prove in-place sorting preserves elements and produces order.",
    "11. **Rust boundaries:** marked trusted declarations, concrete adapters, effects, panics, safe exports; ship a verified codec crate.",
    "12. **Broader integration:** traits, associated types, ordering laws, and cross-package proof metadata; verify a generic algorithm.",
    "",
    "Runtime closures, custom destructors, interior mutability, raw pointers, concurrency, and async follow once this foundation works. Each milestone should deliver a useful example and measure checking cost, proof burden, and generated-code behavior.",
    ""
   ],

   "description": "The sequence of commits that takes the code from what is built to the core language of Target language. One task per commit, each with its tests and exit criterion. The overview, the order, and the exit criteria for the whole are in the Build plan document. The feature tasks under Core Language, Kernel arithmetic, and Macros and built-in forms stay as the checklist; a commit names the ones it covers and closes them when it lands."

  {
   "id": "p2",
   "name": "Core Language",
   "status": "planned",
   "description": "The first stage of implementation, not a part of the vision: the boundary between the core and the rest is temporary and disappears as more is built.\n\nLogic-only types, grouped under logic. These are Prop, proof types, Int and Seq\u003cT>, with Map and Set later. They have no runtime form, now or ever.\n\nGhost\u003cT>, built by snapshot(e). It gives up the runtime form of any other type. Inside a proposition it reads as the T.\n\nOne rule. A binding or field is erased exactly when its type has no runtime form. There is no binder keyword.\n\nConversions into the logic. as Int, and a view from Vec to Seq.\n\nRuntime big numbers and similar types are library types with a logic-only model.\n\nModel functions and model fields need no feature of their own.",
   "created": "2026-09-21T19:19:39.000Z",
   "updated": "2026-09-21T21:22:55.000Z"
  },
  {
   "id": "p229",
   "name": "Kernel arithmetic",
   "status": "planned",
   "created": "2026-09-21T20:49:51.000Z",
   "updated": "2026-09-21T20:49:51.000Z",
   "description": "What Target language: Integers, in code and in propositions of the notes asks of the kernel. The core batch cannot have i32, u32, or the arithmetic operators without it: the kernel today has Nat with addition and a model of u8 only."
  },
  {
   "id": "p173",
   "name": "Macros and built-in forms",
   "status": "planned",
   "description": "Locus has no user-defined macros, and a closed set of forms the compiler handles itself, spelled with ! as Rust spells a macro call (Target language: Built-in forms). Nothing is expanded; the mark says that this is not an ordinary call.\n\nThe rule: a step is a library function when its type can be written, and a form when the compiler has to look at syntax to know the type.\n\nThree groups of work: the machinery (parsing name!(...) for the closed list, diagnostics for anything else); the proof forms (prove!, and the respelling of rewrite, unfold, fold, recurse, old, snapshot); and the forms that mean what they mean in Rust (assert!, unreachable!, todo!, panic!, debug_assert!, matches!, vec!, derive). _ stays the request for evidence and is not part of this.\n\nLater questions: hints for prove!, user-defined macros (not planned), and which forms become library functions once generics and logic-only lambdas exist.",

   "id": "t207",
   "n": 113,
   "title": "Decide what the integer operators mean to the logic",
   "status": "done",
   "priority": 3,
   "project": "p89",
   "notes": "Decided 21 September: Target language: Integers, in code and in propositions. The test is Target language: Functions in propositions applied to operators: x + 1 on a machine integer may panic, so it is not valid in a proposition; x as Int + 1 and x.wrapping_add(1) are.\n\nTarget language. Overflow panics in one build and wraps in another, so without no_panic the only fact true in every build is that the result, if there is one, is the wrapped value. / and % truncate toward zero and panic on a zero divisor; a shift overflows at the bit width; as truncates.\n\nProposal (21 September), not yet accepted:\n\n1. In code an operator means what it means in Rust, and is printed as written.\n2. To the logic, the result of a + b is the sum of the two values as Int, wrapped into the type. Under no_panic there is also an obligation that the sum is in range, after which the wrap is the identity and the result is the exact sum. Without no_panic there is no obligation and only the wrapped value is known, since that is the one fact true in every build.\n3. Inside a proposition, arithmetic is over Int: a machine integer is read as its Int value, so a specification cannot overflow. Code and specification agree exactly when nothing overflows, which is what no_panic establishes. To speak of wrapping in a proposition, write wrapping_add.\n4. An operation that panics in every build teaches its condition to what follows: after a / b, the divisor is known not to be zero, as after assert!(c), c is known. An operation that panics only in some builds teaches nothing.\n5. / and % on Int truncate toward zero, as in Rust, so that code and specification agree. Int division by zero is given the value 0 in the logic, where it must be total; code under no_panic can never reach it.\n6. as between integer types is the same wrap and is never an obligation. as Int is exact.\n7. The reference interpreter panics on overflow, which is the stricter of Rust's two behaviors.\n8. Kernel work this implies: Int as an ordered ring; for each machine type a view to Int and a wrap from Int, generalizing the present u8 model; the evaluator; and an arithmetic procedure that is linear, treats multiplication by a literal as linear, and leaves other products to lemmas.",
   "created": "2026-09-21T20:29:22.000Z",
   "updated": "2026-09-21T20:49:51.000Z"
  },

   "id": "t208",

   "notes": "Done 21 September as M0 of the Build plan, after one review. Target language: How mutation is checked.\n\nThis is commit M0 (LOC-176) of the Build plan.\n\nA gate: mutation is not implemented until this is written (21 September, after review). The design must state, for each case below, the versions, the facts available at each point, and the types of results, and not only whether the program is accepted:\n1. One branch refreshes tracked evidence; the other returns early.\n2. A loop with several continue and break paths.\n3. Snapshot evidence survives an assignment, while tracked evidence needs a refresh.\n4. A proposition value captures an old value, and then becomes the type of tracked evidence.\n5. A value is moved and initialized again, with evidence about its earlier state in scope.\n6. A call changes two disjoint fields and returns evidence about both.\n\nDirection decided 21 September (Target language: How mutation is checked): versions, in lowering, watched by comparing the two interpreters. The design itself is still to be written.\n\nRaised in the last review before the core. Today lowering is small because the language is pure. With let mut, assignment, loops over mutable state, return, moves, and panics, either lowering does a large translation into versions and state passing, all of it trusted, or the check IR gains mutable variables and the checker grows instead. The rules the target language leaves \"to be written with mut\" belong to the same design and are one flow analysis: validity of tracked evidence, what is known after a join, what a loop forgets, initialization and moves, and early return. Write this as a design before implementing any part of it.",

   "project": "p89",
   "notes": "Decided 21 September: no. A declared proposition keeps a keyword of its own; keywords are acceptable. The proposal below is kept for the record.\n\nProposal, 21 September. A proposition is an enum whose values are its proofs, which is how it was first explained, so write it as one:\n\n    #[prop(n: u32)]\n    enum Small {\n        #[proves(Small(0))]\n        Zero,\n        Below { bound: @(n \u003c 10) },\n    }\n\nThe parameters go in the attribute; a variant that proves the proposition at particular arguments says so with #[proves(...)], and one without it proves it at the parameters; fields with names use Rust's struct-like variants. Everything but the @ types is Rust syntax. Use is unchanged: @Small(n), Small::Zero, match on evidence. It is erased whole. Observation: until recursion arrives, a declared proposition adds names and not power, since without recursion it can be written with ||, &&, and exists; what it is really for is inductive predicates.",

   "notes": "Decided 21 September: Rust's restricted visibility, with one checked rule. Target language: What is generated.\n\nTarget language: What is generated. Rust's pub(crate) would let hand-written Rust in the same crate call it, so it does not serve. Either the signature decides (a pub function that takes evidence is emitted visible to generated modules only), or there is an explicit spelling.\n\nProposal (21 September): no new syntax. Rust already has restricted visibility: pub(super), pub(in path), pub(crate). One checked rule does the work: a function that takes evidence may be visible no further than the root of the generated modules. Plain pub on such a function is an error that says so and offers the two ways out, a narrower visibility or a validated type. In a crate that mixes Locus and hand-written Rust the programmer writes pub(in crate::verified), or pub(super) when the modules are siblings under a generated root; in a crate that is all Locus, pub(crate) is already right. Every spelling means what it means in Rust. Not covered: one Locus crate calling evidence-taking functions of another. Rust has no visibility meaning \"generated code in other crates\", so that would rest on a hidden name and a convention, as serde's __private does, and on locus audit. Alternatives considered: inferring it from the signature (implicit, and a small change to a signature would silently change what is exported); an #[export] attribute with pub meaning less than it does in Rust; and pub(locus), which is not Rust syntax.",

   "notes": "Landed 21 September as tests/corpus.rs. Directives: //~ proofs: N, //~ run: f(args) => value (or => panic, refused until E4), //~ rust: text, //~ error: L0204 [message] with ^ for the line above. The corpus is examples/, tests/corpus/accept, and tests/corpus/reject; one rustc call; all failures listed. Found on the way: a name that is a Rust keyword and not a Locus one, such as move, is accepted and printed unescaped, and rustc rejects the output; S1 closes this by reserving every Rust keyword.\n\nLane: Harness. Wave 1.\nDepends on: nothing.\nUnblocks: E4 (LOC-170), R1 (LOC-186), R2 (LOC-187), R3 (LOC-188).\nCovers: LOC-7.\n\nScope. tests/corpus/accept and tests/corpus/reject hold .lc files whose expectations are written in comments: the number of proofs, run lines such as f(1, 2) => 3 or f(255) => panic, substrings the generated Rust must contain, and for rejected files the code of the error on the line where it is expected. One runner does for each accepted file what cli.rs and rust_output.rs do by hand today: check, run every run line in the check-IR interpreter and the erased interpreter, print Rust, compile all files in one rustc call with -D warnings, run, compare. The five examples move under it.\n\nTests.\n- The five examples pass through the runner.\n- The runner is tested on itself: a wrong expected value, a missing error, and an error on the wrong line each make it report a failure.\n- All failures in a run are reported, not the first.\n\nDone when. From here on a feature is tested by adding files. The whole suite stays under a minute because rustc runs once.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "notes": "Landed 21 September. tests/common/rng.rs (xorshift64*, included with #[path]), tests/parser_fuzz.rs, Parsed::stats with a step counter, tools/check.sh and --extended. Fast: 50,000 sequences and 5,000 edited files in about 6 s; extended: 5,000,000 and 500,000 in about 45 s in release. Steps are at most 4 times the tokens; the most seen is 2.99. The fuzzing found no panic; it did find that the for header lookahead rescanned to the end of the file, quadratic on hostile input, now a delimiter table built once. The nesting test passes on a 640 KB stack and fails at 512 KB, so the margin on 1 MB is under two; the syntax lane must keep frames between depth guards small.\n\nLane: Harness. Wave 1.\nDepends on: nothing.\nUnblocks: S1 (LOC-154), R1 (LOC-186).\n\nScope. A small xorshift generator in tests/common, since the build is offline and has one dependency. The parser is run on random sequences drawn from the token vocabulary and on the example files with random edits (delete, duplicate, swap a token). tools/check.sh runs fmt, clippy, and the tests with fixed seeds and small counts, and is what every commit must pass. tools/check.sh --extended sets LOCUS_EXTENDED, under which the fuzz counts are a hundred times larger and the random program comparison compiles thousands of programs; it runs before a milestone is declared, not on every commit.\n\nTests.\n- Fast: 50,000 token sequences and 5,000 edited files with a fixed seed: the parser returns an AST or at least one diagnostic, without a panic, on a 1 MB stack.\n- A failure prints its seed.\n- Separately from the fuzzing, the two guarantees that make the parser total are stated in Architecture and each has its own test: every loop consumes a token or stops (a test counts parser steps against the number of tokens), and recursion is bounded by MAX_DEPTH (the existing nesting test, extended to each new form).\n\nDone when. The fuzz tests show robustness on what they tried and claim no more. Totality rests on the    "notes": "Landed 21 September. kernel::Natural gains checked_sub, mul, div_rem, Ord, parsing; kernel::Integer is a sign and a magnitude with a canonical zero, truncating div and rem, a / 0 == 0 and a % 0 == a. Schoolbook algorithms, base 2^32 limbs. tests/kernel_integers.rs: boundary sets crossed for every operation, 100,000 random pairs per operation against i128 and u128, identities to about 768 bits.\n\nLane: Kernel. Wave 1.\nDepends on: nothing.\nUnblocks: K2 (LOC-160).\nCovers: LOC-118.\n\nScope. kernel::nat already holds naturals of any size with addition. Add subtraction, multiplication, division with remainder, and comparison, and an Int value as a sign and a magnitude. Values only; no terms or axioms yet.\n\nTests.\n- Against i128 on a boundary set and 100,000 random pairs, for every operation.\n- Beyond i128, identities: (a * b) / b == a, (a + b) - b == a, a == (a / b) * b + a % b.\n\nDone when. The arithmetic the evaluator will trust is tested on its own, before any rule depends on it.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t276",
   "n": 160,
   "title": "K2 · Int as a kernel type: literals, the ring and order axioms, discreteness, closed evaluation",
   "status": "done",
   "priority": 3,
   "project": "p266",
   "notes": "Landed 21 September. Type::Int (ghost, as Nat), literals of any size, int_add, int_sub, int_mul, int_neg, and one primitive order int_le; a \u003c b is the term a + 1 \u003c= b. Sixteen axioms, each named in the Kernel contract; int_induction over the non-negative integers; evaluate computes closed Int terms and decides a closed \u003c= or == at Int either way. Added beyond the brief: multiplication is charged steps in proportion to the size of its operands, so repeated squaring cannot build a number of 2^100 bits. A test reads the contract out of the atlas and fails if an axiom, rule, or primitive is not named there. Proof sizes from the axioms alone: 2 to 23 nodes for the small facts tried, and one transport for every reassociation of a sum, which is the case for K6.\n\nLane: Kernel. Wave 2.\nDepends on: K1 (LOC-159).\nUnblocks: K3 (LOC-161), K6 (LOC-164).\nCovers: LOC-118, LOC-122.\n\nScope. Int joins the kernel's types. Axioms: the commutative ring laws, the order and its compatibility with + and *, discreteness (nothing lies between n and n + 1), and induction. Evaluate computes closed Int terms. The Kernel contract is updated in the same commit, as for every kernel commit.\n\nTests.\n- For each axiom one test that uses it and one near miss that must be rejected (the axiom at the wrong type, with an argument swapped, or with \u003c for \u003c=).\n- A few derived facts proved in tests from the axioms alone, such as x \u003c y gives x + 1 \u003c= y, to show the set is usable.\n- Evaluate agrees with K1 on random closed terms.\n- A test reads the contract out of the atlas and fails if a kernel axiom is not named in it.\n\nDone when. Int exists in the logic, and the contract lists exactly what is assumed about it.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t277",
   "n": 161,
   "title": "K3 · Int division and remainder: truncating, total, with x / 0 == 0",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. int_div and int_rem, eight axioms named in the Kernel contract (int_div_rem, int_div_zero, four remainder bounds, two sign axioms), each true at every b including zero and each bound false at b == 0 without its condition, which the tests refute. a % 0 == a derived in 33 nodes. Division is charged steps by operand size. Noted for later: Proof::Literal computes a primitive without a step budget, so literal(int_mul(huge, huge)) does unbounded work; a small K-lane follow-up.\n\nLane: Kernel. Wave 3.\nDepends on: K2 (LOC-160).\nUnblocks: K4 (LOC-162).\nCovers: LOC-119.\n\nScope. The axioms, as formulas over all a and b in Int. (1) a == (a / b) * b + a % b, with no condition. (2) a / 0 == 0. From these a % 0 == a follows and is not a separate axiom. (3) 0 \u003c b gives -b \u003c a % b and a % b \u003c b; b \u003c 0 gives b \u003c a % b and a % b \u003c -b. (4) 0 \u003c= a gives 0 \u003c= a % b; a \u003c= 0 gives a % b \u003c= 0. For b not zero, (1), (3), and (4) determine the quotient and remainder uniquely, and they are Rust's.\n\nTests.\n- The four sign combinations and zero, as named tests, including a % 0 == a derived from (1) and (2) inside the kernel.\n- Evaluation against Rust's / and % on i128 at random for a divisor that is not zero, and against the formulas for a zero divisor.\n- A flooring instance, -7 / 2 == -4, is refuted by evaluation.\n- Near misses: the bound of (3) stated without its condition on b is rejected, and would be false at b == 0.\n\nDone when. Int division means what Rust's means wherever Rust's is defined.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "title": "K4 · A model for each machine integer type, from one table",
   "status": "todo",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Kernel. Wave 4.\nDepends on: K3 (LOC-161).\nUnblocks: K5 (LOC-163), K7 (LOC-165), K8 (LOC-166), E5 (LOC-171).\nCovers: LOC-120, LOC-145.\n\nScope. For u8 to u64 and i8 to i64: a view to Int, a wrap from Int, the range of the view, and the round trips. as between machine types is the wrap of the view. The u8 model over Nat is restated over Int and its separate axioms are removed, so the contract holds one schema and not a list per type.\n\nTests.\n- The 8-bit types exhaustively against Rust: every value for the view and round trip, every pair of types for as.\n- The wider types at a boundary set (0, 1, MAX, MAX - 1, MIN, MIN + 1, -1, powers of two and their neighbours) and at random.\n- Every existing kernel_numbers test passes on the new model.\n\nDone when. What the logic says about a machine value is what Rust computes, tested where it can be tested exhaustively and at the edges where it cannot.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "title": "K5 · The table of primitive operations: result type, panic condition, logical meaning",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Kernel. Wave 5.\nDepends on: K4 (LOC-162).\nUnblocks: E6 (LOC-172).\nCovers: LOC-121, LOC-12.\n\nScope. One trusted table with a row for each type and each of + - * / %, and for the wrapping methods. The panic condition and the meaning are terms over the model of K4.\n\nTests.\n- At 8 bits, every pair of operands for every row: the panic condition holds exactly when Rust's checked operation returns None, and otherwise the meaning equals Rust's result.\n- At wider types the boundary set crossed with itself, and random pairs.\n- MIN / -1 and MIN % -1 as named tests for each signed type.\n- Unary minus on the signed types: panics when the operand is MIN, wraps to MIN. In wrapping mode only the overflow of + - * and unary minus wraps; / and % by zero, MIN / -1, and MIN % -1 panic in every build, and the table says so row by row.\n\nDone when. The table is small enough to read and is tested against Rust row by row.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t280",
   "n": 164,
   "title": "K6 · A kernel rule that checks a linear arithmetic certificate, with its whole boundary written first",
   "status": "todo",
   "priority": 2,
   "project": "p266",
   "notes": "The contract and one complete certificate are written: Target language, The linear certificate, in full. The four sums in it were checked by machine. Decided there: the goal is s \u003c= t or False, and an equation is two inequalities and int_le_antisymm; a conclusion is read as s \u003c= t, its negation, or an equation at Int; equations may take a coefficient of either sign; the coefficient of the negated goal is explicit; nothing is divided or rounded.\n\nLane: Kernel. Wave 3.\nDepends on: K2 (LOC-160).\nUnblocks: K7 (LOC-165).\nCovers: LOC-123.\n\nScope. A certificate is a goal, a list of pairs of a kernel proof and a non-negative literal coefficient, and nothing else. Every constraint enters as the conclusion of a proof the kernel checks in the ordinary way: a hypothesis from the context, a range fact as an instance of the axiom of K4, a quotient and remainder constraint as instances of the axioms of K3, the bridge from a comparison of machine values to a comparison of their views as an instance of K4 or K8. The rule itself does three things, all trusted: it reads each conclusion and the negated goal as a linear expression over Int, treating any term that is not +, -, a literal, or multiplication by a literal as an opaque atom compared by same; it tightens strict inequalities by discreteness; and it checks that the combination sums to a false statement about literals. The procedure states no constraint on its own authority. Before any code, one complete certificate is written into the Kernel contract for the last obligation of midpoint, showing the goal and hypotheses, their linear forms, the proof behind each range fact and each division constraint, and the final sum. The certificate is given a text form with a version in this commit, since E11 stores it.\n\nTests.\n- The written certificate, and certificates by hand for the other six arithmetic obligations of Target examples, are accepted.\n- A test-side recomputation of the combination in i128 decides whether a certificate is valid; over all changes of one coefficient, sign, or hypothesis, the kernel accepts exactly the valid ones. Some changes leave a certificate valid, and those must be accepted.\n- Fabricated constraints: a range fact with no proof, a range fact for the wrong type, a quotient constraint whose proof is for another divisor, a remainder bound taken without b != 0. Each is rejected, and rejected as a bad proof and not as bad arithmetic.\n- Goals that are false on a small bounded domain are never accepted under any of 100,000 random certificates.\n- Two atoms that differ are never merged; two that are same are.\n- Size limits as counts, with a test at the limit.\n\nDone when. The kernel can check arithmetic it did not find, and everything the check relies on is either a kernel proof or one of three trusted steps named in the contract.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",
   "created": "2026-09-21T22:14:21.000Z",
   "updated": "2026-09-21T23:23:22.000Z"
  },
  {
   "id": "t281",
   "n": 165,
   "title": "K7 · The arithmetic procedure: finds certificates for linear goals, machine ranges, and division by a literal",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Kernel. Wave 5.\nDepends on: K4 (LOC-162), K6 (LOC-164).\nUnblocks: E7 (LOC-173).\nCovers: LOC-123, LOC-72.\n\nScope. Outside the kernel and untrusted. Turns the goal and the facts in scope into linear constraints over Int, asks for the range of every machine view and the quotient and remainder facts for every division by a literal as axiom instances, eliminates variables, and emits a certificate for K6. Its effort is limited by counts (variables eliminated, constraints generated, size of the certificate), never by a clock, so that the same file is accepted or rejected on every machine.\n\nTests.\n- Finds all seven obligations from Target examples.\n- Random small linear problems in which every variable carries the hypotheses -8 \u003c= x and x \u003c= 8, so that brute force over that range decides exactly the problem posed: a false one is never accepted, asserted through the kernel, and the share of true ones found is printed and must be at least 95 percent within the fragment.\n- At the budget, the diagnostic says the procedure gave up, names the budget, and lists the constraints it had. The same input gives the same outcome on every run.\n\nDone when. Overflow obligations at 32 and 64 bits are dischargeable; this answers LOC-72.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "n": 170,
   "title": "E4 · A panic is a third outcome: the interpreters, the erased tree, and the harness",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. One Outcome type for both interpreters (Value, Panic(message), OutOfFuel); EExpr::Panic; the corpus runner understands => panic and => panic: message, builds twice (overflow checks on and off), and treats out of fuel and a timeout as inconclusive. Notes for later commits: the erased check now lets any never-yielding subexpression through and stops checking what follows it in a block, which M1 should tighten so that dead arms are still checked; an untyped panic in a let can defeat Rust's inference (E0282), so M1 needs a type on the let or on the panic. When O3 adds the state of &mut parameters to a panic, Panic becomes a struct.\n\nLane: Elaborator. Wave 2.\nDepends on: H1 (LOC-151).\nUnblocks: E6 (LOC-172), M1 (LOC-177).\nCovers: LOC-138.\n\nScope. Preparation only, with no surface syntax and no checked semantics. Both interpreters return a value, a panic with its message, or out of fuel. The erased tree and the printer gain a panic expression, reached for now only from trees built by hand. The compiled harness calls each function under catch_unwind, can build with overflow checks on or off, and runs the program under a process timeout; a timeout is reported as inconclusive and never as a disagreement or as divergence. The statement of erasure in Architecture is restated for three outcomes.\n\nTests.\n- Erased trees built by hand that panic agree with their compiled Rust, message included.\n- Out of fuel stays distinct from a panic and is never compared as one.\n- The harness is tested on a program that loops forever: inconclusive, and the rest of the batch is still compared.\n\nDone when. Tests can say f(255) => panic. What a panic means to the checker comes with M1 for block endings and with E6 for operators.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t288",
   "n": 172,
   "title": "E6 · The operators + - * / % with their panic conditions and what the logic learns",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Elaborator. Wave 7.\nDepends on: K5 (LOC-163), E2 (LOC-168), E4 (LOC-170), E5 (LOC-171), M0 (LOC-176).\nUnblocks: E7 (LOC-173).\nCovers: LOC-11, LOC-12, LOC-121.\n\nScope. Operators elaborate through the table of K5. The check IR gains primitive operations that may panic, as M0 designs them: under no_panic the panic condition is an obligation at the operator and the exact result is known after; otherwise only the wrapped result is known. After a / b the divisor is known not to be zero. In a formula, an operator on a machine type is rejected, because it may panic, and the message offers as Int and the wrapping method. The reference interpreters panic on overflow by default and have a wrapping mode, since Rust does either according to the build. This commit changes the checker of the check IR, which is trusted, and updates Architecture.\n\nTests.\n- For every type and operator, at the boundary set: the interpreter in its default mode agrees with Rust built with overflow checks on, and in its wrapping mode with Rust built with them off. / and % by zero and MIN / -1 panic in both.\n- What the logic learns outside no_panic, the wrapped value, holds in both builds; a test asserts a fact proved from it against both compiled results.\n- An undischarged obligation under no_panic is reported at the operator with its condition written out.\n- Check IR built by hand that omits the evidence at an operator under no_panic is rejected by the checker.\n- The random program generator of R1 now emits arithmetic, in both build configurations.\n\nDone when. x + 1 means what it means in Rust, and a function that promises no_panic has shown it cannot overflow.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t290",
   "n": 174,
   "title": "E8 · Logic-only types and the one erasure rule: Ghost\u003cT>, snapshot!, erased positions",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Elaborator. Wave 7.\nDepends on: E5 (LOC-171), E2 (LOC-168).\nUnblocks: R4 (LOC-189).\nCovers: LOC-97, LOC-81, LOC-141.\n\nScope. Two rules that must not be confused. An erased result: a position is erased exactly when its type has no runtime form, so the evidence a call returns vanishes and the call stays. An erasable computation: a call is removed only if its result is logic-only, it promises terminates, no_panic, and no_io, and it takes no &mut to runtime storage. An expression in a logic-only context, such as the argument of snapshot!, the right side of a let of type Int, or a formula, must be an erasable computation throughout, and is rejected otherwise. Ghost\u003cT> is built by snapshot!(e). Seq\u003cT> is proposed to leave the core: no acceptance example needs it and it brings a theory of its own.\n\nTests.\n- A pure call in a logic-only context: accepted, and absent from the generated Rust.\n- A call that may panic in a logic-only context: rejected, naming the missing promise. The same for one that may not terminate, and one that does I/O.\n- An ordinary runtime call that returns only evidence and may panic or loop: accepted, kept in the generated Rust, its result erased; the three-way comparison sees its panic.\n- A call with a logic-only result and a &mut parameter to runtime storage: kept. This case is written now and enabled by O3.\n- The generated Rust of a file using Ghost and Int holds nothing of them but markers, by golden file, and the erased check rejects a hand-built erased tree that keeps a logic-only value.\n\nDone when. Specifications can carry values the program never computes.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "title": "M0 · Write the design of the checked IR for mutation, early exit, panics, and operations that may panic",
   "status": "done",
   "priority": 3,
   "project": "p266",
   "notes": "Written 21 September, reviewed, and revised the same day: evaluation order as part of the trusted translation, binding identities for the assigned set, one representation for a join that assigns, what may be lent, what a panic carries, all four promises in the checker, wrapping mode by operation, and cases 9 to 11. Target language: How mutation is checked.\n\nLane: Mutation. Wave 1.\nDepends on: nothing.\nUnblocks: E6 (LOC-172), M1 (LOC-177).\nCovers: LOC-129.\n\nScope. A section of Target language, not code. For each of the six cases of LOC-129 it shows the source, the check IR after lowering to versions, and what the checker demands at each point: a branch that refreshes against one that returns early; several continue and break paths; snapshot against tracked evidence; a captured proposition used as a tracked type; move and reinitialise; a call that changes two disjoint fields. A seventh case covers a primitive operation that may panic, under no_panic and outside it, since E6 needs it before the rest. An eighth covers a protected value behind &mut when a panic unwinds, once that rule is decided.\n\nTests.\n- Each case is written so that it can be copied into a test in M2 to M4 and O3.\n- Reviewed by Nikhil before M1 starts.\n\nDone when. The gate. No mutation code is written before this is agreed.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t293",
   "n": 177,
   "title": "M1 · The check IR gains return and panic as ways a block ends",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. Promises on ExecFn, enforced by the checker: no_panic (callees and a proof of False at every panic), terminates (no loop or for anywhere, callees), no_io and no_alloc (callees). Tail::Return checked against the result type at that point; Tail::Panic with an optional proof. Both interpreters unwind a return. EExpr::Return in the erased tree, tested three ways. The erased check again checks everything after a never-yielding value, and bindings carry their type so the printer can annotate a let whose value diverges. Note for M3: LoopUnderTerminates refuses a bounded for too, as designed; relaxing it is one condition.\n\nLane: Mutation. Wave 3.\nDepends on: M0 (LOC-176), E4 (LOC-170).\nUnblocks: M2 (LOC-178), E10 (LOC-190).\nCovers: LOC-142, LOC-93.\n\nScope. src/exec only: the IR, its checker, and its interpreter. At a return the checker demands the function's result type; at a panic it demands nothing, or under no_panic evidence that the point is unreachable.\n\nTests.\n- Programs built by hand in the IR, as exec_check does today: a return inside a branch, a panic inside a branch, both.\n- A return with the wrong evidence is rejected at the return.\n- Architecture's account of the trusted base is updated.\n- All four promises are enforced by the checker, no_io and no_alloc included, each with a hand-built function that breaks it.\n- The erased check still checks the arms and statements that follow a never-yielding expression, which E4 stopped doing.\n- A let bound to a panic gets a type in the generated Rust, so that inference cannot fail (E0282).\n\nDone when. The checker is ready before any surface syntax reaches it.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "notes": "Lane: Mutation. Wave 7.\nDepends on: M1 (LOC-177), S5 (LOC-158).\nUnblocks: M3 (LOC-179), O1 (LOC-182).\nCovers: LOC-1, LOC-142.\n\nScope. The typed tree gains assignment to a variable or field path and stays source-shaped. lower gives each assignment a new version and makes a variable assigned in a branch a result of the branch. The printer emits let mut and assignment as written.\n\nTests.\n- Differential and compiled tests for straight-line and branching mutation.\n- The generator of R1 emits mutable locals, and the three-way comparison holds.\n- The generated Rust has no unused mut, which -D warnings already enforces.\n- Case 9: the right side changes what the left side names; lo == 3 and hi == 7 three ways. The same for the two argument orders.\n- Case 10: both arms assign and refresh, and the condition reads the entry version.\n- The assigned set, on the check IR lowering produces and through both interpreters: an outer binding assigned in a nested block; a field write counting for its root; a local let mut inside a branch staying local; a shadowing binding assigned while the outer one is not, and the reverse.\n\nDone when. The first program that reads like ordinary imperative Rust.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "notes": "Lane: Mutation. Wave 8.\nDepends on: M2 (LOC-178).\nUnblocks: M4 (LOC-180), M5 (LOC-181).\nCovers: LOC-127, LOC-5.\n\nScope. loop, while, and for i in a..b. A variable assigned in a loop becomes loop state in the check IR. break with a value, continue.\n\nTests.\n- Every old loop test is ported and passes.\n- The generated Rust uses the loop form the source used, by golden file.\n- The generator of R1 emits loops; fuel bounds them.\n- The assigned set for loops: a let mut inside the body is not loop state; an assignment in a while condition is; a &mut call in the condition is, once O3 lands.\n\nDone when. The provisional loops are gone, as planned since they were added.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "title": "M4 · Tracked evidence: let mut evidence, invalidated by assignment, refreshed explicitly",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Mutation. Wave 9.\nDepends on: M3 (LOC-179), E1 (LOC-167).\nUnblocks: O3 (LOC-184).\nCovers: LOC-16.\n\nScope. Assigning to a variable invalidates tracked evidence that mentions it; using it before a refresh is an error shaped like use after move. ok = _; or ok = proof; refreshes. Around a loop it must hold on entry and at every continue and at the end of the body, and is known after.\n\nTests.\n- The first four cases of M0 as named tests.\n- The flow analysis is tested as untrusted: typed trees built by hand that skip a refresh are rejected by the checker of the check IR, not by the elaborator.\n- run from the 32-bit lock checks, runs, and compiles; the lock file is complete.\n\nDone when. The third milestone: a loop that carries a proof, with no invariant construct.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "notes": "Lane: Mutation. Wave 9.\nDepends on: M3 (LOC-179).\nUnblocks: R4 (LOC-189).\nCovers: LOC-93, LOC-92.\n\nScope. return lowers to the block ending of M1. ! is the type of return, break, continue, and the panicking forms, and coerces to any type.\n\nTests.\n- A return inside a loop inside a branch, three ways.\n- Evidence owed at an early return is reported at the return.\n- Code after a never-typed expression is reported as unreachable, as rustc would warn.\n\nDone when. Early exit works as in Rust.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t298",
   "n": 182,
   "title": "O1 · Moves, and derive with a closed list",
   "status": "backlog",
   "priority": 2,
   "project": "p266",
   "notes": "Lane: Ownership. Wave 8.\nDepends on: M2 (LOC-178), S4 (LOC-157).\nUnblocks: O3 (LOC-184).\nCovers: LOC-89, LOC-25, LOC-141, LOC-99.\n\nScope. Values move by default. Copy, Clone, PartialEq, Eq, and Debug by derive only. Types with no runtime form are always Copy. Use after move is an error; assignment reinitialises. A proposition in a body cannot mention a moved local. PartialEq is derivable only for a type with no logic-only data at any depth.\n\nTests.\n- rustc as the oracle, for runtime uses only: each program rejected for using a moved runtime value, printed as Rust through a test hook that skips the move check, is also rejected by rustc with E0382. A program rejected only because a proposition or erased expression mentions a moved local has no counterpart in the generated Rust, where that use is gone; those are tested as Locus rejections alone.\n- Every accepted program compiles, which the runner already enforces.\n- The fifth case of M0.\n\nDone when. Locus is never more permissive than rustc about moves, and the generated Rust never surprises its compiler.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "priority": 2,
   "project": "p266",
   "notes": "Lane: Ownership. Wave 7.\nDepends on: S4 (LOC-157), E2 (LOC-168).\nUnblocks: O4 (LOC-185).\nCovers: LOC-90, LOC-137, LOC-18, LOC-19, LOC-135.\n\nScope. Private by default. The restricted forms of pub mean what they mean in Rust. A function that takes evidence, directly or inside a parameter type Rust could construct, may be visible no further than the generated root; plain pub on it is an error that offers a narrower visibility or a validated type. locus build writes the root module with the markers and one module per file; LOC-135 must be decided first.\n\nTests.\n- A hand-written Rust crate compiled against the generated module: calling an evidence-taking function, naming a marker constructor, and building a struct with private fields are each rejected by rustc with the expected error code; calling a plain pub function works and runs.\n- The marker replay attack is written out as a test and fails to compile.\n- Evidence hidden in a pub field of a pub struct is caught.\n\nDone when. The guarantee at the boundary with Rust rests on what is exported and is tested from the Rust side.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t300",

   "title": "O3 · References as parameters: &T and &mut T, path arguments, disjointness, old!",

   "priority": 2,
   "project": "p266",
   "notes": "Lane: Ownership. Wave 10.\nDepends on: O1 (LOC-182), M4 (LOC-180).\nUnblocks: O4 (LOC-185).\nCovers: LOC-76, LOC-81.\n\nScope. A &mut parameter lowers to a value passed in and a new version passed out. Arguments are paths. Two arguments may not overlap. old!(x) names the entry value. Matching through & binds only Copy fields.\n\nTests.\n- rustc as the oracle for rejected aliasing of runtime values (E0499, E0502, E0506).\n- The sixth case of M0, and the eighth: whatever rule is decided for a panic that unwinds past a protected value behind &mut, a rejected file shows it.\n- The mutating-call case of E8 is enabled.\n- The generator of R1 emits calls with &mut.\n- A field that evidence in its struct depends on cannot be lent: &mut percent.value is rejected by lowering, and &mut percent is accepted.\n- A panic carries the values of the &mut parameters at that moment, in both interpreters and in the compiled harness, which reads the arguments after catch_unwind. A callee that writes and then panics, called directly and through a caller that lent a field of its own &mut parameter.\n\nDone when. Tier 0 of references is complete.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {

   "status": "doing",
   "priority": 3,
   "project": "p266",
   "notes": "Lane: Robustness. Wave 2.\nDepends on: H1 (LOC-151), H2 (LOC-152).\nUnblocks: R4 (LOC-189).\n\nScope. Programs over the runtime fragment with trivial evidence, run in the check-IR interpreter, the erased interpreter, and as compiled Rust, two hundred to a rustc call. Loops are generated bounded by construction (a counter with a literal limit, never assigned in the body), because interpreter fuel does not bound the compiled program; the process timeout of E4 is a safeguard and its firing is inconclusive. The fast suite runs a few hundred programs with a fixed seed; the extended suite runs thousands with fresh seeds. E6, M2, M3, and O3 each extend the generator as part of their own exit.\n\nTests.\n- Three-way agreement on every generated program, panics included once E4 lands, and in both overflow configurations once E6 lands.\n- A failing program is printed with its seed and shrunk by deleting statements.\n- An inconclusive run is counted and printed, and the extended suite fails if more than a handful are.\n\nDone when. Differences between what is checked and what runs are found by machine, not by luck.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t303",
   "n": 187,
   "title": "R2 · Kernel soundness under mutation: no proof is accepted for a claim known to be false",
   "status": "doing",
   "priority": 3,
   "project": "p266",
   "notes": "Lane: Robustness. Wave 2.\nDepends on: H1 (LOC-151).\nUnblocks: R4 (LOC-189).\n\nScope. Accepting a changed proof of a true claim is harmless, and a changed proof may validly prove some other proposition, so neither is a finding. What would be a finding is a proof accepted for a false claim. For every proof the corpus produces, the test makes claims known to be false (the negation of the original where that is closed or bounded, and perturbed claims refuted by evaluation over a small domain) and checks them against the original proof and against random changes of one node of it: another hypothesis, another axiom argument, a swapped subproof.\n\nTests.\n- The kernel rejects every pairing of a proof with a claim known to be false.\n- A changed proof checked against the original claim may be accepted; the count is printed, for interest only.\n- Runs over every proof in the corpus, so it grows with the language.\n- Covers the Int forms of K2 (rebased after K2 landed).\n\nDone when. A standing check on the one component everything trusts.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",
