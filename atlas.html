  {
   "id": "t290",
   "n": 174,
   "title": "E8 · Logic-only types and the one erasure rule: Ghost\u003cT>, snapshot!, erased positions",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. Ghost\u003cT> is the kernel type T with a ghost binder; it has no erased representation, and the erased check refuses any binding of ghost type as the second judge. snapshot!(e) builds one; a ghost local at runtime is L0201. The one erasure rule in erase.rs: a call is removed iff its result has no runtime form and the callee promises terminates, no_panic, and no_io (the &mut clause is a comment for O3); otherwise the call stays with its result replaced by the marker. Logic-only contexts (the argument of snapshot!, a let of type Ghost, Int, or Prop, a Ghost argument, proposition arguments, evidence constructors) require every callee to make the three promises (L0209 names the missing one). Seams for the discussion: arguments of an erased call are not a logic-only context and are kept as let _ = arg; a struct with only ghost fields is still a runtime struct of markers; no Seq anywhere.\n\nLane: Elaborator. Wave 7.\nDepends on: E5 (LOC-171), E2 (LOC-168).\nUnblocks: R4 (LOC-189).\nCovers: LOC-97, LOC-81, LOC-141.\n\nScope. Two rules that must not be confused. An erased result: a position is erased exactly when its type has no runtime form, so the evidence a call returns vanishes and the call stays. An erasable computation: a call is removed only if its result is logic-only, it promises terminates, no_panic, and no_io, and it takes no &mut to runtime storage. An expression in a logic-only context, such as the argument of snapshot!, the right side of a let of type Int, or a formula, must be an erasable computation throughout, and is rejected otherwise. Ghost\u003cT> is built by snapshot!(e). Seq\u003cT> is proposed to leave the core: no acceptance example needs it and it brings a theory of its own.\n\nTests.\n- A pure call in a logic-only context: accepted, and absent from the generated Rust.\n- A call that may panic in a logic-only context: rejected, naming the missing promise. The same for one that may not terminate, and one that does I/O.\n- An ordinary runtime call that returns only evidence and may panic or loop: accepted, kept in the generated Rust, its result erased; the three-way comparison sees its panic.\n- A call with a logic-only result and a &mut parameter to runtime storage: kept. This case is written now and enabled by O3.\n- The generated Rust of a file using Ghost and Int holds nothing of them but markers, by golden file, and the erased check rejects a hand-built erased tree that keeps a logic-only value.\n\nDone when. Specifications can carry values the program never computes.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "title": "M0 · Write the design of the checked IR for mutation, early exit, panics, and operations that may panic",
   "status": "done",
   "priority": 3,
   "project": "p266",
   "notes": "Written 21 September, reviewed, and revised the same day: evaluation order as part of the trusted translation, binding identities for the assigned set, one representation for a join that assigns, what may be lent, what a panic carries, all four promises in the checker, wrapping mode by operation, and cases 9 to 11. Target language: How mutation is checked.\n\nLane: Mutation. Wave 1.\nDepends on: nothing.\nUnblocks: E6 (LOC-172), M1 (LOC-177).\nCovers: LOC-129.\n\nScope. A section of Target language, not code. For each of the six cases of LOC-129 it shows the source, the check IR after lowering to versions, and what the checker demands at each point: a branch that refreshes against one that returns early; several continue and break paths; snapshot against tracked evidence; a captured proposition used as a tracked type; move and reinitialise; a call that changes two disjoint fields. A seventh case covers a primitive operation that may panic, under no_panic and outside it, since E6 needs it before the rest. An eighth covers a protected value behind &mut when a panic unwinds, once that rule is decided.\n\nTests.\n- Each case is written so that it can be copied into a test in M2 to M4 and O3.\n- Reviewed by Nikhil before M1 starts.\n\nDone when. The gate. No mutation code is written before this is agreed.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "title": "M1 · The check IR gains return and panic as ways a block ends",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. Promises on ExecFn, enforced by the checker: no_panic (callees and a proof of False at every panic), terminates (no loop or for anywhere, callees), no_io and no_alloc (callees). Tail::Return checked against the result type at that point; Tail::Panic with an optional proof. Both interpreters unwind a return. EExpr::Return in the erased tree, tested three ways. The erased check again checks everything after a never-yielding value, and bindings carry their type so the printer can annotate a let whose value diverges. Note for M3: LoopUnderTerminates refuses a bounded for too, as designed; relaxing it is one condition.\n\nLane: Mutation. Wave 3.\nDepends on: M0 (LOC-176), E4 (LOC-170).\nUnblocks: M2 (LOC-178), E10 (LOC-190).\nCovers: LOC-142, LOC-93.\n\nScope. src/exec only: the IR, its checker, and its interpreter. At a return the checker demands the function's result type; at a panic it demands nothing, or under no_panic evidence that the point is unreachable.\n\nTests.\n- Programs built by hand in the IR, as exec_check does today: a return inside a branch, a panic inside a branch, both.\n- A return with the wrong evidence is rejected at the return.\n- Architecture's account of the trusted base is updated.\n- All four promises are enforced by the checker, no_io and no_alloc included, each with a hand-built function that breaks it.\n- The erased check still checks the arms and statements that follow a never-yielding expression, which E4 stopped doing.\n- A let bound to a panic gets a type in the generated Rust, so that inference cannot fail (E0282).\n\nDone when. The checker is ready before any surface syntax reaches it.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t294",
   "n": 178,
   "title": "M2 · let mut and assignment, lowered to versions",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. Stmt::Assign with a Place (binding plus field path) in the typed tree; lowering emits a let of the rebuilt value per assignment, verifies every executable mention is the current version, and lowers a branch that assigns an outer binding to a match whose result is the tuple of new versions then the value; the tree carries the version identities so proofs can mention them and lowering checks the join set against its own computation. Erasure maps versions back and prints let mut and x.f = e as written; mut only where assigned. Diagnostics: L0232 assign twice to immutable, L0233 a field that evidence depends on. Cases 9 and 10 in the corpus (case 9's &mut form waits for O3); the five assigned-set rules tested on the IR shape; the generator emits mutable locals and branching assignment, 10,000 programs agreed three ways. Deviation from the design, recorded: lowering verifies versions the tree supplies rather than inventing them, since proofs must name them; soundness is the same.\n\nLane: Mutation. Wave 7.\nDepends on: M1 (LOC-177), S5 (LOC-158).\nUnblocks: M3 (LOC-179), O1 (LOC-182).\nCovers: LOC-1, LOC-142.\n\nScope. The typed tree gains assignment to a variable or field path and stays source-shaped. lower gives each assignment a new version and makes a variable assigned in a branch a result of the branch. The printer emits let mut and assignment as written.\n\nTests.\n- Differential and compiled tests for straight-line and branching mutation.\n- The generator of R1 emits mutable locals, and the three-way comparison holds.\n- The generated Rust has no unused mut, which -D warnings already enforces.\n- Case 9: the right side changes what the left side names; lo == 3 and hi == 7 three ways. The same for the two argument orders.\n- Case 10: both arms assign and refresh, and the condition reads the entry version.\n- The assigned set, on the check IR lowering produces and through both interpreters: an outer binding assigned in a nested block; a field write counting for its root; a local let mut inside a branch staying local; a shadowing binding assigned while the outer one is not, and the reverse.\n\nDone when. The first program that reads like ordinary imperative Rust.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t295",
   "n": 179,
   "title": "M3 · Rust's loops over let mut; the state-passing loop and the bounded for are removed",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September (rebased over E3, E9, E6). loop, while, for over a range of any machine type with ..=, break with a value from loop, continue; the old state-passing forms are reported with L0234 and the new spelling. The loop state is the tuple of outer bindings the body (or a while condition) assigns, computed by lowering; the bounded For of the check IR lost its ordered proof and index-dependent state, gained inclusive and break. No loop lowers to a kernel term any more. lock.lc keeps run by carrying (lock, evidence) as one let mut tuple, an M2-legal program; the tracked spelling is M4. The extended random run found a real lower-versus-erase disagreement (an effectful argument of a dropped lemma call), fixed in erase.rs. The while exit fact is not exported after the loop until M4.\n\nLane: Mutation. Wave 8.\nDepends on: M2 (LOC-178).\nUnblocks: M4 (LOC-180), M5 (LOC-181).\nCovers: LOC-127, LOC-5.\n\nScope. loop, while, and for i in a..b. A variable assigned in a loop becomes loop state in the check IR. break with a value, continue.\n\nTests.\n- Every old loop test is ported and passes.\n- The generated Rust uses the loop form the source used, by golden file.\n- The generator of R1 emits loops; fuel bounds them.\n- The assigned set for loops: a let mut inside the body is not loop state; an assignment in a while condition is; a &mut call in the condition is, once O3 lands.\n\nDone when. The provisional loops are gone, as planned since they were added.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t296",
   "n": 180,
   "title": "M4 · Tracked evidence: let mut evidence, invalidated by assignment, refreshed explicitly",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. Milestone 3 reached: tests/corpus/target/lock.lc checks, runs, and compiles in full (11 proofs), with let mut ok: @within_limit(lock.failures) carried by the loop and refreshed each pass. A tracked binding is a let mut whose type mentions other mutable bindings; assigning a dependency makes it stale (L0245 on use, L0246 at a continue, break, body end, or while exit); a refresh is an assignment checked against the claim over the current versions. Lowering types every version at joins and loop state over the current versions, so the trusted checker rejects a stale use as a type mismatch and needs nothing new; tested with a hand-built tree. Two lowering rules sharpened: an arm that leaves contributes nothing to a join; a proof-typed binding may be left out of a join or loop state. The while exit fact remains unexported.\n\nLane: Mutation. Wave 9.\nDepends on: M3 (LOC-179), E1 (LOC-167).\nUnblocks: O3 (LOC-184).\nCovers: LOC-16.\n\nScope. Assigning to a variable invalidates tracked evidence that mentions it; using it before a refresh is an error shaped like use after move. ok = _; or ok = proof; refreshes. Around a loop it must hold on entry and at every continue and at the end of the body, and is known after.\n\nTests.\n- The first four cases of M0 as named tests.\n- The flow analysis is tested as untrusted: typed trees built by hand that skip a refresh are rejected by the checker of the check IR, not by the elaborator.\n- run from the 32-bit lock checks, runs, and compiles; the lock file is complete.\n\nDone when. The third milestone: a loop that carries a proof, with no invariant construct.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t297",
   "n": 181,
   "title": "M5 · return and the never type in the surface language",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. return lowers to Tail::Return in tail position and, elsewhere, to the two-arm leaving match E10 introduced for panics; a returning arm contributes nothing to a join. Never-typed values (return, break, continue, the panic forms, calls to -> ! functions) coerce to any expected type; a -> ! function has result type @False in the kernel and its body must end never-typed. Diagnostics gained a warning level: L0247 unreachable statement, as rustc warns, and locus check exits 0 on warnings; the corpus has //~ warning: directives and goldens beside accepted files. L0216 removed. Evidence owed at an early return is reported at the return.\n\nLane: Mutation. Wave 9.\nDepends on: M3 (LOC-179).\nUnblocks: R4 (LOC-189).\nCovers: LOC-93, LOC-92.\n\nScope. return lowers to the block ending of M1. ! is the type of return, break, continue, and the panicking forms, and coerces to any type.\n\nTests.\n- A return inside a loop inside a branch, three ways.\n- Evidence owed at an early return is reported at the return.\n- Code after a never-typed expression is reported as unreachable, as rustc would warn.\n\nDone when. Early exit works as in Rust.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t298",
   "n": 182,
   "title": "O1 · Moves, and derive with a closed list",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. src/elab/moves.rs, interleaved with elaboration: values move by default, Copy types never; partial moves as rustc does them; branches join by union over live arms, loops report a move of an outer value at the back edge; assignment reinitialises. L0240 use of moved value (rustc wording), L0241 a proposition mentioning a moved local, L0242 and L0243 for the derive list and its field rules (PartialEq refused where logic-only data sits at any depth). The printer emits exactly the derives the source declares. rustc as oracle: 15 rejected shapes, all E0382 when printed with the analysis skipped. Cost of the rule: lock32_step's (next, prove!(next.failures \u003c= 3)) needed Copy on Lock, since the tuple moved next before the claim named it.\n\nLane: Ownership. Wave 8.\nDepends on: M2 (LOC-178), S4 (LOC-157).\nUnblocks: O3 (LOC-184).\nCovers: LOC-89, LOC-25, LOC-141, LOC-99.\n\nScope. Values move by default. Copy, Clone, PartialEq, Eq, and Debug by derive only. Types with no runtime form are always Copy. Use after move is an error; assignment reinitialises. A proposition in a body cannot mention a moved local. PartialEq is derivable only for a type with no logic-only data at any depth.\n\nTests.\n- rustc as the oracle, for runtime uses only: each program rejected for using a moved runtime value, printed as Rust through a test hook that skips the move check, is also rejected by rustc with E0382. A program rejected only because a proposition or erased expression mentions a moved local has no counterpart in the generated Rust, where that use is gone; those are tested as Locus rejections alone.\n- Every accepted program compiles, which the runner already enforces.\n- The fifth case of M0.\n\nDone when. Locus is never more permissive than rustc about moves, and the generated Rust never surprises its compiler.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "project": "p266",
   "notes": "Landed 22 September. Visibility recorded and printed as written, private by default. The export boundary: L0244 a plain pub function with a forgeable parameter type (evidence, or a tuple, enum, or struct through which Rust could pass a marker or set a field the evidence speaks of); L0245 a pub struct carrying evidence with a pub field. locus build writes a Cargo crate (LOC-135 closed). From the Rust side: calling a pub(crate) evidence-taking function, naming or constructing the marker, and building a struct with private fields are E0603, E0451, E0616; the marker replay fails to compile; a plain pub function runs. For the vision discussion: Target examples write pub fn step, remaining, and midpoint with evidence parameters, which the Vision's own rule forbids; the corpus copies say pub(crate).\n\nLane: Ownership. Wave 7.\nDepends on: S4 (LOC-157), E2 (LOC-168).\nUnblocks: O4 (LOC-185).\nCovers: LOC-90, LOC-137, LOC-18, LOC-19, LOC-135.\n\nScope. Private by default. The restricted forms of pub mean what they mean in Rust. A function that takes evidence, directly or inside a parameter type Rust could construct, may be visible no further than the generated root; plain pub on it is an error that offers a narrower visibility or a validated type. locus build writes the root module with the markers and one module per file; LOC-135 must be decided first.\n\nTests.\n- A hand-written Rust crate compiled against the generated module: calling an evidence-taking function, naming a marker constructor, and building a struct with private fields are each rejected by rustc with the expected error code; calling a plain pub function works and runs.\n- The marker replay attack is written out as a test and fails to compile.\n- Evidence hidden in a pub field of a pub struct is caught.\n\nDone when. The guarantee at the boundary with Rust rests on what is exported and is tested from the Rust side.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied,    "notes": "Landed 22 September. Tier 0 of references: &T and &mut T as parameter types only; arguments are paths; a &mut parameter is a let mut inside the callee whose final version is one more field of the result tuple, bound at the call and written back to the root by the inside-out rebuilding an assignment uses, so tracked evidence goes stale and the callee's returned evidence about the exit value refreshes it; old!(x) names the entry value in propositions. Overlapping arguments are refused by lowering and, earlier, by the elaborator with rustc's codes (L0263: E0499, E0502, E0503, E0505); E0596, E0507 likewise; all observed from rustc on the printed twins. The panic rule as designed: the value at the moment of the panic is what the caller observes, in both interpreters (a side table the checker never reads) and in the compiled harness under catch_unwind. Lending a field that evidence depends on is refused (L0233). The generator lends; E8's &mut test is enabled. *x place syntax waits for O4.\n\nLane: Ownership. Wave 10.\nDepends on: O1 (LOC-182), M4 (LOC-180).\nUnblocks: O4 (LOC-185).\nCovers: LOC-76, LOC-81.\n\nScope. A &mut parameter lowers to a value passed in and a new version passed out. Arguments are paths. Two arguments may not overlap. old!(x) names the entry value. Matching through & binds only Copy fields.\n\nTests.\n- rustc as the oracle for rejected aliasing of runtime values (E0499, E0502, E0506).\n- The sixth case of M0, and the eighth: whatever rule is decided for a panic that unwinds past a protected value behind &mut, a rejected file shows it.\n- The mutating-call case of E8 is enabled.\n- The generator of R1 emits calls with &mut.\n- A field that evidence in its struct depends on cannot be lent: &mut percent.value is rejected by lowering, and &mut percent is accepted.\n- A panic carries the values of the &mut parameters at that moment, in both interpreters and in the compiled harness, which reads the arguments after catch_unwind. A callee that writes and then panics, called directly and through a caller that lent a field of its own &mut parameter.\n\nDone when. Tier 0 of references is complete.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "status": "done",

   "project": "p266",
   "notes": "Landed 22 September. Milestone 4 reached: every program in Target examples checks, runs, and compiles. Methods are functions named Type::name with self as the first parameter passed as written; a method call is rewritten to the path call with the receiver lent or moved, so O3's rules apply unchanged; *self is the one dereference Locus reads. The printer alone rebuilds impl blocks from the erased tree's owner and receiver marks. From Rust: Percent::checked works, Percent::new is E0624, the literal E0451, the field E0616; set_twice under catch_unwind leaves the valid value written before the panic. Deviations of the target files from the atlas text, for the discussion: pub(crate) on evidence-taking functions; an enum Checked in place of Option\u003cPercent>; Debug derives; value \u003c= 100 written without the cast. percent.lc: 3 obligations, all computed (the text predicted 1 exact).\n\nLane: Ownership. Wave 11.\nDepends on: O2 (LOC-183), O3 (LOC-184).\nUnblocks: R4 (LOC-189).\n\nScope. Methods and associated functions in impl blocks, with self, &self, and &mut self. The Percent example checks and builds, with an enum of its own in place of Option, which waits for generics.\n\nTests.\n- Percent moves from parse-only to run.\n- The Rust caller crate of O2 uses Percent: checked works, new is not visible, the fields are not visible.\n- The Rust caller calls a method that updates a Percent through &mut self under catch_unwind, with an input chosen to make it panic if anything can, and then reads the value that survives: it satisfies the invariant. If the rule decided forbids the method instead, the rejected file is the test.\n- Case 11: a method that completes one valid replacement and then panics; the Rust caller finds the new valid value.\n\nDone when. The fourth milestone: every program in Target examples works.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "notes": "Landed 21 September as tests/random_programs.rs with tests/common/compiled.rs (harness pieces copied from tests/corpus.rs, to deduplicate later). Type-directed generation of typed trees with weighted productions; loops bounded by construction; every program declared through the real Session and checked. Fast: 300 programs, 2,617 cases, 6 s; extended: 10,000 programs, 90,633 cases, 0 inconclusive, 0 disagreements, 180 s. Shrinking tested on a planted disagreement. Finding, not fixed: the printer writes byte literals without a suffix, so let k = 200; k.wrapping_add(n) and a for index used as a receiver are accepted by Locus and rejected by rustc (E0689); kept as an ignored test and given to E5.\n\nLane: Robustness. Wave 2.\nDepends on: H1 (LOC-151), H2 (LOC-152).\nUnblocks: R4 (LOC-189).\n\nScope. Programs over the runtime fragment with trivial evidence, run in the check-IR interpreter, the erased interpreter, and as compiled Rust, two hundred to a rustc call. Loops are generated bounded by construction (a counter with a literal limit, never assigned in the body), because interpreter fuel does not bound the compiled program; the process timeout of E4 is a safeguard and its firing is inconclusive. The fast suite runs a few hundred programs with a fixed seed; the extended suite runs thousands with fresh seeds. E6, M2, M3, and O3 each extend the generator as part of their own exit.\n\nTests.\n- Three-way agreement on every generated program, panics included once E4 lands, and in both overflow configurations once E6 lands.\n- A failing program is printed with its seed and shrunk by deleting statements.\n- An inconclusive run is counted and printed, and the extended suite fails if more than a handful are.\n\nDone when. Differences between what is checked and what runs are found by machine, not by luck.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t303",
   "n": 187,
   "title": "R2 · Kernel soundness under mutation: no proof is accepted for a claim known to be false",
   "status": "done",
   "priority": 3,
   "project": "p266",
   "notes": "Landed 21 September as tests/kernel_soundness.rs. Triples come from 67 hand-built proofs covering every rule and axiom family (Int and division included), the 13 theory lemmas, and every proof the elaborator finds for the corpus (recorded through a new HoleReport::found). The oracle is an evaluator of its own, three-valued, exhaustive over bool and u8 and sampling over Nat and Int; a claim is false only when a witness satisfies every hypothesis. Mutations are generic over axioms through Axiom::terms(). Fast: about 17,000 mutants in 3 s; extended: 1.7 million in 78 s, no finding. Sabotage: Evaluate deciding \u003c= as \u003c gives 67 findings; an axiom stated wrongly is caught at setup by its own positive triple. K4 and later kernel commits must extend the exhaustive matches here, which the compiler enforces.\n\nLane: Robustness. Wave 2.\nDepends on: H1 (LOC-151).\nUnblocks: R4 (LOC-189).\n\nScope. Accepting a changed proof of a true claim is harmless, and a changed proof may validly prove some other proposition, so neither is a finding. What would be a finding is a proof accepted for a false claim. For every proof the corpus produces, the test makes claims known to be false (the negation of the original where that is closed or bounded, and perturbed claims refuted by evaluation over a small domain) and checks them against the original proof and against random changes of one node of it: another hypothesis, another axiom argument, a swapped subproof.\n\nTests.\n- The kernel rejects every pairing of a proof with a claim known to be false.\n- A changed proof checked against the original claim may be accepted; the count is printed, for interest only.\n- Runs over every proof in the corpus, so it grows with the language.\n- Covers the Int forms of K2 (rebased after K2 landed).\n\nDone when. A standing check on the one component everything trusts.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is    "notes": "Landed 21 September, with a follow-up for the S1 messages. tests/diagnostics_golden.rs renders every rejected file through the library and compares with NAME.stderr; a second test checks the binary prints the same; LOCUS_BLESS=1 rewrites. A meta test scans src for L-codes and fails if one has no rejected file: 50 codes before S1, all covered, 105 files. Thirteen diagnostics judged misleading are listed in the task and should be fixed as reviewed golden diffs (see the list below).\n\nMisleading diagnostics found while writing the goldens, to fix later as golden diffs:\n1. L0299 (the checker rejected this) surfaces kernel messages: an if with evidence branches points at the function name; let next = continue(...) says break and continue may only end a block; [h == g] on two proofs, evidence returned from an enum payload, fold toward @q(1) leaking a VarId, and g(1).1 on a dependent tuple all reach L0299.\n2. unexpected_character.lc: the parser's L0102 is printed before the lexer's L0001 that caused it.\n3. evidence_as_proposition_parameter.lc: a prop parameter naming an earlier parameter gives L0204 unknown name rather than L0225.\n4. false_in_one_case.lc: after the arm's equation the claim computes to 7 \u003c= 6 and the note says nothing known speaks of it, although n == 7 is known; no counterexample note for a closed false claim.\n5. reversed_range.lc: nothing says the obligation comes from the range 5..n.\n6. L0216/L0220 span a whole block instead of the offending statement; L0215 spans a whole loop.\n7. L0208 labels only the path, not the wrong pattern list; L0228 points at the argument, not the call.\n8. L0206 (_ asks for evidence) says nothing about what to write instead.\n9. The nesting and chain limit errors could name the limit.\n10. unknown_enum.lc gives unknown name for Light::Red where unknown enum would match the neighbouring wording.\n\nLane: Robustness. Wave 2.\nDepends on: H1 (LOC-151).\nUnblocks: R4 (LOC-189).\n\nScope. The rendered diagnostic of every rejected corpus file is stored and compared. A meta test lists the error codes in the source and fails if one has no rejected file.\n\nTests.\n- LOCUS_BLESS=1 rewrites the goldens; the diff is reviewed like code.\n\nDone when. Diagnostics are the product for an author, human or AI, and change only on purpose.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "project": "p266",
   "notes": "Landed 22 September. tests/acceptance.rs holds the twelve exit criteria; tools/check.sh --extended runs them and prints one line each: eleven met (three target files agree three ways in both builds; the boundary held by rustc; counterexamples in every failing diagnostic; eight files check --locked with no search; determinism; never more permissive than rustc; 10,000 random programs and 82,159 cases agreed; 5.4 million kernel mutants without a finding; parser total; the legacy gone) and one not: the fast suite took 161 s in debug against the 120 s bound, reported by check.sh rather than failed. Removed: the bracket, def, math fn, and state-passing loop spellings and their migrations; Nat and its axioms, induction, and lemmas from the kernel; the proof by 256 cases. Kept: kernel::Natural as the magnitude of Integer; the kernel for term, a removal candidate. Language, as built, Overview, README, and the Kernel contract rewritten from the implementation; 63 status rows moved; finding 7 added to Target examples.\n\nLane: Robustness. Wave 12.\nDepends on: E11 (LOC-192), E3 (LOC-169), E7 (LOC-173), E8 (LOC-174), E9 (LOC-175), E10 (LOC-190), M5 (LOC-181), O4 (LOC-185), K8 (LOC-166), R1 (LOC-186), R2 (LOC-187), R3 (LOC-188).\n\nScope. The closing commit. Language, as built is rewritten from the implementation, Overview and README show the 32-bit lock, and the Language status table moves every core row to built.\n\nTests.\n- The overall exit criteria of the Build plan, each as a test or a command, under tools/check.sh --extended.\n\nDone when. The core language of the Vision is the language of the code.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t306",
   "n": 190,
   "title": "E10 · The forms that panic: panic!, assert!, unreachable!, todo!, debug_assert!",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. panic!, todo!, unreachable! are never-typed and lower to Tail::Panic (or a two-arm match that panics, in statement position); assert! lowers to a match whose failing arm panics and whose passing arm yields evidence of the condition, so the condition is a fact afterwards; debug_assert! teaches nothing. Under no_panic: panic! and todo! are refused (L0239), assert! must prove its condition and unreachable! must prove False through the usual tiers; without the promise the proofs are tried and attached when found. Messages are Rust's and the harness compares them exactly three ways, so the printer passes the message explicitly. Noted for M5: statements after a never-typed statement still hit L0216. debug_assert! is checked in both builds because the harness's two rustc builds both have debug_assertions on.\n\nLane: Elaborator. Wave 7.\nDepends on: M1 (LOC-177), E2 (LOC-168), S2 (LOC-155).\nUnblocks: R4 (LOC-189).\nCovers: LOC-71, LOC-85, LOC-95.\n\nScope. The forms with their Rust meaning and string literal messages, lowered to the panic ending of M1. Their type is the never type where Rust's is. Under no_panic, assert!(c) needs evidence of c and unreachable!() needs evidence of false, as Target language states; panic! and todo! are rejected there.\n\nTests.\n- Each form three ways, message included.\n- After assert!(c), c is a fact; under no_panic without evidence it is an error at the assert.\n- Check IR built by hand with a panic ending and no evidence of false is rejected under no_panic by the checker.\n\nDone when. A half-written file checks with todo!(), and a runtime check can teach the logic a fact.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

  {
   "id": "t307",
   "n": 191,
   "title": "Decide the rule for a protected value behind &mut when a panic unwinds past a broken invariant",
   "status": "done",
   "priority": 3,
   "project": "p89",
   "created": "2026-09-21T22:27:28.000Z",
   "updated": "2026-09-21T22:47:55.000Z",
   "notes": "Refined the same day while writing the design of M0: in the core the scenario cannot arise, because a field that evidence depends on is never assigned alone and a whole-value write evaluates its operands first. The no_panic rule is kept for the day field-by-field update is allowed. The Rust caller test stays in O4.\n\nDecided 21 September: the conservative rule below. Target language: Effects are promises.\n\nRaised by review of the Build plan, 21 September; Target language mentions the question under Effects and leaves it to protected exports. A method takes &mut self on a type whose fields carry evidence, assigns a field, which invalidates the evidence, and panics before refreshing it. The checker looks only at the return path, so it is satisfied. A Rust caller that wrapped the call in catch_unwind now holds a value whose invariant is false, in safe Rust. A value owned by the function that panics is not a problem: it is dropped unseen, since Locus types have no Drop.\n\nRecommended, conservative: between an assignment that invalidates evidence stored in a place reached through a &mut parameter and the refresh of that evidence, nothing may panic; to begin with this is enforced by requiring #[no_panic] on any function that makes such an assignment. Replacing the whole value at once, *self = Percent { ... }, invalidates nothing and needs no promise. A finer rule, which looks only at the window between the assignment and the refresh, can replace it later without breaking any program.\n\nNeeded before O3 (LOC-184). The Rust caller test is in O4 (LOC-185), and the design case is the eighth of M0."
  },
  {
   "id": "t308",
   "n": 192,
   "title": "E11 · Found proofs are stored beside the source, and locus check --locked never searches",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. \u003csource>.proofs beside each file, version 1: one entry per obligation keyed by an FNV-1a hash of the context (variables with types, ghostness, hypotheses) and the claim in a text form of kernel terms; definitions by name, context entries by position, rebound on read; every rule and axiom round-trips; a stored proof is parsed by a total, depth-limited reader and kernel-checked, never trusted. locus check reads, searches on a miss, writes only on change; --locked never searches and names the missing obligation; --no-store, LOCUS_PROOFS=off, and LOCUS_SEARCH=none (the upgrade hook) exist. The five examples' files are committed, 1.8 KB in all; reformatting, renaming, and editing another function keep every entry in use; hostile files are always a miss.\n\nLane: Elaborator. Wave 9.\nDepends on: E7 (LOC-173).\nUnblocks: R4 (LOC-189).\nCovers: LOC-8.\n\nScope. Target language: Found proofs are stored. A text format for kernel proofs and certificates with a version, names for definitions, and one entry per obligation keyed by a hash of the claim and its available facts as kernel terms. A file beside each source file. locus check reads, searches on a miss, writes, and drops entries nothing asked for; locus check --locked never searches.\n\nTests.\n- Round trip: every proof the corpus produces is written, read back, and accepted; the file is byte-identical on a second run.\n- Reformatting a source file, adding comments, and editing an unrelated function leave every entry in use, counted by a test.\n- The file as hostile input: entries swapped between obligations, a proof edited by hand, a truncated file, random bytes. Each is a miss or a reported error, never an accepted false claim and never a panic; the reader is added to the fuzz tests.\n- --locked with a missing entry fails and names the obligation; with a complete file it runs no search, asserted by a counter.\n- A file written with the search deliberately weakened by a test hook still checks, which is what surviving an upgrade means.\n\nDone when. A reviewer or CI checks a crate with the kernel alone, and a change to the automation cannot break a build that has its proofs.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "updated": "2026-09-22T20:37:36.000Z"
  },
  {
   "id": "t309",
   "n": 193,
   "title": "Decide how a fully promised function whose body is not a kernel term enters the logic",
   "status": "done",
   "priority": 3,
   "project": "p89",
   "created": "2026-09-22T17:42:38.000Z",
   "updated": "2026-09-22T23:44:20.000Z",
   "notes": "Resolved 22 September by the Vision: an ordinary fn never enters the logic, whatever it promises; a logic fn does and is checked pure and total; the interim rule stays in the code until the reconciliation replaces it (Build plan, After the core build).\n\nFound by E6 on 22 September. A function promising terminates, no_panic, and no_io is lowered as a kernel function with a defining equation, which is what lets it appear in propositions and be unfolded. An operator that may panic is a statement of the check IR, not a term, so such a function cannot contain one (L0236), yet the target example midpoint is fully promised and uses - / +. Functions in propositions already says a function is known by its contract, and its equation is visible only where its body is expressible as a kernel term; Termination says a recursive function enters the logic as a function symbol known by its contract alone. What is missing is the kernel form for that: a declared function symbol with a signature and no body, or the same through a top-level variable of function type. Until decided, E7 checks such a function as an ordinary ExecFn with its promises and refuses its use in a proposition with a message that says why. To discuss with the vision edits."
  },
  {
   "id": "t311",
   "n": 194,
   "title": "P1 · Paragraph IDs, categories, and a traceability gate for the Kernel contract and Language, as built",
   "status": "done",
   "priority": 3,
   "project": "p310",
   "created": "2026-09-23T00:03:12.000Z",
   "updated": "2026-09-23T04:35:37.000Z",
   "notes": "When: now. After: nothing.\n\nScope. Every paragraph of the Kernel contract and of Language, as built carries an identifier in the form chapter.section:paragraph and a category: normative, legality-rule, syntax, dynamic-semantics, informative, example. A paragraph without a category is informative; normativity is opted into, never inherited. Tests cite paragraphs: a corpus file with //~ spec: 7.2:3 or a Rust test with a spec attribute. A gate in the suite fails when a normative paragraph has no focused test citing it (a focused test is a corpus file under forty lines or one Rust test), when a citation names a paragraph that no longer exists, or when a behaviour-asserting test cites only an informative paragraph. The existing contract test, which checks that every kernel name appears in the contract, becomes one of the gate's rules.\n\nWhy. The document a reviewer reads and the tests the machine runs become the same artifact; today the kernel-contract test covers names only, and R4 had to rewrite Language, as built by hand because nothing tied its sentences to the code. Rue's spec (docs/spec, crates/rue-spec) does this with a rule() marker per paragraph and a 100 percent coverage gate.\n\nTests. The gate itself on a scratch copy of the atlas with a paragraph removed, a citation dangling, and an informative paragraph cited by an asserting test; the count of normative paragraphs and of citations printed by the extended gate.\n\nDone when. tools/check.sh fails on an uncovered normative paragraph, and the atlas shows the IDs in the rendered documents.\n\nImplementation accepted. Stable rendered paragraph IDs, local categories, strict focused citations, dangling/informative-only checks, rule inventories and adversarial traceability tests implemented. tools/spec.py is integrated in the gate. Full tools/check.sh --extended passed; fast 221s (advisory target 120s). See Generated status for machine-produced counts and raw benchmark record."

  {

   "notes": "When: now. After: nothing.\n\nScope. A corpus file may carry //~ known: LOC-NN with a reason. The runner expects the file to fail as pinned; if it passes, the suite fails, naming the marker to remove. The same marker on a Rust test through a small attribute or helper. The task number must be an open task in the atlas, checked by the meta test that reads atlas.html.\n\nWhy. A skipped or ignored test outlives its bug. Rue's known_bug = \"RUE-NN\" on CLI cases is an executable xfail: an unexpected pass is a failure, so a fixed bug cannot leave a stale marker.\n\nDone when. One real known bug from the discussion note (the fold! of a struct literal that projection reduction does not match, found by E9) is pinned this way, and removing the workaround in the code makes the marker fail loudly.\n\nImplementation accepted. Known-bug directives and Rust helper implemented with pinned failure, reason and open-task checks; changed failures and unexpected passes fail loudly. The specified E9 struct-literal fold bug was already fixed by Reconciliation, so its real reproducer is a passing regression. Synthetic harness tests cover the executable known-bug lifecycle; no stale real xfail is retained. Full tools/check.sh --extended passed; fast 221s (advisory target 120s). See Generated status for machine-produced counts and raw benchmark record."

  {
   "id": "t313",
   "n": 196,
   "title": "P3 · A reason on every trusted site, and locus audit",
   "status": "done",
   "priority": 3,
   "project": "p310",
   "created": "2026-09-23T00:03:12.000Z",
   "updated": "2026-09-23T04:35:37.000Z",
   "notes": "When: now, and again when trusted declarations arrive. After: nothing.\n\nScope. locus audit lists, for a file or a crate, everything a reviewer must take on trust: every function that does not promise terminates (a source of divergence), every panic ending and operator without evidence in a function without no_panic, every use of classical reasoning in the theory and, when the surface can invoke it, in source, and later every foreign or trusted declaration. Where the language gives the programmer a way to assert something the compiler does not check (trusted declarations in the Interop project, a lemma admitted without proof if that is ever allowed), the reason is a mandatory string literal in the grammar between the keyword and the item, kept in the tree so that a formatter cannot separate it and the audit prints it beside the site.\n\nWhy. The one part of the language the compiler cannot check is where a stated reason earns a reviewer's trust, and for code written by an agent the cost of stating it is nothing. Rue's checked \"reason\" { } (ADR-0095) makes it grammar rather than a lint. Positioning already promises the audit command.\n\nTests. The audit over the examples is a golden; a trusted site without a reason is a rejected corpus file once the grammar exists.\n\nDone when. locus audit exists and its output for the target examples is committed as a golden; the reason clause is designed in the Vision for the declarations that will need it.\n\nImplementation accepted. locus audit checks sorted files/directories and reports divergence, panic/allocation, classical dependencies and trusted reason strings. Target/foreign-site goldens and multi-file discovery/rejection regressions pass. Full tools/check.sh --extended passed; fast 221s (advisory target 120s). See Generated status for machine-produced counts and raw benchmark record."

   "status": "done",

   "notes": "When: now. After: nothing.\n\nScope. The stored proofs of E11 move from one sidecar per source to one Locus.lock at the root of what locus check was given (the crate root, or the directory of a single file), written and read with the toml crate, the first dependency of the compiler. The file has version = 2, then [[file]] tables in path order, each with path and [[file.obligation]] tables in order of position with key (the hash of the obligation as E11 defines it), at (the function and ordinal, reader-only), claim (the conclusion the stored proof proves, in the text form), and steps, a multi-line literal string of named steps: tN = term and sN = proof, one per line, a line may refer to earlier names, shared subterms and subproofs written once (hash-consed by the writer), the last line the conclusion. The reader parses each line, resolves names, expands the DAG into the tree the kernel checks, and hands it to the kernel as before: nothing trusted changes. A stale entry now reports \"the stored proof concludes X, the obligation wants Y\" using the claim field. The writer numbers steps in first-use order and rewrites the file whole; comments are not preserved. Migration: a run that finds version-1 sidecars reads them, writes Locus.lock, and deletes them, once. --locked, --no-store, LOCUS_PROOFS=off, LOCUS_SEARCH=none, --holes and --stats keep their meaning.\n\nWhy. Fifty sidecars in a crate are clutter, and the tree form repeats every shared subproof; a DAG of named steps is smaller, readable, and diff-friendly, and a single lockfile is what a reviewer and CI expect. Decided with Nikhil on 22 September; recorded under Found proofs are stored.\n\nTests.\n- E11's round trip, reformatting, hostile-input, --locked, and weakened-search tests pass over the new file; the file is byte-identical on a second run; sharing is asserted on the lock's run entry (a subproof written once, referred to twice).\n- The size of Locus.lock for the examples is at most that of the // ---------------------------------------------------------------- documents
function viewDoc(id) {
  const d = docById(id);
  if (!d) return '<div class="page"><h1>No such document</h1></div>';
  const r = renderMarkdown(d.body, {editable: true, docId: d.id});
  const toc = r.headings.filter(h => h.level === 2 || h.level === 3).map(h => '<a class="l' + h.level + '" href="#/doc/' + d.id + '/' + h.id + '">' + esc(h.text.replace(/[`*]/g, '')) + '</a>').join('');
  return '<div class="page wide"><div class="head"><div><p class="tiny">' + esc(d.group || 'Docs') + ', edited ' + ago(d.updated) + '</p></div>' +
    '<div class="row"><a class="btn" href="#/edit/' + d.id + '">Edit</a><button class="btn ghost" data-act="doc-settings" data-id="' + d.id + '">Settings</button></div></div>' +
    '<div class="doc"><article class="md">' + r.html + '</article><nav class="toc">' + toc + '</nav></div></div>';
}
function viewEdit(id, h) {
  const d = docById(id);
  if (!d) return '<div class="page"><h1>No such document</h1></div>';
  const lines = d.body.split('\n');
  let text = d.body, title = 'Editing ' + d.title, range = null;
  if (h != null && h !== '') {
    const heads = renderMarkdown(d.body).headings, k = +h;
    if (heads[k]) { range = sectionRange(heads, k, lines.length); text = lines.slice(range[0], range[1]).join('\n'); title = 'Editing the section ' + heads[k].text; }
  }
  viewEdit.state = {id, range};
  return '<div class="page wide"><div class="head"><div><h1>' + esc(title) + '</h1><p>' + esc(d.title) + '. Markdown on the left, the result on the right.</p></div>' +
    '<div class="row"><button class="btn primary" data-act="edit-apply">Apply</button><a class="btn" href="#/doc/' + d.id + '">Cancel</a></div></div>' +
    '<div class="editor"><textarea id="ed" class="mono" spellcheck="false">' + esc(text) + '</textarea><div class="preview md" id="pv"></div></div></div>';
}
function wireEditor() {
  const ed = $('#ed'), pv = $('#pv'); if (!ed) return;
  const paint = () => { pv.innerHTML = renderMarkdown(ed.value, {docId: viewEdit.state.id}).html; };
  ed.addEventListener('input', () => { clearTimeout(paint.t); paint.t = setTimeout(paint, 150); });
  ed.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); ed.setRangeText('    ', ed.selectionStart, ed.selectionEnd, 'end'); } });
  paint(); ed.focus();
}
function applyEdit() {
  const st = viewEdit.state, d = docById(st.id), text = $('#ed').value.replace(/\s+$/, '');
  if (st.range) {
    const lines = d.body.split('\n');
    const tail = st.range[1] < lines.length ? [''] : [];
    lines.splice(st.range[0], st.range[1] - st.range[0], ...text.split('\n'), ...tail);
    d.body = lines.join('\n');
  } else d.body = text + '\n';
  d.updated = now(); touch();
  go('#/doc/' + d.id);
}

    rows += '<tr class="area"><td colspan="4">' + esc(a) + ' <span class="muted tiny">' + built + ' of ' + all.length + ' built</span></td></tr>';

    });
  });
  return '<div class="page wide"><div class="head"><div><h1>Language status</h1><p>The difference between Now and Vision: every feature of the language and the compiler, and whether it is built, designed and not built, or only planned.</p></div>' +

function progress(tasks) {
  const live = tasks.filter(t => t.status !== 'canceled'), done = live.filter(t => t.status === 'done').length;
  return {done, total: live.length, pct: live.length ? Math.round(100 * done / live.length) : 0};
}
function taskRow(t) {

    (t.priority ? '<span class="prio p' + t.priority + ' tiny">' + PRIORITY[t.priority] + '</span>' : '') + (p ? '<span class="muted tiny">' + esc(p.name) + '</span>' : '') + pill(TASK_STATUS, t.status) + '</li>';
}

// ---------------------------------------------------------------- search
function viewSearch(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return '<div class="page"><h1>Search</h1></div>';
  const mark = s => { const i = s.toLowerCase().indexOf(needle); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + needle.length)) + '</mark>' + esc(s.slice(i + needle.length)); };
  let hits = '', count = 0;
  DB.tasks.forEach(t => { if ((t.title + ' ' + (t.notes || '') + ' ' + taskKey(t)).toLowerCase().indexOf(needle) >= 0 && count++ < 200) hits += '<a class="hit" href="#/tasks" data-act="task-open" data-id="' + t.id + '"><b>' + taskKey(t) + ' ' + mark(t.title) + '</b><span class="muted tiny">Task, ' + label(TASK_STATUS, t.status) + '</span></a>'; });
  DB.features.forEach(f => { if ((f.name + ' ' + (f.note || '')).toLowerCase().indexOf(needle) >= 0 && count++ < 200) hits += '<a class="hit" href="#/status"><b>' + mark(f.name) + '</b><span class="muted tiny">Language status, ' + label(FEATURE_STATUS, f.status) + '. ' + mark(f.note || '') + '</span></a>'; });
  DB.docs.forEach(d => {
    const heads = renderMarkdown(d.body).headings; let per = 0;
    d.body.split('\n').forEach((line, n) => {
      if (per >= 12 || count >= 200 || line.toLowerCase().indexOf(needle) < 0) return;
      let h = null; for (const x of heads) { if (x.line <= n) h = x; else break; }
      const i = line.toLowerCase().indexOf(needle), from = Math.max(0, i - 80);
      hits += '<a class="hit" href="#/doc/' + d.id + (h ? '/' + h.id : '') + '"><b>' + esc(d.title) + (h ? ', ' + esc(h.text) : '') + '</b><span class="muted tiny">' + mark(line.slice(from, i + needle.length + 120)) + '</span></a>';
      per++; count++;
    });
  });
  return '<div class="page"><div class="head"><div><h1>Search: ' + esc(q) + '</h1><p>' + count + (count >= 200 ? ' or more' : '') + ' results</p></div></div>' + (hits || '<p class="muted">Nothing found.</p>') + '</div>';
}

// ---------------------------------------------------------------- events
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const HELP = '<h2>How this file works</h2><div class="md"><p>Everything is inside this one HTML file: the documents, the language status table, the projects and tasks, and the program that shows them. Nothing is sent anywhere.</p>' +
  '<p><strong>Saving.</strong> With Autosave on, every change is written to the file a moment after it is made. There are two ways the page can write the file. Opened from <code>python3 tools/atlas.py serve</code>, it writes through that program, in any browser, with nothing to set up. Opened directly in Chrome, Edge or Arc, press Save file once and choose this file; from then on the page writes to it, and the browser may remember the permission for next time. In other browsers, opened directly, Save file downloads a copy to put in place of the old one. Cmd/Ctrl+S saves at once. Unsaved edits are also kept in the browser and offered back if the page is closed before they are written.</p>' +
  '<p><strong>One copy.</strong> The documents live only here. <code>python3 tools/atlas.py</code> reads and writes them from the command line: <code>list</code>, <code>show NAME</code>, <code>put NAME FILE</code>, and <code>dump DIR</code> to write them all out as markdown for reading elsewhere. If the file changes on disk while this page is open, saving says so before replacing it.</p>' +
  '<p><strong>Keys.</strong> <code>/</code> search, Cmd/Ctrl+S save, Esc close.</p></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Close</button></div>';
const ACTIONS = {
  save: () => save(true), close: closeModal, reload: () => { dirty = false; location.reload(); },
  menu: () => $('#side').classList.toggle('open'),
  theme: () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('locus-atlas-theme', next); } catch (e) { /* ignore */ } },
  help: () => modal(HELP),
  'draft-restore': () => { const d = draft(); if (d) { DB = parseData(d.data); dirty = true; render(); toast('Restored. Save the file to keep it.'); } },
  'draft-discard': () => { try { localStorage.removeItem('locus-atlas-draft'); } catch (e) { /* ignore */ } render(); },
  'edit-section': el => go('#/edit/' + route()[1] + '/' + el.dataset.h),
  'edit-apply': applyEdit,
  'new-doc': el => { docSettings.group = el.dataset.group; docSettings(''); },
  'doc-settings': el => docSettings(el.dataset.id),
  'doc-save': el => {
    const title = val('ds-title').trim(); if (!title) return toast('A document needs a title.');
    let d = docById(el.dataset.id);
    if (!d) { let id = slug(title), n = 1; while (docById(id)) id = slug(title) + '-' + (++n); d = {id, body: '# ' + title + '\n', created: now()}; DB.docs.push(d); }
    d.title = title; d.group = val('ds-group').trim() || 'Docs'; d.updated = now();
    touch(); closeModal(); go('#/doc/' + d.id);
  },
  'doc-delete': el => { const d = docById(el.dataset.id); if (d && confirm('Delete the document ' + d.title + '? This cannot be undone once the file is saved.')) { DB.docs = DB.docs.filter(x => x !== d); touch(); closeModal(); go('#/'); } },
  'spec-filter': el => { specFilter = el.dataset.v; render(); },
  'feature-edit': el => featureModal(el.dataset.id),
  'feature-save': el => {
    const name = val('ff-name').trim(); if (!name) return toast('A feature needs a name.');
    let f = DB.features.find(x => x.id === el.dataset.id);
    if (!f) { f = {id: newId('f')}; DB.features.push(f); }
    Object.assign(f, {name, area: val('ff-area').trim() || 'Other', status: val('ff-status'), note: val('ff-note').trim(), doc: val('ff-doc'), anchor: val('ff-anchor').trim(), project: val('ff-project'), updated: now()});
    touch(); closeModal(); render();
  },
  'feature-delete': el => { DB.features = DB.features.filter(x => x.id !== el.dataset.id); touch(); closeModal(); render(); },
  'project-edit': el => projectModal(el.dataset.id),
  'project-save': el => {
    const name = val('pf-name').trim(); if (!name) return toast('A project needs a name.');
    let p = projectById(el.dataset.id);
    if (!p) { p = {id: newId('p'), created: now()}; DB.projects.push(p); }
    Object.assign(p, {name, status: val('pf-status'), description: val('pf-desc'), updated: now()});
    touch(); closeModal(); go('#/project/' + p.id);
  },
  'project-delete': el => { const p = projectById(el.dataset.id); if (p && confirm('Delete the project ' + p.name + '? Its tasks are kept, without a project.')) { DB.tasks.forEach(t => { if (t.project === p.id) t.project = ''; }); DB.projects = DB.projects.filter(x => x !== p); touch(); closeModal(); go('#/projects'); } },
  'task-new': () => taskModal(''),
  'task-open': el => taskModal(el.dataset.id),
  'task-save': el => {
    const title = val('tf-title').trim(); if (!title) return toast('A task needs a title.');
    const fields = {title, status: val('tf-status'), priority: +val('tf-priority'), project: val('tf-project'), notes: val('tf-notes'), updated: now()};
    const t = DB.tasks.find(x => x.id === el.dataset.id);
    if (t) { Object.assign(t, fields); touch(); } else addTask(fields);
    closeModal(); render();
  },
  'task-delete': el => { DB.tasks = DB.tasks.filter(x => x.id !== el.dataset.id); touch(); closeModal(); render(); }
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-act]');
  const link = e.target.closest('a[href^="#/"]');
  if (link && !(el && link.contains(el) && el !== link) && !link.dataset.act && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    e.preventDefault(); const s = $('#side'); if (s) s.classList.remove('open');
    return go(link.getAttribute('href'));
  }
  if (!el) { if (!e.target.closest('#side')) { const s = $('#side'); if (s) s.classList.remove('open'); } return; }
  const act = ACTIONS[el.dataset.act]; if (!act) return;
  if (el.tagName === 'A') e.preventDefault();
  act(el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'feature-status') { const f = DB.features.find(x => x.id === el.dataset.id); f.status = el.value; f.updated = now(); touch(); render(); }
  if (el.dataset.change === 'board-project') { boardProject = el.value; render(); }
  if (el.dataset.change === 'board-canceled') { showCanceled = el.checked; render(); }
  if (el.dataset.change === 'autosave') { autosaveOn = el.checked; try { localStorage.setItem('locus-atlas-autosave', autosaveOn ? 'on' : 'off'); } catch (err) { /* ignore */ } renderSaveState(); if (autosaveOn) scheduleAutosave(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.input !== 'board-text') return;
  boardText = e.target.value; clearTimeout(ACTIONS.timer);
  ACTIONS.timer = setTimeout(() => { render(); const f = $('[data-input="board-text"]'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, 250);
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-submit]'); if (!form) return;
  e.preventDefault();
  const title = form.elements.title.value.trim(); if (!title) return;
  addTask({title, project: form.dataset.project}); render(); const f = $('.quick input'); if (f) f.focus();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (route()[0] === 'edit') applyEdit(); save(true); return; }
  if (e.key === 'Escape') return closeModal();
  if (e.key === 'Enter' && e.target.id === 'q') return go('#/search/' + encodeURIComponent(e.target.value));
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); const q = $('#q'); if (q) q.focus(); }
});
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (c) e.dataTransfer.setData('text/plain', c.dataset.drag); });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('[data-drop]'); if (!c) return;
  e.preventDefault();
  const t = DB.tasks.find(x => x.id === e.dataTransfer.getData('text/plain'));
  if (t && t.status !== c.dataset.drop) { t.status = c.dataset.drop; t.updated = now(); touch(); }
  render();
});
window.addEventListener('hashchange', syncFromAddress);
window.addEventListener('popstate', syncFromAddress);
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
try { const th = localStorage.getItem('locus-atlas-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
document.title = DB.meta.title;
// For checking from the console that what would be saved is what is expected.
window.__atlas = {buildFile, data: () => DB};
render();
prepare();
})();
</script>
