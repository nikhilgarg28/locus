    "a == b                 to_nat(a) == to_nat(b)",
    "a \u003c b, a \u003c= b, ...     the corresponding order on to_nat(a), to_nat(b)",
    "a.wrapping_add(b)      the u8 whose to_nat is (to_nat(a) + to_nat(b)) mod 256",
    "a.wrapping_sub(b)      the u8 whose to_nat is (to_nat(a) + 256 - to_nat(b)) mod 256",
    "~~~",
    "",
    "The bool-valued runtime comparison a \u003c b and the proposition [a \u003c b] are connected by a reflection lemma per operator, stating that the bool is true exactly when the proposition holds. The u8 ordering lemmas of the kernel-level prelude (such as lt_of_le_of_ne and step_stays_below's ingredients) are proved from this model by ordinary reasoning and Nat induction. None is an axiom, and none depends on exhaustive enumeration of several variables.",
    "",
    "Primitive evaluation. On literals, the kernel evaluates bool and u8 operations natively. This native implementation must agree with the Nat model; that agreement is part of the trusted base and is tested exhaustively, which is feasible for one-byte and two-byte operations. An evaluation rule builds on it: a closed logical term of type bool may be evaluated by the kernel, unfolding math functions as it goes, and evidence of [term == true] is accepted when the result is true. This evaluator of closed terms is the only place the kernel computes; it is a big-step shortcut for a chain of the axioms above, and it plays no part in comparing terms. A claim of the form forall (x: u8) { b(x) } with a computable bool body can be established by evaluating all 256 cases. Evaluation is a convenience for closed and single-variable facts; it is not the foundation of u8 reasoning.",
    "",
    "Kernel-level prelude. Lemmas that must apply at every type (eq_symm, eq_trans, congruence), and the u8 theory over the Nat model are written in the kernel's own term language, where type parameters and Nat are available, and are checked by the kernel like everything else. They are not trusted.",
    "",
    "Proof terms are checked and then discarded. Results are cached by content hash so that unchanged declarations are not rechecked.",
    "",
    "### 12.3 What a hole is guaranteed to find",
    "",
    "A hole's behavior must be predictable, so its search is fixed and bounded:",
    "",
    "1. a fact already in scope, including branch and arm evidence, up to the type identity of section 3.1; and reflexivity;",
    "2. propositional reasoning over &&, ||, =>, true, and false using facts in scope;",
    "3. rewriting with equalities in scope and congruence (a proof-producing congruence closure);",
    "4. unfolding of math function definitions;",
    "5. evaluation of closed terms by the kernel;",
    "6. for a comparison that speaks of exactly one unknown byte, evaluation of all 256 cases under the facts in scope that speak of that byte alone (the rule of section 12.2).",
    "",
    "The implementation builds tiers 1, 2, 4, 5, and 6, and in place of tier 3 an oriented rewriting: a name bound by let, or a field of a result, is replaced by what an equation in scope says it equals. A proof-producing congruence closure is not built yet.",
    "",
    "A hole does not search the prelude. In particular it does not reason about order or arithmetic between two unknowns: it will not derive i \u003c limit from i \u003c= limit and i != limit. With limit a literal, tier 6 decides it. Such steps are written as lemma calls, as in sections 8.1 and 10.4. Every example in this document uses a hole only for a goal within these five tiers. A mechanism that lets a hole apply selected lemmas is a possible later addition (section 15.2); it is deliberately absent here so that what a hole can do is easy to state.",
    "",
    "Anything beyond the tiers is an explicit step: a lemma call, a match, a rewrite, unfold, or fold form (section 8.4), or a named decision procedure. Expected named procedures are linear arithmetic once mathematical integers exist, and bit-level reasoning for wider machine integers. Each emits kernel terms or a certificate for a small checker; if a certificate checker is added to the trusted base, that is recorded explicitly.",
    "",
    "Resource policy. Every limit is a count of deterministic steps, never elapsed time, so that whether a program is accepted does not depend on the machine that checks it. A hole has fixed budgets for: the depth of definition unfolding; the size of any intermediate term; the number of congruence-closure merges; the number of propositional case splits; and the number of cases evaluated, at most 65,536, which covers two byte variables and rules out three. Acyclic unfolding always terminates but can grow a term rapidly; the size budget, not termination, is what bounds it. Exceeding any budget is reported as \"not found\", naming the budget. The budgets are constants of a language version, and raising one is a compatible change.",
    "",
    "When a hole fails, the diagnostic reports the Locus-level goal, the goal after computing when that differs, and the facts in scope that speak of the values in the goal, and distinguishes \"not found\" from \"refuted by evaluation\": a refutation names the failing byte.",
    "",
    "Two tooling consequences are intended:",
    "",
    "- An \"expand hole\" action replaces a solved hole with the explicit steps that were found.",
    "- Found proofs are recorded, in the manner of a lockfile, so that rechecking does not repeat the search and a change to the search procedure cannot break a proof that was previously accepted.",
    "",
    "### 12.4 The trusted base",
    "",
    "- The kernel, including native Nat, bool, and u8 evaluation and its agreement with the Nat model of u8.",
    "- The translation of a program into kernel statements: the generation of the per-path statements of section 6.3, and the logical definitions given to primitive operations.",
    "- Erasure and Rust generation, and the Rust toolchain beneath them.",
    "",
    "The prelude, including its kernel-level part, is not trusted: its lemmas are checked like any other. The hole solver and all other automation are not trusted.",
    "",
    "## 13. Surface grammar",
    "",
    "This is the grammar implemented by the syntax frontend. Names, types, propositions, modes, and proofs still require the semantic checking that comes after parsing. bool, u8, and Prop are parsed as type names, not lexer keywords.",
    "",
    "Appendix A lists the Rust features that the fragment does not support.",
    "",
    "### Relationship to Rust tokens",
    "",
    "Locus source is meant to tokenize as Rust, so that the same frontend can later run inside a locus! { ... } procedural macro as well as on .lc files. Every token here is a Rust token. Two places need care in that setting and none in the file-based frontend: Rust reads pair.0.1 as a name, a dot, and the float 0.1, which a macro driver has to split; and => and .. arrive as single punctuation tokens in both.",
    "",
    "The words struct, enum, match, loop, for, in, break, and continue are reserved, as they are in Rust. forall and exists are reserved by Locus. math and prop are ordinary identifiers except where a declaration or a function type can begin: math directly before fn, and prop directly before a name at the start of a declaration.",
    "",
    "### Retired syntax",
    "",
    "The parser recognizes four retired forms in order to say what replaced them.",
    "",
    "| Written | Diagnostic | Replacement |",
    "|---|---|---|",
    "| def name(...) | L0113, with an applicable fix; parsing continues as a math fn | math fn name(...) |",
    "| @{ command; ... } | L0110 | Evidence is an ordinary expression: a stated intermediate fact, a lemma call, a match, or _ |",
    "| a + b | L0112 | a.wrapping_add(b); arithmetic operators return with Int and Nat in a later milestone |",
    "| [], [a, b], [a; n], [T], [T; n] | L0114 | None in the core; brackets hold exactly one proposition |",
    "",
    "Nat is an ordinary name to the parser. Name resolution reports it.",
    "",
    "### Notation",
    "",
    "In this EBNF, brackets denote optional syntax and braces denote repetition. Quoted brackets and braces are source tokens. Comma-separated lists allow a trailing comma.",
    "",
    "~~~",
    "file        = { declaration } ;",
    "declaration = [ \"math\" ] \"fn\" name \"(\" parameters \")\" \"->\" type block",
    "            | \"struct\" name \"{\" parameters \"}\"",
    "            | \"enum\" name \"{\" [ variant { \",\" variant } [ \",\" ] ] \"}\"",
    "            | \"prop\" name [ \"(\" parameters \")\" ] \"{\" [ prop_variant { \",\" prop_variant } [ \",\" ] ] \"}\"",
    "            | \"const\" name \":\" type \"=\" expression \";\" ;",
    "parameters  = [ parameter { \",\" parameter } [ \",\" ] ] ;",
    "parameter   = name \":\" type ;",
    "variant     = name [ \"(\" fields \")\" ] ;",
    "prop_variant = name [ \"(\" fields \")\" ] [ \":\" \"@\" proof_target ] ;",
    "fields      = [ field { \",\" field } [ \",\" ] ] ;",
    "field       = [ name \":\" ] type ;",
    "",
    "type        = name | \"(\" \")\" | \"(\" type \")\" | tuple_type",
    "            | \"@\" proof_target",
    "            | [ \"math\" ] \"fn\" \"(\" fields \")\" \"->\" type ;",
    "proof_target = (name | proposition | \"(\" expression \")\") { postfix } ;",
    "postfix     = \"(\" arguments \")\" | \".\" name | \".\" integer ;",
    "tuple_type  = \"(\" field \",\" \")\"",
    "            | \"(\" field \",\" field { \",\" field } [ \",\" ] \")\" ;",
    "",
    "block       = \"{\" { statement } [ expression ] \"}\" ;",
    "statement   = \"let\" pattern [ \":\" type ] \"=\" expression \";\"",
    "            | expression \";\" ;",
    "pattern     = name | \"_\" | \"true\" | \"false\" | integer",
    "            | \"(\" \")\" | \"(\" pattern \")\"",
    "            | \"(\" pattern \",\" [ pattern { \",\" pattern } [ \",\" ] ] \")\"",
    "            | name \"{\" [ pattern_field { \",\" pattern_field } [ \",\" ] ] \"}\"",
    "            | path [ \"(\" [ pattern { \",\" pattern } [ \",\" ] ] \")\" ] ;",
    "pattern_field = [ name \":\" ] pattern ;",
    "path        = name \"::\" name ;",
    "",
    "expression  = atom | \"!\" expression | expression binary_operator expression",
    "            | expression postfix ;",
    "arguments   = [ expression { \",\" expression } [ \",\" ] ] ;",
    "atom        = name | path | integer | \"true\" | \"false\" | \"_\" | block",
    "            | \"(\" \")\" | \"(\" expression \")\" | tuple_expression",
    "            | name \"{\" [ value_field { \",\" value_field } [ \",\" ] ] \"}\"",
    "            | proposition",
    "            | \"if\" expression block \"else\" (block | if_expression)",
    "            | \"match\" expression \"{\" { arm } \"}\"",
    "            | \"loop\" \"(\" state \")\" \"->\" type block",
    "            | \"for\" name \"in\" expression \"..\" expression \"(\" state \")\" block",
    "            | \"break\" expression",
    "            | \"continue\" \"(\" arguments \")\"",
    "            | (\"forall\" | \"exists\") \"(\" nonempty_parameters \")\" block ;",
    "tuple_expression = \"(\" expression \",\" [ expression { \",\" expression } [ \",\" ] ] \")\" ;",
    "value_field = [ name \":\" ] expression ;",
    "arm         = pattern \"=>\" expression [ \",\" ] ;",
    "state       = [ state_parameter { \",\" state_parameter } [ \",\" ] ] ;",
    "state_parameter = name \":\" type \"=\" expression ;",
    "proposition = \"[\" expression \"]\" ;",
    "~~~",
    "",
    "if_expression has the if form above. nonempty_parameters follows parameters but requires at least one parameter. The comma after a match arm may be omitted only when the arm's body is a block, and after the last arm. Binary precedence, highest first: comparisons == != \u003c \u003c= > >=; &&; ||; implication =>. Conjunction and disjunction associate left; implication associates right. Unparenthesized comparison chains are errors. Calls and projections bind tighter than prefix !.",
    "",
    "The parser is more permissive than the language in three places, and the elaborator narrows them: a let pattern must be irrefutable; struct fields and patterns are checked against the declaration; and the body of a quantifier is a block whose only meaningful content is its final formula.",
    "",
    "### Headers and blocks",
    "",
    "Three conventions keep a { unambiguous. They are parsing conventions and do not change typing.",
    "",
    "- In the condition of an if, the scrutinee of a match, and the bounds of a for, name { begins the following block and is not a struct literal. This is Rust's rule. Parentheses, brackets, call arguments, and nested blocks lift the restriction: match (Unit {}) { ... }.",
    "- The proposition of a proof type follows the same rule, because a proof type is usually followed by a body: in -> @claim { given } the braces are the function body.",
    "- In the bounds of a for, the parenthesized group directly before the body is the state list, not a call on the upper bound. for i in 0..limit(a) (acc: u8 = 0) { ... } calls limit and then lists the state. A for with no state writes ().",
    "",
    "=> separates a match arm's pattern from its body and is also implication. A pattern never contains an expression and there are no guards, so the first => after a pattern is the separator and any later one belongs to the body.",
    "",
    "### Executable and math functions",
    "",
    "fn and math fn share parameter, result, and body grammar; the AST records FunctionMode::Runtime or FunctionMode::Math. The semantic rules, from the specification, are:",
    "",
    "- fn accepts/returns executable data and erased proofs, including data/proof tuples. It may diverge, and is checked for partial correctness. Proposition and proof values in its signature are ghost: they are erased and cannot determine executable data or control flow. A proof type such as @[same(x, y)] can mention propositions without passing a proposition object at runtime.",
    "- math fn is a pure, total function. It can accept/return propositions, proofs, and data. It is callable from logic, and also from executable code; it is compiled when its signature contains executable data and erased entirely when its signature is wholly ghost.",
    "- Local Prop bindings and logical calls are allowed in fn bodies as ghost bindings. A ghost value cannot determine executable data, runtime branching, or runtime layout. Proofs can discharge statically checked obligations.",
    "- Unknown runtime inputs can be used symbolically in logic. Compile-time resolution means checking the expression and its dependencies, not knowing every input value or deciding every proposition.",
    "- A runtime fn cannot be used in a proposition. A function used in logic must be a math fn, whose totality is guaranteed syntactically: no general loops and, in the core, no recursion.",
    "",
    "The syntax parser does not enforce these semantic restrictions. Both declaration kinds currently require explicit parameter/result types, and nested declarations are outside the initial grammar.",
    "",
    "### Propositions and bracket expressions",
    "",
    "Propositions are erased logical values of type Prop, not executable Booleans. Logical expressions may refer symbolically to unknown runtime inputs. Their meaning and well-formedness are checked at compile time; neither those inputs nor the truth of every claim must be known at compile time. Merely defining a proposition does not establish it.",
    "",
    "A proposition literal uses brackets, even when its annotation already says Prop:",
    "",
    "~~~",
    "math fn positive(n: u8) -> Prop {",
    "    [n > 0]",
    "}",
    "",
    "const equality_is_reflexive: Prop = [",
    "    forall (n: u8) {",
    "        n == n",
    "    }",
    "];",
    "~~~",
    "",
    "The intended elaboration rules are:",
    "",
    "- The core has no arrays, so [e] always denotes a proposition literal, with or without an expected type: let claim = [n != 0]; binds a Prop. How brackets are shared with arrays once arrays exist is an open question in the specification.",
    "- [], [e,], [a, b], and [e; count] are rejected. A multiline proposition is one formula, not a comma-separated list of claims.",
    "- let claim: Prop = n > 0; is a type error: there is no implicit Boolean-to-proposition conversion. Write let claim: Prop = [n > 0];.",
    "- Existing proposition values do not need wrapping: let another: Prop = claim; and a call returning Prop are valid.",
    "- For p: Prop and q: Prop, !p, p && q, p || q, and p => q construct new propositions directly, without extra brackets. They do not prove, decide, or branch on those claims. Boolean !, &&, and || retain their executable meanings; Boolean conjunction/disjunction retain short-circuit behavior. Implication is a logical operation. Mixed Boolean/proposition operands require an explicit logical formula.",
    "- Logical literals interpret comparisons and connectives logically and permit quantification. They do not execute arbitrary code or make effectful/nonterminating calls valid in logic.",
    "- A local proposition refers to logical snapshots at its definition; later mutation will not change what that proposition means.",
    "",
    "The parser records a bracket expression as ExprKind::Proposition. Enforcing the rules above is the elaborator's work.",
    "",
    "### Proof types and construction",
    "",
    "@claim denotes evidence for a named proposition. @[condition] applies the same type constructor to a proposition literal. Calls to proposition-returning math fn declarations can be used directly, such as @same(x, y), or within literals, such as @[same(x, y)]. Calls and projections belong to the proof target; ungrouped binary operators do not. The target must have type Prop after elaboration.",
    "",
    "An expression _ requests checked evidence for its expected proposition. It cannot assume a claim, stand for unspecified runtime data, or select an arbitrary proposition when no goal is known. Unsolved goals are compilation errors. _ in a binding/destructuring pattern continues to mean ignoring a value; this is a different AST form.",
    "",
    "A proof type (@claim, @[condition]) is not also a proof-producing expression, and @ never begins an expression. Use an annotation to state an explicit goal, such as let evidence: @[n == n] = _;.",
    "",
    "Evidence is built with ordinary expressions. A declared proposition is proved by applying one of its constructors, Small::Below(bound), and used by match. rewrite, unfold, and fold use call syntax with reserved names and need no grammar of their own. Hash-based proof forms are no longer accepted. #[...] and #![...] remain reserved for future attributes and currently receive an unsupported-feature diagnostic.",
    "",
    "### Scope, lexical rules, and recovery",
    "",
    "The final expression supplies a block's result. Every preceding expression statement requires ;, including an if or block expression. Early return is outside this initial grammar. (x) is grouping, (x,) is a tuple, and (out: u8,) is a named one-field tuple type. Named result fields in either kind of function will bind only in subsequent fields; parameter names and local bindings have lexical scope. Constants require an explicit type and are currently top-level declarations; local names use let.",
    "",
    "Identifiers currently use ASCII letters/digits and underscores and cannot begin with a digit. Proposition names follow a lowercase snake_case convention, not a capitalization rule. Integers are decimal digit sequences with optional single underscores between digits; their text is retained without a machine-integer conversion. Numeric suffixes, strings, and raw identifiers are not supported yet. Whitespace, // comments, and nested /* ... */ comments are accepted. Spans use UTF-8 byte offsets, including on invalid Unicode input.",
    "",
    "Parsing has bounded nesting (64 levels) and expression-chain length (128). Recovery can retain a partial AST for diagnostics; a file with any lexical or syntax error is never reported as successfully parsed. Conversely, syntax success does not establish semantic validity: the parser still accepts false proof goals, unbracketed Booleans in Prop contexts, misplaced proof holes, refutable let patterns, and a break outside a loop, for subsequent checking to reject.",
    "",
    "### Notes on the productions",
    "",
    "Formula and PropExpr follow section 7. LogicalExpr is Expr checked in logical mode; it is not a separate token language. IfExpr is the if production above. A variant with a payload is constructed by applying its Path with the call Postfix. A let Pattern is restricted to the irrefutable forms (section 6), which include the constructor pattern of a single-variant, all-proof proposition. The rewrite, unfold, and fold forms of section 8.4 use call syntax with reserved names and need no grammar of their own; the first argument of unfold and fold is a function name.",
    "",
    "Named function signatures, loop signatures, and for state lists are always explicit.",
    "",
    "## 14. Minimum checks an implementation must enforce",
    "",
    "A conforming implementation must reject:",
    "",
    "- A use of an unbound or out-of-scope name in a type or proposition.",
    "- A named projection or labelled constructor field on a tuple; tuple names are type-local binders only.",
    "- Treating a proof about a shadowed binding as a proof about its replacement.",
    "- A field dependency on itself or a later field.",
    "- A field, payload, or result type in which a value selects runtime data layout instead of appearing inside a proposition.",
    "- A named global struct, enum, or prop that implicitly refers to a function-local parameter.",
    "- A declaration cycle: a recursive or mutually recursive function, enum, or prop.",
    "- An unbracketed Boolean expression supplied where a proposition literal is required.",
    "- A bare predicate function supplied where a proposition is required, without application.",
    "- A proof hole that has no expected proof type or cannot be solved.",
    "- A proof type supplied where a different proof type is expected, when the two are not identical under the type identity rule of section 3.1, even if one implies the other.",
    "- Calling an ordinary fn from a proposition or a logical proof computation.",
    "- A loop expression inside a math fn or any logical expression.",
    "- A non-exhaustive match.",
    "- A match on a proof whose result type is not a proof type, except a match with no arms.",
    "- A match on a proof whose scrutinee or any arm is not a total logical computation, even when every arm has a proof type.",
    "- A pattern in an executable match that inspects a ghost position with anything other than a name, a wildcard, or an irrefutable all-proof constructor.",
    "- A prop variant whose conclusion is not an application of the proposition being declared, or whose payload mentions that proposition.",
    "- Treating an expression as erasable because its result is ghost: a potentially divergent call is retained whatever its result type.",
    "- A bounded for without evidence that its bounds are ordered.",
    "- A hole accepted or rejected on the basis of elapsed time.",
    "- Opening an existential proof with let, or letting its witness appear in the result type of the arm that opened it.",
    "- Branching on Prop or proof values at runtime, or any other flow from a ghost binding into executable data or control.",
    "- Extracting executable witnesses from logical existential proofs.",
    "- Returning a type with an unbound block-local, arm-local, or loop-local dependency.",
    "- Continuing a loop or bounded for without re-establishing its state proof fields.",
    "- Assuming a loop parameter retains its initial value after a back edge.",
    "- Assigning or otherwise choosing the index of a bounded for.",
    "- Dropping a potentially divergent call merely because its result is erased.",
    "- Accepting any logical fact that the kernel has not checked.",
    "",
    "## 15. Deferred features and open questions",
    "",
    "What is deferred, what is undecided, and what has been agreed but not yet specified all concern the future of the language, and are kept in [notes.md](notes.md) so that this document describes one thing: the language as it is specified now. References in this document to section 15.1, 15.2, or 15.3 are to the sections of that name in the notes.",
    "",
    "## 16. Semantic completion status",
    "",
    "This is a coherent design specification built from established mechanisms, not a completed soundness proof or a fully formal executable semantics. It is detailed enough to guide a reference interpreter and checker, but several obligations must be made precise and validated before treating an implementation as trusted.",
    "",
    "### 16.1 The intended model",
    "",
    "The plan for soundness is a denotational model that adapts Ghalayini and Krishnaswami's explicit refinement types (section 17), whose development is mechanized in Lean 4 and can serve as a starting point. It replaces the earlier plan of embedding the kernel into Lean's logic. It is an adaptation and not a reuse: in that calculus a value is its erased value, which is not true of Locus.",
    "",
    "Locus needs two layers, because a logical value cannot always be identified with its runtime representation. Claim { proposition: [true] } and Claim { proposition: [false] } have the same, empty, representation, yet the logic must tell them apart, since projection and equality substitution apply to them.",
    "",
    "- A logical value keeps everything the logic can observe: executable data, Prop fields, and other ghost data. It keeps no proof contents; a proof field contributes only the requirement that its proposition holds.",
    "- A type denotes a set of logical values. A proposition denotes a classical truth value, relative to the logical values of the variables in scope. Prop denotes the two truth values, so predicates and Prop parameters are ordinary functions and arguments. A function type denotes functions between the denoted sets, which is what gives equality at function types its meaning (section 7.2).",
    "- Every type erases to a simple type (section 11.1), and a representation relation connects each logical value to the runtime values that represent it. For first-order data it is the function that forgets ghost data. For a type with no ghost data fields, such as NonZero, it is the identity, and the type is simply a subset of its erased type: the subset reading remains exact there, and is not claimed beyond it. For functions it relates a logical function to any runtime function that maps representations of arguments to representations of results.",
    "- A math fn must denote a total function on logical values, represented by its erasure.",
    "- An ordinary fn must erase to a partial function whose result, when there is one, represents a logical value of the result type. This is the partial-correctness reading of section 6.3. The cited calculus is total and lists divergence as future work; this clause is the part Locus must supply itself.",
    "",
    "The model stays tractable because value dependence is confined to propositions (section 3): erasing a type never needs a value, and the representation relation is defined by recursion on simple types.",
    "",
    "The two target theorems are corollaries of showing that every well-typed term's erasure represents a logical value in the denotation of its type:",
    "",
    "- The logic is consistent: no closed math term has type @[false].",
    "- Well-typed programs do not go wrong: erasure preserves observable behavior, including divergence, and no trap is evaluated.",
    "",
    "### 16.2 Remaining obligations",
    "",
    "1. Give program evaluation an exact operational semantics, and define precisely the per-path logical statements of section 6.3, including the continuation scope of evidence returned by potentially divergent functions.",
    "2. Define elaboration from the surface into explicit binder identities, product and payload dependencies, and kernel terms, including the silently inserted equality steps of section 12.2.",
    "3. Turn the rule inventory of section 12.2 into exact typing rules: the term language, the two recursion rules, the u8 model and its reflection lemmas, comparison with proof irrelevance, the computation axioms, the index-equation case rule, and the evaluation rule. Check each rule against the model of section 16.1. Until that is done, consistency is a goal, not a result.",
    "4. State the upgrade-based ghost rules of section 2.4 as typing rules, and prove the three erasure properties of section 11.2.",
    "5. Establish the usual scope/substitution and typing-preservation properties, and test the rejection boundaries with small counterexamples.",
    "",
    "A small implementation can expose missing rules. Passing tests is useful evidence but is not a proof of consistency or preservation.",
    "",
    "## 17. Relationship to Rust and a possible interoperability path",
    "",
    "At this stage Locus is a small immutable, typed language with a proof system. Machine types, let bindings, shadowing, functions, tuples, named structs, enums, and match are familiar to Rust programmers. It does not yet contain Rust's ownership, borrowing, mutable references, resource destruction, traits, generics, or broad collection APIs. The explicit list of unsupported Rust features, of Locus constructs that are not Rust, and of places where the two currently conflict is maintained in Appendix A.",
    "",
    "The logical layer is closer to a restricted dependent type theory: propositions, evidence, and dependent proof fields are checked by a kernel. It is much smaller than Lean's exposed type system and libraries: there are no types indexed by values, no first-class types or universes, no type-level computation, and no quotients. What it keeps is roughly classical higher-order logic with declared data and declared propositions, plus proof-carrying data. The closest formal relative is the explicit refinement calculus of Ghalayini and Krishnaswami: refinements with explicit, erased proofs and ghost variables over a simply typed base, with no judgmental equality. Locus adds potentially divergent functions, declared propositions, propositions as values, and bounded automation. The runtime/math distinction is a Locus design choice; it should not be mistaken for a complete model of Lean's runtime facilities.",
    "",
    "A practical proposed route toward Rust interoperability is:",
    "",
    "1. Erase propositions and proofs as defined in section 11, generate ordinary Rust code, and compile it through Cargo. Ghost positions become the zero-sized markers Proved and Ghost, so the generated code keeps the shape of the source (section 11).",
    "2. Introduce explicit Rust imports for supported data and function signatures. Foreign code starts as executable code; it does not acquire a mathematical meaning or produce trusted proofs merely because it is callable.",
    "3. Extend ownership, borrowing, lifetimes, mutation, destruction, and panic/effect semantics as the supported interfaces require.",
    "4. Add generics and traits with explicit rules connecting executable operations to their logical specifications.",
    "5. If a separate native backend is desired, use deliberate ABI boundaries and generated wrappers instead of assuming arbitrary Rust binaries have a stable calling convention.",
    "",
    "Generated Rust can use Rust's own source-level type and ABI decisions. An independent compiler must instead arrange explicit calling-convention and layout compatibility. Rust's default ABI has no stability guarantee, and its default representation leaves layout choices unspecified. Extern C and suitable repr(C)/transparent wrappers are possible boundaries for supported types; Rust tuples are not automatically C-FFI-safe.",
    "",
    "Unverified Rust calls must not manufacture evidence. A property of a foreign result requires a checked Locus validation step, verification of the foreign implementation, or an explicit trusted contract. Proof erasure also means Rust can ordinarily supply a data representation without supplying its logical guarantee; exported proof-requiring interfaces therefore need an explicit trust or validation policy.",
    "",
    "These are an interoperability direction and its constraints, not an implementation claim.",
    "",
    "References:",
    "",
    "- [Ghalayini and Krishnaswami, Explicit Refinement Types, ICFP 2023](https://arxiv.org/abs/2311.13995)",
    "- [Rust let statements and shadowing](https://doc.rust-lang.org/reference/statements.html)",
    "- [Rust enumerations](https://doc.rust-lang.org/reference/items/enumerations.html)",
    "- [Rust match expressions](https://doc.rust-lang.org/reference/expressions/match-expr.html)",
    "- [Rust external blocks and ABI guarantees](https://doc.rust-lang.org/reference/items/external-blocks.html)",
    "- [Rust type layout](https://doc.rust-lang.org/reference/type-layout.html)",
    "- [Rust representations and FFI](https://doc.rust-lang.org/nomicon/other-reprs.html)",
    "- [Lean function types and binding](https://lean-lang.org/doc/reference/latest/The-Type-System/Functions/)",
    "- [Lean inductive types and structures](https://lean-lang.org/doc/reference/latest/The-Type-System/Inductive-Types/)",
    "- [Lean propositional equality](https://lean-lang.org/doc/reference/latest/Basic-Propositions/Propositional-Equality/)",
    "- [Lean quantifiers](https://lean-lang.org/doc/reference/latest/Basic-Propositions/Quantifiers/)",
    "",
    "## Appendix A. Rust features and Locus",
    "",
    "This appendix is the explicit record of how the Locus core relates to Rust: what is supported, what is supported differently, what is not supported, what Locus adds, and where the two currently conflict. It tracks the fragment specified above, and is updated with it.",
    "",
    "Keep this file current. Any change to the specification that adds, removes, or alters a Rust-visible construct must update the matching row here.",
    "",
    "Status values:",
    "",
    "| Status | Meaning |",
    "|---|---|",
    "| Supported | Same surface form and the same meaning as Rust, within the fragment. |",
    "| Differs | Present, but with a different form or a restricted meaning. The note says how. |",
    "| Deferred | Not in the core. Intended later; the note gives the README milestone when one exists. |",
    "| Unplanned | Not in the core and with no current plan. |",
    "",
    "### 1. Supported, or supported with differences",
    "",
    "| Rust feature | Status | Notes |",
    "|---|---|---|",
    "| `bool`, `true`, `false` | Supported | |",
    "| `u8`, decimal literals | Differs | No literal suffixes, hex, octal, or binary forms. Underscore separators are accepted. |",
    "| Unit `()` and tuples | Differs | A tuple type may name its fields, `(value: u8, @[value != 0])`. The names are binders for later field types only; access, construction, and patterns stay positional. |",
    "| `.0`, `.1` tuple projection | Supported | Erased fields still occupy a source position. |",
    "| Named-field `struct` | Differs | Fields are ordered, may be unnamed, and may be accessed positionally as well as by name. A later field's type may mention an earlier field inside a proposition. No field-init shorthand, no reordering, no `..base` update. |",
    "| `enum` | Differs | Unit and tuple-style variants only. Non-recursive. Variants are always written `Enum::Variant`. No struct-style variants, explicit discriminants, or `as` casts. |",
    "| `match` | Differs | Exhaustive, ordered arms; name, wildcard, literal, tuple, struct, and variant patterns, nested. No guards, `\\|` alternatives, ranges, `@` bindings, or `ref`. Each arm also receives checked evidence about the scrutinee. |",
    "| `if` / `else` | Differs | `else` is required. Defined as `match` on `bool`; each branch receives evidence of the condition's value. |",
    "| `let` and shadowing | Supported | Bindings are immutable. Irrefutable patterns only. |",
    "| Block expressions, trailing expression | Supported | |",
    "| `fn` items | Differs | Parameter and result types are always explicit. Result types may name their fields and depend on parameters. Top level only. No recursion. |",
    "| Function pointer types `fn(A) -> B` | Differs | Inhabited by the names of declared functions. A `math fn(A) -> B` type also exists. |",
    "| `const` items | Differs | The initializer is a total logical expression. |",
    "| Method-call syntax `x.wrapping_add(1)` | Differs | Only for primitive operations: `wrapping_add`, `wrapping_sub`. No user methods. |",
    "| Comparison operators `== != \u003c \u003c= > >=` | Differs | Defined on `u8` and `bool` only. No chaining. No equality on products, enums, or functions at runtime. |",
    "| `!`, `&&`, `\\|\\|` | Supported | Short-circuit on `bool`. The same tokens build propositions when the operands are `Prop`. |",
    "| `loop` | Differs | Carries explicit state: `loop (s: T = init) -> R { ... }`. There is no bare `loop { }`. |",
    "| `break value` | Supported | Targets the nearest `loop`. No labels. |",
    "| `continue` | Differs | Takes the next state: `continue(next_1, next_2)`. No labels. |",
    "| `for` | Differs | Only `for i in lo..hi (state) { ... }` over a `u8` range, with explicit state and no `break` (proposed form). Requires evidence that `lo \u003c= hi`; a reversed range is rejected, where Rust treats it as empty. No iterators. |",
    "| Line and nested block comments | Supported | Doc comments have no special meaning. |",
    "| Attributes `#[...]`, `#![...]` | Deferred | Reserved; currently rejected with a diagnostic. |",
    "",
    "### 2. Not supported",
    "",
    "#### 2.1 Types",
    "",
    "| Rust feature | Status | Notes |",
    "|---|---|---|",
    "| Other integer types: `u16` to `u128`, `i8` to `i128`, `usize`, `isize` | Deferred | Milestone 2. Added by the same rules as `u8`. |",
    "| Arithmetic and bit operators: `+ - * / %`, `& \\| ^ \u003c\u003c >>`, unary `-`, compound assignment | Deferred | Milestone 2. Needs the overflow policy: an obligation over the mathematical value. |",
    "| `as` casts and numeric conversions | Deferred | Milestone 2. |",
    "| `f32`, `f64` | Unplanned | |",
    "| `char`, `str`, `String`, string, char, and byte literals | Deferred | With collections, milestone 10. |",
    "| Arrays `[T; N]`, slices `[T]`, indexing `a[i]`, array literals | Deferred | Milestones 9 and 10. The bracket syntax conflicts with proposition literals; see section 4. |",
    "| References `&T`, `&mut T`, lifetimes | Deferred | Milestone 9. |",
    "| Raw pointers | Unplanned | Listed in the README as following the foundation. |",
    "| `Box`, `Rc`, `Arc` | Deferred | With recursion and ownership. In the logic they are transparent wrappers around `T`. |",
    "| `Vec`, maps, sets, the standard library | Deferred | Milestone 10. |",
    "| Recursive types | Deferred | Milestone 4, with structural recursion. |",
    "| Tuple structs `struct P(u8, u8);` and unit structs | Deferred | Named-field struct syntax covers unnamed fields meanwhile. |",
    "| Struct-style enum variants, explicit discriminants | Deferred | |",
    "| `union` | Unplanned | |",
    "| Never type `!` | Deferred | A match with no arms on a proof of `false` plays this role inside verified code. |",
    "| Type aliases `type` | Deferred | |",
    "| Generics and const generics | Deferred | Milestone 3. |",
    "| Traits, `impl` blocks, user methods, associated items, trait objects `dyn`, `impl Trait` | Deferred | Milestone 12. |",
    "| Closures and the `Fn`, `FnMut`, `FnOnce` traits | Deferred | Logic-only lambdas come first; runtime closures follow the foundation. |",
    "",
    "#### 2.2 Bindings, ownership, and state",
    "",
    "| Rust feature | Status | Notes |",
    "|---|---|---|",
    "| `let mut`, assignment | Deferred | Milestone 7. |",
    "| Moves, borrows, the borrow checker, `Copy` and `Clone` | Deferred | Milestone 9. Every core value is immutable and freely reusable. |",
    "| `Drop` and destructors | Deferred | After the foundation. |",
    "| Interior mutability: `Cell`, `RefCell`, `Mutex` | Deferred | After the foundation. Types that allow cycles are not inductive in the logic. |",
    "| `static` items | Unplanned | |",
    "| Threads, `Send`, `Sync`, atomics | Deferred | After the foundation. |",
    "| `async` / `await` | Deferred | After the foundation. |",
    "| `unsafe` blocks and functions | Unplanned | |",
    "",
    "#### 2.3 Control flow and expressions",
    "",
    "| Rust feature | Status | Notes |",
    "|---|---|---|",
    "| Recursive and mutually recursive functions | Deferred | Milestone 4. Declarations are acyclic in the core. |",
    "| `if` without `else` | Deferred | |",
    "| `if let`, `let ... else`, `while let` | Deferred | |",
    "| `while` | Deferred | Milestone 8, elaborating to state-passing loops. |",
    "| `for` over iterators, ranges as values | Deferred | With traits. |",
    "| Bare `loop { }`, loop labels, labelled `break` and `continue` | Deferred | Milestone 8. |",
    "| `return` | Deferred | |",
    "| `?` operator | Deferred | With generics. |",
    "| Match guards, `\\|` patterns, range patterns, `@` bindings, `ref` patterns, slice patterns | Deferred | Guards interact with the `=>` conflict in section 4. |",
    "| Refutable patterns in `let` | Deferred | |",
    "| Struct update `..base`, field-init shorthand | Deferred | |",
    "| Panics, `panic!`, unwinding, `catch_unwind` | Deferred | Milestone 11. The core's only non-returning behavior is divergence. |",
    "| Macros: `macro_rules!`, procedural macros, `println!` and other std macros | Unplanned | |",
    "| Input and output, `fn main`, process entry | Deferred | Milestone 1 defines how generated Rust is invoked. |",
    "",
    "#### 2.4 Items and program structure",
    "",
    "| Rust feature | Status | Notes |",
    "|---|---|---|",
    "| Modules `mod`, `use`, paths other than `Enum::Variant`, visibility `pub` | Deferred | Milestone 5. |",
    "| Crates, Cargo dependencies, `extern crate` | Deferred | Milestone 11. |",
    "| `extern` blocks, FFI, calling Rust from Locus | Deferred | Milestone 11. Requires marked trusted declarations. |",
    "| Exporting Locus functions to Rust callers | Deferred | Milestone 11. Proof parameters need checked wrappers or validated types. |",
    "| Items nested inside function bodies | Deferred | |",
    "| `const fn`, const evaluation | Unplanned | `math fn` is the closest analogue: a restricted subset usable in a second context. |",
    "| Type inference for function signatures | Unplanned | Signatures stay explicit. |",
    "",
    "### 3. Locus constructs that are not Rust",
    "",
    "| Construct | Purpose |",
    "|---|---|",
    "| `math fn` | A pure, total function, callable from both code and logic. Lemmas and predicates are math functions. |",
    "| `Prop` | The type of logical claims. |",
    "| `@P`, `@[formula]` | The type of proofs of a proposition. |",
    "| `[formula]` | A proposition literal, with logical `==`, comparisons, connectives, `forall`, and `exists`. |",
    "| `=>` between propositions | Implication. |",
    "| `forall (x: A) { ... }`, `exists (x: A) { ... }` | Quantifiers inside a formula. |",
    "| `prop Name(params) { variants }` | A user-declared proposition, given by its proof constructors. |",
    "| `_` in expression position | A request for a checked proof of the expected proposition. |",
    "| `rewrite(eq, h)`, `unfold(f, h)`, `fold(f, h)` | Built-in proof forms: transport along an equality or a function's defining equation. |",
    "| Applying a proof, `all(n)`, `imp(hp)` | Instantiating a quantified or implicational proof. |",
    "| Named tuple fields and dependent field types | Letting a proof field describe a data field. |",
    "| `loop (state) -> R`, `continue(next)`, `for i in lo..hi (state)` | State-passing iteration for an immutable language. |",
    "| Ghost bindings | Bindings that exist only for the checker. Implicit in the core; a `ghost` keyword is deferred. |",
    "",
    "### 4. Known conflicts with Rust syntax",
    "",
    "A Rust superset stays reachable only if Locus never gives valid Rust syntax a different meaning. Whether to adopt that as a rule is an open question in the specification (section 15.2). These are the current violations and near-misses.",
    "",
    "| Locus form | Conflict | Proposed resolution |",
    "|---|---|---|",
    "| `[n > 0]` as a proposition literal | Valid Rust: a one-element `[bool; 1]` array. In the core a bracketed expression is always a proposition literal. Also collides with array types, slices, and indexing once those exist. | Drop the literal form. Elaborate an expression as a formula wherever a `Prop` is expected, and write the proof type as `@(n > 0)`. |",
    "| `=>` as implication | Rust uses `=>` for match arms. Unambiguous only while guards are absent. | Spell implication `==>`. |",
    "| `prop`, `math`, `in` as words | Valid Rust identifiers, except `in`. | Treat as contextual keywords, reserved only where the grammar expects them. |",
    "| Erased fields in tuples and structs | Not a syntax conflict. A proof field, parameter, or result appears in generated Rust as the zero-sized marker `Proved`, and a proposition as `Ghost`, so positions, arity, and patterns match the source. Signatures show the markers. | Settled; see specification section 11. |",
    "",
    "Forms that occupy positions where Rust has no valid syntax, and are therefore safe extensions: `math fn`, `@` in type position, `loop (...)`, `continue(...)`, `for ... (state) { }`, named tuple fields, and an enum or struct that refers to itself without `Box` (rejected by Rust as infinitely sized; not yet accepted by Locus either).",
    ""
   ],

  {
   "id": "architecture",
   "title": "Architecture",
   "group": "Reference",
   "body": [
    "# Architecture",
    "",
    "This document describes how the compiler is built: its intermediate representations, what each contains, which passes connect them, which passes are trusted, and the elaborator that produces the first of them from source. The language is defined in [language.md](language.md) and the kernel's rules in [the kernel contract](kernel-contract.md).",
    "",
    "## The three representations in brief",
    "",
    "| Name | What it is | Made by | Used by |",
    "|---|---|---|---|",
    "| **Typed tree** | The source program made fully explicit: every name resolved, every type present, every hole replaced by the proof that was found. It keeps the shape of the source. | the elaborator (untrusted) | `lower` and `erase` |",
    "| **Check IR** | A flattened form of the typed tree that exists only to be verified: executable code in let-normal form over kernel terms and proofs. Nothing prints or runs it. It lives in `src/exec/`. | `lower` (trusted) | the exec checker and the kernel |",
    "| **Erased tree** | The typed tree with the logic taken out: the same shape, containing only what exists at runtime. | `erase` (trusted) | the reference interpreter and the Rust printer |",
    "",
    "One program, the typed tree, is both verified, through the check IR, and executed, through the erased tree.",
    "",
    "## Goals",
    "",
    "1. What is verified is what runs. A program is checked and executed from one shared artifact.",
    "2. The generated Rust reads like the Locus that was written: the same names, nesting, declaration order, and control structure. Layout is left to rustfmt.",
    "3. The trusted passes are small, syntax-directed, and individually testable.",
    "4. Proof search, inference, and diagnostics stay untrusted.",
    "",
    "Goal 2 rules out printing Rust from a lowered form. Once a program is in let-normal form with case trees and positional fields, recovering `let next = i.wrapping_add(1);` is decompilation, and the pass that does it would be both fragile and trusted. So the shared artifact is source-shaped, and lowering is a side branch used only for checking.",
    "",
    "## The pipeline",
    "",
    "~~~",
    "source text",
    "   |  parser                                   (exists)",
    "   v",
    "Surface AST        syntax as written: spans, sugar, names as strings",
    "   |  name resolution                          (untrusted)",
    "   v",
    "Resolved AST       the same shape; every name is a binding or declaration identity",
    "   |  elaborator                               (untrusted)",
    "   v",
    "Typed tree         the source program made fully explicit",
    "   |",
    "   +--- lower (TRUSTED) ---> Check IR ---> exec checker + kernel (TRUSTED)",
    "   |",
    "   +--- erase (TRUSTED) ---> Erased tree ---> Rust printer ---> rustfmt ---> rustc",
    "                                        \\---> reference interpreter",
    "~~~",
    "",
    "| Layer | Contains | Holds once built |",
    "|---|---|---|",
    "| Surface AST | what the user typed | it parses |",
    "| Resolved AST | identities in place of names | scoping and shadowing are settled (specification section 2) |",
    "| Typed tree | explicit types, filled holes, identities for everything that binds | nothing; it is a claim until its check IR is accepted |",
    "| Check IR | let-normal executable code over kernel terms and proofs | accepted by the exec checker and the kernel |",
    "| Erased tree | data and control only, in the shape of the typed tree | a proof or a ghost cannot be represented |",
    "",
    "The resolved tree is a stage of the design and not a data structure in the implementation: the elaborator resolves each name against its scope as it builds the typed tree, after ordering the declarations by what they mention (see The elaborator, below).",
    "",
    "## The typed tree",
    "",
    "The typed tree is the source program with nothing left implicit. It has two kinds of content.",
    "",
    "The executable skeleton mirrors the source: the same nesting, names, and declaration order; `if` stays `if`, `match` stays `match`, method-call syntax is kept, `let` patterns stay patterns. This is what `erase` projects and the printer prints, so it must look like what was written.",
    "",
    "The logical annotations are kernel-level: propositions and ghost values are kernel `Term`s, proofs are kernel `Proof`s, and types are kernel `Type`s. They never reach the output, so they need no source shape. Every hole has been replaced by the proof the elaborator found.",
    "",
    "The typed tree carries identities for everything the checker will bind: each `let`'s variable and its defining equation, each branch's and arm's fact, each arm's payload variables, each loop's state variables, and each call's result. The elaborator writes proofs against these identities, and `lower` uses the same ones, which is what keeps a proof written against the typed tree valid in the check IR.",
    "",
    "The nodes that stand for a place or a call carry their type (a variable, a field access, a call), and the control forms carry their result type. That is enough to tell, for any expression, whether its value is a proof, which both `lower` and `erase` need to know. Types here are kernel types written over the identities of the binders in scope; `lower` turns a signature or a loop's state into the telescope the kernel wants.",
    "",
    "The body of a math function is a source-shaped tree too, because it is printed like any other function. `lower` turns it into a kernel `Term`.",
    "",
    "The metadata the typed tree needs for faithful printing is modest and lives in the tree naturally: identifier and field names, literal spellings (the lexer keeps them), and documentation comments on declarations.",
    "",
    "Initially the typed tree has flat patterns only: one constructor deep, as the kernel's `case` is. The elaborator nests matches, and the output shows nested `match`es. Keeping nested patterns in the typed tree, with `lower` compiling them to case trees, is a later refinement that adds trusted code.",
    "",
    "## The check IR",
    "",
    "The check IR exists to be checked. It is never printed or run in production.",
    "",
    "- Types are kernel `Type`s. Pure subexpressions are kernel `Term`s. Every ghost position holds a kernel `Proof`.",
    "- An ordinary `fn` body is in let-normal form. Every intermediate result of a computation that may diverge has a name. The right side of a binding is a pure kernel term, a call to an ordinary `fn`, or a control form (`match`, `loop`, `for`). A `for` here is for a body that is not pure, one that calls ordinary functions; a `for` with a pure body is a kernel term. Its state is given as a function type from the index to the state's tuple type, which is how a state type mentions the index. A block ends in a value, `break`, `continue`, or a `match` of blocks.",
    "- A math function body is a kernel `Term`.",
    "",
    "Let-normal form makes the trusted checker a simple walk that maintains a kernel `Context`, which is specification section 6.3 made concrete:",
    "",
    "| Check IR | Effect on the kernel context |",
    "|---|---|",
    "| `let x = pure term` | declare `x` and assume `x == term` |",
    "| `have h: P by proof` | check the proof, then assume `P` as `h` |",
    "| `let x = f(args)`, `f` an ordinary `fn` | check the arguments against `f`'s parameters; declare `x : R[args]` with no defining equation |",
    "| a `match` arm | declare the payload variables and assume `scrutinee == variant(payload)` |",
    "| a `loop` | declare abstract state variables; `continue` arguments and the initial values are checked against the state telescope, `break` values against the result type |",
    "| a bounded `for` | check that the bounds are executable bytes and that the given proof shows `lo \u003c= hi`; check the initial values against the state at `lo`; declare the index and abstract state at the index, and assume `lo \u003c= index` and `index \u003c hi`; `continue` arguments are checked against the state at `index + 1`; there is no `break`; the result is the state at `hi` |",
    "",
    "Pure terms are typed by the kernel in `Executable` mode, which is what enforces the ghost rules: a ghost variable cannot be the scrutinee of an executable match, an executable argument, or executable data. A value returned by a call is an opaque variable; evidence returned with it is reached by projection. Nothing about termination is checked, and a math function cannot mention an ordinary `fn` at all, because kernel terms have no way to name one.",
    "",
    "## Lowering and erasure",
    "",
    "Both are defined by recursion on the typed tree, against one stated evaluation order: left to right, as the specification says.",
    "",
    "`lower` is a desugaring: `if` to `case` on `bool`, nested expressions to let-normal form, operators and methods to primitives, patterns to projections and case arms, each binder to the identity the typed tree already gave it. It works item by item, in a session: each struct, enum, and function is checked as it is declared, and the identity it receives is what later items use to refer to it. In detail:",
    "",
    "- A pure expression becomes a kernel term. An expression is pure when evaluating it always returns and transfers no control: no call to an ordinary function, no `loop`, no `break` or `continue`. A bounded `for` is pure when its body is, apart from the `continue` that ends it, and then it becomes the kernel's `for` term; otherwise it becomes a statement of the check IR. The body of a math function must be pure.",
    "- An expression that is not pure is put in let-normal form: each step that may not return becomes a statement, in source order, under the identity the typed tree gave it. A nested call such as `increment(increment(n).0)` is two statements, and the tree had already named both results, so a proof can speak of either.",
    "- A kernel term has no `let`. In a pure block, each `let` is substituted into what follows, and the equation it would have provided becomes an instance of reflexivity. In a block of the check IR, a `let` is a statement and keeps its equation.",
    "- A condition that is a negation, `a != b`, branches on the comparison `a == b` with the branches exchanged, because branch facts are about the comparison performed, which is what the kernel's reflection axioms speak of.",
    "- The kernel wants a proof-typed position inside a term to hold `proof(...)`. A proof-typed variable, field, or call is a fine expression in the source, as in `break (i, bound)`, so `lower` wraps it as `proof(of_term(...))`.",
    "",
    "`erase` is a projection that preserves shape exactly (specification section 11). Each type becomes its erased type. A ghost position does not disappear: it is filled by a named zero-sized marker, `Proved` for a proof and `Ghost` for any other ghost value, which in the core means a proposition. So field positions, tuple arity, parameter lists, and patterns are the same in the output as in the source, and `erase` never renumbers, collapses, or moves anything.",
    "",
    "| Locus | Rust |",
    "|---|---|",
    "| `fn increment(n: u8) -> (out: u8, @[out == n.wrapping_add(1)])` | `fn increment(n: u8) -> (u8, Proved)` |",
    "| `(out, _)` | `(out, Proved)` |",
    "| `let (value, _) = increment(n);` | `let (value, _) = increment(n);` |",
    "| `let h: @[n != 0] = _;` | `let h = Proved;` |",
    "| `continue(next, next_bound);` | the same, as an assignment of the loop's state |",
    "| `struct NonZero { value: u8, evidence: @[value != 0] }` | `struct NonZero { value: u8, evidence: Proved }` |",
    "| `let p: Prop = [n == 3];` | `let p = Ghost;` |",
    "",
    "A ghost-typed expression that is a variable stays that variable: a proof bound by a `let` or a pattern is an ordinary Rust binding of type `Proved`. Any other ghost-typed expression becomes its marker when its computation is erasable, and `{ effects; marker }` when something in it must still run. `And::Intro(spin(), h)`, with `spin` a divergent `fn` returning a proof, becomes `{ spin(); Proved }`. A call such as `spin()` on its own needs nothing: its erased result type is already `Proved`. Evaluation order is the source's, because nothing has been removed.",
    "",
    "A math function whose signature is entirely ghost, a lemma or a predicate, has no runtime form and is not emitted. An empty match used for its value becomes a trap.",
    "",
    "What necessarily differs between the Locus source and the Rust output: the markers; `math fn` becomes `fn`; `loop (s: T = init) -> R { ... continue(next) }` becomes mutable state and a Rust `loop`; `for i in lo..hi (state) { ... }` becomes mutable state and a Rust `for`; and Locus-only syntax such as proof types in annotations.",
    "",
    "### The markers",
    "",
    "Every generated crate carries two unit structs, `Proved` and `Ghost`, that are `Clone` and `Copy`. They occupy no space and the optimizer removes every trace of them.",
    "",
    "The alternatives considered were removing ghost positions, which gives the most idiomatic signatures but renumbers positions, collapses one-field tuples, and forces retained computations to be hoisted into statements; and a bare `()`, which keeps shape but says nothing. Named markers keep the shape of the source, make the output self-describing, and keep `erase` a pure projection. Their cost is that signatures show them.",
    "",
    "Two refinements are expected and change nothing now. When the `ghost` keyword brings ghost data, `Ghost` can carry the type it stands for, `Ghost\u003cT>` backed by `PhantomData\u003cT>`: `ghost model: Seq\u003cT>` would print as `model: Ghost\u003cSeq\u003cT>>`, which keeps the type visible and keeps a type parameter that occurs only in ghost fields in use, where Rust would otherwise reject the declaration. With generics, a type parameter instantiated with a proof type is simply `Proved`.",
    "",
    "A marker does not make an exported function safe to call from Rust: Rust cannot tie a `Proved` to the value it is about, so foreign code could pass one for the wrong value. For exported interfaces the evidence is carried by privacy instead, a validated type with a private field and a checked constructor, and functions that take markers stay crate-private. That belongs to the Rust interoperability milestone.",
    "",
    "## Agreement between the two branches",
    "",
    "The checker sees the lowering of the typed tree; the machine runs its erasure. Their agreement rests on three things.",
    "",
    "1. Construction. Both passes are small, syntax-directed recursions over one tree with one evaluation order.",
    "2. Differential testing. An interpreter for the check IR that skips ghosts and the interpreter for the erased tree must agree on every test program, including on running out of fuel. This runs on every example.",
    "3. A theorem, eventually. \"Erasure preserves behavior\" is already a proof obligation in specification section 16. It is restated as: for every typed tree, its erasure behaves as its lowering does with ghosts ignored.",
    "",
    "A second cheap check guards `erase` alone: the erased tree has its own simple type checker, and everything `erase` emits must pass it. A dangling ghost reference or a renumbering mistake fails there.",
    "",
    "## Interpreter and Rust generation",
    "",
    "Both consume the erased tree.",
    "",
    "The reference interpreter comes first. It is small, needs no toolchain in tests, gives the semantics an executable definition, and has a fuel counter so that divergence is observable: \"the caller of a divergent function still diverges after erasure\" is tested as running out of fuel, not as returning a value. It takes the meaning of the primitives from the kernel's native evaluation, so logic and execution share one definition. It does not reuse the kernel's term evaluator, which is trusted and covers total terms only.",
    "",
    "Rust generation is a printer over the erased tree, tested by compiling its output with rustc under `-D warnings`, running it, and comparing what it prints with the interpreter's results.",
    "",
    "The two loop forms have no direct Rust spelling and are printed through mutable state. The state lives in variables of its own, and each iteration rebinds the source's names from them, so a `let` in the body that shadows a state name cannot disturb the loop, as in Locus:",
    "",
    "~~~",
    "fn bounded_walk(limit: u8) -> (u8, Proved) {",
    "    let mut state_i: u8 = 0;",
    "    let mut state_bound: Proved = Proved;",
    "    loop {",
    "        let i = state_i;",
    "        let bound = state_bound;",
    "        if i == limit {",
    "            break (i, bound);",
    "        } else {",
    "            let differs = Proved;",
    "            let below = Proved;",
    "            let next = i.wrapping_add(1);",
    "            let next_bound = Proved;",
    "            (state_i, state_bound) = (next, next_bound);",
    "            continue;",
    "        }",
    "    }",
    "}",
    "~~~",
    "",
    "The right side of the assignment is evaluated in full before any state changes, which is what `continue(next...)` means. These temporaries are the kind of modest departure from the source that is accepted where it makes correctness simple. Every value in the core is immutable and freely reusable, so generated structs and enums derive `Copy`.",
    "",
    "## The trusted base",
    "",
    "The kernel; the exec checker; `lower`; `erase`; the Rust printer; and the Rust toolchain. The parser, name resolution, the elaborator, the hole solver, the derived proof forms, the prelude's lemmas, and both interpreters are not trusted: a fault in any of them produces a rejection or a failing test, not a false theorem.",
    "",
    "Compared with checking a lowered core directly, `lower` has moved into the trusted base. In exchange the typed tree is much closer to the source than a lowered core is, so the distance between what was written and what was verified is smaller.",
    "",
    "## The elaborator",
    "",
    "The elaborator turns a parsed file into typed trees and hands each item to the `Session`, which lowers it, has the kernel check it, and erases it ([IR architecture](#the-elaborator)). It lives in `src/elab/`. Nothing in it is trusted: a mistake here produces a program the kernel rejects, never an accepted wrong one.",
    "",
    "It does four jobs that the plan lists separately: name resolution, type elaboration, filling each `_` with an explicit proof, and the diagnostics for all three. There is no separate resolved syntax tree. Names are resolved against a scope as expressions are elaborated, and declarations are ordered first by what they mention.",
    "",
    "### Order of declarations",
    "",
    "An item is checked when it is declared, so everything it mentions must already exist. `order.rs` reads dependencies off the syntax: every name an item writes that is also the name of an item. Items are elaborated dependencies first, whatever order the file lists them in. A cycle is an error (`L0203`), because the core has no recursion. A local that shadows an item's name counts as a mention of it, which can only add an edge.",
    "",
    "When an item is rejected, the items that mention it are skipped without a second report.",
    "",
    "### The mirrored context",
    "",
    "Proofs in a typed tree refer to identities: the binder of each `let`, the fact of each branch and arm, the result of each call. The checker binds those identities as it walks the lowered program. While it works, the elaborator keeps a kernel context of its own with the same identities, bound in the same order, so that it can:",
    "",
    "- ask the kernel what a term's type is, instead of recomputing it (a projection's type, a `let` binder's type);",
    "- test every proof it finds with the kernel before using it, so that a failure is reported at the `_` and not as a rejection of the whole function.",
    "",
    "The mirrored context must never hold more than the checker's will. Three rules keep it so. A branch, an arm, a loop body, and a quantifier end with a rollback. A block used as an expression keeps its declarations, because the checker splices its statements into the enclosing sequence, and forgets its names and facts. The term that stands for an expression's value is computed by `typed::value_term`, which is lowering's own rule without the lowering.",
    "",
    "### Bidirectional elaboration",
    "",
    "An expression is elaborated against the type expected of it when there is one. That is how `_` learns what to prove, how a tuple checked against `(out: u8, @[out == n])` learns that its second field speaks of its first, and how `Or::Left(h)` learns which disjunction it proves. Arguments, struct fields, variant payloads, loop state, and `continue` are all checked against a telescope: each value's term replaces its binder in the types that follow.",
    "",
    "Inside `[ ... ]` and proof types, `logic.rs` builds kernel propositions directly: a comparison is a claim, and `&&`, `||`, `!`, `=>` are connectives. Outside, `a && b` on booleans is an `if`, which is also how the right operand comes to know the left one held.",
    "",
    "Evidence of one claim is accepted where another is wanted when the solver can bridge them. This is what lets `still`, which is evidence about `step(...).0`, be passed where evidence about `next` is wanted after `let (next, still) = step(...)`.",
    "",
    "### Filling a hole",
    "",
    "The search is fixed and bounded. Every limit counts steps.",
    "",
    "1. **A fact in scope.** Facts are: branch and arm evidence; the equation of each `let`; loop bounds; every evidence-typed name; and the evidence fields of every tuple and struct in scope, each stated about that value's own fields.",
    "2. **The same after normalizing** the claim and every fact. Names are replaced by what they stand for, using the equations in scope whose left side is a variable or a field of one, read left to right. Projections of written tuples and structs, matches on written constructors, and arithmetic on literals are computed. Calls of the program's own math functions are unfolded; the prelude's orderings stay folded. Conjunctions among the facts are taken apart.",
    "3. **Reflexivity; structure.** `&&` by proving both sides, `||` by proving one, `=>` by assuming the premise, `forall` by generalizing, `false` from a refuted fact whose claim can be shown. Depth at most 8.",
    "4. **Closed evaluation.** A comparison of known values is run by the kernel.",
    "5. **All 256 cases.** A comparison that speaks of exactly one unknown byte is decided by evaluating it at every byte, under the facts that speak of that byte alone. The kernel's `EvaluateAll` rule does the evaluation; the elaborator assembles the facts into the evaluated claim and discharges them afterwards. When a case fails, the failing byte is reported.",
    "",
    "Ordering claims are compared in one form, as the outcome of the runtime test (`a \u003c b` is `u8_lt(a, b) == true`), using the kernel's reflection axioms in both directions.",
    "",
    "What this does not reach: a claim relating two unknown bytes that is not already a fact after normalizing, such as `x \u003c= limit` and `limit \u003c= 9` giving `x \u003c= 9`. That step is a lemma call. The checked ordering lemmas are callable by name: `u8_le_refl`, `u8_zero_le`, `u8_le_trans`, `u8_lt_of_le_of_ne`, `u8_succ_le_of_lt`. Rewriting is oriented, from names to values; it is not a congruence closure.",
    "",
    "Relative to specification section 12.3, tier 5 is an addition and the congruence closure of its tier 3 is not built. The specification has been updated to say so.",
    "",
    "### When a hole cannot be filled",
    "",
    "The report states, in source syntax:",
    "",
    "- the claim, with written values put in their fields;",
    "- the claim after computing, when that differs;",
    "- a failing case, when evaluation found one: the byte, and that the known facts allow it;",
    "- the facts that speak of a value the claim speaks of, normalized the same way, at most six.",
    "",
    "~~~",
    "error[L0230]: cannot show `within_limit(lock.failures.wrapping_add(1))`",
    "  --> lock.lc:27:77",
    "   = note: after computing, the claim is `lock.failures.wrapping_add(1) \u003c= 3`",
    "   = note: it fails when `lock.failures` is 3, which the facts known here allow",
    "   = note: known here: `lock.failures \u003c= 3`",
    "~~~",
    "",
    "A `let` whose value fails poisons the names it would have bound, so that their uses are not reported as unknown.",
    "",
    "### Evidence written out",
    "",
    "`proofs.rs` elaborates the explicit forms of specification section 8 into kernel proofs: proof constructors, with `And::Intro`, `Or::Left`, `Or::Right`, and `True::Intro` for the built-in connectives; `match` on evidence, where each arm receives its variant's index equations as facts; `match h {}` on evidence of `false`, at any type; `rewrite`, `unfold`, `fold`; evidence of a `forall` or an implication applied to an argument; and a `math fn` that returns evidence, named as evidence of its general claim.",
    "",
    "### Measurements",
    "",
    "`locus check file.lc --holes` lists every hole: where, which tier filled it, the size of the proof in nodes, and the time to find and check it once. `locus check file.lc --stats` lists, per function, the time to elaborate it, which includes the search, and the time to lower, check, and erase it.",
    "",
    "For `examples/lock.lc` in a debug build: 8 proofs, about 800 proof nodes, about 8 ms elaborating, of which 6 ms is search, and about 5 ms checking. The largest proof is a 256-case one, at about 250 nodes; its size does not grow with the number of cases, because the kernel evaluates them. There is no cache of found proofs yet, so checking a file again after an edit costs the same as checking it the first time. Memory is not measured.",
    "",
    "### Not yet elaborated",
    "",
    "- Patterns beyond a name, `_`, and a tuple in `let`; beyond `Enum::Variant(names)` and `_` in `match`. Literal and struct patterns parse and are rejected here.",
    "- `let And::Intro(a, b) = h;`. Use `match`.",
    "- `exists`: formulas elaborate, and there is no source form yet for introducing or opening one.",
    "- Values of `fn` type. A `math fn` type elaborates; no expression has one except a function named as evidence.",
    "- Field access by name on a tuple with named fields. Use `.0` or `let`.",
    "- A `for` with one state parameter yields a one-field tuple; the specification says it yields the value.",
    "- In generated Rust, evidence that needed bridging prints as `Proved` and not as the name that was written, and `match` arms print in declaration order.",
    "- In a `math fn`, a `for` whose body is not a sequence of `let`s ending in `continue` is rejected by lowering with an internal error, not with a message of its own.",
    "",
    "## Build order",
    "",
    "All six steps are done. Steps 1 to 5 were built against hand-built typed trees; step 6 produces typed trees from source, and is described in the section The elaborator.",
    "",
    "1. Kernel: give the arms of a term-level `case` the hypothesis `scrutinee == variant(payload)`, so that a math function's branches know what an executable `match` arm knows.",
    "2. The check IR and the exec checker, driven by hand-built programs: `increment`, `preserve`, `classify`, `bounded_walk`, and `spin` with its caller.",
    "3. The typed tree, `lower`, and the ghost-skipping interpreter for the check IR.",
    "4. The erased tree, `erase`, its type checker, and the reference interpreter with fuel; the differential and divergence tests.",
    "5. The Rust printer, and compiled-versus-interpreted tests.",
    "6. The frontend: realignment of the parser, name resolution, and the elaborator targeting the typed tree.",
    ""
   ],
