  {
   "id": "kernel-contract",
   "title": "Kernel contract",
   "group": "Now",
   "body": [
    "# Kernel contract",
    "",
    "This document states every rule the proof kernel implements, with exact premises and conclusions. The kernel lives in `src/kernel/` and is independent of the parser. The code and this document change together: a rule is not in the kernel unless it is written here, and nothing here is in force until a kernel test exercises it.",
    "",
    "It covers all six kernel gates, **K1** to **K6**, which are listed at the end of this document. Tests are in `tests/kernel.rs` (K1), `tests/kernel_products.rs` (K2), `tests/kernel_functions.rs` (K3), `tests/kernel_cases.rs` (K4), `tests/kernel_numbers.rs` (K5), `tests/kernel_loops.rs` (K6), `tests/kernel_evaluation.rs` (evaluation and the range successor axiom), `tests/kernel_depth.rs` (the depth bound), `tests/kernel_int.rs` (`Int`), and `tests/kernel_int_div.rs` (quotient and remainder on `Int`). The last test in `tests/kernel_int.rs` reads this document out of `atlas.html` and fails when an axiom, a proof rule, or a primitive of the kernel is not named here; the names are the ones `Axiom::name`, `Proof::rule_name`, and `Prim::name` give. The intended full rule inventory is section 12.2 of [the specification](language.md); rules are added here as each gate is built.",
    "",
    "## Representation",
    "",
    "Types:",
    "",
    "~~~",
    "Type ::= bool | u8 | Prop",
    "       | Nat                      internal natural numbers",
    "       | Int                      the integers of the logic",
    "       | @P                       the proofs of the proposition P",
    "       | (A_0, A_1, ..., A_n)     a telescope: A_i may mention fields 0..i-1",
    "       | struct S                 a declared struct, by identity",
    "       | enum E                   a declared enum, by identity",
    "       | math fn(A_0, ..., A_n) -> R     parameters form a telescope; R may mention all of them",
    "~~~",
    "",
    "`Prop`, `@P`, `Nat`, and `Int` are ghost types: they have no runtime representation. `Nat` is internal to the kernel: it is the model of `u8` and the domain of induction, and a source program cannot name it. `Int` is the integers of the logic, the type a specification does its arithmetic in; see Int below. A function type is ghost when its result type is: such a function is a predicate or a proof. Only total functions have kernel types; an ordinary `fn` never reaches the kernel. A term occurs inside a type only inside some `@P`. A value can therefore change what a later proof field says, and never what data a product holds.",
    "",
    "In a telescope, field `i` is under `i` binders: `#0` in it is field `i - 1`, `#1` is field `i - 2`, and so on. `A_i[v_0, ..., v_{i-1}]` below means field `i`'s type with each earlier field replaced by the given term.",
    "",
    "Declarations. A struct declaration is a closed telescope. An enum declaration is a list of variants, each a closed payload telescope. A proposition declaration is described under Declared propositions below. A math function declaration is a closed function type and a body. Each declaration is checked against the declarations that precede it, so a struct, enum, or proposition cannot mention itself and a function cannot call itself, directly or indirectly. Kernel terms contain no loop, so every declared function is total by construction. Structs are nominal: two declarations with identical fields are different types. Tuple types are structural, and the names a source program gives tuple fields do not exist here.",
    "",
    "Terms. A proposition is a term of type `Prop`; there is no separate syntactic class.",
    "",
    "~~~",
    "t ::= x                     a context variable, by identity",
    "    | #i                    a bound variable, by de Bruijn index",
    "    | true | false | 0..255",
    "    | 0n, 1n, ...           Nat literals, of arbitrary size",
    "    | wrapping_add(t, t) | wrapping_sub(t, t)",
    "    | u8_eq(t, t) | u8_lt(t, t) | u8_le(t, t)     the runtime comparisons, of type bool",
    "    | to_nat(t) | of_nat(t) | succ(t) | nat_add(t, t)",
    "    | 0i, 1i, -1i, ...      Int literals, of arbitrary size and either sign",
    "    | int_add(t, t) | int_sub(t, t) | int_mul(t, t) | int_neg(t)",
    "    | int_div(t, t) | int_rem(t, t)     quotient and remainder, truncated toward zero",
    "    | int_le(t, t)          the order of Int, of type Prop",
    "    | t ==[A] t             equality at type A",
    "    | t => t",
    "    | forall (#: A) { t }   binds #0 in its body",
    "    | (t_0, ..., t_n) : (A_0, ..., A_n)     a tuple value carries its telescope",
    "    | S { t_0, ..., t_n }",
    "    | t.i                   positional projection",
    "    | proof(p)              a proof used as a value",
    "    | f                     a declared math function, as a value",
    "    | t(t_0, ..., t_n)      application",
    "    | E::i(t_0, ..., t_n)   variant i of a declared enum",
    "    | case t : R { arm_0, ..., arm_n }     arm_i binds the payload of variant i",
    "    | N(t_0, ..., t_n)      a declared proposition applied to arguments",
    "    | exists (#: A) { t }   binds #0 in its body",
    "    | absurd(p) : A         a value of any type from a proof of an empty proposition",
    "    | for # in t..t (S = t) { t }     range iteration; see below",
    "~~~",
    "",
    "A tuple value carries its type because a dependent telescope cannot be inferred from the values alone.",
    "",
    "Binding is locally nameless. Variables of the context carry globally unique identities that are never reused. Variables bound inside a term are indices. Two consequences are relied on throughout:",
    "",
    "- Terms that differ only in the names of bound variables are equal as data.",
    "- Substituting a term that is well formed in the context under a binder needs no shifting, because such a term contains no dangling index.",
    "",
    "`t[u]` below means: replace the outermost bound variable of `t` by `u`. `close(t, x)` means: turn the context variable `x` into the outermost bound variable of `t`.",
    "",
    "Proofs:",
    "",
    "~~~",
    "p ::= h                     a context hypothesis, by identity; the rule is named hyp",
    "    | refl(t)",
    "    | transport(p, T, p)    T is a template: a term binding #0 as its hole",
    "    | implies_intro(t, p)   binds a hypothesis in p",
    "    | implies_elim(p, p)",
    "    | forall_intro(A, p)    binds a term variable in p",
    "    | forall_elim(p, t)",
    "    | of_term(t)            a term of proof type, used as a proof",
    "    | projection(t)         computation axiom",
    "    | literal(t)            computation axiom",
    "    | definition(t)         computation axiom",
    "    | case_step(t)          computation axiom",
    "    | construct(N, i, params, payload)     variant i of a declared proposition",
    "    | case_proof(p, G, arms)    case analysis on a proof",
    "    | case_data(t, G, arms)     case analysis on data",
    "    | exists_intro(P, t, p)",
    "    | exists_elim(p, G, arm)",
    "    | excluded_middle(P)",
    "    | for_empty(t)          computation axiom",
    "    | for_step(t, p, p)     computation axiom",
    "    | evaluate(t)           big-step evaluation of a closed term",
    "    | evaluate_all(t)       a claim about every byte, by 256 evaluations; t binds #0",
    "    | omitted               left by the evaluator; proves nothing",
    "    | axiom(...)            an axiom of Nat, of the u8 model, or of Int",
    "    | nat_induction(M, p, arm, t)",
    "    | int_induction(M, p, arm, t)",
    "~~~",
    "",
    "An arm of a proof-level case binds some term variables and some hypotheses, and states how many of each.",
    "",
    "Hypotheses bound by `implies_intro` are indexed separately from term variables.",
    "",
    "## Context",
    "",
    "A context is an ordered list of three kinds of entry:",
    "",
    "~~~",
    "x : A            an executable variable",
    "ghost x : A      a ghost variable",
    "h : P            a hypothesis, where P is a proposition well formed in the preceding context",
    "~~~",
    "",
    "A variable whose type is a ghost type is ghost however it was declared. Declaring a variable requires its type to be well formed.",
    "",
    "An immutable logical `let x = e` reaches the kernel as `x : A` followed by the hypothesis `x ==[A] e`, where `e : A`. `Context::define` does exactly that and is not a rule: it is `declare` followed by `assume`. The same fact is derivable inside a closed statement by instantiating `forall x, x == e => P(x)` at `e` and discharging the premise with `refl(e)`; `tests/kernel_products.rs` does so.",
    "",
    "Terms are typed in one of two modes. `Logical` is the upgraded reading of the context: ghost variables are ordinary variables. `Executable` means the term's value is required at runtime.",
    "",
    "## Type formation: `ctx |- A type`",
    "",
    "| Type | Premises |",
    "|---|---|",
    "| `bool`, `u8`, `Nat`, `Int`, `Prop` | none |",
    "| `@P` | `P : Prop` in `Logical` mode |",
    "| `(A_0, ..., A_n)` | for each `i`, with fresh ghost variables `x_0 : A_0, ..., x_{i-1} : A_{i-1}[...]` added, `A_i[x_0, ..., x_{i-1}]` is a type |",
    "| `struct S` | `S` is declared |",
    "| `enum E` | `E` is declared |",
    "| `math fn(A_0, ..., A_n) -> R` | `(A_0, ..., A_n, R)` is a well-formed telescope |",
    "",
    "## Term typing: `ctx |- t : A` in a mode",
    "",
    "| Term | Premises | Type |",
    "|---|---|---|",
    "| `x` | `x : A` or `ghost x : A` is in `ctx`. In `Executable` mode, `x` is not ghost. | `A` |",
    "| `#i` | none: a bound index outside any binder is rejected | |",
    "| `true`, `false` | | `bool` |",
    "| `0..255` | | `u8` |",
    "| `wrapping_add(a, b)`, `wrapping_sub(a, b)` | exactly two arguments; `a : u8` and `b : u8` in the same mode | `u8` |",
    "| `u8_eq(a, b)`, `u8_lt(a, b)`, `u8_le(a, b)` | `a : u8` and `b : u8` in the same mode | `bool` |",
    "| `0n, 1n, ...` | mode is `Logical` | `Nat` |",
    "| `to_nat(a)` | mode is `Logical`; `a : u8` | `Nat` |",
    "| `of_nat(n)` | `n : Nat`, which is only possible in `Logical` mode | `u8` |",
    "| `succ(n)`, `nat_add(n, m)` | mode is `Logical`; the arguments have type `Nat` | `Nat` |",
    "| `0i, 1i, -1i, ...` | mode is `Logical` | `Int` |",
    "| `int_add(a, b)`, `int_sub(a, b)`, `int_mul(a, b)` | mode is `Logical`; exactly two arguments; `a : Int` and `b : Int` | `Int` |",
    "| `int_div(a, b)`, `int_rem(a, b)` | mode is `Logical`; exactly two arguments; `a : Int` and `b : Int`; no condition on `b` | `Int` |",
    "| `int_neg(a)` | mode is `Logical`; exactly one argument; `a : Int` | `Int` |",
    "| `int_le(a, b)` | mode is `Logical`; exactly two arguments; `a : Int` and `b : Int` | `Prop` |",
    "| `a ==[A] b` | mode is `Logical`; `A` is a type and not a proof type; `a : A` and `b : A` in `Logical` mode | `Prop` |",
    "| `P => Q` | mode is `Logical`; `P : Prop` and `Q : Prop` in `Logical` mode | `Prop` |",
    "| `forall (#: A) { P }` | mode is `Logical`; `A` is a type; for a fresh ghost `x : A`, `P[x] : Prop` in `Logical` mode | `Prop` |",
    "| `(t_0, ..., t_n) : (A_0, ..., A_n)` | the telescope is a type; the field rule below holds | `(A_0, ..., A_n)` |",
    "| `S { t_0, ..., t_n }` | `S` is declared with fields `(A_0, ..., A_n)`; the field rule below holds | `struct S` |",
    "| `t.i` | `t : (A_0, ..., A_n)` or `t : struct S` in the same mode; `i \u003c= n`. In `Executable` mode the result type is not ghost. | `A_i[t.0, ..., t.(i-1)]`, or, when `t` is literally a product value with fields `v_0, ..., v_n`, `A_i[v_0, ..., v_{i-1}]` |",
    "| `proof(p)` | mode is `Logical`; `p` proves `P` | `@P` |",
    "| `E::i(t_0, ..., t_n)` | `E` is declared and has a variant `i` with payload `(A_0, ..., A_n)`; the field rule holds for the payload, in the same mode | `enum E` |",
    "| `case t : R { arms }` | `t : bool` or `t : enum E` in the same mode; `R` is a type, is not a proof type, and in `Executable` mode is not ghost; there is exactly one arm per variant, in order (`false`, `true` for `bool`); arm `i` binds exactly the payload of variant `i` as variables `ys`, together with the hypothesis `t ==[T] variant_i(ys)` where `T` is the scrutinee's type, and with those added its body has type `R` in the same mode | `R` |",
    "| `N(t_0, ..., t_n)` | mode is `Logical`; `N` is declared with parameters `(A_0, ..., A_n)`; each `t_j : A_j` in `Logical` mode | `Prop` |",
    "| `exists (#: A) { P }` | as `forall` | `Prop` |",
    "| `absurd(p) : A` | `p` proves `N(...)` where `N` is declared with no variants; `A` is a type; in `Executable` mode `A` is not ghost | `A` |",
    "| `f` | `f` is declared with type `F`. In `Executable` mode `F` is not ghost and `f` is executable, as defined under function declaration below. | `F` |",
    "| `t(t_0, ..., t_n)` | `t : math fn(A_0, ..., A_n) -> R` in the same mode; the field rule below holds for the arguments against the parameters. In `Executable` mode the result type is not ghost. | `R[t_0, ..., t_n]` |",
    "",
    "In an arm's fact, a payload variable `y` standing in a proof field appears as `proof(of_term(y))`, so that the fact is itself well formed under the field rule. Each arm's hypothesis is the same fact `case_data` gives its arms, so a branch of a math function knows what a branch of executable code knows, and a proof field in an arm can use it. It is a hypothesis, so it can occur only inside proofs, and it has no runtime content.",
    "",
    "In an executable `case`, a payload variable is executable when its field has a runtime representation and ghost otherwise; in a logical `case` every payload variable is ghost. The result type of a `case` does not depend on the scrutinee. A `case` cannot scrutinize a proof and cannot have a proof type as its result: case analysis that inspects or produces proofs is a proof rule, below. `absurd` is the match with no arms used for its value; it marks a point that is never reached.",
    "",
    "Function declaration. `math fn f(x_0: A_0, ..., x_n: A_n) -> R { body }` is accepted when its function type is well formed with no variables in scope, and, with fresh ghost variables for the parameters, `body : R[x_0, ..., x_n]` in `Logical` mode. A lemma is a function whose result type is a proof type; its body has the form `proof(p)`.",
    "",
    "A declared function is *executable* when its result type is not ghost and its body also has type `R[x_0, ..., x_n]` in `Executable` mode, with each parameter ghost exactly when its type is ghost. Otherwise it is logical-only, and naming it in `Executable` mode is an error. The signature alone cannot decide this. `math fn narrow(n: Nat) -> u8 { of_nat(n) }` has an executable result, but its body needs the ghost `n`, so a call to it would turn an erased number into a byte: `narrow(0)` and `narrow(1)` differ in the logic while their erased calls are identical. Being logical-only propagates: a function whose body calls `narrow` is logical-only too. A ghost parameter that the result does not depend on does no harm. `Definitions::is_executable` reports the classification.",
    "",
    "The field rule. It applies to the fields of a product value and to the arguments of a call. There are exactly as many values as fields. For each `i` in order, let `E = A_i[t_0, ..., t_{i-1}]`:",
    "",
    "- if `E` is `@P`, then `t_i` must have the form `proof(p)` and `p` must prove `P`;",
    "- if `E` is another ghost type, `t_i : E` in `Logical` mode;",
    "- otherwise `t_i : E` in the product's own mode.",
    "",
    "So a ghost field is a logical position even inside an executable product: a ghost variable may be mentioned by a proof field's proposition, or stored in a `Prop` field, but not stored in a data field of executable data.",
    "",
    "Requiring the literal form `proof(p)` in every proof field is what makes proof irrelevance a syntactic check. A projection or variable of proof type is used in such a position as `proof(of_term(t))`.",
    "",
    "A proposition former, a `proof(p)`, or a projection of a ghost field in `Executable` mode is rejected: a term of ghost type has no runtime value. Inside a proposition former the mode is always `Logical`, which is the upgrade rule of specification section 2.4.",
    "",
    "Equality may be formed at any type except a proof type, including `Prop`, product types, and function types. There is no extensionality rule: nothing concludes `f == g` from `forall x, f(x) == g(x)`, and nothing concludes `P == Q` from `P => Q` and `Q => P`.",
    "",
    "## Proof checking: `ctx |- p proves P`",
    "",
    "The kernel reads the proposition off the proof. It never searches.",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `h` (the rule `hyp`) | `h : P` is in `ctx` | `P` |",
    "| `refl(t)` | `t : A` in `Logical` mode; `A` is not a proof type | `t ==[A] t` |",
    "| `transport(e, T, p)` | `e` proves `a ==[A] b`; for a fresh ghost `x : A`, `T[x] : Prop`; `p` proves `T[a]` | `T[b]` |",
    "| `implies_intro(P, p)` | `P : Prop`; with a fresh hypothesis `h : P` added, `p[h]` proves `Q` | `P => Q` |",
    "| `implies_elim(f, p)` | `f` proves `P => Q`; `p` proves `P` | `Q` |",
    "| `forall_intro(A, p)` | with a fresh ghost `x : A` added, `p[x]` proves `P` | `forall (#: A) { close(P, x) }` |",
    "| `forall_elim(f, t)` | `f` proves `forall (#: A) { P }`; `t : A` in `Logical` mode | `P[t]` |",
    "| `of_term(t)` | `t : @P` in `Logical` mode | `P` |",
    "| `projection(c.i)` | `c` is literally a tuple or struct value with fields `v_0, ..., v_n`; `c.i : A` in `Logical` mode; `A` is not a proof type | `c.i ==[A] v_i` |",
    "| `definition(f(t_0, ..., t_n))` | the callee is literally a declared function `f` with parameters `x_0, ..., x_n` and body `b`; `f(t_0, ..., t_n) : A` in `Logical` mode; `A` is not a proof type | `f(t_0, ..., t_n) ==[A] b[t_0, ..., t_n]` |",
    "| `case_step(case c : R { arms })` | `c` is literally `false`, `true`, or `E::i(v_0, ..., v_n)`; the case is well typed in `Logical` mode | `case c ... ==[R] arm_i[v_0, ..., v_n]`, with the arm's hypothesis replaced by `refl(c)` |",
    "| `literal(op(args))` | `op` is a primitive and every argument is a literal of the right type | `op(args) ==[A] r`, where `r` is the literal the native evaluation below produces and `A` is the primitive's result type |",
    "",
    "### Declared propositions",
    "",
    "`prop N(x_0: A_0, ..., x_n: A_n) { variants }` is accepted when each `A_j` is a type that is not a proof type, and each variant has one of two shapes:",
    "",
    "- A variant without a stated conclusion has a payload telescope that may mention the parameters. It proves `N` at whatever parameters it is given.",
    "- A variant with a stated conclusion has a closed payload telescope `(B_0, ..., B_m)` and arguments `c_0, ..., c_n` under it, with each `c_j : A_j`. It proves exactly `N(c_0, ..., c_n)`. The parameters are not in scope in it.",
    "",
    "A parameter cannot be a proof, so no parameter type depends on an earlier parameter, and index equations are independent. A conclusion is a list of arguments for `N`, not a proposition, so a variant cannot conclude anything but `N`; the surface rule that says so is enforced by the representation. A payload cannot mention `N`, because `N` has no identity until its declaration is accepted.",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `construct(N, i, (t_0..t_n), payload)`, variant `i` without a stated conclusion | the field rule holds for `(t_0, ..., t_n, payload...)` against the parameters followed by the payload telescope | `N(t_0, ..., t_n)` |",
    "| `construct(N, i, (), payload)`, variant `i` with a stated conclusion | the field rule holds for the payload | `N(c_0[payload], ..., c_n[payload])` |",
    "| `case_proof(p, G, arms)` | `p` proves `N(a_0, ..., a_n)`; `G : Prop` in the current context; one arm per variant, in order; each arm proves `G` under the bindings below | `G` |",
    "| `case_data(t, G, arms)` | `t : bool` or `t : enum E` in `Logical` mode, of type `T`; `G : Prop` in the current context; one arm per variant; arm `i` binds fresh ghost payload variables `ys` and the hypothesis `t ==[T] variant_i(ys)`, and proves `G` | `G` |",
    "",
    "What an arm of `case_proof` binds:",
    "",
    "- for a variant without a stated conclusion: payload variables whose types are the payload telescope with the parameters replaced by `a_0, ..., a_n`, and no hypotheses;",
    "- for a variant with a stated conclusion: payload variables `ys`, then one hypothesis per parameter, `a_j ==[A_j] c_j[ys]`. These are the index equations. There is no equation about the scrutinee itself: under proof irrelevance it would say nothing.",
    "",
    "`G` is checked before anything is bound, so it cannot mention a payload variable, and it does not depend on the proof being analyzed. A proposition with no variants has a `case_proof` with no arms, which proves any `G`.",
    "",
    "The result of `case_proof` is a proof by construction, and every arm is a kernel proof, hence total. The specification's restrictions on a match over a proof, that its result is a proof and that its arms are total logical computations, therefore cannot be violated in kernel terms; rejecting surface programs that try is the elaborator's job.",
    "",
    "The prelude declares `True`, `False`, `And`, and `Or` by this mechanism, before anything else, and records their identities. `!P` is `P => False`.",
    "",
    "### Exists",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `exists_intro(P, t, p)` | `P` is `exists (#: A) { B }` and `P : Prop`; `t : A` in `Logical` mode; `p` proves `B[t]` | `P` |",
    "| `exists_elim(p, G, arm)` | `p` proves `exists (#: A) { B }`; `G : Prop` in the current context; the arm binds a fresh ghost `w : A` and the hypothesis `B[w]`, and proves `G` | `G` |",
    "",
    "`G` cannot mention the witness, and the result is a proof: an existential cannot be mined for data.",
    "",
    "### Excluded middle",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `excluded_middle(P)` | the declarations include the prelude; `P : Prop` | `Or(P, P => False)` |",
    "",
    "`proof_is_classical` reports whether a proof uses this rule, directly or through a declared function, and each function declaration records the same about its body. This is bookkeeping for auditing, not a check.",
    "",
    "### Range iteration",
    "",
    "`for i in lo..hi (s : S(i) = init) { body }` is the term-level recursion rule. `S(i)` is a tuple telescope under one binder, the index. `body` binds the index `i`, the current state `s`, and two hypotheses.",
    "",
    "| Term | Premises | Type |",
    "|---|---|---|",
    "| `for i in lo..hi (s = init) { body }` | the declarations include the prelude; `lo : u8` and `hi : u8` in the same mode; the attached proof proves `u8_le(lo, hi)`; `init : S(lo)` in the same mode; for a fresh `i : u8`, `S(i)` is a type; with `i : u8`, `s : S(i)`, and the hypotheses `u8_le(lo, i)` and `u8_lt(i, hi)` added, `body : S(wrapping_add(i, 1))` in the same mode | `S(hi)` |",
    "",
    "In `Executable` mode `i` and `s` are executable variables; in `Logical` mode they are ghost. The ghost fields of `s` are ghost either way, by the projection rule.",
    "",
    "The index may change what the state's proofs say and never what data the state holds, because a term occurs in a type only inside `@P`. So the erasure of `S(i)` does not depend on `i`, and a loop whose invariant varies with the index erases to a plain loop over one fixed state type. That is what makes this rule erasable, and it holds by construction.",
    "",
    "Ordered bounds make the final index `hi`, so the result type needs no case distinction. A reversed range is not a type error in itself; it is rejected because no proof of `u8_le(lo, hi)` can be supplied. Since `i \u003c hi`, the successor in the body's type never wraps. A half-open byte range cannot have 255 as an index.",
    "",
    "Two loops that differ only in the proof that their bounds are ordered are the same term.",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `for_empty(f)` | `f` is a `for` whose `lo` and `hi` are the same term, and is well typed | `f ==[S(lo)] init` |",
    "",
    "| `for_step(f, lower, upper)` | `f` is a well-typed `for` over `lo..wrapping_add(h, 1)`, with the successor written exactly so; `lower` proves `u8_le(lo, h)`; `upper` proves `u8_lt(h, wrapping_add(h, 1))`; the unrolled right side below is well typed at the type of `f` | `f ==[S(wrapping_add(h, 1))] body[h, g, lower, upper]`, where `g` is the same `for` over `lo..h` with `lower` as its ordering proof |",
    "",
    "Stating the successor case with the bound in successor form is what makes it work for index-dependent state: the body at index `h` has type `S(wrapping_add(h, 1))`, which is the type of `f`, so no transport between types is needed. `upper` says the successor does not wrap. The loop `g` reuses the body under the hypothesis `i \u003c h`; a body whose proofs depend on the particular upper bound does not type-check there, and then there is no step. `for_empty` and `for_step` compute a loop symbolically; on literals, `evaluate` below is the practical route, because a literal bound cannot be rewritten into successor form inside a `for` that carries a proof about it.",
    "",
    "Soundness of the typing rule is by induction on `hi - lo` in the intended model. It is a separate rule from `nat_induction` on purpose: one recursion rule computes and erases to a loop, the other only proves and is erased.",
    "",
    "### Evaluation",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `evaluate(t)` | `t : A` in `Logical` mode; `A` is plain data: `bool`, `u8`, `Nat`, `Int`, or a tuple, struct, or enum built only from those; `t` has no free variable; evaluation finishes within the step budget with value `v` | `t ==[A] v` |",
    "| `evaluate(c)`, where `c` is literally `int_le(a, b)` or `a ==[Int] b` | `c : Prop` in `Logical` mode; `a` and `b` have no free variable and evaluate, within one step budget for the two, to the literals `m` and `n` | `c` when `m \u003c= n`, respectively `m == n`, holds of the two numbers; `c => False` when it does not, which needs the prelude |",
    "| `evaluate_all(b)` | for a fresh ghost `x : u8`, `b[x] : bool`; for each byte `k`, `b[k]` evaluates to `true`, all within one step budget | `forall (#: u8) { b ==[bool] true }` |",
    "",
    "Evaluation is big-step and call-by-value: primitives by native evaluation, a call by instantiating the function's body, `case` by choosing the arm of the evaluated scrutinee, projection from the evaluated product, and `for` by running the body for each index from `lo` to `hi`. It is a shortcut for a chain of the computation axioms and is the one place the kernel computes. It takes no part in comparing terms. On `Int` the primitives are computed with `kernel::Integer` (`src/kernel/int.rs`) and with nothing else, so nothing overflows.",
    "",
    "Proofs are never evaluated. The evaluator replaces each `proof(p)` it meets by `proof(omitted)`, so a loop state that carries proofs about the previous state does not grow. `omitted` proves nothing: checking it is an error. Because `evaluate` offers only plain data, no omitted proof can appear in a conclusion. To evaluate the data of a proof-carrying value, project it first: `evaluate(count_up(200).0)`.",
    "",
    "A comparison of integers is a proposition, so it has no value for `evaluate` to state an equation with. The second row decides it instead: both sides are evaluated, and the rule proves the comparison when it holds of the two numbers and its negation when it does not. `int_lt` is an abbreviation of `int_le`, so it is decided by the same row. No other proposition is decided: `evaluate(1 ==[u8] 1)` is still rejected as not plain data. Inside a value, `int_le(a, b)` is an opaque proposition like any other and is not evaluated.",
    "",
    "A failing case of `evaluate_all` is reported with the byte that refutes it. `evaluate_all` ranges over the 256 bytes and over nothing else: there is no exhaustion over `Int`. With `reflect`, a proved `forall (x: u8) { u8_le(x, 255) == true }` becomes a fact about the ordering of any byte.",
    "",
    "Evaluation has two budgets, both counted and neither timed, so that acceptance does not depend on the machine: 2,000,000 steps, and a nesting depth of 200. Exceeding either is an error distinct from refutation. The depth budget exists because a call evaluates the callee's body: a chain of a thousand small functions, each calling the next, is shallow as input and a thousand levels deep to evaluate, which would otherwise exhaust the stack long before the step budget. Iterations of a `for` run one after another, so a long loop costs steps and not depth. `int_mul` is the one primitive whose result can be twice the size of its operands, so a term of a hundred nodes that squares a number again and again names a number of `2^100` bits. A multiplication is therefore charged what the schoolbook product costs, one step for each pair of 32-bit digits of its operands, before it is carried out. That bounds the size of every number evaluation can reach, and the work done on it, by the step budget; the other primitives add at most one bit for each step. `int_div` and `int_rem` make nothing larger, but the long division in `src/kernel/nat.rs` is bit by bit: for each bit of the dividend it doubles a remainder and subtracts the divisor from it when it can, and each of those touches every digit of the divisor. A quotient or a remainder is therefore charged one step for each bit of the dividend times each 32-bit digit of the divisor, again before it is carried out. A division whose charge alone exceeds the budget is refused without doing any of its work. Measured in an unoptimized build on a 2 MiB thread stack, evaluation alone nests 500 levels in every shape tried and overflows at 700 in the worst; the bound is well under half of that because evaluation can begin at the bottom of a proof that is itself nested up to the input depth bound, and the two share one stack. A test does exactly that.",
    "",
    "### Nat",
    "",
    "`Nat` has the literals, `succ`, and `nat_add`. Its rules are Peano's, with addition:",
    "",
    "| Axiom | Premises | Conclusion |",
    "|---|---|---|",
    "| `nat_add_zero(a)` | `a : Nat` | `a + 0 == a` |",
    "| `nat_add_succ(a, b)` | `a, b : Nat` | `a + succ(b) == succ(a + b)` |",
    "| `nat_succ_injective(a, b)` | `a, b : Nat` | `succ(a) == succ(b) => a == b` |",
    "| `nat_succ_not_zero(a)` | `a : Nat` | `succ(a) == 0 => False` |",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `nat_induction(M, base, step, t)` | for a fresh ghost `x : Nat`, `M[x] : Prop`; `t : Nat`; `base` proves `M[0]`; `step` binds a fresh ghost `n : Nat` and the hypothesis `M[n]`, and proves `M[succ(n)]` | `M[t]` |",
    "",
    "Literals connect to `succ` through `literal`: `succ(3n) == 4n`. Induction is the proof-level recursion rule. It has no runtime content. There is no term-level recursion over `Nat`.",
    "",
    "The orderings are not primitive. The prelude defines them as ordinary math functions, and the kernel knows their identities only because the axioms below are stated with them:",
    "",
    "~~~",
    "nat_le(a, b) := exists k { a + k == b }",
    "nat_lt(a, b) := nat_le(succ(a), b)",
    "u8_le(a, b)  := nat_le(to_nat(a), to_nat(b))",
    "u8_lt(a, b)  := nat_lt(to_nat(a), to_nat(b))",
    "~~~",
    "",
    "### Int",
    "",
    "`Int` is the integers of the logic. It enters the kernel by axioms and native evaluation, not by a construction from `Nat`. It has literals of any size and either sign, the primitives `int_add`, `int_sub`, `int_mul`, `int_neg`, `int_div`, and `int_rem`, and one primitive order, the proposition `int_le(a, b)`. Below, `a + b`, `a - b`, `a * b`, `-a`, `a / b`, `a % b`, and `a \u003c= b` stand for these, a literal is written without its `i`, and `==` is `==[Int]`.",
    "",
    "The strict order is not primitive and is not a definition to unfold either. `int_lt(a, b)` is the term `int_le(int_add(a, 1i), b)`, built by `Term::int_lt`, so `a \u003c b` and `a + 1 \u003c= b` are the same term and each proves the other with no step. `>=` and `>` are the same two with the sides exchanged.",
    "",
    "The ring axioms say that `Int` is a commutative ring:",
    "",
    "| Axiom | Premises | Conclusion |",
    "|---|---|---|",
    "| `int_add_assoc(a, b, c)` | `a, b, c : Int` | `(a + b) + c == a + (b + c)` |",
    "| `int_add_comm(a, b)` | `a, b : Int` | `a + b == b + a` |",
    "| `int_add_zero(a)` | `a : Int` | `a + 0 == a` |",
    "| `int_add_neg(a)` | `a : Int` | `a + (-a) == 0` |",
    "| `int_sub_def(a, b)` | `a, b : Int` | `a - b == a + (-b)` |",
    "| `int_mul_assoc(a, b, c)` | `a, b, c : Int` | `(a * b) * c == a * (b * c)` |",
    "| `int_mul_comm(a, b)` | `a, b : Int` | `a * b == b * a` |",
    "| `int_mul_one(a)` | `a : Int` | `a * 1 == a` |",
    "| `int_mul_add(a, b, c)` | `a, b, c : Int` | `a * (b + c) == a * b + a * c` |",
    "",
    "The order axioms say that the ring is totally and discretely ordered:",
    "",
    "| Axiom | Premises | Conclusion |",
    "|---|---|---|",
    "| `int_le_refl(a)` | `a : Int` | `a \u003c= a` |",
    "| `int_le_trans(a, b, c)` | `a, b, c : Int` | `a \u003c= b => (b \u003c= c => a \u003c= c)` |",
    "| `int_le_antisymm(a, b)` | `a, b : Int` | `a \u003c= b => (b \u003c= a => a == b)` |",
    "| `int_le_add(a, b, c)` | `a, b, c : Int` | `a \u003c= b => a + c \u003c= b + c` |",
    "| `int_le_mul(a, b)` | `a, b : Int` | `0 \u003c= a => (0 \u003c= b => 0 \u003c= a * b)` |",
    "| `int_le_total(a, b)` | `a, b : Int` | `Or(a \u003c= b, b + 1 \u003c= a)` |",
    "| `int_lt_irrefl(a)` | `a : Int` | `a + 1 \u003c= a => False` |",
    "",
    "Every premise is checked in `Logical` mode, and every axiom needs the prelude, as the axioms of `Nat` do. An axiom is an instance at the given terms, which may be any terms of type `Int` in the context; the general statement is obtained with `forall_intro`.",
    "",
    "An ordered ring need not be the integers, because its order need not be discrete. Here it is: `int_le_total` gives `b + 1 \u003c= a`, which is `b \u003c a`, in its second case, where the total order of a ring would give only `b \u003c= a`. With `int_lt_irrefl` it follows that nothing lies strictly between `n` and `n + 1`. `tests/kernel_int.rs` derives `n + 1 \u003c= m => (m + 1 \u003c= n + 1 => False)` from `int_le_add`, `int_le_trans`, and `int_lt_irrefl`, and also `a \u003c= a + 1`, `a \u003c= b => a \u003c b + 1`, `a \u003c= b => (b \u003c c => a \u003c c)`, and `a + c \u003c= b + c => a \u003c= b`, from the axioms alone. `0 \u003c= 1` is not an axiom: `evaluate(int_le(0i, 1i))` proves it.",
    "",
    "| Proof | Premises | Conclusion |",
    "|---|---|---|",
    "| `int_induction(M, base, step, t)` | for a fresh ghost `x : Int`, `M[x] : Prop`; `t : Int`; `base` proves `M[0i]`; `step` binds a fresh ghost `n : Int` and two hypotheses, `int_le(0i, n)` and then `M[n]`, and proves `M[int_add(n, 1i)]` | `int_le(0i, t) => M[t]` |",
    "",
    "Induction is over the non-negative integers, which are the ones reached from `0` by adding `1`, so the conclusion carries the premise `0 \u003c= t`. The successor in the step is written exactly `int_add(n, 1i)`. The rule has the shape and the binder discipline of `nat_induction`, with one more hypothesis in its step. It is what makes the axioms describe the integers and not some larger discretely ordered ring, and like `nat_induction` it has no runtime content.",
    "",
    "Quotient and remainder. `a / b` is the quotient truncated toward zero and `a % b` the remainder that goes with it, exactly Rust's `/` and `%` on the signed integer types, with no overflow because nothing overflows here. Both are total: `a / 0 == 0` and `a % 0 == a`. Eight axioms fix them. In the table `a \u003c b` is the term `a + 1 \u003c= b`, as everywhere on `Int`, so each conclusion is a single `int_le` or a single equation, usable as a linear fact as it stands:",
    "",
    "| Axiom | Premises | Conclusion |",
    "|---|---|---|",
    "| `int_div_rem(a, b)` | `a, b : Int` | `a == (a / b) * b + a % b` |",
    "| `int_div_zero(a)` | `a : Int` | `a / 0 == 0` |",
    "| `int_rem_lower_pos(a, b)` | `a, b : Int` | `0 \u003c b => -b \u003c a % b` |",
    "| `int_rem_upper_pos(a, b)` | `a, b : Int` | `0 \u003c b => a % b \u003c b` |",
    "| `int_rem_lower_neg(a, b)` | `a, b : Int` | `b \u003c 0 => b \u003c a % b` |",
    "| `int_rem_upper_neg(a, b)` | `a, b : Int` | `b \u003c 0 => a % b \u003c -b` |",
    "| `int_rem_nonneg(a, b)` | `a, b : Int` | `0 \u003c= a => 0 \u003c= a % b` |",
    "| `int_rem_nonpos(a, b)` | `a, b : Int` | `a \u003c= 0 => a % b \u003c= 0` |",
    "",
    "The decomposition is stated in exactly one orientation, with `a` alone on the left, the quotient's product before the remainder, and the quotient before the divisor in the product: `a == int_add(int_mul(int_div(a, b), b), int_rem(a, b))`. Any other arrangement is a different term, reached from this one by the ring axioms.",
    "",
    "Each axiom is true of truncating division at every `a` and every `b`, a zero divisor included. For `b != 0`, write `q = a / b` and `r = a % b`: truncation toward zero means `|q|` is `|a| / |b|` rounded down and `q` has the sign of `a * b`, so `r = a - q * b` has the sign of `a`, or is zero, and satisfies `|r| \u003c |b|`. The decomposition is `r`'s definition; the four bounds say `|r| \u003c |b|` split by the sign of `b`, since for `0 \u003c b` the bound is `-b \u003c r \u003c b` and for `b \u003c 0` it is `b \u003c r \u003c -b`; and the two sign axioms say `r` has the sign of `a`. At `b == 0` the unconditional axioms hold as well: `int_div_rem` reads `a == 0 * 0 + a`, which is true because `a / 0 == 0` and `a % 0 == a`; `int_div_zero` is the definition of `a / 0`; and `int_rem_nonneg` and `int_rem_nonpos` say that `a % 0`, which is `a`, has the sign of `a`. The four bounds are false at `b == 0` without their conditions, since `a % 0 == a` is bounded by nothing, which is why they carry them: `0 \u003c b` and `b \u003c 0` exclude zero exactly. The bounds are strict, and `0 \u003c= b` in place of `0 \u003c b` would let `b == 0` in, so `tests/kernel_int_div.rs` rejects each of these near misses and refutes the unconditional bounds at `b == 0` by evaluation.",
    "",
    "For `b != 0` the axioms determine `q` and `r` uniquely, so they pin down truncating division and not flooring or Euclidean division. If `a == q * b + r == q' * b + r'` with both remainders bounded by `|b|` in magnitude and both of the sign of `a`, then `r - r'` is a multiple of `b` whose magnitude is below `|b|`, because two numbers of one sign and each below `|b|` in magnitude differ by less than `|b|`; so it is zero, and then `q == q'` because `b != 0`. Flooring division, `-7 / 2 == -4` with remainder `1`, breaks `int_rem_nonpos`, and Euclidean division, `-7 / -2 == 4` with remainder `1`, breaks it too. `tests/kernel_int_div.rs` has evaluation refute both and prove the truncating values in each of the four sign combinations: `-7 / 2 == -3` and `-7 % 2 == -1`, `7 / -2 == -3` and `7 % -2 == 1`, `-7 / -2 == 3` and `-7 % -2 == -1`, and `7 / 2 == 3` and `7 % 2 == 1`.",
    "",
    "`a % 0 == a` is not an axiom. It follows from the two unconditional axioms and the ring: `int_div_rem(a, 0)` gives `a == (a / 0) * 0 + a % 0`, `int_div_zero` turns `a / 0` into `0`, `0 * 0 == 0` comes from the ring axioms, and `0 + a % 0 == a % 0` from `int_add_comm` and `int_add_zero`. `tests/kernel_int_div.rs` derives it inside the kernel in thirty-three nodes, twenty-one of them the ring derivation of `x * 0 == 0`.",
    "",
    "Computation. `literal` computes one primitive on literals, as `int_add(2i, 3i) == 5i` and `int_div(-7i, 2i) == -3i`; `int_le` is a proposition and has no `literal` step. `evaluate` computes a closed term of type `Int` to a literal, and decides a closed `int_le(a, b)` or `a ==[Int] b`, as described under Evaluation. `int_div` and `int_rem` are computed by `Integer::div` and `Integer::rem` in `src/kernel/int.rs`, which truncate toward zero and give `0` and `a` at a zero divisor, and by nothing else; `tests/kernel_int_div.rs` checks them against Rust's `/` and `%` on random `i128` pairs with a nonzero divisor, against the formulas at a zero divisor, and on the one pair where Rust overflows, `i128::MIN / -1`, checks that the kernel gives `2^127`. A quotient or a remainder is charged steps in proportion to its operands, as described under Evaluation. There is no other connection between the literals and the axioms: that `2 + 3` is `5` is known by computing, not from the ring laws.",
    "",
    "Not here yet, each left to a later commit: conversions between `Nat` and `Int`; the models of the machine integer types over `Int`, which will generalize the model of `u8` below; and a rule that checks a certificate of linear arithmetic, which exists in the plan because a proof from these axioms alone takes one transport for each rearrangement, as the derived facts in `tests/kernel_int.rs` show. That rule will take instances of the bounds and sign axioms above as hypotheses, which is why each of them concludes a single comparison rather than a conjunction.",
    "",
    "### The model of u8",
    "",
    "A `u8` is a natural number below 256. `to_nat` is the inclusion and `of_nat` is reduction modulo 256. Six axioms say so, and each is true in that reading:",
    "",
    "| Axiom | Premises | Conclusion |",
    "|---|---|---|",
    "| `to_nat_bound(x)` | `x : u8` | `nat_lt(to_nat(x), 256)` |",
    "| `of_to_nat(x)` | `x : u8` | `of_nat(to_nat(x)) == x` |",
    "| `to_of_nat(n)` | `n : Nat` | `nat_lt(n, 256) => to_nat(of_nat(n)) == n` |",
    "| `of_nat_wrap(n)` | `n : Nat` | `of_nat(n + 256) == of_nat(n)` |",
    "| `wrapping_add_model(a, b)` | `a, b : u8` | `wrapping_add(a, b) == of_nat(to_nat(a) + to_nat(b))` |",
    "| `wrapping_sub_model(a, b)` | `a, b : u8` | `wrapping_add(wrapping_sub(a, b), b) == a` |",
    "",
    "`to_of_nat` and `of_nat_wrap` together pin `of_nat` down as reduction modulo 256 without a `mod` operator, and `wrapping_sub` is characterized as the inverse of `wrapping_add` without subtraction on `Nat`. Injectivity of `to_nat` follows from `of_to_nat` by congruence.",
    "",
    "Reflection connects a runtime comparison to the proposition it decides:",
    "",
    "| Axiom | Premises | Conclusion |",
    "|---|---|---|",
    "| `reflect(c, true)` | `c` is `u8_eq(a, b)`, `u8_lt(a, b)`, or `u8_le(a, b)`, and `c : bool` | `c == true => P` |",
    "| `reflect(c, false)` | the same | `c == false => (P => False)` |",
    "",
    "where `P` is `a ==[u8] b`, `u8_lt(a, b)`, or `u8_le(a, b)` respectively. With `case_data` on the comparison, these give each branch of an `if` its fact, and the two together decide `P` without excluded middle. The converse directions are derivable from them.",
    "",
    "All of these axioms need the prelude, because they are stated with `False` and the orderings.",
    "",
    "`src/kernel/theory.rs` begins the kernel-level prelude: associativity of addition, `0 + a == a`, and `succ(a) + b == succ(a + b)` by induction; every natural is zero or a successor, which serves as case analysis on `Nat`; reflexivity, `0 \u003c= a`, transitivity, and monotonicity of `succ` for `nat_le`; the corresponding facts about `u8_le`; and the two lemmas the specification's `bounded_walk` uses, `u8_le(i, limit) => (i == limit => False) => u8_lt(i, limit)` and `u8_lt(i, limit) => u8_le(wrapping_add(i, 1), limit)`. The second shows through the model of `wrapping_add` that the successor of a byte below another does not wrap. These are declared lemmas, checked by the kernel when they are declared, and not trusted. A fact about the ordering of three byte variables is obtained by reasoning about their models, never by enumerating bytes.",
    "",
    "### Notes on the rules",
    "",
    "Using a lemma needs no rule of its own: a call to a lemma is a term of proof type, so `of_term(lemma(args))` proves the instantiated conclusion. A lemma has no defining equation, because equality at its proof type cannot be formed; nothing is lost, since proofs are irrelevant.",
    "",
    "`projection`, `literal`, `definition`, and `case_step` are the computation axioms of specification section 12.2 that exist so far; the `let` axiom is a hypothesis, as described under Context. Each is a single step validated by matching the shape of its term. They are used through `transport`, and the elaborator will insert them silently.",
    "",
    "Projection from a literal product is typed by the product's own field values, which is the type the constructor rule checked field `i` against. So `v_i : A` always holds in `projection`, including for a nested dependent product whose inner type mentions an outer field.",
    "",
    "`definition` is the only way a function body ever becomes visible. At type `Prop` it is how a predicate is unfolded, and at a function type it gives equations such as `select() == successor`. The call must name the declared function directly: a call through a variable or through another call has no defining equation until the callee has been rewritten to a function name.",
    "",
    "`literal` evaluates natively: `u8::wrapping_add`, `u8::wrapping_sub`, `==`, `\u003c`, `\u003c=` on bytes; widening for `to_nat`; the low byte for `of_nat`; arbitrary-precision addition for `succ` and `nat_add` (`src/kernel/nat.rs`), so those always have a step; and arbitrary-precision `add`, `sub`, `mul`, `neg`, `div`, and `rem` of `kernel::Integer` (`src/kernel/int.rs`) for `int_add`, `int_sub`, `int_mul`, `int_neg`, `int_div`, and `int_rem`, where `div` and `rem` truncate toward zero and are total. `int_le` has no literal result. This evaluation must agree with the model of `u8`, and `tests/kernel_numbers.rs` checks that it does; on `Int` it must agree with the integers, which the axioms of `Int` describe.",
    "",
    "`check(ctx, p, P)` requires `P : Prop`, infers the proposition `p` proves, and accepts when the two are the same term.",
    "",
    "## Comparison",
    "",
    "\"The same term\" means equal up to two things, and nothing else:",
    "",
    "- renaming of bound variables, which the locally nameless representation makes structural equality;",
    "- proof irrelevance: any two terms of the form `proof(p)` are the same, whatever `p` is.",
    "",
    "The same relation on types compares the propositions inside `@P` and the fields of telescopes with it.",
    "",
    "There is no unfolding, no evaluation, and no normalization. A hypothesis `is_three(n)` does not prove `n == 3`; transport along `definition(is_three(n))` does. `refl(2)` does not prove `wrapping_add(1, 1) == 2`; `literal(wrapping_add(1, 1))` does. `refl(3)` does not prove `(3, true).0 == 3`; `projection((3, true).0)` does. Two `Int` literals are the same term exactly when they are the same number, because a number has one representation: zero has no sign, and a magnitude has no leading zero digit.",
    "",
    "Proof irrelevance is sound as a syntactic check because of the field rule: in a well-typed term, every position of proof type inside a product value holds a `proof(p)`, equality at a proof type cannot be formed, and no other term former has a proof-typed argument. Two product values with the same data and different proofs are therefore the same term, and `refl` proves them equal with no proof step.",
    "",
    "Constructor disjointness and injectivity are not rules. `tests/kernel_cases.rs` derives `Red == Green => False` and `Byte(a) == Byte(b) => a == b` from `case_step`, `transport`, and a `case` that sends the constructors to different results.",
    "",
    "## Derived forms",
    "",
    "`src/kernel/derive.rs` builds proofs out of the rules above and is not trusted: `symm`, `trans`, `rewrite`, `unfold`, and `fold`. Each computes a transport template by abstracting occurrences of a term, and the kernel checks the result like any other proof. These are the elaborator forms of specification section 8.4. Their loops are bounded by a step count.",
    "",
    "`unfold` and `fold` reach a call that mentions a bound variable, as in `forall x { is_three(x) }`, by going under `forall` and `exists` and into the conclusion of an implication, and rebuilding the binder around the rewritten body. `fold` follows the shape of its goal and unfolds an implication's premise on the way in. A call inside the arguments of a declared proposition, or under a binder within the premise of an implication, is not reached. `rewrite` needs no descent, because the term it replaces is closed. `Chain` builds an equational chain a link at a time.",
    "",
    "## Depth bound",
    "",
    "Checking, comparison, and substitution are recursive. Every public entry point (`check_type`, `infer_term`, `infer_proof`, `check_proof`, `Context::declare`, `assume`, `define`, and the declaration functions) first measures its input with an explicit work list, without recursion, and rejects input nested more than `MAX_DEPTH` = 256 levels deep, counting types, terms, and proofs together.",
    "",
    "The number comes from measurement in an unoptimized build on a 2 MiB thread stack: nested arithmetic and nested quantifiers check at depth 800, and the worst shape found, a chain of transports, at 500 but not 600. To get there, the two judgments and the binder traversals are written as small dispatchers that call one function per rule or per variant; as single large matches, an unoptimized build reserved stack for every arm at once and overflowed near depth 150. A long equational argument should be a balanced tree of transitivity steps, or separate lemmas, not one chain.",
    "",
    "The bound is on input. A term built by substitution during checking can be deeper than any input, by at most the input depth for each substitution a proof performs. Dropping a very deep term is recursive in Rust itself; the parser's own nesting limit keeps such terms from arising from source text.",
    "",
    "## Invariants the implementation maintains",
    "",
    "- Every proposition returned by proof inference is well formed in the context it was inferred in.",
    "- Everything pushed while checking under a binder is removed before returning, on success and on failure.",
    "- A fresh variable or hypothesis has an identity that occurs nowhere else, so generalizing over it cannot capture anything, and it cannot be referred to after its binder is left.",
    "- Replacement terms used for `t[u]` are well formed in the context, hence contain no dangling index. For `forall_elim` this is established by typing the argument first.",
    "",
    "## Deliberately absent",
    "",
    "Symmetry, transitivity, and congruence of equality are not rules. They are derived from `refl` and `transport`, and `tests/kernel.rs` derives each of them.",
    "",
    "All six kernel gates are implemented, and the gaps recorded when they were finished are closed. What remains, each noted where it arises above: the evaluator is recursive and bounded by a depth budget rather than written with an explicit stack, so a legitimate computation nested more than 200 deep is refused; `for_step` has no step for a body whose proofs depend on the particular upper bound; the derived forms do not reach inside a declared proposition's arguments or under a binder in an implication's premise; the depth bound covers input, not terms produced by substitution; and there is no transport between types, which nothing has needed so far because a dependent product can be rebuilt field by field.",
    "",
    "One K2 acceptance condition is stated in the plan in terms of `NonZero`. When K2 was built the kernel had no `!=`, which needs `False` from K4, so the test uses a struct whose proof field is an equation, `a.wrapping_add(b) == 10`, to the same effect.",
    "",
    "## Trusted base",
    "",
    "`src/kernel/check.rs` (the rules and the comparison), `src/kernel/term.rs` (opening and closing binders, and telescope instantiation), `src/kernel/context.rs` (lookup and scoping), `src/kernel/defs.rs` (declarations and the prelude's definitions), the axioms of `Nat`, of the `u8` model, and of `Int`, the native evaluation behind `literal` and `evaluate` together with its agreement with the `u8` model and with the integers, `src/kernel/nat.rs` and `src/kernel/int.rs` (the arithmetic of `kernel::Natural` and `kernel::Integer`, which literals are computed with and which `evaluate` decides comparisons by), `src/kernel/eval.rs` (the evaluator), and `src/kernel/depth.rs` (the depth bound). `src/kernel/derive.rs`, `src/kernel/classical.rs`, and `src/kernel/theory.rs` are not part of it.",
    "",
    "Agreement is tested exhaustively. For every pair of bytes, `tests/kernel_numbers.rs` has the kernel check that the native `wrapping_add` result equals `of_nat(to_nat(a) + to_nat(b))` evaluated step by step, that adding the subtrahend back to the native `wrapping_sub` result restores the minuend, and that whatever the native `\u003c` answers, the matching fact about the models is provable. `of_nat` and `to_nat` are checked against their axioms on literals. `Int` is too large to exhaust. That the axioms of `Int` are consistent rests on the integers being a model of them, and on the list being short and standard: a discretely ordered commutative ring with induction, and truncating division stated by its decomposition, its bounds, and the sign of its remainder, which the section on `Int` checks against that model at every divisor. That evaluation agrees with that model rests on `kernel::Integer` computing the integers: `tests/kernel_integers.rs` compares it with Rust's arithmetic up to 128 bits, division and remainder included, and checks the ring identities beyond, and `tests/kernel_int.rs` and `tests/kernel_int_div.rs` check `evaluate` against it on random closed terms, in both directions: the true claim is proved and the false one is refused. The builder functions on `Term` and `Proof` that take closures are conveniences for constructing well-scoped terms; a term built any other way is checked just the same.",
    "",
    "## The gates",
    "",
    "The kernel was built in six acceptance gates, from hand-written terms and independently of the parser. Each was small, and none was started before the ones ahead of it passed. The tests are named after them.",
    "",
    "| Gate | Scope | Passes when |",
    "|---|---|---|",
    "| K1 (done) | Terms, contexts with the three kinds of entry and upgrade, comparison up to renaming and proof irrelevance, `Eq` with reflexivity and transport, internal `Forall` and `Implies`. | A true equality checks; a false one is rejected; a fact in scope discharges an identical goal; a ghost variable is rejected in an executable term. |",
    "| K2 (done) | Tuples, structs, dependent proof fields, and the `let`, projection, and literal computation axioms. | A dependent data/proof result checks; returned data instantiates a later proof field; two `NonZero` values with equal bytes are equal without a proof step. |",
    "| K3 (done) | Math functions, defining equations, `unfold`/`fold`/`rewrite`, function values, `Prop` as a value. | An explicit unfolding step checks; `select() == successor` is provable at a function type while pointwise agreement does not prove function equality; `Claim { proposition: [true] }` and `Claim { proposition: [false] }` are distinguishable and their projections compute. |",
    "| K4 (done) | Enums and the case rule with arm evidence; declared props, the index-equation case rule, `Exists`, excluded middle with dependency recording. | An indexed proposition match supplies its index equation; a match on a proof with a non-proof result or a non-total arm is rejected; a variant concluding another proposition is rejected; constructor disjointness is derived. |",
    "| K5 (done) | Internal `Nat` with induction; the `u8` model, reflection lemmas, and native evaluation. | A `u8` ordering lemma over three variables is proved from the model, not by enumeration; native evaluation agrees with the model exhaustively for one-byte operations. |",
    "| K6 (done) | The range-iteration rule. | The bounded-count example checks with index-dependent state; empty range, rejected reversed bounds, `hi == 255`, and nested iteration are covered. |",
    "",
    "After the gates, the kernel grows by the commits of the build plan, which are named differently: `Int` was added by the plan's commit K2, which is not the gate K2 above, and its quotient and remainder by the plan's commit K3."
   ],

  {
   "id": "positioning",
   "title": "Positioning",
   "group": "Vision",
   "body": [
    "# Positioning",
    "",
    "Locus is a tool and a language, not a company. This document records what it is for, why it has the shape it has, and what it gives up. Design decisions are measured against it.",
    "",
    "## In one line",
    "",
    "Review the guarantees, check the implementation, and use the result from ordinary Rust.",
    "",
    "## In one paragraph",
    "",
    "Locus is a Rust-like language for the parts of a crate whose correctness matters most. Propositions and proofs compose with ordinary functions and data, and explicit proof evidence is checked, deterministically, by a small, auditable kernel. Locus is designed to verify systems implementations with precise arithmetic, ownership, and mutation semantics, then emit readable Rust without runtime proof machinery. Generated interfaces protect proven invariants at the boundary with safe Rust callers. A programmer or an AI supplies the implementation and evidence against a human-reviewed specification; proof construction can be automated, while acceptance rests on independent checking.",
    "",
    "This is a statement of destination. What is true today: the kernel, the checking of evidence, a bounded search that fills holes, readable generated Rust, and proof-bearing interfaces between Locus functions, over `bool`, `u8`, structs, enums, and loops without mutation. Not yet true: ownership and mutation, arithmetic beyond a byte, and protected exports. Each release should say which systems features its guarantees cover.",
    "",
    "## The reasoning",
    "",
    "1. **The generated code must be efficient and safe.** A prover such as Lean can state and prove facts about machine integers and structures, and its proofs are kernel-checked. Its compiled code, however, runs on a runtime with reference-counted heap objects and boxing, and it reaches other languages only through a C interface.",
    "2. **Efficient code needs a source language that knows about ownership, mutability, and layout.** Avoiding boxing, heap allocation, and reference counting requires knowing statically what is uniquely owned and how data is laid out. A pure functional language with free sharing and types that depend on values cannot add that afterwards. A Rust-like language has it from the start.",
    "3. **Proofs and program belong in one language.** The alternative keeps them apart: write Rust, translate it into a prover, and write specifications and proofs there, as Aeneas does with Lean. That verifies existing code and has the full power of the prover. It also means two artifacts kept in step by a tool, specifications stated against a generated model, and proofs that break far from the edit that broke them, in a language a Rust programmer does not read. Locus puts the specification in the function's type and the proof in the function's body.",
    "4. **Acceptance rests on checking evidence, whoever produced it.** A person, an AI, a bounded search, or a decision procedure may construct a proof. What matters is that the program is accepted because a small kernel checked explicit evidence, and not because a search succeeded. The alternative, trusting a solver's answer, saves effort, and what it finds can change between versions and time out. Checked evidence is accepted deterministically and is not limited by what one search happens to find. \"Explicit\" describes the evidence, not the effort: a `_` is filled by a search that emits a proof, and any later decision procedure must emit one or a certificate for a small checker. Writing out intermediate facts is tedious for a person and cheap for an AI, which makes this choice more affordable than it was. Deterministic is not the same as inexpensive; what checking costs is measured, not assumed.",
    "5. **The target is Rust, which makes protected interfaces possible.** Rust supplies the mechanisms: private fields, shared references that cannot mutate, no null, no uninitialized value, exhaustive enums. A caller in C, or across a C interface, can forge anything. The mechanisms do not preserve a guarantee by themselves. Locus has to generate, and verify, the abstraction that uses them: private storage, constructors that validate or demand evidence, and operations that keep the invariant. Exposing unrestricted mutable access to a validated value would undo it. The claim is therefore narrow: a generated interface preserves the invariants it exposes to safe callers; `unsafe` in the caller can break them. A guarantee that relates several values, such as \"this output is a permutation of that input\", is available to Locus callers as evidence and does not become a Rust type; a Rust caller gets it as documentation of a checked fact, not as something the compiler tracks.",
    "",
    "Hence one language with a Rust-like type system, propositions, and explicit proofs, lowered to Rust.",
    "",
    "## What is trusted",
    "",
    "The proof kernel is small and auditable. It is not the whole trusted base. The correspondence between the source, the logical statements checked, and the Rust emitted is trusted too: lowering, the checker for executable code, erasure, the Rust printer, and the Rust toolchain ([IR architecture](architecture.md)). A sound kernel cannot establish that the program checked and the program run agree; differential testing of the two branches addresses that, and an erasure theorem is the longer-term answer. \"Proofs about the real code\" is likewise a commitment, not a consequence of the syntax: each systems feature, from machine arithmetic to aliasing, panics, and imported operations, needs a precise meaning in the logic that compilation preserves.",
    "",
    "\"Without runtime proof machinery\" means no dedicated runtime and no proof checking when the program runs. It does not mean no checks: validating input that arrives from outside, and the wrapper around an exported function with a precondition, are executable tests.",
    "",
    "## What it is not, and what it gives up",
    "",
    "- **It does not verify existing Rust.** Keeping proofs and program together means only code written in Locus is verified. Verifying code that already exists is what Aeneas, Verus, Creusot, and Kani are for.",
    "- **It is not as powerful as Lean.** The logic is deliberately small: dependency only inside propositions, no tactic language, no mathematics library. Where the difficulty is mathematics rather than bounds, states, and invariants, a prover is the right tool. Locus emits plain safe Rust, so taking a generated core into such a tool later remains possible.",
    "- **It is not a superset of Rust, and may never be one in full.** The aspiration is a growing subset of safe Rust, plus propositions and proofs, in which anything Locus and Rust both have means what it means in Rust. `unsafe`, interior mutability, and concurrency stay behind a stated trusted boundary. Giving logical meaning to all of Rust, which has no finished formal semantics, would make \"kernel-checked\" relative to a large trusted model.",
    "",
    "- **It is not alone.** Verified systems code, familiarity to Rust programmers, and static verification are what Verus offers too, with far more automation. What Locus wagers on is a combination: proof-bearing interfaces that compose as ordinary values, evidence that is checked independently of whatever produced it, proof construction a Rust programmer finds approachable, and Rust exports that protect what was proven. Those are experiences to demonstrate, not properties to assert.",
    "",
    "Its closest relative is Low\\* with KaRaMeL, a restricted language inside F\\* that compiles to readable C with no runtime, more than it is Lean.",
    "",
    "## The assumption everything rests on",
    "",
    "A Rust-like language with ownership and mutation, a logic over immutable values, and explicit proofs, all at a proof burden people tolerate. The functional reading of `&mut` is known to work. That it stays pleasant without a solver absorbing the obligations it generates is not known, and Locus today has no mutation at all. The experiment that tests the thesis is `let mut` and `&mut` under that reading; the Aeneas papers are the reference for it. Close behind is the expressiveness of specifications: mathematical integers, sequences and maps, ghost models, and opaque types, without which a specification can say little of interest.",
    "",
    "## How it is delivered",
    "",
    "- **A verified core inside a Rust crate.** `.lc` files in a crate, compiled by a cargo command or `build.rs` into an ordinary module. The output has no runtime and no dependency, so the users of the crate need nothing.",
    "- **A macro as the way in.** `locus! { ... }` for a first proven function with one dependency added. It is a second driver over the same library, which is why Locus source tokenizes as Rust. It is not the main route: a macro sees only its own tokens, pushes proof checking into every downstream build, and can report little.",
    "- **Rust only.** The erased tree is target-neutral and stays so, and nothing beyond Rust is promised, because the boundary guarantee depends on the host language.",
    "- **Rust's modules when modules are needed.** `mod`, `use`, and `pub` exactly as in Rust. `pub` and field privacy arrive earlier, with interoperation, because privacy is what protects a validated type.",
    "",
    "## The use case that motivates the next steps",
    "",
    "A person writes a header: types, declared propositions, math functions with their bodies, and the signatures of the public functions, which carry their invariants. An AI writes the implementation and its proofs in another file, against that fixed specification. People review only the header.",
    "",
    "This moves review to a smaller artifact; it does not decide what correctness means. The header becomes the critical document. A sorting contract that says only \"the result is sorted\" permits returning an empty collection. The specification has to cover the intended behavior and its assumptions, and the AI must be unable to weaken it or to add trusted assumptions while satisfying it. Tooling can help a reviewer trust a header, with executable examples and a warning when a precondition cannot be satisfied, and cannot write it for them.",
    "",
    "For that to be sound:",
    "",
    "- the header elaborates on its own, so that every word a claim uses is defined where it is reviewed;",
    "- the checker requires each implementation to match its signature exactly;",
    "- termination is visible in the header, since a function that never returns satisfies any result type, and `loop` is the only source of divergence;",
    "- `Proved` cannot be constructed outside generated code, and an exported function never takes evidence from Rust: it has no proof precondition, takes a validated type, or is a wrapper that checks at runtime;",
    "- an audit command lists everything trusted: foreign declarations, classical reasoning, divergence, traps.",
    "",
    "For it to be pleasant: diagnostics as data, with the claim, the facts, the gap, and the failing case; a short reference and example corpus written for a model that has never seen the language; a cache of found proofs; and decision procedures that produce certificates once integers are wider than a byte, where evaluating every case stops being possible.",
