    "# Formal core: checked execution, lowering and erasure",
    "",
    "\u003c!-- spec: 3.0:1 informative -->",
    "This is the current compiler's small calculus, not a mechanized proof of its correctness. It states the trusted judgments outside the logical kernel and the preservation obligations still to prove. The concrete syntax below is metalanguage; names in backticks identify Rust constructors. Every rule cites the Language paragraph it implements and an Architecture section. The kernel's own typing, proof and definitional-equality rules remain in the Kernel contract; they are premises here, never an implicit solver. The executable oracle for the erased calculus is `erased::Interpreter`; `exec::CheckInterpreter` is the reference for the check IR. Neither implementation wins a disagreement by definition.",
    "",
    "## 1. Judgments and grammar",
    "",
    "\u003c!-- spec: 3.1:1 informative -->",
    "`D` is the checked logical declaration environment. `F` contains the already accepted ordinary functions and recorded trusted adapters. `G` is an ordered context of fresh variable identities `x:T` and established hypotheses `h:P`; source spellings are not identities. A telescope `(x1:T1, ..., xn:Tn)` checks left to right, substituting earlier arguments into later types. `K(G,t):T` and `K(G,p):@P` mean the kernel accepts a term or proof. A block judgment also carries the enclosing function result `R`, its promises `Π`, a stack `L` of loop targets `(state,result)`, and an expected local result `Q` or `none`. Separately checked physical layouts `A` distinguish surface `bool` from logical `Bool`, physical containers from logical inductive data, and reference origins. `K` alone does not discharge the layout/permission judgment. [Language 1.2:1–3, 1.3:2, 1.5:5; Architecture “Logical classification and physical layout”, “Context, snapshots and scope”.]",
    "",
    "\u003c!-- spec: 3.1:2 syntax -->",
    "~~~text prose check-ir-metalanguage",
    "Block  ::= Stmt* ; Tail",
    "Stmt   ::= Let(x,h,T?,t) | Have(h,P,p) | Call(x,f,args)",
    "         | Match(x,T,t,arms) | Loop(x,S,xs,init,R,body)",
    "         | For(x,i,hlo,hhi,lo,hi,inclusive,S,xs,init,body)",
    "         | Operate(x,h,op,M,args,fits?,learned)",
    "         | Buffer(x,h,op,storage,T,logical_payload,args,bounds,learned)",
    "         | BoxNew(x,h,t,logical_payload)",
    "Tail   ::= Value(t) | Break(t) | Continue(ts) | Match(t,arms)",
    "         | Return(t) | Panic(message,unreachable?)",
    "Arm    ::= (payload identities, branch hypothesis identity, Block)",
    "Storage::= Array(n) | Slice | Vector",
    "BufferOp ::= Literal | Length | Get | Set | Push",
    "Promises ::= subset {terminates, no_panic, no_alloc, no_io}",
    "~~~",
    "",
    "\u003c!-- spec: 3.1:3 informative -->",
    "This grammar covers every variant of `exec::Stmt`, `exec::Tail`, `BufferStorage` and `BufferOp`, including the fields carried by `ForStmt`, `OperateStmt` and `BufferStmt`. `tests/formal_core.rs` checks that inventory against the declarations rather than treating the displayed list as permanent. Pure terms, types, proofs, nominal constructors, lambdas and logical recursion are the Kernel contract's grammar. Source struct/tuple construction, projections, casts and wrapping arithmetic become those checked terms; effectful arithmetic stays `Operate`. [Language 1.4:1–2, 1.5:1–5, 1.11:1–3, 1.15:2–3, 1.26:1; Architecture “Representations and pipeline”, “Lowering ordinary execution”.]",
    "",
    "## 2. Static check-IR rules",
    "",
    "\u003c!-- spec: 3.2:1 legality-rule -->",
    "**IR-Bind.** To check `Let(x,h,T?,t)`, infer the permitted value with the kernel, check an optional annotation against the inferred type, bind fresh `x`, and add its defining equation when the type admits equality. Proof values carry their proposition without an equality between proof objects. `Have(h,P,p)` requires `K(G,p):@P` before adding fresh `h:P`. Context extension is ordered and freshness is mandatory. Logical lets introduce facts, not runtime effects. At the end of a lexical block, its local bindings are removed from the checking context; a result type must already be well formed in its receiving context. [Language 1.2:1–3, 1.7:5; Architecture “Context, snapshots and scope”, “Lowering ordinary execution”. Implementation: `exec/check.rs::check_stmt`, `kernel/context.rs::define_with`.]",
    "",
    "\u003c!-- spec: 3.2:2 legality-rule -->",
    "**IR-Call.** For `Call(x,f,args)`, find an already registered signature `(params)->T`, check the arguments in executable mode against the dependent parameter telescope, and require every promise made by the caller to be made by `f`. Bind `x:T[args/params]`. Introduce no equation between `x` and `f(args)`: an ordinary function is not a logical definition. Its proof fields are available through its declared result type. Ordinary recursive call graphs are unavailable in this tier. A trusted adapter uses the same call rule but its accepted contract is an explicit recorded assumption; it is never silently upgraded into a theorem. [Language 1.5:2, 1.9:1–4, 1.26:3; Architecture “Lowering ordinary execution”, “Explicit trust boundary and audit”. Implementation: `exec/check.rs`.]",
    "",
    "\u003c!-- spec: 3.2:3 legality-rule -->",
    "**IR-Match.** Require an executable bool or physical enum scrutinee, one arm per constructor, and each arm's exact payload telescope. In arm `C`, extend `G` by payload identities and the checked equation `scrutinee = C(payload)`, then check its block. Logical evidence may use that equation. Check a statement match's result type outside the arms; every value-producing arm must supply it, while a control-transferring arm has no joining value. Tail `Match` passes the enclosing block's expected result and targets to its arms. Physical layout checking separately rejects an erased discriminant even where the kernel representation is Bool. [Language 1.4:2, 1.5:4–5, 1.11:1, 1.12:2; Architecture “Logical classification and physical layout”, “Lowering ordinary execution”. Implementation: `exec/check.rs::check_arms`, `typed/layout.rs`, `erased/check.rs`.]",
    "",
    "\u003c!-- spec: 3.2:4 legality-rule -->",
    "**IR-Loop.** `Loop(x,S,xs,init,R,B)` requires a tuple telescope `S` and a result `R` formed in the outer context. Check `init:S`, then check `B` under fresh abstract state identities `xs:S` and target `(S,R)`, with expected local result `none`. Thus every path must continue with a new `S`, break with `R`, return from the function, or panic. Only after checking all paths bind the loop result `x:R`. The state is not assumed equal to its initial value in the arbitrary iteration. Evidence fields of `S` are exactly the loop invariant: checked at entry and on every back edge. This is partial correctness; no decreasing measure is required for ordinary execution. [Language 1.11:2, 1.12:3; Architecture “Lowering ordinary execution”. Implementation: `exec/check.rs::check_stmt`, `declare_state`.]",
    "",
    "\u003c!-- spec: 3.2:5 legality-rule -->",
    "**IR-For.** `For` checks both bounds at the same executable machine type, forms state `S` in the outer context, and checks `init:S`. The body receives fresh `i`, fresh state, and `view(lo) \u003c= view(i)` together with `view(i) \u003c view(hi)` (or `\u003c=` for an inclusive range); its target is `(S,S)`. It must not fall through. The result is `S`. Neither checking nor execution assumes the initial bounds are ordered: an empty or reversed range has zero iterations. The bound expressions have already run once before this statement. [Language 1.11:2, 1.15:3; Architecture “Lowering ordinary execution”. Implementation: `exec/check.rs::check_stmt`, `exec/ir.rs::ForStmt`.]",
    "",
    "\u003c!-- spec: 3.2:6 legality-rule -->",
    "**IR-End.** `Value(t)` requires a local expected result and `t` of that type. `Break(t)` requires a nearest loop and its result type; `Continue(ts)` checks its state telescope. `Return(t)` checks the enclosing function's result type instantiated at entry parameters, irrespective of nesting. `Panic(message,None)` has no value and is admitted unless the function promises `no_panic`; `Panic(message,Some(p))` always checks `p:False`. Under `no_panic` this evidence is mandatory. A panic is not evidence that a postcondition held. [Language 1.10:1–2, 1.11:2–3; Architecture “Lowering ordinary execution”. Implementation: `exec/check.rs::check_block_in_scope`.]",
    "",
    "\u003c!-- spec: 3.2:7 legality-rule -->",
    "**IR-Operate.** For a machine row `op[M]`, check operand types and exact arity. Bind the result with the row's total wrapped equation, the common value meaning on normal return in both overflow modes. If `fits` is supplied, check every premise of that row in order. Under `no_panic`, any possibly panicking row requires these proofs. With checked range premises, derive and kernel-check the exact Int-view equation. After division/remainder, normal return establishes its nonzero-divisor premise and, for signed division, exclusion of `MIN/-1`; the checker learns these in both builds. Normal return from addition in the wrapping build establishes no new overflow bound. `learned` must have exactly the hypotheses required by the row. [Language 1.9:3, 1.15:2–3; Architecture “Lowering ordinary execution”. Implementation: `exec/check.rs::check_operate`, `kernel/ops.rs`.]",
    "",
    "\u003c!-- spec: 3.2:8 legality-rule -->",
    "**IR-Storage.** `BoxNew` requires a permitted payload observation and checked payload layout, preserves physical allocation even for a logical payload, and on normal return binds `x:Box\u003cT>` with `x = Boxed(payload)`. It violates `no_alloc` and the current conservative `no_panic` allocation policy. `Buffer` uses the following table; every argument is checked in its physical or explicitly erased payload mode before any result fact is added. Storage shape, operand arity, result layout, bound-proof count, and learned-fact count must match. [Language 1.5:4–5, 1.26:1, 1.26:6; Architecture “Calls, borrowing and native storage”. Implementation: `exec/buffer.rs`, `typed/buffer.rs`, `typed/shared.rs`; Kernel 2.35, 2.36.]",
    "",
    "\u003c!-- spec: 3.2:9 legality-rule -->",
    "| Buffer operation | Premises | Normal-return result and meaning |",
    "|---|---|---|",
    "| `Literal` | Exact array length; no slice allocation; each element fits the retained payload layout. | Buffer snapshot containing the element sequence. Nonempty vector literal may allocate. |",
    "| `Length` | Existing physical buffer. | u64 result whose Int view equals snapshot length. |",
    "| `Get` | Buffer, u64 index, exactly two checked proofs `0 \u003c= view(index)` and `view(index) \u003c length(buffer)`. | Element at that snapshot position; logical elements yield logical values only. |",
    "| `Set` | Same bounds as Get, plus a replacement element. | New immutable content snapshot with that position replaced; the caller's mutation/writeback implements physical update. |",
    "| `Push` | Vector storage and an element. No caller-supplied bound proof. | May allocate/fail. Only on normal return introduce the fact `old_length \u003c u64::MAX`, then the appended snapshot equation. |",
    "",
    "\u003c!-- spec: 3.2:10 legality-rule -->",
    "**IR-Promises.** All calls satisfy promise inclusion. `terminates` additionally rejects every `Loop` and `For`, even an obviously finite one; there is no ordinary recursion. `no_panic` checks the endings/operators/storage rules above. `no_alloc` rejects allocating storage operations; `no_io` allows only callees promising no I/O. Native implementation/specification assumptions are recorded separately. This is the implemented rule, not an inference of the strongest effects. [Language 1.9:2–4, 1.26:3; Architecture “Lowering ordinary execution”, “Explicit trust boundary and audit”. Implementation: `exec/check.rs`, `exec/buffer.rs`.]",
    "",
    "## 3. Dynamic interpretation",
    "",
    "\u003c!-- spec: 3.3:1 dynamic-semantics -->",
    "Write `run(B,σ,H,mode) -> (control,H')` for evaluation with identity-to-value environment `σ`, physical storage `H`, and overflow mode `Checks` or `Wrap`. Controls are `value(v)`, `break(v)`, `continue(vs)`, `return(v)`, and `panic(message)`; infinite execution has no finite result. An implementation's fuel/depth exhaustion is an inconclusive observation, not another language result and not proof of divergence. Logical values are observed only through their erased marker. `Let` binds its permitted value, `Have` does no runtime work, and ordinary `Call` executes its callee even when its result erases. Statements run in order until a control transfer; block-local environment entries leave scope, while completed physical writes remain. [Language 1.5:1–4, 1.10:2, 1.18:1–2, 1.19:2; Architecture “Representations and pipeline”, “Agreement and the trusted base”.]",
    "",
    "\u003c!-- spec: 3.3:2 dynamic-semantics -->",
    "`Match` runs exactly the arm selected by the physical tag, binding its payloads; its equation is logical only. `Loop` starts at `init`, replaces the state on `continue`, yields a value on `break`, and propagates return/panic. `For` visits the machine range in increasing order without an overflowing increment past its final endpoint; zero visits return `init`; continue advances the state, break yields it, and return/panic propagate. `Operate` runs the corresponding Rust machine operation in the selected overflow mode. `BoxNew` and `Buffer` perform their physical operations; normal-return equations do not predict that allocation succeeds. `Value`, `Break`, `Continue`, `Return` and `Panic` produce their named controls. [Language 1.10:1–2, 1.11:1–3, 1.15:2, 1.26:1; Architecture “Lowering ordinary execution”, “Calls, borrowing and native storage”.]",
    "",
    "\u003c!-- spec: 3.3:3 informative -->",
    "The check-IR interpreter stores immutable value snapshots and uses the lowering-provided Lending/projection metadata to report physical `&mut` exits, including writes completed before a panic. The erased interpreter performs mutable storage operations on the source-shaped tree. This difference makes them useful independent oracles, not interchangeable implementations of the same traversal. There is no promise here that the test harness simulates host OOM/abort, allocator addresses, destructor behavior not yet admitted, or arbitrary external I/O. The native-storage correspondence is conditional on the admitted Rust native semantics; partial correctness constrains normal return. [Language 1.13:2, 1.19:2, 1.24:1; Architecture “Calls, borrowing and native storage”, “Agreement and the trusted base”.]",
    "",
    "## 4. Typed lowering",
    "",
    "\u003c!-- spec: 3.4:1 legality-rule -->",
    "**L-Eval.** The lowering judgment `lower(e,G,V,A) = (stmts,t,V')` sequences every ordinary operand/argument computation left to right, then returns its named result term. `V` maps each mutable storage-root identity to its current immutable version. A pure executable expression becomes a kernel term; an ordinary call, panicking operator, storage operation, loop or control transfer becomes ordered IR. The lowering of an effectful expression cannot be removed because its result is Logical. A logical application keeps its ordinary argument computations and introduces only an erased logical result. Explicit logic blocks admit no such effects. Every executable read must name the current version; an old version is valid only as a logical snapshot, never as a silently stale physical read. [Language 1.5:1–5, 1.12:1; Architecture “Lowering ordinary execution”. Implementation: `typed/lower.rs`.]",
    "",
    "\u003c!-- spec: 3.4:2 legality-rule -->",
    "**L-Write.** Lower assignment's right-hand side first. Then find the destination root/path, rebuild the old immutable root with that field replaced, and emit `Let(fresh_version,eq,root_type,rebuilt)`. Update `V(root)` to the fresh identity; never overwrite an old context binding. A field replacement checks the entire dependent root, so it cannot silently invalidate a proof field. Shadowing allocates a distinct root. **L-Tracked.** A tracked evidence binding's current expected claim is its declared claim with captured mutable dependencies substituted by `V`. Refreshing it is a checked assignment; an older proof remains evidence only about older snapshots. [Language 1.12:1, 1.12:3; Architecture “Context, snapshots and scope”, “Lowering ordinary execution”. Implementation: `typed/lower.rs::rebuilt`, `Versions::version_type`.]",
    "",
    "\u003c!-- spec: 3.4:3 legality-rule -->",
    "**L-Join.** Independently compute roots assigned on arms that can reach the continuation. In declaration order, build a dependent tuple of their post-arm versions followed by the expression result. Each reaching arm returns its own versions, using its entry version for a root it did not change. Transferring arms contribute no tuple. Check the tuple type outside the arms, substituting earlier joined fields in later proof fields. Bind the joined versions by projections and update `V`. Reject a typed tree whose claimed join roots disagree with the independently computed set. Ordinary lexical blocks keep writes to outer roots but close their local names. [Language 1.3:2, 1.11:1, 1.12:2; Architecture “Context, snapshots and scope”, “Lowering ordinary execution”. Implementation: `typed/lower.rs::join_type`, `block_leaves`.]",
    "",
    "\u003c!-- spec: 3.4:4 legality-rule -->",
    "**L-Iteration.** Independently compute outer roots assigned by the body (and a while condition), then form their state telescope in declaration order. Shadowed/body-local roots are not carried. A stale proof binding may be omitted, in which case any refreshed local version cannot escape as loop state. Supply current entry versions as `init`, abstract versions to the body, current versions on continue and break edges, and project exit versions from the loop result. An unbounded loop appends its break value after carried fields; a while/for carries unit control result. `while c {B}` lowers to a loop whose body evaluates `c` anew and branches to break or `B; continue`; for bounds run once. No ordinary loop is a kernel logical loop. [Language 1.11:2, 1.12:3; Architecture “Lowering ordinary execution”. Implementation: `typed/lower.rs::carried_bindings`.]",
    "",
    "\u003c!-- spec: 3.4:5 legality-rule -->",
    "**L-Lend.** A call-scoped shared parameter is a referent snapshot. A mutable parameter is an entry value plus an exit value in the check-IR function result: `(mut_exit_1,...,mut_exit_n,declared_result)`, a dependent telescope. `old!(x)` selects the entry identity; result claims use the appropriate named exit/input binders. A call evaluates arguments in order, rejects overlapping lends whenever either is mutable, binds this exit tuple once, then rebuilds each caller root with its exit field in argument order. Normal return and early return produce the same exit shape. Panic has no normal result tuple, but already completed physical writes remain and Lending metadata lets the IR oracle report them. [Language 1.9:1, 1.11:3, 1.13:1–2; Architecture “Calls, borrowing and native storage”, “Lowering ordinary execution”. Implementation: `typed/lower.rs::exec_result`, `exec::Lending`.]",
    "",
    "\u003c!-- spec: 3.4:6 legality-rule -->",
    "**L-Permission.** Before snapshots erase reference syntax, check each shared-reference leaf's origin set `(root,path,creation_position,lifetime)`. A read, including a logical observation, requires a live origin with no intervening overlapping write/move. Copying or transporting a reference preserves its origins; branch joins conservatively merge them. A result cannot refer to dead local/arm storage or a shorter lifetime. Shared dereference cannot move out non-Copy data; references hidden in unsupported owned containers, stored mutable aliases and interior mutation are rejected. Physical Box dereference follows its allocation root and owned consumption rules. This judgment is separate from snapshot equality: equal contents do not imply the same permission. [Language 1.16:1, 1.25:5, 1.26:2, 1.26:4; Architecture “Logical classification and physical layout”, “Calls, borrowing and native storage”. Implementation: `typed/shared.rs`, `typed/layout.rs`.]",
    "",
    "## 5. Erasure",
    "",
    "\u003c!-- spec: 3.5:1 legality-rule -->",
    "**E-Type.** Erasure is indexed by a checked layout, not only by the kernel type. A Logical position maps to private zero-sized `Erased`. Runtime tuples/structs retain positional fields; ordinary enums retain their tags; recursive runtime enums retain their Box indirection. Physical Box, Vec, arrays and slices remain physical even with Logical payloads. Shared references retain their lifetime/layout and permission-checked referents. The internal distinction between `Proved` and `Ghost` erasure nodes prints as the same marker. The erasure checker rejects a physical use of a logical position, including nested tuple/enum projections. [Language 1.3:1, 1.5:5, 1.18:1, 1.26:6; Architecture “Logical classification and physical layout”, “Erasure and cleanup”. Implementation: `typed/layout.rs`, `erased/erase.rs`, `erased/check.rs`.]",
    "",
    "\u003c!-- spec: 3.5:2 dynamic-semantics -->",
    "**E-Expr.** Keep literals, physical constructors/projections, ordinary calls, borrowing, assignments, operations, storage allocation, and physical control in their source shape after recursively erasing logical positions. Erase logical definitions, propositions, certificates, model observations and logical applications after retaining eager ordinary subexpression effects exactly once and in order. A physical conditional yielding Logical values still runs its condition and only its selected arm's effects; erasure must not concatenate both arms. Logical boolean operators in ordinary code retain their eager ordinary operands rather than introducing a physical short circuit. Map SSA versions back to their physical root binding; do not emit the check IR's join/state/writeback tuples as production storage. [Language 1.5:1–5, 1.18:1–2; Architecture “Erasure and cleanup”. Implementation: `erased/erase.rs::effects_then`, `expr_with_layout`.]",
    "",
    "\u003c!-- spec: 3.5:3 legality-rule -->",
    "**E-Clean/Export.** Remove an unused erased binding or pattern component only while retaining its effectful initializer as a statement; preserve panic/divergence, mutation and allocation. A nonreturning initializer becomes a terminal expression, not an unreachable marker tail. Privacy is part of the boundary: a single marker does not carry proposition identity in Rust, so exported evidence-accepting entry points and writable invariant fields must pass the dedicated anti-forgery checks. Safe Rust callers construct verified values through the accepted exported interface, not arbitrary markers. [Language 1.17:1, 1.18:3–4, 1.19:1; Architecture “Erasure and cleanup”. Implementation: `erased/cleanup.rs`, `erased/rust.rs`, `elab/items.rs::check_exported_fn`, `check_exported_struct`, `build.rs`.]",
    "",
    "## 6. Preservation obligations and agreement",
    "",
    "\u003c!-- spec: 3.6:1 informative -->",
    "The intended theorem is conditional, not an implementation claim already proved: if declaration checking, layout/permission checking, lowering and IR checking accept `e:R`, the initial physical store realizes its parameter telescope, and the recorded native/foreign contracts hold, every normal execution result realizes `R` and its exposed evidence claims. Panic and divergence do not establish the normal postcondition. A separate simulation must show that `lower(e)` and `erase(e)` preserve the same physical result, completed writes and panic behavior, modulo erased values and logical stuttering, in each overflow mode. It must account for dependent joins, reference origins, ordinary calls with erased results, and writebacks interrupted by panic. A kernel soundness theorem alone does not imply this simulation. [Language 1.5:2, 1.13:2, 1.18:2, 1.23:1; Architecture “Agreement and the trusted base”.]",
    "",
    "\u003c!-- spec: 3.6:2 normative -->",
    "Agreement has no designated winner: Language prose, this calculus, check-IR execution, erased execution and emitted Rust are views of the same intended behavior. A failure report identifies the disagreeing pair and reproducing input/seed, mode, relevant output and rule IDs; an oracle may itself be wrong. `tests/exec_check.rs`, `exec_endings.rs` and `exec_operations.rs` exercise individual IR judgments; `typed_lower.rs` and reference tests exercise version/join/loop/writeback rules; `erasure_layout.rs`, `reconcile_logic.rs`, `collections.rs`, `reconcile_box.rs` and `rust_output.rs` exercise erasure and native boundaries. `random_programs.rs`, `differential.rs` and the corpus compare the two interpreters and generated Rust in both overflow builds. A timeout/fuel/depth exhaustion is inconclusive and must not be counted as agreement. Allocation failure is not exhaustively explored by these finite tests. [Language 1.19:2, 1.23:1; Architecture “Agreement and the trusted base”.]",
    "",
    "## 7. Future Lean deliverables",
    "",
    "\u003c!-- spec: 3.7:1 informative -->",
    "Mechanization is intentionally deferred. Its first checked-in deliverable must freeze a reviewed logical axiom manifest and separately enumerate the native/foreign assumptions; it must not assume the erasure theorem it intends to prove. Encode the telescope/context calculus, every IR constructor, both overflow modes, physical permission/layout judgments, lowering and erasure relations. Prove weakening/substitution and context realization, then each checking rule's preservation, then lowering and erasure simulations, including panic-state writebacks and control transfer. For the admitted fragment, mechanize executable evaluators and connect their bounded observations to the relations. A fixed primitive manifest is distinct from optional classical reasoning; dependencies must report both honestly.",
    "",
    "\u003c!-- spec: 3.7:2 informative -->",
    "The trust report must print `#print axioms` for every exported correctness theorem, count `sorry`/`admit` and unexpected axioms (required zero in the validation target), identify any intentionally assumed native contract by reason, and record Lean/toolchain versions and source revision. Generate an index `calculus rule ID -> Lean declaration -> Language paragraph ID -> Rust implementation -> focused test`; CI must reject missing rows and stale declaration names. Keep interpreter dependencies outside the axiom manifest. The current file-level compiler trusted-base report conservatively counts mixed files in full, including the export boundary currently housed in the elaborator; it must not be relabeled as just the proof kernel.",
    "",
    "\u003c!-- spec: 3.7:3 informative -->",
    "A future `tools/validate-formal` entry point must run from a clean checkout with the pinned toolchain and documented cache, check the fixed axiom allowlist, build the mechanization, regenerate the rule index/trust report, run deterministic IR/erasure/native boundary examples in both overflow modes, and emit a reproducible summary. Publish hardware/cache prerequisites and measured clean/cached durations, with a target of completing the reader's validation in 30 minutes. A wall-clock deadline is only the validation harness's inconclusive stop policy, never a proof-search or language-acceptance rule. CI archives the index, axiom report, sorry count, toolchain versions and test summary. These are future deliverables, not files claimed to exist today."
   ],

  {
   "id": "development-workflow",
   "title": "Development workflow",
   "group": "Now",
   "created": "2026-09-23T04:07:15.000Z",
   "body": [
    "# Development workflow and measurements",
    "",
    "Run `tools/check.sh` for formatting, warnings-denied clippy, focused specification traceability, executable documentation, compiler tests and benchmark freshness. Run `tools/check.sh --extended` before acceptance: it also runs the release stress suite, benchmarks the target programs, and regenerates [status](generated-status.md). Rust 1.91+, Python 3, and Node.js are needed for the full gate. The editor grammar test additionally uses its installed npm dependencies. No benchmark duration is a proof-checking acceptance criterion.",
    "",
    "## Read the completion receipt",
    "",
    "Only a successful complete selected gate emits `LOCUS GATE COMPLETE` as its final line. A successful Cargo tally followed by a killed or failed step is not completion. Gate timing history appends to `target/gate-history.jsonl`; the two-minute fast-suite target is advisory and an overrun is explicit. The compilation warm-up is excluded from the fast-suite timer. Fast and extended Cargo logs receive distinct completion markers only after their processes succeed.",
    "",
    "## Specifications, examples and known bugs",
    "",
    "[Language](language.md), [Kernel contract](kernel-contract.md), and [Formal core](formal-core.md) have stable paragraph IDs. Categories are local; unmarked categories mean informative. Tests cite IDs with `//~ spec: 1.2:3` or a Rust test's `#[doc = \"spec: 1.2:3\"]`. An operative paragraph must have a focused citation: one Rust test or a corpus file with fewer than forty physical lines. Review must still check the substantive relationship between test and rule; the gate checks coverage and references, not semantic equivalence of prose and code. Rendered IDs are links.",
    "",
    "Every Now fence says `check`, `run`, `reject CODE`, or `prose REASON`; run fences include expected values. The suite exports and checks them, including interpreter/Rust agreement where applicable. `python3 tools/spec.py check` runs the inventory gate; `python3 tools/spec.py fences --out target/atlas-fences` exports the examples. Vision fences are exempt until their feature lands.",
    "",
    "Known-bug markers pin a failure and an open Atlas task. An unexpected pass, a changed pinned failure, or a closed task fails the suite. The earlier E9 struct-literal `fold!` bug was already fixed by Reconciliation: its reproducer is now a passing regression, and synthetic harness tests exercise the known-bug lifecycle. No broken program is invented merely to keep a real known-bug marker alive.",
    "",
    "## Trust and diagnostics",
    "",
    "`locus audit FILE_OR_DIRECTORY...` checks each discovered source unit and lists divergence, panic, native allocation, classical dependencies, and explicitly trusted adapters with their required reason strings. Directory discovery is sorted, skips symlinks and generated `target`/`.git` trees, and does not introduce module resolution. See the [trust boundary](architecture.md) for what the audit means. Explicit foreign specifications remain assumptions.",
    "",
    "`locus check FILE --error-format json` emits schema-versioned diagnostic arrays on stderr; `locus explain L0230` gives a code-specific explanation with a Language paragraph link. The exact schema and compatibility policy are in `docs/diagnostics/schema.md`; corpus JSON and text are separate goldens. Optional proof fields are null when unavailable. A bounded failed search is not a refutation. Kernel/checker errors have their own code range.",
    "",
    "## Raw benchmark records",
    "",
    "`cargo run --release -- bench` runs `tests/corpus/target` by default. Pass files/directories to choose workloads, `--library FILE` to supply checked declarations, `--samples N` to choose the repetitions (default five), or `--no-record` to inspect raw JSON without updating history. Every workload has an empty-store search pass and a fresh parsed-store locked replay pass per repetition. Benchmarking never rewrites source proof sidecars.",
    "",
    "Per obligation, samples record attempted search tiers in integer nanoseconds, proof-tree nodes, serialized certificate bytes, stored-proof hits, and an independent kernel recheck (`kernel_recheck_ns`, not the time spent checking the obligation during compilation). Per file they record parse, frontend elaboration, lowering, checking and erasure time. The elaboration field is the residual frontend duration after subtracting measured lowering/checking/erasure spans; it includes search and name/type work. Total excludes the additional per-obligation serialization/recheck measurement pass and excludes file I/O and per-library preflight parsing. Phase times describe instrumented boundaries, not CPU profiling. Fast-suite duration comes from the current extended gate, or the last complete local gate for standalone runs; it is null when no gate sample exists.",
    "",
    "Records are canonical JSON, named by SHA-256, appended to the local Git data branch `locus-bench-data`. Appending changes that branch alone, not the checked-out source branch or index. Records are never overwritten; the branch must be retained/shared separately when moving machines. `python3 tools/bench.py summary` derives medians, workload sparklines and a geometric headline index (first same-epoch record = 100, lower is faster).",
    "",
    "An epoch pins workload/library content and roles, library order, CPU/OS machine class, the Rust toolchain and settings recorded when the compiler binary was built, and elaboration options. Equivalent absolute and relative paths use the same workload keys. Each raw record also identifies the actual compiler executable by SHA-256 and the build-time source by its Git blob hash; those identities do not become epoch pins, because compiler improvements must remain comparable. A change to a pin starts a new comparison epoch. Use the same build profile for a meaningful series. `LOCUS_BENCH_MACHINE_CLASS` can supply an additional machine-class discriminator.",
    "",
    "For each workload the comparison uses the current cold-search samples and up to ten preceding same-epoch records. With at least three samples on each side, a slowdown is flagged when its median increase exceeds six times the pooled robust dispersion (scaled median absolute deviation). Flags are evidence to investigate, not automatic correctness failures. A deliberate synthetic slowdown is a regression test of this policy. `python3 tools/bench.py check` fails when the current target corpus has no release-build history for this machine/toolchain, its source lineage diverged, or that target series is more than five source commits behind; run a new release benchmark to resume the series. An unrelated workload cannot refresh that target series.",
    "",
    "The two-week observation criterion stays open until genuine same-epoch records span that interval. Today's implementation cannot create that elapsed history. No historical timestamps are fabricated and no recurring automation is implied.",
    "",
    "## Generated status and stale results",
    "",
    "The extended gate creates `target/status-record.json`, `target/status.json`, and the Atlas [generated status](generated-status.md) from complete test logs, spec inventory, trusted-file inventory, and immutable benchmark records. The Overview links there rather than duplicating hand-entered counts. Trusted-base counts conservatively include whole mixed files; the inventory is `tools/trusted-base.json` and distinguishes this end-to-end boundary from just the proof kernel.",
    "",
    "A source/test/tool/example/editor or Now-document change invalidates the status fingerprint. The gate replaces obsolete displayed counts with a STALE notice; `python3 tools/metrics.py check` verifies the exact generated display, while `--fresh` requires a current complete measurement. `tools/atlas.py serve` also checks the fingerprint when serving the page and hides obsolete counts in that response. A standalone saved HTML copy is a dated report, not a live filesystem monitor. Raw old measurements remain available as history. The extended gate rejects a checkout that changed while its tests were running.",
    "",
    "## Mechanization boundary",
    "",
    "[Formal core](formal-core.md) covers the check IR and its lowering/erasure obligations. The check-IR interpreter, erased interpreter and compiled Rust are compared; a disagreement identifies a defect to investigate, never an automatic winner. No Lean proof is claimed. Its eventual fixed-axiom, no-hidden-sorry, rule-index and reproducible validation deliverables are specified there and intentionally deferred."
   ],
   "updated": "2026-09-23T04:07:15.000Z"
  }

  {
   "id": "p2",
   "name": "Core Language",
   "status": "planned",
   "description": "The first stage of implementation, not a part of the vision: the boundary between the core and the rest is temporary and disappears as more is built.\n\nLogic-only types, grouped under logic. These are Prop, proof types, Int and Seq\u003cT>, with Map and Set later. They have no runtime form, now or ever.\n\nGhost\u003cT>, built by snapshot(e). It gives up the runtime form of any other type. Inside a proposition it reads as the T.\n\nOne rule. A binding or field is erased exactly when its type has no runtime form. There is no binder keyword.\n\nConversions into the logic. as Int, and a view from Vec to Seq.\n\nRuntime big numbers and similar types are library types with a logic-only model.\n\nModel functions and model fields need no feature of their own.",
   "created": "2026-09-21T19:19:39.000Z",
   "updated": "2026-09-21T21:22:55.000Z"
  },
  {
   "id": "p229",
   "name": "Kernel arithmetic",
   "status": "planned",
   "created": "2026-09-21T20:49:51.000Z",
   "updated": "2026-09-21T20:49:51.000Z",
   "description": "What Target language: Integers, in code and in propositions of the notes asks of the kernel. The core batch cannot have i32, u32, or the arithmetic operators without it: the kernel today has Nat with addition and a model of u8 only."
  },
  {
   "id": "p173",
   "name": "Macros and built-in forms",
   "status": "planned",
   "description": "Locus has no user-defined macros, and a closed set of forms the compiler handles itself, spelled with ! as Rust spells a macro call (Target language: Built-in forms). Nothing is expanded; the mark says that this is not an ordinary call.\n\nThe rule: a step is a library function when its type can be written, and a form when the compiler has to look at syntax to know the type.\n\nThree groups of work: the machinery (parsing name!(...) for the closed list, diagnostics for anything else); the proof forms (prove!, and the respelling of rewrite, unfold, fold, recurse, old, snapshot); and the forms that mean what they mean in Rust (assert!, unreachable!, todo!, panic!, debug_assert!, matches!, vec!, derive). _ stays the request for evidence and is not part of this.\n\nLater questions: hints for prove!, user-defined macros (not planned), and which forms become library functions once generics and logic-only lambdas exist.",
   "created": "2026-09-21T19:41:53.000Z",
   "updated": "2026-09-21T19:41:53.000Z"
  },

   "title": "Decide what the integer operators mean to the logic",
   "status": "done",
   "priority": 3,
   "project": "p89",
   "notes": "Decided 21 September: Target language: Integers, in code and in propositions. The test is Target language: Functions in propositions applied to operators: x + 1 on a machine integer may panic, so it is not valid in a proposition; x as Int + 1 and x.wrapping_add(1) are.\n\nTarget language. Overflow panics in one build and wraps in another, so without no_panic the only fact true in every build is that the result, if there is one, is the wrapped value. / and % truncate toward zero and panic on a zero divisor; a shift overflows at the bit width; as truncates.\n\nProposal (21 September), not yet accepted:\n\n1. In code an operator means what it means in Rust, and is printed as written.\n2. To the logic, the result of a + b is the sum of the two values as Int, wrapped into the type. Under no_panic there is also an obligation that the sum is in range, after which the wrap is the identity and the result is the exact sum. Without no_panic there is no obligation and only the wrapped value is known, since that is the one fact true in every build.\n3. Inside a proposition, arithmetic is over Int: a machine integer is read as its Int value, so a specification cannot overflow. Code and specification agree exactly when nothing overflows, which is what no_panic establishes. To speak of wrapping in a proposition, write wrapping_add.\n4. An operation that panics in every build teaches its condition to what follows: after a / b, the divisor is known not to be zero, as after assert!(c), c is known. An operation that panics only in some builds teaches nothing.\n5. / and % on Int truncate toward zero, as in Rust, so that code and specification agree. Int division by zero is given the value 0 in the logic, where it must be total; code under no_panic can never reach it.\n6. as between integer types is the same wrap and is never an obligation. as Int is exact.\n7. The reference interpreter panics on overflow, which is the stricter of Rust's two behaviors.\n8. Kernel work this implies: Int as an ordered ring; for each machine type a view to Int and a wrap from Int, generalizing the present u8 model; the evaluator; and an arithmetic procedure that is linear, treats multiplication by a literal as linear, and leaves other products to lemmas.",

   "updated": "2026-09-21T20:49:51.000Z"

   "project": "p89",
   "notes": "Done 21 September as M0 of the Build plan, after one review. Target language: How mutation is checked.\n\nThis is commit M0 (LOC-176) of the Build plan.\n\nA gate: mutation is not implemented until this is written (21 September, after review). The design must state, for each case below, the versions, the facts available at each point, and the types of results, and not only whether the program is accepted:\n1. One branch refreshes tracked evidence; the other returns early.\n2. A loop with several continue and break paths.\n3. Snapshot evidence survives an assignment, while tracked evidence needs a refresh.\n4. A proposition value captures an old value, and then becomes the type of tracked evidence.\n5. A value is moved and initialized again, with evidence about its earlier state in scope.\n6. A call changes two disjoint fields and returns evidence about both.\n\nDirection decided 21 September (Target language: How mutation is checked): versions, in lowering, watched by comparing the two interpreters. The design itself is still to be written.\n\nRaised in the last review before the core. Today lowering is small because the language is pure. With let mut, assignment, loops over mutable state, return, moves, and panics, either lowering does a large translation into versions and state passing, all of it trusted, or the check IR gains mutable variables and the checker grows instead. The rules the target language leaves \"to be written with mut\" belong to the same design and are one flow analysis: validity of tracked evidence, what is known after a join, what a loop forgets, initialization and moves, and early return. Write this as a design before implementing any part of it.",

   "id": "t263",
   "n": 148,
   "title": "Decide whether a declared proposition is written as an attribute on an enum, so that prop is not a keyword",
   "status": "canceled",
   "priority": 1,
   "project": "p89",
   "notes": "Decided 21 September: no. A declared proposition keeps a keyword of its own; keywords are acceptable. The proposal below is kept for the record.\n\nProposal, 21 September. A proposition is an enum whose values are its proofs, which is how it was first explained, so write it as one:\n\n    #[prop(n: u32)]\n    enum Small {\n        #[proves(Small(0))]\n        Zero,\n        Below { bound: @(n \u003c 10) },\n    }\n\nThe parameters go in the attribute; a variant that proves the proposition at particular arguments says so with #[proves(...)], and one without it proves it at the parameters; fields with names use Rust's struct-like variants. Everything but the @ types is Rust syntax. Use is unchanged: @Small(n), Small::Zero, match on evidence. It is erased whole. Observation: until recursion arrives, a declared proposition adds names and not power, since without recursion it can be written with ||, &&, and exists; what it is really for is inductive predicates.",

   "id": "t265",
   "n": 150,
   "title": "Decide how a function is marked visible to other Locus modules but not exported to Rust",
   "status": "done",
   "priority": 2,
   "project": "p89",
   "notes": "Decided 21 September: Rust's restricted visibility, with one checked rule. Target language: What is generated.\n\nTarget language: What is generated. Rust's pub(crate) would let hand-written Rust in the same crate call it, so it does not serve. Either the signature decides (a pub function that takes evidence is emitted visible to generated modules only), or there is an explicit spelling.\n\nProposal (21 September): no new syntax. Rust already has restricted visibility: pub(super), pub(in path), pub(crate). One checked rule does the work: a function that takes evidence may be visible no further than the root of the generated modules. Plain pub on such a function is an error that says so and offers the two ways out, a narrower visibility or a validated type. In a crate that mixes Locus and hand-written Rust the programmer writes pub(in crate::verified), or pub(super) when the modules are siblings under a generated root; in a crate that is all Locus, pub(crate) is already right. Every spelling means what it means in Rust. Not covered: one Locus crate calling evidence-taking functions of another. Rust has no visibility meaning \"generated code in other crates\", so that would rest on a hidden name and a convention, as serde's __private does, and on locus audit. Alternatives considered: inferring it from the signature (implicit, and a small change to a signature would silently change what is exported); an #[export] attribute with pub meaning less than it does in Rust; and pub(locus), which is not Rust syntax.",
   "created": "2026-09-21T21:51:51.000Z",
   "updated": "2026-09-21T22:03:29.000Z"
  },

   "notes": "Landed 21 September as tests/corpus.rs. Directives: //~ proofs: N, //~ run: f(args) => value (or => panic, refused until E4), //~ rust: text, //~ error: L0204 [message] with ^ for the line above. The corpus is examples/, tests/corpus/accept, and tests/corpus/reject; one rustc call; all failures listed. Found on the way: a name that is a Rust keyword and not a Locus one, such as move, is accepted and printed unescaped, and rustc rejects the output; S1 closes this by reserving every Rust keyword.\n\nLane: Harness. Wave 1.\nDepends on: nothing.\nUnblocks: E4 (LOC-170), R1 (LOC-186), R2 (LOC-187), R3 (LOC-188).\nCovers: LOC-7.\n\nScope. tests/corpus/accept and tests/corpus/reject hold .lc files whose expectations are written in comments: the number of proofs, run lines such as f(1, 2) => 3 or f(255) => panic, substrings the generated Rust must contain, and for rejected files the code of the error on the line where it is expected. One runner does for each accepted file what cli.rs and rust_output.rs do by hand today: check, run every run line in the check-IR interpreter and the erased interpreter, print Rust, compile all files in one rustc call with -D warnings, run, compare. The five examples move under it.\n\nTests.\n- The five examples pass through the runner.\n- The runner is tested on itself: a wrong expected value, a missing error, and an error on the wrong line each make it report a failure.\n- All failures in a run are reported, not the first.\n\nDone when. From here on a feature is tested by adding files. The whole suite stays under a minute because rustc runs once.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "notes": "Landed 21 September. tests/common/rng.rs (xorshift64*, included with #[path]), tests/parser_fuzz.rs, Parsed::stats with a step counter, tools/check.sh and --extended. Fast: 50,000 sequences and 5,000 edited files in about 6 s; extended: 5,000,000 and 500,000 in about 45 s in release. Steps are at most 4 times the tokens; the most seen is 2.99. The fuzzing found no panic; it did find that the for header lookahead rescanned to the end of the file, quadratic on hostile input, now a delimiter table built once. The nesting test passes on a 640 KB stack and fails at 512 KB, so the margin on 1 MB is under two; the syntax lane must keep frames between depth guards small.\n\nLane: Harness. Wave 1.\nDepends on: nothing.\nUnblocks: S1 (LOC-154), R1 (LOC-186).\n\nScope. A small xorshift generator in tests/common, since the build is offline and has one dependency. The parser is run on random sequences drawn from the token vocabulary and on the example files with random edits (delete, duplicate, swap a token). tools/check.sh runs fmt, clippy, and the tests with fixed seeds and small counts, and is what every commit must pass. tools/check.sh --extended sets LOCUS_EXTENDED, under which the fuzz counts are a hundred times larger and the random program comparison compiles thousands of programs; it runs before a milestone is declared, not on every commit.\n\nTests.\n- Fast: 50,000 token sequences and 5,000 edited files with a fixed seed: the parser returns an AST or at least one diagnostic, without a panic, on a 1 MB stack.\n- A failure prints its seed.\n- Separately from the fuzzing, the two guarantees that make the parser total are stated in Architecture and each has its own test: every loop consumes a token or stops (a test counts parser steps against the number of tokens), and recursion is bounded by MAX_DEPTH (the existing nesting test, extended to each new form).\n\nDone when. The fuzz tests show robustness on what they tried and claim no more. Totality rests on the    "notes": "Landed 21 September. Type::Int (ghost, as Nat), literals of any size, int_add, int_sub, int_mul, int_neg, and one primitive order int_le; a \u003c b is the term a + 1 \u003c= b. Sixteen axioms, each named in the Kernel contract; int_induction over the non-negative integers; evaluate computes closed Int terms and decides a closed \u003c= or == at Int either way. Added beyond the brief: multiplication is charged steps in proportion to the size of its operands, so repeated squaring cannot build a number of 2^100 bits. A test reads the contract out of the atlas and fails if an axiom, rule, or primitive is not named there. Proof sizes from the axioms alone: 2 to 23 nodes for the small facts tried, and one transport for every reassociation of a sum, which is the case for K6.\n\nLane: Kernel. Wave 2.\nDepends on: K1 (LOC-159).\nUnblocks: K3 (LOC-161), K6 (LOC-164).\nCovers: LOC-118, LOC-122.\n\nScope. Int joins the kernel's types. Axioms: the commutative ring laws, the order and its compatibility with + and *, discreteness (nothing lies between n and n + 1), and induction. Evaluate computes closed Int terms. The Kernel contract is updated in the same commit, as for every kernel commit.\n\nTests.\n- For each axiom one test that uses it and one near miss that must be rejected (the axiom at the wrong type, with an argument swapped, or with \u003c for \u003c=).\n- A few derived facts proved in tests from the axioms alone, such as x \u003c y gives x + 1 \u003c= y, to show the set is usable.\n- Evaluate agrees with K1 on random closed terms.\n- A test reads the contract out of the atlas and fails if a kernel axiom is not named in it.\n\nDone when. Int exists in the logic, and the contract lists exactly what is assumed about it.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t277",
   "n": 161,
   "title": "K3 · Int division and remainder: truncating, total, with x / 0 == 0",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. int_div and int_rem, eight axioms named in the Kernel contract (int_div_rem, int_div_zero, four remainder bounds, two sign axioms), each true at every b including zero and each bound false at b == 0 without its condition, which the tests refute. a % 0 == a derived in 33 nodes. Division is charged steps by operand size. Noted for later: Proof::Literal computes a primitive without a step budget, so literal(int_mul(huge, huge)) does unbounded work; a small K-lane follow-up.\n\nLane: Kernel. Wave 3.\nDepends on: K2 (LOC-160).\nUnblocks: K4 (LOC-162).\nCovers: LOC-119.\n\nScope. The axioms, as formulas over all a and b in Int. (1) a == (a / b) * b + a % b, with no condition. (2) a / 0 == 0. From these a % 0 == a follows and is not a separate axiom. (3) 0 \u003c b gives -b \u003c a % b and a % b \u003c b; b \u003c 0 gives b \u003c a % b and a % b \u003c -b. (4) 0 \u003c= a gives 0 \u003c= a % b; a \u003c= 0 gives a % b \u003c= 0. For b not zero, (1), (3), and (4) determine the quotient and remainder uniquely, and they are Rust's.\n\nTests.\n- The four sign combinations and zero, as named tests, including a % 0 == a derived from (1) and (2) inside the kernel.\n- Evaluation against Rust's / and % on i128 at random for a divisor that is not zero, and against the formulas for a zero divisor.\n- A flooring instance, -7 / 2 == -4, is refuted by evaluation.\n- Near misses: the bound of (3) stated without its condition on b is rejected, and would be false at b == 0.\n\nDone when. Int division means what Rust's means wherever Rust's is defined.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. MachineInt table (u8 to u64, i8 to i64) in src/kernel/machine.rs; Type::Machine for the seven non-u8 types beside Type::U8; Term::Machine literals checked in range; view, wrap, cast primitives; six axiom schemas named in the contract. The u8 model over Nat is kept beside the Int model until E5 moves the elaborator, then removed (added to E5). Exhaustive at 8 bits against Rust, boundaries and random above, 19 s extended.\n\nLane: Kernel. Wave 4.\nDepends on: K3 (LOC-161).\nUnblocks: K5 (LOC-163), K7 (LOC-165), K8 (LOC-166), E5 (LOC-171).\nCovers: LOC-120, LOC-145.\n\nScope. For u8 to u64 and i8 to i64: a view to Int, a wrap from Int, the range of the view, and the round trips. as between machine types is the wrap of the view. The u8 model over Nat is restated over Int and its separate axioms are removed, so the contract holds one schema and not a list per type.\n\nTests.\n- The 8-bit types exhaustively against Rust: every value for the view and round trip, every pair of types for as.\n- The wider types at a boundary set (0, 1, MAX, MAX - 1, MIN, MIN + 1, -1, powers of two and their neighbours) and at random.\n- Every existing kernel_numbers test passes on the new model.\n\nDone when. What the logic says about a machine value is what Rust computes, tested where it can be tested exhaustively and at the edges where it cannot.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "status": "done",

   "project": "p266",
   "notes": "Landed 21 September as src/kernel/ops.rs: Op x MachineInt, 72 rows, each with arity, panic condition (never, overflow, division), whether a wrapping build wraps it instead, the total meaning wrap(exact), and the exact meaning under fits. Prim::Op(op, T) evaluated totally by the kernel; axioms op_model (every row) and op_exact (overflowing rows, under fits). Exhaustive at 8 bits against Rust's checked and wrapping operations; the contract argues op_model at a panicking pair is harmless because nothing continues. The interpreters consult Row::panic and wraps_instead in E6.\n\nLane: Kernel. Wave 5.\nDepends on: K4 (LOC-162).\nUnblocks: E6 (LOC-172).\nCovers: LOC-121, LOC-12.\n\nScope. One trusted table with a row for each type and each of + - * / %, and for the wrapping methods. The panic condition and the meaning are terms over the model of K4.\n\nTests.\n- At 8 bits, every pair of operands for every row: the panic condition holds exactly when Rust's checked operation returns None, and otherwise the meaning equals Rust's result.\n- At wider types the boundary set crossed with itself, and random pairs.\n- MIN / -1 and MIN % -1 as named tests for each signed type.\n- Unary minus on the signed types: panics when the operand is MIN, wraps to MIN. In wrapping mode only the overflow of + - * and unary minus wraps; / and % by zero, MIN / -1, and MIN % -1 panic in every build, and the table says so row by row.\n\nDone when. The table is small enough to read and is tested against Rust row by row.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t280",
   "n": 164,
   "title": "K6 · A kernel rule that checks a linear arithmetic certificate, with its whole boundary written first",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September as src/kernel/linear.rs, 321 lines, reviewed line by line. Proof::Linear { goal, goal_coefficient, pairs }; conclusions are read from checked proofs, never stated; limits are counts (256 pairs, 256 atoms, 512-bit literals). The contract's four midpoint certificates and six more from the target examples are accepted; 549 one-step mutants agree with an i128 recomputation (4 stay valid); 100,000 random certificates for false goals, none accepted. Text form is Display only until E11. Decided in code and stated in the contract: atoms that cancel are dropped, so (x - x) * y reads as 0; no commuting inside atoms.\n\nThe contract and one complete certificate are written: Target language, The linear certificate, in full. The four sums in it were checked by machine. Decided there: the goal is s \u003c= t or False, and an equation is two inequalities and int_le_antisymm; a conclusion is read as s \u003c= t, its negation, or an equation at Int; equations may take a coefficient of either sign; the coefficient of the negated goal is explicit; nothing is divided or rounded.\n\nLane: Kernel. Wave 3.\nDepends on: K2 (LOC-160).\nUnblocks: K7 (LOC-165).\nCovers: LOC-123.\n\nScope. A certificate is a goal, a list of pairs of a kernel proof and a non-negative literal coefficient, and nothing else. Every constraint enters as the conclusion of a proof the kernel checks in the ordinary way: a hypothesis from the context, a range fact as an instance of the axiom of K4, a quotient and remainder constraint as instances of the axioms of K3, the bridge from a comparison of machine values to a comparison of their views as an instance of K4 or K8. The rule itself does three things, all trusted: it reads each conclusion and the negated goal as a linear expression over Int, treating any term that is not +, -, a literal, or multiplication by a literal as an opaque atom compared by same; it tightens strict inequalities by discreteness; and it checks that the combination sums to a false statement about literals. The procedure states no constraint on its own authority. Before any code, one complete certificate is written into the Kernel contract for the last obligation of midpoint, showing the goal and hypotheses, their linear forms, the proof behind each range fact and each division constraint, and the final sum. The certificate is given a text form with a version in this commit, since E11 stores it.\n\nTests.\n- The written certificate, and certificates by hand for the other six arithmetic obligations of Target examples, are accepted.\n- A test-side recomputation of the combination in i128 decides whether a certificate is valid; over all changes of one coefficient, sign, or hypothesis, the kernel accepts exactly the valid ones. Some changes leave a certificate valid, and those must be accepted.\n- Fabricated constraints: a range fact with no proof, a range fact for the wrong type, a quotient constraint whose proof is for another divisor, a remainder bound taken without b != 0. Each is rejected, and rejected as a bad proof and not as bad arithmetic.\n- Goals that are false on a small bounded domain are never accepted under any of 100,000 random certificates.\n- Two atoms that differ are never merged; two that are same are.\n- Size limits as counts, with a test at the limit.\n\nDone when. The kernel can check arithmetic it did not find, and everything the check relies on is either a kernel proof or one of three trusted steps named in the contract.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t281",
   "n": 165,
   "title": "K7 · The arithmetic procedure: finds certificates for linear goals, machine ranges, and division by a literal",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September as src/arith (untrusted): collects hypotheses, And parts, proof-typed variables, view ranges, and division facts, each with its kernel proof; Fourier-Motzkin with multiplier bookkeeping, then branch and bound on int_le_total when the rational point is fractional; budgets are counts only; every returned proof is checked by the kernel before it is returned. All seven target obligations found with certificates matching the contract's sizes; random box problems: 97 to 98 percent of true goals found, no false goal ever proved, verified counterexamples for the rest. Deviation: prove takes the Prelude as a parameter. Limits for E7: exact-result equations of operators must be supplied as hypotheses; proof fields of struct variables are not read.\n\nLane: Kernel. Wave 5.\nDepends on: K4 (LOC-162), K6 (LOC-164).\nUnblocks: E7 (LOC-173).\nCovers: LOC-123, LOC-72.\n\nScope. Outside the kernel and untrusted. Turns the goal and the facts in scope into linear constraints over Int, asks for the range of every machine view and the quotient and remainder facts for every division by a literal as axiom instances, eliminates variables, and emits a certificate for K6. Its effort is limited by counts (variables eliminated, constraints generated, size of the certificate), never by a clock, so that the same file is accepted or rejected on every machine.\n\nTests.\n- Finds all seven obligations from Target examples.\n- Random small linear problems in which every variable carries the hypotheses -8 \u003c= x and x \u003c= 8, so that brute force over that range decides exactly the problem posed: a false one is never accepted, asserted through the kernel, and the share of true ones found is printed and must be at least 95 percent within the fragment.\n- At the budget, the diagnostic says the procedure gave up, names the budget, and lists the constraints it had. The same input gives the same outcome on every run.\n\nDone when. Overflow obligations at 32 and 64 bits are dischargeable; this answers LOC-72.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "project": "p266",
   "notes": "Landed 21 September. Added to the trusted base: Prim::Cmp(Eq|Lt|Le, T) on every machine type and the axiom cmp_reflect, in the shape of reflect, over the views. Not trusted: 134 lemmas in theory.rs (6 on Int, 16 per machine type: le_refl, le_trans, le_of_lt, lt_of_le_of_ne, lt_irrefl, le_antisymm, view_injective derived from wrap_view, view_bounds, the cmp bridges both ways, lt_of_not_le, le_of_not_lt), several proved with Proof::Linear, all listed by Theory::lemma_names(). E5 exposes them to source and must rebind u8_le_refl, u8_le_trans, u8_lt_of_le_of_ne from the Nat-model lemmas to the table.\n\nLane: Kernel. Wave 5.\nDepends on: K4 (LOC-162).\nUnblocks: R4 (LOC-189).\nCovers: LOC-124.\n\nScope. The u8 ordering lemmas generalize to every machine type, plus the bridge between a comparison of machine values and the comparison of their views.\n\nTests.\n- Each lemma is called once from a corpus file.\n- The names are listed by a test so that a rename is deliberate.\n\nDone when. A proof can be written by hand where the procedure does not reach.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "status": "done",

   "project": "p266",
   "notes": "Landed 21 September. Removed from the solver: rewriting by equations in scope, unfolding without unfold!, the structural search, and the proof by 256 cases. Kept as computing: let and pattern names replaced, projections and matches of written values, literal arithmetic, reflexivity, Reflect of the branch fact, And-splitting, closed evaluation; and u8_zero_le for the 0..n range, which has no place for evidence. Tiers now reported: exact, computed, evaluation. A dependent pattern opens over its own names, so evidence out of a call is used exactly with no hole. lock.lc: 8 proofs of 775 nodes became 5 of 76, and its sizes are asserted. src/elab/explain.rs re-runs the removed tiers for diagnosis only and prints a suggestion it has checked. Seven lemmas added to theory.rs (u8_sub_le, u8_sub_le_sub, u8_eq_symm callable). Wart to remember: rewrite! replaces every occurrence, so n == 7 to n \u003c= 7 needs a let-named left side.\n\nLane: Elaborator. Wave 4.\nDepends on: S2 (LOC-155), H3 (LOC-153).\nUnblocks: E7 (LOC-173), M4 (LOC-180).\nCovers: LOC-140, LOC-139, LOC-17.\n\nScope. Remove from the solver everything that bridges one claim to another: rewriting by facts in scope, unfolding without being asked, the structural search, and the proof by all 256 cases. Keep computing: let names replaced, projections and matches of written values, arithmetic on literals, and closed evaluation. let (next, still) = step(...) types still over next. lock.lc is rewritten with the evidence it now has to state.\n\nTests.\n- For each removed tier, a rejected file whose diagnostic shows the claim, the computed claim, the nearest fact, and the explicit form that would be accepted.\n- The pattern-opening test from finding 2 of Target examples.\n- Proof sizes for lock.lc are asserted, so growth is visible.\n\nDone when. Checking is deterministic and explainable: a hole is filled by a fact that matches or it is not filled.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t284",

   "title": "E2 · Promises: terminates, no_panic, no_alloc, no_io, checked and never inferred",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. FnInfo carries the four promises from attributes plus the file default; a call to a callee lacking a promise the caller makes is L0232 at the call, a loop under terminates L0215 at the keyword, a promise on a non-function L0233; a function may appear in a proposition (or under unfold!/fold!, or as evidence) iff it promises terminates, no_panic, no_io and takes no &mut (L0209 names the missing one). Such functions lower as kernel functions with a defining equation, exactly as math fn did, so math fn is now one spelling of the three (E3 removes it). Promises reach the trusted checker through Session::declare_fn_promising; a hand-built discrepancy is caught there. 16x16 matrices tested, plus through file defaults. decreases is parsed and reported as the Recursion project's.\n\nLane: Elaborator. Wave 6.\nDepends on: S4 (LOC-157).\nUnblocks: E3 (LOC-169), E6 (LOC-172), E8 (LOC-174), O2 (LOC-183), E10 (LOC-190).\nCovers: LOC-13, LOC-73, LOC-14.\n\nScope. A function keeps a promise only if everything it calls makes it. terminates forbids loops and, until recursion arrives, any call cycle. #![...] sets a default for the file. A function may appear in a proposition exactly when it promises terminates, no_panic, and no_io and takes no &mut. math fn stays for one commit as another spelling of the three.\n\nTests.\n- A generated matrix of caller promises against callee promises, 16 by 16, accepted or rejected with the missing promise named.\n- A function mentioned in a proposition without a promise is rejected, naming the promise.\n- The file default applies and an explicit list on a function adds to it.\n\nDone when. The specification author states what a function may not do, and the checker holds them to it.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t286",
   "n": 170,
   "title": "E4 · A panic is a third outcome: the interpreters, the erased tree, and the harness",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 21 September. One Outcome type for both interpreters (Value, Panic(message), OutOfFuel); EExpr::Panic; the corpus runner understands => panic and => panic: message, builds twice (overflow checks on and off), and treats out of fuel and a timeout as inconclusive. Notes for later commits: the erased check now lets any never-yielding subexpression through and stops checking what follows it in a block, which M1 should tighten so that dead arms are still checked; an untyped panic in a let can defeat Rust's inference (E0282), so M1 needs a type on the let or on the panic. When O3 adds the state of &mut parameters to a panic, Panic becomes a struct.\n\nLane: Elaborator. Wave 2.\nDepends on: H1 (LOC-151).\nUnblocks: E6 (LOC-172), M1 (LOC-177).\nCovers: LOC-138.\n\nScope. Preparation only, with no surface syntax and no checked semantics. Both interpreters return a value, a panic with its message, or out of fuel. The erased tree and the printer gain a panic expression, reached for now only from trees built by hand. The compiled harness calls each function under catch_unwind, can build with overflow checks on or off, and runs the program under a process timeout; a timeout is reported as inconclusive and never as a disagreement or as divergence. The statement of erasure in Architecture is restated for three outcomes.\n\nTests.\n- Erased trees built by hand that panic agree with their compiled Rust, message included.\n- Out of fuel stays distinct from a panic and is never compared as one.\n- The harness is tested on a program that loops forever: inconclusive, and the rest of the batch is still compared.\n\nDone when. Tests can say f(255) => panic. What a panic means to the checker comes with M1 for block endings and with E6 for operators.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract    "title": "E5 · Every machine integer type, literal typing, as, Int, and comparison within one type",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September (the agent ran out of credits after passing the checks; I committed its staged work and landed it). Every machine type in the typed tree, both interpreters, the erased check, and the printer; literals take the expected type, else suffix, else i32, and are range-checked; as wraps, as Int is the view; comparisons within one type, lowered to cmp, and in formulas the order of the views. The u8 model over Nat is gone from the kernel and the contract; the bounded for rests on the Int model; the 134 theory lemmas are callable by name. Corpus: casts.lc with 480 run lines against compiled Rust, integer_types.lc, lock_u32.lc; the ignored R1 test passes. Milestone 1 reached: the new surface.\n\nLane: Elaborator. Wave 5.\nDepends on: K4 (LOC-162), S3 (LOC-156).\nUnblocks: E6 (LOC-172), E8 (LOC-174).\nCovers: LOC-2, LOC-3, LOC-9, LOC-94, LOC-99, LOC-96.\n\nScope. The typed tree, both interpreters, the erased check, and the printer learn u8 to u64 and i8 to i64. A literal takes the expected type, else i32, or its suffix, and is checked against the range. as between integer types wraps; as Int is exact and Int is logic-only. == != and the orderings need both sides of one type. u32::MAX and MIN resolve as associated constants.\n\nTests.\n- Literals one past each range are rejected.\n- as for every pair of types at the boundary set, compared with compiled Rust through the corpus runner.\n- A comparison across types is rejected and the message shows the cast to add.\n- lock.lc with u32 counts runs.\n- The u8 model over Nat (to_nat, of_nat, the wrapping models, reflect on u8, the Nat lemmas of theory.rs) is removed once the elaborator builds on the Int model; the contract then lists one schema. The ignored test of R1 (a byte typed by a literal alone as a receiver, E0689) passes: the printer suffixes literals or annotates the let.\n- Theory::lemma_names() (134 names from K8) is exposed to source; u8_le_refl, u8_le_trans, u8_lt_of_le_of_ne rebound from the Nat-model lemmas to the table.\n\nDone when. Programs are no longer limited to bytes.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",

   "id": "t288",
   "n": 172,
   "title": "E6 · The operators + - * / % with their panic conditions and what the logic learns",
   "status": "done",
   "priority": 2,
   "project": "p266",
   "notes": "Landed 22 September. Stmt::Operate in the check IR: the trusted checker defines the result by the every-build (wrapped) equation, checks the fits proofs when given, and then assumes the exact result through a derivation from op_exact that it builds and checks itself; under no_panic the proofs are required; after / and % the premises are assumed in every function. Both interpreters have Checks and Wrap modes; the corpus runner and the differential test run both against the matching rustc build; //~ run: f(255) => panic | 0 gives the two outcomes. The elaborator discharges an obligation by exact, computed, evaluation, then K7 (needed even for unsigned +, whose premise 0 \u003c= a + b only the view ranges give); L0235 shows the premise written out with a counterexample; L0236 rejects an operator in a formula. 10,000 random programs with operators agreed three ways in both builds. Open point for the vision discussion: a fully promised function is a kernel term and has no place for an operator's evidence, so + is refused there (L0236) although the Vision allows + under no_panic.\n\nLane: Elaborator. Wave 7.\nDepends on: K5 (LOC-163), E2 (LOC-168), E4 (LOC-170), E5 (LOC-171), M0 (LOC-176).\nUnblocks: E7 (LOC-173).\nCovers: LOC-11, LOC-12, LOC-121.\n\nScope. Operators elaborate through the table of K5. The check IR gains primitive operations that may panic, as M0 designs them: under no_panic the panic condition is an obligation at the operator and the exact result is known after; otherwise only the wrapped result is known. After a / b the divisor is known not to be zero. In a formula, an operator on a machine type is rejected, because it may panic, and the message offers as Int and the wrapping method. The reference interpreters panic on overflow by default and have a wrapping mode, since Rust does either according to the build. This commit changes the checker of the check IR, which is trusted, and updates Architecture.\n\nTests.\n- For every type and operator    "notes": "Landed 22 September. A hole is tried as exact, computed, evaluation, then arithmetic through K7 over the facts in both spellings; --holes prints the certificate size; the failure diagnostic shows the counterexample in source spelling or the budget hit. After a / k with a literal k the exact quotient is derived, nothing assumed. Milestone 2 reached: tests/corpus/target/midpoint.lc checks, runs, and compiles, with six obligations (1 evaluation, 5 arithmetic; the prediction of 3/4/7 for lock plus midpoint counted each operator once where a row has two premises, and folded evaluation into computed). lock32_step.lc holds step and remaining. The full target lock.lc waits on M4 (let mut ok) and O1 (derive). Interim rule for LOC-193 in place: a fully promised function with an operator is an ExecFn with its promises and is refused in propositions with the reason.\n\nLane: Elaborator. Wave 8.\nDepends on: K7 (LOC-165), E1 (LOC-167), E6 (LOC-172).\nUnblocks: R4 (LOC-189), E11 (LOC-192).\nCovers: LOC-72, LOC-15.\n\nScope. A hole is tried as exact, then computed, then arithmetic. When the procedure fails and finds values that satisfy the facts and break the goal, the diagnostic shows them.\n\nTests.\n- midpoint, and step and remaining from the 32-bit lock, check, run, and compile; their corpus files move from parse-only to run.\n- check --stats classifies the obligations as Target examples predicted: three exact, four computed, seven arithmetic. A difference is a finding to record, not a number to adjust.\n- midpoint without its ordered hypothesis is rejected with a counterexample.\n\nDone when. The second milestone: real 32-bit programs with overflow shown impossible.\n\nAs for every commit: tools/check.sh passes (fmt, clippy with warnings denied, the fast tests), and the atlas is updated in the same commit: the Language status rows, this task, the tasks it covers, and the Kernel contract or Architecture if the trusted base changed.",
