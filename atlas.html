   "body": [
    "# Target language",
    "",
    "What Locus is meant to be, by topic. Every design decision is written here, and nowhere else. It describes the language the projects are building towards, not what the compiler accepts today: that is [Language, as built](language.md), and the table under Language status is the difference between the two. Each section ends with the tasks that carry it.",
    "",
    "## The rule about Rust",
    "",
    "Where Locus and Rust both have a thing, it means in Locus what it means in Rust, and generated Rust must be what a Rust programmer would have written. Locus never gives valid Rust syntax a different meaning; what it adds is syntax Rust does not have.",
    "",
    "What Locus adds to Rust, in full, so that the list can be kept short:",
    "",
    "- Tokens: none. Every token Locus uses is a token of Rust, which is what keeps a locus! { ... } macro possible. One case needs care there: Rust reads pair.0.1 as a name, a dot, and the number 0.1, and splits it while parsing.",
    "- Words: three. prop, which declares a proposition, is a keyword only where a declaration can begin. Writing the declaration as an attribute on an enum was considered and declined (LOC-148): a keyword is acceptable, and says more plainly what is being declared. math goes when promises replace math fn. Every keyword of Rust is reserved. forall and exists are keywords inside a formula, and ordinary names outside one. Int, Prop, Seq, and Ghost are names of types, and prove!, old!, recurse!, and the rest are names of forms, not keywords.",
    "- Grammar, where Rust's tokens are used in a way Rust's parser would refuse: @P as a type; names on the fields of a tuple type, as in (out: u32, @(out == n)), with each name in scope in the fields after it; => as implication inside a formula; the quantifiers; declarations of propositions, including a variant that states which proposition it proves; and a function signature without a body in a header. Everything inside prop!(...), prove!(...), and the other forms is, to Rust, the argument of a macro, where any tokens may stand. _ where a value is expected is parsed by Rust and then refused, so it is given a meaning Rust does not have and takes none away.",
    "- Attributes: the promises and derive. An attribute's contents are free-form in Rust.",
    "",
    "The loop with a state list, continue with arguments, and the for with a state list were additions of the same kind, and go when let mut arrives.",
    "",
    "",
    "## Propositions and evidence",
    "",
    "- Propositions are written prop!(P), where P is a formula, and the type of evidence is @P, where P is the name of a proposition, a proposition applied to arguments, or a formula in parentheses: @within_limit(n), @(out == n.wrapping_add(1)). Brackets are no longer proposition literals, because [n > 0] is a Rust array and arrays, slices, and indexing are coming. This settles open question 1. A lighter way to write a proposition value may be found later. The implication arrow stays =>; it appears only inside prop!(...), prove!(...), and @(...), which Locus owns.",
    "",
    "- Evidence is accepted where a claim is wanted only when it is evidence of exactly that claim, after computing. Computing means what the kernel decision has always meant by it: a name bound by let is replaced by what it stands for, a projection of a written tuple or struct and a match on a written constructor are carried out, and arithmetic on literals is done. It is a fixed procedure and not a search. Nothing else happens by itself: no fact is used to reach another, and no function is unfolded unless unfold! or fold! asks. The programmer states a step with prove!, and the forms rewrite!, unfold!, and fold! do the rest. This settles open question 3 against the bridging the elaborator does today.",
    "- Opening a dependent pattern types each part over the names the pattern binds. In let (next, still) = step(...), still has the type @within_limit(next.failures), not a type about step(...).0. This too is a fixed step, and without it evidence that comes out of a call could never be used.",
    "",
    "- The quantifiers are keywords: forall (x: u8) { x \u003c= 255 } and exists (x: u8) { x == 0 }, with several parameters for several variables. Writing them as names that take a closure was agreed and then withdrawn: a quantifier is part of how every formula is built, and a function name with a meaning fixed by the language is an odd thing to build it from. Writing the whole grammar of propositions as an enum was also considered and does not work: a quantifier would still need a function inside a variant, which is the closure again; equality and the comparisons exist at every type, which an enum cannot list; and an enum can be matched on, which would let code tell p && q from q && p although they say the same thing. What is like an enum is the evidence of a declared proposition, and that is already written with variants. They are keywords inside a formula only. A formula is always written inside prop!(...), prove!(...), or @(...), where the language already has a grammar of its own, of which => is part; outside a formula forall and exists are ordinary names, so the language at large reserves nothing beyond Rust's keywords and prop.",
    "",
    "Plan: LOC-88, LOC-77, LOC-115, LOC-140, LOC-139, LOC-147.",
    "",
    "## Values and types",
    "",
    "- Values move, as in Rust. A type is used more than once only if it is Copy, and Copy and Clone are asked for with derive, from the closed list under Built-in forms. Use of a moved value is an error from the start. The present behavior, where every type is silently Copy, accepts programs that are not Rust.",
    "",
    "- The never type ! exists, with its coercion to any type. It is the type of panic!, unreachable!, todo!, of return, break, and continue, and the result type of a function that never returns.",
    "",
    "- An integer literal takes the type expected of it, and i32 when nothing expects one, as in Rust. Suffixes (255u8), and hexadecimal, octal, and binary literals are part of the core. String literals exist for the messages of the built-in forms.",
    "",
    "- Type arguments are written only on the types the language provides, Ghost\u003cT> in the core, and later Seq\u003cT>, Option\u003cT>, and Vec\u003cT>. Type parameters on a programmer's own types and functions arrive with generics, which need type variables in the logic. The alternative considered was a small subset of generics in the core.",
    "",
    "- Enum variants with named fields are part of the core. Explicit discriminants, tuple structs, unit structs, and the newtype idiom are polish.",
    "",
    "- A const item is emitted as a Rust const, and its initializer is limited to what Rust can evaluate at compile time. At present it is a function of no arguments.",
    "",
    "- A type with no runtime form is Copy, whatever it speaks of: evidence, Ghost\u003cT>, Int, Prop. A type with a runtime form moves unless it derives Copy.",
    "- In a body, a proposition cannot mention a local that has been moved, as code cannot; to speak of a value after it moves, take snapshot!(v) before. A signature is outside the body's flow: a result type may mention any parameter, and means its value on entry.",
    "- An expression that is erased keeps the three promises, terminates, no_panic, and no_io, which are the three that let a function appear in a proposition, and for the same reason: it is never run, so erasing it must change nothing. It takes no &mut to anything with a runtime form, since a write is as observable as a panic. It also never moves anything: a use of a variable inside it is a reading of its value, which requires the variable to be live and leaves it live. The flow analysis that tracks initialization and moves enforces both, and the generated Rust agrees because the expression is not in it. This replaces the present rule that keeps the effects of an erased expression.",
    "",
    "Plan: LOC-2, LOC-89, LOC-92, LOC-94, LOC-95, LOC-97, LOC-100, LOC-101, LOC-25, LOC-103, LOC-112, LOC-111, LOC-141.",
    "",
    "## Names, visibility, and keywords",
    "",
    "- Items and fields are private unless marked pub, and pub is part of the core. The generated Rust at present makes everything public; shipping that and adding privacy later would change what programs mean. pub(crate) and the rest wait for modules.",
    "",
    "- Every Rust keyword is reserved: the strict ones and the ones Rust reserves for later (abstract, become, box, do, final, gen, macro, override, priv, try, typeof, unsized, virtual, yield). Identifiers reach the generated Rust, so a variable named type or move would break it. Rust's weak keywords stay identifiers, as they do in Rust. Locus reserves forall and exists besides.",
    "",
    "- Paths and namespaces follow Rust. A path has any number of segments, which u32::MAX, an associated function such as Lock::new, and modules all need. Types and values are looked up separately, so that a type and a function may share a name, as a struct and its constructor function do in Rust.",
    "",
    "Plan: LOC-90, LOC-91, LOC-96, LOC-18.",
    "",
    "## Expressions and control",
    "",
    "- Early exit is part of the core: return. The check IR and lowering are designed with it from the start. The ? operator waits for the traits it is defined by.",
    "",
    "- Operator precedence is Rust's table, exactly, including as and the unary operators. The implication arrow binds loosest.",
    "",
    "- == and != are what they are in Rust: defined on bool and every integer type, and on a programmer's type only when it derives PartialEq. Deriving PartialEq is allowed only for a type with no logic-only data in it: no field of type Prop, Int, Seq, or Ghost\u003cT>, at any depth. Two values that differ only in such a field have one runtime representation and are different values to the logic, so a == b coming out true could not teach that a and b are equal. Evidence fields are no obstacle, since what a proof contains is irrelevant. For a type that qualifies, the true branch of a == b knows the two are equal, and the false branch that they are not.",
    "",
    "- match is to have the power it has in Rust: on integers, bool, and tuples, with literal, range, and or-patterns, bindings with @, guards, and exhaustiveness over integer ranges. This is in the batch on control flow, not in the core.",
    "",
    "- Polish, after the core: omitting -> (), mut on parameters, field init shorthand and ..base in struct expressions, loop labels, MAX and MIN and a closed list of integer methods, range expressions including ..=, and passing doc comments and chosen attributes through to the generated Rust. usize and isize arrive with slices; their width depends on the platform, which the logic and determinism both have to account for.",
    "",
    "Plan: LOC-93, LOC-98, LOC-99, LOC-102, LOC-86, LOC-69, LOC-104, LOC-105, LOC-106, LOC-107, LOC-108, LOC-109, LOC-110, LOC-111, LOC-112, LOC-116.",
    "",
    "## Integers, in code and in propositions",
    "",
    "Integers, in code and in propositions. One rule decides what may be written in a proposition, and it is the rule of Functions in propositions, applied to operators as to any other function: an operator is a function of its operand types, with effects of its own, and only what always returns, never panics, and does no io may appear in a proposition.",
    "",
    "- In code an operator means what it means in Rust and is printed as written. + - * on a machine integer panic on overflow in a build with overflow checks and wrap in one without; / and % panic on a zero divisor, and on the smallest value divided by -1, in every build.",
    "- So x + 1 on a machine integer may panic, and is not valid in a proposition. x as Int + 1 is valid, because + on Int is total, and so is x.wrapping_add(1), which never panics. The same test, not a rule about arithmetic, is what rejects the one and admits the others, and the error says which two things can be written instead. Comparisons of machine integers never panic and are valid as they stand. A specification therefore cannot contain arithmetic that silently wraps, and no operator means one thing in code and another in a proposition: + always means the operation of its operand type.",
    "- The same test settles what is to come. Indexing a Vec and unwrap may panic and are not written in propositions; their total counterparts on Seq and Option are. A function that takes evidence in place of panicking is total, and is written in a proposition wherever that evidence can be given. An operator a programmer defines is valid in a proposition exactly when its implementation makes the three promises.",
    "- Code that promises no_panic may still use +: the operation has a condition under which it does not panic, and the promise turns that condition into an obligation at the place it is used. A proposition is never executed, so it has no such place, which is why the condition cannot be discharged there.",
    "- What the logic knows of let s = a + b. Under no_panic, where the sum was shown to be in range, s as Int == a as Int + b as Int. Otherwise only s == a.wrapping_add(b), the one fact true in every build; evidence that the sum is in range recovers the exact sum. An operation that panics in every build teaches its condition to what follows: after a / b the divisor is known not to be zero, as c is known after assert!(c). An overflow check that only some builds make teaches nothing.",
    "- / and % on Int truncate toward zero, as in Rust, so that code and specification agree. Int division by zero has the value 0, since a function of the logic must be total; code that promises no_panic never reaches it. The equation a == (a / b) * b + a % b holds for every b, from which a % 0 == a. The bounds on the remainder are stated for b != 0 only: its magnitude is less than that of b, and its sign is that of a.",
    "- as between integer types wraps, never panics, and is valid everywhere. as Int is exact. A literal that does not fit its type is an error.",
    "- Floats follow from the same test. Their arithmetic never panics, so it may be written in a proposition, where it is an operation the logic knows nothing about: out == a + b can be stated and used, and no algebra follows from it. Equality in a proposition is the logic's, which holds of any value and itself; Rust's == on floats is a different function, which NaN fails, and the two must not be confused. How that is spelled is to be settled with floats.",
    "- The reference interpreter panics on overflow, the stricter of Rust's two behaviors, and generated Rust is compared with it in a build with overflow checks.",
    "- A comparison is between two values of one type, in code and in propositions alike, and Int is a type like any other here: out as Int == x as Int + 1, not out == x as Int + 1. This is Rust's rule, and it keeps every conversion into the logic visible.",
    "- How the language knows that + on a u8 or an i32 may panic. The operations of the built-in types are a table in the compiler: for each operator and type, the result type, the condition under which it panics, stated over the Int values of the operands, and what the result is to the logic. + - * of every integer type panic when the exact result is out of range in a build that checks; / and % panic on a zero divisor, and on the smallest value over -1 for a signed type; negating the smallest value of a signed type overflows; comparisons, as, the wrapping_ methods, and the operators of bool never panic. The table is part of what is trusted, beside the table from constructs to effects (Effects are promises), and the kernel's models of the machine types are what it is stated in. Once traits exist the table is presented as the implementations of the operator traits for the built-in types in the standard library, so that a built-in operator and one a programmer defines are found and judged the same way.",
    "- Operators a programmer defines, as Rust allows through the operator traits (Add, Sub, Mul, Div, Rem, Neg, Not, the comparison traits, Index), arrive with traits. One question they raise is open. A built-in + is usable in code that promises no_panic because it has a condition under which it does not panic, and that condition becomes an obligation where it is used. A function a programmer writes has no way to state such a condition except by taking evidence as a parameter, and a + b has no place to pass evidence. So an Add for Meters whose body adds two u32 could not be used under no_panic. The candidates are a promise that carries its condition, or evidence parameters on an operator's implementation that every use fills with a hole, which does not fit the signature Rust's trait fixes.",
    "- What this asks of the kernel: Int, by the axioms listed below, where there is only Nat with addition today; for each machine type a view to Int and a wrap from Int, generalizing the present model of u8; the evaluator; and an arithmetic procedure that is linear, treats multiplication by a literal as linear, and leaves other products to lemmas.",
    "",
    "- Int enters the kernel by axioms, with literals of any size and native evaluation, and not by a construction from Nat, which would need the ring laws proved by hand in the kernel's own terms while native evaluation of literals is trusted either way. Nat remains, for induction. An ordered ring is not enough to be the integers, since the order of an ordered ring need not be discrete. The contract states: the ring laws and the order; discreteness, that nothing lies strictly between n and n + 1; for each machine type the view to Int, its range, the wrap from Int, and that they round-trip; and quotient and remainder that truncate toward zero, characterized by a == (a / b) * b + a % b, by the remainder being smaller than the divisor in size and having the sign of a, and by the value 0 for a zero divisor. The arithmetic procedure is scoped by the acceptance examples: linear constraints over Int, the facts about machine ranges, and division by a literal reduced to linear constraints through the characterization above, each reduction a checked step and not an assumption. Random tests check the evaluator and the models against Rust; they say nothing about whether the axioms are consistent, which rests on the integers being a model of them and on keeping the list short and standard.",
    "- Linear arithmetic is checked by one kernel rule and found outside the kernel. A certificate is a goal and a list of pairs, each a kernel proof and a non-negative literal coefficient. Every constraint is the conclusion of a proof checked in the ordinary way, so the procedure that finds certificates asserts nothing on its own authority: a range fact is an instance of a machine model axiom, a quotient and remainder constraint an instance of the division axioms. The rule reads each conclusion and the negated goal as a linear expression over Int, with anything that is not +, -, a literal, or multiplication by a literal treated as an opaque atom; tightens strict inequalities by discreteness; and checks that the combination sums to a false statement about literals. The alternative, spelling the same reasoning out in ring and order axioms, keeps the kernel smaller by a couple of hundred lines and makes each line of arithmetic a proof of hundreds of steps, in a kernel that has no normalizer to shorten them.",
    "",
    "Plan: LOC-11, LOC-12, LOC-3, LOC-9, LOC-118, LOC-119, LOC-120, LOC-121, LOC-122, LOC-123, LOC-124, LOC-145.",
    "",
    "### The linear certificate, in full",
    "",
    "Written before the rule is coded (K6), so that what the kernel will trust is agreed first. When the rule lands, this moves to the Kernel contract.",
    "",
    "The rule is `linear(goal, c0, [(p1, c1), ..., (pn, cn)])`. Each `pi` is a proof, checked in the ordinary way, and each `ci` is an integer literal. The rule does four things and nothing else.",
    "",
    "- It reads a term of type Int as a linear form: a constant and a coefficient for each atom. `int_add`, `int_sub`, `int_neg`, and literals are read through. `int_mul` is read through when one side reads as a constant with no atoms. Every other term, a variable, a view of a machine value, a quotient, a product of two atoms, a call, is an atom, and two atoms are one when they are the same term by the kernel's comparison.",
    "- It reads the conclusion of each `pi` as a constraint. `s \u003c= t` is `t - s >= 0`. `(s \u003c= t) => False` is `s - t - 1 >= 0`, which is where discreteness enters. `s == t` at Int is `t - s == 0`. Any other conclusion is an error. The coefficient of an inequality must not be negative; the coefficient of an equation may have either sign.",
    "- It reads the goal. `s \u003c= t` contributes its negation `s - t - 1 >= 0` with the coefficient `c0`, which must be positive. `False` contributes nothing, and `c0` is ignored. Since `s \u003c t` is the term `s + 1 \u003c= t`, strict goals need nothing of their own. No other goal is accepted: an equation is proved as two inequalities and `int_le_antisymm`, and a negated inequality by introducing its hypothesis and proving `False`.",
    "- It adds the constraints up, each times its coefficient, and accepts when every atom has coefficient zero and the constant is negative. A sum of things that are not negative cannot be negative, so the constraints cannot all hold, so the goal holds.",
    "",
    "Nothing enters the sum on the word of whoever built the certificate. A fact in scope is a hypothesis. The range of a machine value is an instance of the range axiom of its type (K4). What is known of a quotient or remainder is an instance of a division axiom (K3), with its condition discharged by a proof, which for a literal divisor is one `evaluate`. The step from a comparison of machine values to a comparison of their views is an instance of the model (K4, K8). A constraint with no proof behind it has no way in, and that failure is a failure of an ordinary proof, reported as such. What is trusted in the rule is the reading of linear forms, the three readings of a conclusion, and the sum. The rule does no search, divides nothing, and rounds nothing: reasoning that needs a constraint divided by a common factor and rounded is not covered, and none of the acceptance examples needs it.",
    "",
    "The procedure that finds certificates (K7) is outside the kernel. Limits are counts: the number of pairs, the size of each linear form, and the size of the literals.",
    "",
    "#### The last obligation of midpoint",
    "",
    "~~~",
    "let half = (hi - lo) / 2;",
    "let mid = lo + half;",
    "(mid, prove!(mid as Int == (lo as Int + hi as Int) / 2))",
    "~~~",
    "",
    "Write L, H, D, F, M for the views of lo, hi, hi - lo, half, and mid; these are atoms. Write q and r for the terms `D / 2` and `D % 2`, and Q and R for `(L + H) / 2` and `(L + H) % 2`; these are atoms too. MAX is the literal 4294967295. The facts available, each with the proof that stands behind it:",
    "",
    "| Name | Constraint | Where it comes from |",
    "|---|---|---|",
    "| ord | `L \u003c= H` | the hypothesis ordered, through the model's bridge from `lo \u003c= hi` |",
    "| lo0 | `0 \u003c= L` | the range axiom of u32 at lo |",
    "| hi1 | `H \u003c= MAX` | the range axiom of u32 at hi |",
    "| sub | `D == H - L` | the exact result of `hi - lo`, known because its obligation was met (below) |",
    "| div | `F == q` | the meaning of `/` on u32, with `2 != 0` by evaluation |",
    "| add | `M == L + F` | the exact result of `lo + half`, known because its obligation was met (below) |",
    "| d1 | `D == q * 2 + r` | the decomposition axiom at D and 2 |",
    "| d2 | `r + 1 \u003c= 2` | the remainder bound at D and 2, its condition `0 \u003c 2` by evaluation |",
    "| d3 | `0 \u003c= r` | the sign axiom at D and 2, its condition `0 \u003c= D` being the range axiom of u32 at hi - lo |",
    "| e1 | `L + H == Q * 2 + R` | the decomposition axiom at L + H and 2 |",
    "| e2 | `R + 1 \u003c= 2` | the remainder bound at L + H and 2 |",
    "| e3 | `0 \u003c= R` | the sign axiom at L + H and 2, its condition `0 \u003c= L + H` by a certificate of its own, `linear(0 \u003c= L + H, 1, [(lo0, 1), (hi0, 1)])`, where hi0 is `0 \u003c= H`, the range axiom of u32 at hi |",
    "",
    "The obligation of `hi - lo` is `0 \u003c= H - L`. Its negation is `-(H - L) - 1 >= 0`. The certificate is `[(ord, 1)]` with `c0 = 1`: `(L - H - 1) + (H - L) = -1`.",
    "",
    "The obligation of `lo + half` is `L + F \u003c= MAX`, and its negation is `L + F - MAX - 1 >= 0`. The orientation of each constraint matters to the signs, so here is the table as the rule reads it, `t - s` for `s == t` and for `s \u003c= t`:",
    "",
    "| Name | Read as |",
    "|---|---|",
    "| ord | `H - L >= 0` |",
    "| lo0 | `L >= 0` |",
    "| hi1 | `MAX - H >= 0` |",
    "| sub | `H - L - D == 0` |",
    "| div | `q - F == 0` |",
    "| add | `L + F - M == 0` |",
    "| d1 | `2q + r - D == 0` |",
    "| d2 | `1 - r >= 0` |",
    "| d3 | `r >= 0` |",
    "| e1 | `2Q + R - L - H == 0` |",
    "| e2 | `1 - R >= 0` |",
    "| e3 | `R >= 0` |",
    "",
    "For `L + F \u003c= MAX`, with `c0 = 2`: (div, 2), (d1, -1), (sub, 1), (ord, 1), (hi1, 2), (d3, 1).",
    "",
    "~~~",
    "2 (L + F - MAX - 1)  =  2L + 2F           - 2MAX - 2",
    "2 (q - F)            =      - 2F + 2q",
    "-1 (2q + r - D)      =           - 2q - r + D",
    "1 (H - L - D)        =  -L + H              - D",
    "1 (H - L)            =  -L + H",
    "2 (MAX - H)          =      - 2H                + 2MAX",
    "1 (r)                =                 + r",
    "sum                  =  -2",
    "~~~",
    "",
    "Every atom cancels and the constant is -2, so the sum of lo and half fits.",
    "",
    "The claim is `M == Q`, proved as `M \u003c= Q` and `Q \u003c= M` and `int_le_antisymm`.",
    "",
    "For `M \u003c= Q`, negation `M - Q - 1 >= 0`, with `c0 = 2`: (add, 2), (div, 2), (d1, -1), (sub, 1), (e1, 1), (e2, 1), (d3, 1).",
    "",
    "~~~",
    "2 (M - Q - 1)        =  2M - 2Q                          - 2",
    "2 (L + F - M)        = -2M      + 2L + 2F",
    "2 (q - F)            =                - 2F + 2q",
    "-1 (2q + r - D)      =                     - 2q - r + D",
    "1 (H - L - D)        =           - L            + H - D",
    "1 (2Q + R - L - H)   =      + 2Q - L            - H      + R",
    "1 (1 - R)            =                                   - R + 1",
    "1 (r)                =                          + r",
    "sum                  =  -1",
    "~~~",
    "",
    "For `Q \u003c= M`, negation `Q - M - 1 >= 0`, with `c0 = 2`: (add, -2), (div, -2), (d1, 1), (sub, -1), (e1, -1), (d2, 1), (e3, 1). It is the mirror image: the equations change sign, and the two bounds used are `1 - r >= 0` and `R >= 0`. The sum is again -1.",
    "",
    "What the example shows. Four certificates, the longest of seven pairs, against proofs of hundreds of steps from the ring axioms. Every line of a table is a proof the kernel checks on its own. The integer reasoning, that twice a whole number lying between -1 and 1 is zero, needs nothing beyond reading a strict inequality as one with a 1 added. And the atoms must be the same terms wherever they occur, which is the elaborator's work: it must present D as the same term in sub, d1, and the range axiom, by computing let names away before it asks.",
    "",
    "## Effects are promises",
    "",
    "Effects are a small closed list fixed by the language: not returning, panicking, allocating, and io, which is any interaction with the world, including time and randomness. There are no user-defined effects and no effect handlers, which would need runtime machinery that plain Rust does not have. Mutation is visible in types and is not an effect. Being ghost is a separate axis: an effect says what happens at runtime, and ghost says what exists at runtime. Classical reasoning is reported by an audit, not tracked as an effect.",
    "",
    "As in Rust, a function may have any effect unless it promises otherwise. A promise is a built-in attribute, one per effect, named as Rust names its own promises of absence (no_std, no_mangle):",
    "",
    "~~~",
    "#[terminates]      always returns",
    "#[no_panic]        never aborts",
    "#[no_alloc]        never allocates",
    "#[no_io]           never interacts with the world",
    "~~~",
    "",
    "What is guaranteed is what is written, which suits review of a specification: a reader looks for promises that are present, not for weakenings that are absent. An inner attribute at the top of a file, such as #![no_panic], makes a promise for every function in it. Promises are always explicit and never inferred, as const fn and async fn are in Rust, so they spread to every function a promising function calls. There is no attribute that bundles several promises. An obligation arises only where a promise is made: an operation that may panic in Rust, such as checked arithmetic or indexing when they arrive, needs no evidence in an ordinary function and needs evidence in one that promises no_panic.",
    "",
    "Attributes are a closed, built-in set interpreted by the compiler. Locus has no user-defined macros and no user-defined attributes; its built-in forms are described under Built-in forms. Attribute syntax is chosen because it is Rust syntax.",
    "",
    "A promise is checked against the body: every construct and every callee must keep it. A foreign declaration states its promises and is trusted. Only termination bears on the soundness of the logic, and the logic is protected by construction, since only total kernel terms appear in propositions. The other promises are claims about runtime behavior, enforced by a table from constructs to effects and a check at each call, in the check IR so that the check is on the trusted path.",
    "",
    "- A panic is a third way for a function to end, beside returning and never returning. The interpreters report it, generated Rust is compared with the interpreter on it, and the statement that erasure preserves behavior speaks of it. Partial correctness is unchanged: a result type says what holds if the function returns. With &mut and protected types a further question arises, since a panic in the middle of an update leaves the caller's value half changed and a Rust caller that catches the panic can see it; the rule is the next point.",
    "- A value whose fields carry evidence is never left broken where a panic could expose it. In the core this needs no rule of its own: a field that evidence in the same struct depends on cannot be assigned alone, the whole value is written by one assignment, and Rust evaluates the operands before it writes, so a panic leaves the old valid value (How mutation is checked, case 8). Should field-by-field update with a refresh ever be allowed, a function that opens such a window through a &mut parameter must promise no_panic. A value the function owns needs no rule: if the function panics the value is dropped unseen, since no Locus type has a destructor.",
    "",
    "Plan: LOC-13, LOC-59, LOC-138.",

    "## Functions in propositions",
    "",
    "A function may appear in a proposition exactly when it promises terminates, no_panic, and no_io, and its signature takes no &mut: a proposition is never run, so nothing written in one can change anything. A function may assign its own locals freely; what matters is storage the caller can see, and the signature shows that. Such a function always returns and is deterministic, so f(x) denotes one value; allocation is invisible to the logic. The rule reads the signature and never the body. A function with no runtime form, such as one returning Prop, must keep these promises and states them like any other. A function that may not return cannot appear in a proposition, because its result type may promise anything; the result of calling it is a fresh variable that exists only after the call returns, as now.",
    "",
    "What the logic knows about f(x) is, always, what the result type says, so that f(x).1 is evidence about f(x).0; and, where the body of f is visible, its defining equation as well. Visibility of the equation follows visibility of the body. A recursive function is the exception recorded under Termination. Within one file every body is visible. Once headers exist, a function whose body is in the header is known by its definition, which is right for the vocabulary of a specification, and a function given there only by its signature is known by its contract. No separate control of unfolding is planned; it can be revisited.",
    "",
    "With the above, math fn carries no information of its own: it is the three promises just named. That a function may use Prop, quantifiers, and later Int, and need not be executable, follows from its types, which the kernel already classifies. The type math fn(x: A) -> B becomes a function type with those promises; function types carry promises too. The keyword stays until the promises are implemented and is then removed.",
    "",
    "Plan: LOC-14, LOC-73, LOC-39.",

    "## Mutation and references",
    "",
    "Mutation and references, in tiers. Tier 0 is agreed; the full rules are to be written when it is specified in detail, together with Evidence about mutable state, which depends on it.",
    "",
    "Tier 0 consists of two steps, in order. First, let mut locals and assignment to a variable or to a field path of one (x = e, lock.failures = e), which need no references at all. Second, &mut T and &T as parameter types, including self, with arguments written as paths (&mut lock, &mut pair.0, &lock), a reference parameter passed on to another call, and inherent impl blocks with method calls, without traits, since &mut self presupposes them. Not in tier 0: a reference held in a local, in a struct field, or returned; explicit lifetimes; a reference to a reference; a closure that captures one. A reference therefore lasts for one call, and no lifetime is ever written or checked. Values move from the start, as decided under Values and types, so a struct that does not derive Copy is moved when it is passed by value and lent when it is passed by reference; Box and Vec add heap storage, not moving.",
    "",
    "- What the logic sees. A mutable variable is a sequence of versions, a new one at each assignment. At a join, a variable assigned on some path gets a new version, equal to a conditional term when the branches are pure. In a loop, nothing is known of a variable the loop assigns beyond what tracked evidence carries (Evidence about mutable state). Lowering turns versions into the state-passing forms the check IR already has. What becomes trusted is that translation.",
    "- How a signature speaks of old and new. In parameter types a &mut parameter means its value at entry. In the result type it means its value at return. old!(x) names the entry value where the result needs both. In the logic the function takes the old value and returns the new value beside its declared result, so that a call gives its argument a new version and the evidence it returns is about that version:",
    "",
    "~~~",
    "fn bump(lock: &mut Lock, ok: @within_limit(lock.failures)) -> @within_limit(lock.failures)",
    "",
    "ok = bump(&mut lock, ok);      // lock has a new version; the result re-establishes ok",
    "~~~",
    "",
    "- Aliasing. The &mut arguments of one call are disjoint paths, and disjoint from every other argument that reads the same variable: f(&mut a, &mut a) and f(&mut a, a.x) are rejected, f(&mut a.x, &a.y) is accepted. Locus is never more permissive than rustc, since the generated Rust must compile, and soundness rests on Locus's own check: lowering cannot write two new values back to one variable.",
    "- Evidence. A parameter is bound as let is, so an evidence parameter is a snapshot of the entry state; mut ok: @P makes it tracked, which is Rust's own syntax for a mutable parameter. A field that a proof field of the same struct depends on is not assigned through a reference; the whole value is replaced.",
    "- &T adds nothing to the logic while every type is Copy and nothing has interior mutability: a shared reference is the value. It is there for idiom, and for efficiency later.",
    "- Left for the detailed specification: the flow rules for tracked evidence, early return, what the caller's variable holds when the callee does not return normally (harmless under partial correctness), and diagnostics that name versions, such as i as it was before line 12.",
    "",
    "Tier 1, planned next: shared references in fields, returns, and locals, with lifetimes. The logic is unchanged, because a shared reference is still the value, provided types with interior mutability are excluded. Nothing in the logic depends on when a shared loan ends, only on the value not changing while it lasts, which rustc enforces on the generated code; whether rustc may be the final judge of lifetimes here is to be examined. This recovers parsers that hold their input, lookups that return a reference, and iteration over a collection.",
    "",
    "Tiers beyond that are not planned, and what each would cost is known from the tools that have done it. A mutable reference in a local needs a loan analysis of Locus's own, because a borrow ends at its last use and the logic must know where the lent variable gets its value back; rustc's checker has no specification to match. A returned mutable reference breaks the reading of a function as old values to new ones, because the final state of self depends on what the caller later writes; the known answers are a second, backward function per function, or prophecy variables that name a reference's final value, and either makes specifications harder to read, which matters when the specification is what people review. A mutable reference in a struct makes the struct's logical value carry current and final values. Interior mutability, unsafe code, and concurrency need separation logic and are a different project. In each case the translation from borrows to values would sit in the trusted lowering. Every tier 0 program remains valid under the later tiers, and the old!(x) convention coexists with a notation for a reference's final value.",
    "",
    "- To flesh out with references: matching through a & parameter binds references in Rust, and tier 0 has no place to hold one, so only Copy fields could be bound.",
    "",
    "Plan: LOC-1, LOC-128, LOC-38, LOC-33, LOC-37.",
