<!doctype html>
<meta charset="utf-8">
<title>Locus highlighting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 52em; margin: 2em auto; padding: 0 16px; }
  pre { padding: 12px 14px; border-radius: 8px; overflow: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
  .locus-reserved { text-decoration: underline wavy; }
</style>
<h1>Locus highlighting, two ways</h1>
<p>Left: <code>editors/highlight/locus.js</code>, no dependencies, highlight.js class names so any highlight.js theme applies. Right: the same source through highlight.js with <code>locus.hljs.js</code> registered.</p>
<pre><code class="hljs" id="mine"></code></pre>
<pre><code class="hljs" id="theirs"></code></pre>
<script src="locus.js"></script>
<script type="module">
  import hljs from 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/es/core.min.js';
  import locus from './locus.hljs.js';
  const source = `#[derive(Clone, Copy, Debug)]
struct Lock { failures: u32, open: bool }

prop within_limit(failures: Int) {
    Bounds => { prop!(failures <= 3) }
}

#[terminates] #[no_panic] #[no_io]
pub(crate) fn step(lock: Lock, bounded: @within_limit(lock.failures), event: Event)
    -> (next: Lock, @within_limit(next.failures)) {
    match event {
        Event::Right => {
            let next = Lock { failures: 0, open: true };
            (next, within_limit::Bounds @ prove!(next.failures <= 3))     // computed
        }
        Event::Wrong => {
            if lock.failures < 3 {
                let fits = prove!(lock.failures + 1 <= u32::MAX);         // arithmetic
                let next = Lock { failures: lock.failures + 1, open: false };
                (next, within_limit::Bounds @ prove!(next.failures <= 3))
            } else { (Lock { failures: lock.failures, open: false }, bounded) }
        }
    }
}
//~ run: step(Lock { failures: 0, open: false }, _, Event::Right) => (Lock { failures: 0, open: true }, Proved)
`;
  document.getElementById('mine').innerHTML = highlightLocus(source);
  hljs.registerLanguage('locus', locus);
  document.getElementById('theirs').innerHTML = hljs.highlight(source, { language: 'locus' }).value;
</script>
