[package]
name = "locus"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "An experimental programming language with erased, kernel-checked proofs"
publish = false

[dependencies]
annotate-snippets = "=0.12.16"
serde_json = "=1.0.150"
sha2 = "=0.11.0"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
unsafe_code = "forbid"
